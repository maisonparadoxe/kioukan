une clause, ça ne se lit pas en marchant. »": "“At 7 pm and at 7:30 pm I didn’t move: you don’t read a clause while walking.”", "« À 20 h comme à 20 h 30, je suis resté au même endroit. En ma qualité de notaire, je n’ai rien vu. »": "“At 8 pm and at 8:30 pm I stayed in the same place. In my capacity as notary, I saw nothing.”", "« Hippolyte n’a jamais mis les pieds au jardin de la soirée. L’herbe abîme ses souliers vernis. »": "“Ivor never set foot in the garden all evening. Grass ruins his patent shoes.”", "« Le majordome est passé par la cave à un moment de la soirée. Je l’atteste. »": "“The butler passed through the cellar at some point in the evening. I can attest to it.”", "« Je suis passé par le bureau dans la soirée, pour relire le testament. Rien de plus. »": "“I passed through the study during the evening, to reread the will. Nothing more.”", "« À 19 h 30, Mademoiselle Lucie et moi étions dans la même pièce. Elle a goûté la sauce sans permission. »": "“At 7:30 pm, Miss Lucy and I were in the same room. She tasted the sauce without permission.”", "« Je n’ai pas quitté ma pièce à 20 h 30 comme à 21 h. Un majordome ne court pas : il glisse. »": "“I didn’t leave my room at 8:30 pm or at 9 pm. A butler doesn’t run: he glides.”", "« À 21 h, j’étais avec Hippolyte. Il m’a servi un thé tiède, comme d’habitude. »": "“At 9 pm I was with Ivor. He served me lukewarm tea, as usual.”", "« À 21 h, je n’étais pas avec le notaire. Dieu merci. »": "“At 9 pm I was not with the notary. Thank heavens.”", "« Hippolyte n’a pas bougé à 20 h comme à 20 h 30. Il fait partie des meubles. »": "“Ivor stayed put at 8 pm and at 8:30 pm. He’s part of the furniture.”", "« J’ai changé de pièce entre 19 h et 19 h 30. Je m’ennuyais. »": "“I changed rooms between 7 pm and 7:30 pm. I was bored.”", "« Hippolyte est passé par le salon dans la soirée, plumeau en main. Il époussetait les soupçons. »": "“Ivor passed through the drawing room during the evening, feather duster in hand. He was dusting off suspicions.”", "Voler un testament que je dois lire moi-même ? Ce serait me priver du meilleur moment.": "Steal a will I have to read out myself? That would rob me of the best part.", "Un majordome ne touche jamais aux papiers de monsieur, madame. Seulement à la poussière dessus.": "A butler never touches the master’s papers, madam. Only the dust on them.", "La tarte aux olives": "The olive tart", "La tarte aux olives a été engloutie.": "The olive tart has been gobbled up.", "Quelqu’un l’a mangée à {h}, {lieu}, tout seul. Les innocents disent vrai, le gourmand ment à chaque phrase.": "Someone ate it at {h}, {lieu}, all alone. The innocent tell the truth, the glutton lies in every sentence.", "goûter": "snack", "Ma tarte aux olives ! Je l’avais posée à refroidir, et il ne reste que le plat !": "My olive tart! I left it to cool, and only the dish is left!", "Elle a été dévorée {lieu}, à {h}. Écoutons ce que chacun raconte. L’un d’eux ment.": "It was devoured {lieu}, at {h}. Let’s hear what everyone has to say. One of them is lying.", "Les olives viennent de MES oliviers. C’était une sorte de… dégustation professionnelle.": "The olives come from MY olive trees. It was a sort of… professional tasting.", "Une dégustation de la tarte entière, Basile ?": "A tasting of the entire tart, Bud?", "Le soir, c’est le rosier préféré de l’oncle Aristide qui est saccagé.": "In the evening, it’s Uncle Aristide’s favourite rose bush that gets ransacked.", "« À 19 h 30 comme à 20 h, je n’ai pas bougé : ma pâte reposait, moi aussi. »": "“At 7:30 pm and at 8 pm I didn’t move: my pastry was resting, and so was I.”", "« À 20 h 30 comme à 21 h, je suis restée au même endroit, à éplucher. »": "“At 8:30 pm and at 9 pm I stayed in the same place, peeling.”", "« Rémi n’a jamais mis les pieds dans ma cuisine de la soirée. Heureusement : il m’aurait emprunté mes couteaux. »": "“Remy never set foot in my kitchen all evening. Just as well: he’d have borrowed my knives.”", "« À 20 h 30, j’étais au jardin, à cueillir du thym. »": "“At 8:30 pm I was in the garden, picking thyme.”", "« À 19 h, Julie et Basile étaient ensemble. Je parie qu’ils parlaient de courgettes. »": "“At 7 pm, Julie and Bud were together. I bet they were talking about courgettes.”", "« À 19 h 30, Julie et moi étions dans la même pièce. Je lui ai demandé un petit prêt… refusé. »": "“At 7:30 pm, Julie and I were in the same room. I asked her for a small loan… refused.”", "« Quand l’horloge a sonné neuf coups, Julie et Basile étaient encore ensemble. Je parie qu’ils parlaient toujours de courgettes. »": "“When the clock struck nine, Julie and Bud were still together. I bet they were still talking about courgettes.”", "« À 19 h, Julie était dans le bureau. Elle cherchait les chocolats de monsieur. »": "“At 7 pm, Julie was in the study. She was looking for the master’s chocolates.”", "« À 19 h 30, Rémi et moi étions ensemble, à parler de mes rosiers. »": "“At 7:30 pm, Remy and I were together, talking about my rose bushes.”", "« Rémi n’a pas bougé à 19 h comme à 19 h 30. Planté là comme un poireau. »": "“Remy stayed put at 7 pm and at 7:30 pm. Planted there like a leek.”", "« Rémi n’a jamais mis les pieds dans la bibliothèque. Il ne lit que les cotes des courses. »": "“Remy never set foot in the library. He only reads the racing odds.”", "« Rémi a fait un tour par le bureau dans la soirée. J’ai vu ses traces de semelles. »": "“Remy took a turn through the study during the evening. I saw his footprints.”", "« Rémi est passé par le jardin à un moment donné. Il a piétiné mes bégonias. »": "“Remy passed through the garden at some point. He trampled my begonias.”", "Engloutir ma propre tarte ? Je la connais par cœur, madame, je n’ai plus besoin de la goûter.": "Gobble up my own tart? I know it by heart, madam, I don’t need to taste it any more.", "Des olives ? Je suis fauché, madame, pas affamé… enfin, pas que.": "Olives? I’m broke, madam, not starving… well, not only.", "Le rosier d’Aristide": "Aristide’s rose bush", "Le rosier primé a été dépouillé.": "The prize-winning rose bush has been stripped bare.", "Toutes les roses ont été coupées à {h}, {lieu}. Le coupable y était seul. Ici, tous les constats sont vrais.": "Every rose was cut at {h}, {lieu}. The culprit was alone there. Here, all the findings are true.", "cueillette": "picking", "Le rosier de monsieur Aristide ! Toutes les roses coupées ! Il avait gagné trois concours !": "Mr Aristide’s rose bush! Every rose cut! It had won three competitions!", "Retour aux constats, sans témoignages. Les roses ont été coupées {lieu} à {h}.": "Back to findings, no testimonies. The roses were cut {lieu} at {h}.", "C’était… pour un bouquet. Pour mademoiselle Julie. Un majordome a aussi un cœur, madame.": "It was… for a bouquet. For Miss Julie. A butler has a heart too, madam.", "Un cœur, oui. Un sécateur, apparemment aussi.": "A heart, yes. And apparently a pair of secateurs as well.", "Le lendemain, la lecture du testament reprend… et le notaire s’endort au milieu.": "The next day, the reading of the will resumes… and the notary falls asleep in the middle of it.", "À 19 h 30, le majordome aidait Julie à écosser des petits pois. Julie, elle, n’a pas bougé à 19 h 30 comme à 20 h.": "At 7:30 pm, the butler was helping Julie shell peas. Julie, for her part, stayed put at 7:30 pm and at 8 pm.", "Le docteur n’a pas bougé à 19 h comme à 19 h 30 ; à 19 h 30, Lucie est venue lui réclamer des cachets « contre l’ennui ».": "The doctor stayed put at 7 pm and at 7:30 pm; at 7:30 pm, Lucy came to ask him for pills “against boredom”.", "À 20 h 30, Lucie se faisait ausculter par le docteur Cament. Diagnostic : mauvaise foi chronique.": "At 8:30 pm, Lucy was being examined by Dr Cation. Diagnosis: chronic bad faith.", "Quand l’horloge a sonné neuf coups, Julie servait une tisane à Lucie, qui l’a trouvée imbuvable.": "When the clock struck nine, Julie was serving herbal tea to Lucy, who found it undrinkable.", "Le majordome a changé cinq fois de pièce sans jamais mettre les pieds dans le hall, mais il est passé par le salon.": "The butler changed rooms five times without ever setting foot in the hall, but he did pass through the drawing room.", "Julie n’a changé que deux fois de pièce : elle n’a pas bougé à 20 h 30 comme à 21 h, et elle est passée par le salon.": "Julie changed rooms only twice: she stayed put at 8:30 pm and at 9 pm, and she passed through the drawing room.", "Lucie a changé trois fois de pièce, dont une fois entre 19 h 30 et 20 h.": "Lucy changed rooms three times, once of them between 7:30 pm and 8 pm.", "Lucie n’a pas bougé à 21 h comme à 21 h 30. Elle est passée par le salon dans la soirée, le nez en l’air.": "Lucy stayed put at 9 pm and at 9:30 pm. She passed through the drawing room during the evening, nose in the air.", "Le salon était désert à 19 h 30. Le docteur y est passé à un autre moment de la soirée.": "The drawing room was deserted at 7:30 pm. The doctor passed through it at another moment in the evening.", "Des roses ? Moi, je cueille des poireaux.": "Roses? I pick leeks.", "Des fleurs ? Je préfère qu’on m’en offre, voyons.": "Flowers? I’d rather someone gave me some, really.", "Mon diagnostic : allergie aux pollens. Je ne m’approche jamais des rosiers.": "My diagnosis: pollen allergy. I never go near rose bushes.", "Le notaire endormi": "The sleeping notary", "Le notaire s’est endormi pendant la lecture.": "The notary fell asleep during the reading.", "Son thé a été trafiqué à {h}, {lieu}. Même le notaire endormi a donné sa version. Les innocents disent vrai, le coupable ment toujours.": "His tea was tampered with at {h}, {lieu}. Even the sleeping notary gave his version. The innocent tell the truth, the culprit always lies.", "somnifère": "sleeping draught", "Maître Menvussa ronfle au milieu de la lecture ! Quelqu’un a mis un somnifère dans son thé !": "Mr Nott is snoring in the middle of the reading! Someone put a sleeping draught in his tea!", "Le thé a été trafiqué {lieu} à {h}. Quatre témoins, un menteur.": "The tea was tampered with {lieu} at {h}. Four witnesses, one liar.", "Il lisait si lentement… J’ai pensé qu’une petite sieste lui ferait du bien. Et à nous aussi.": "He was reading so slowly… I thought a little nap would do him good. And us too.", "Docteur Cament. Vous prescrivez des somnifères sans ordonnance, maintenant ?": "Dr Cation. Prescribing sleeping pills without a prescription now?", "Pendant ce temps, la bouteille de 1899 de l’oncle a disparu.": "Meanwhile, Uncle’s bottle of 1899 has disappeared.", "« À 21 h, j’étais avec Julie, qui me décrivait ses aigreurs d’estomac. »": "“At 9 pm I was with Julie, who was describing her heartburn to me.”", "« Le notaire n’a pas bougé à 20 h 30 comme à 21 h. Il dormait, je l’ai ausculté. »": "“The notary stayed put at 8:30 pm and at 9 pm. He was asleep, I examined him.”", "« Julie n’a pas bougé à 20 h 30 comme à 21 h non plus. Repos complet : je le lui avais prescrit. »": "“Julie stayed put at 8:30 pm and at 9 pm as well. Complete rest: I had prescribed it.”", "« Basile a changé de pièce entre 20 h 30 et 21 h. Il trotte comme un lapin, ce jardinier. »": "“Bud changed rooms between 8:30 pm and 9 pm. He scampers about like a rabbit, that gardener.”", "« À 19 h 30, j’étais à la cave. Pour raisons médicales. »": "“At 7:30 pm I was in the cellar. For medical reasons.”", "« À 19 h, Julie et moi étions dans la même pièce. Je n’ai rien vu d’autre, comme toujours. »": "“At 7 pm, Julie and I were in the same room. I saw nothing else, as always.”", "« Julie n’a pas bougé à 19 h comme à 19 h 30. Je l’ai remarqué, pour une fois. »": "“Julie stayed put at 7 pm and at 7:30 pm. I noticed it, for once.”", "« À 20 h 30, le notaire et moi étions ensemble. Il m’a parlé de successions, je lui ai parlé de boutures. »": "“At 8:30 pm, the notary and I were together. He talked to me about inheritances, I talked to him about cuttings.”", "« À 20 h 30, le docteur et Julie étaient ensemble. Il lui prenait le pouls, elle lui tendait une tartine. »": "“At 8:30 pm, the doctor and Julie were together. He was taking her pulse, she was handing him a slice of bread and jam.”", "« À 20 h, le notaire n’était pas avec Julie. Elle le fuit depuis l’affaire du gigot. »": "“At 8 pm, the notary was not with Julie. She has been avoiding him since the business with the leg of lamb.”", "« Le notaire n’a pas bougé à 19 h 30 comme à 20 h. Il a des racines, celui-là. »": "“The notary stayed put at 7:30 pm and at 8 pm. That one has put down roots.”", "« Le notaire a changé de pièce entre 20 h et 20 h 30. On aurait dit une limace pressée. »": "“The notary changed rooms between 8 pm and 8:30 pm. Like a slug in a hurry.”", "« Le docteur a changé de pièce entre 20 h 30 et 21 h, sa sacoche sous le bras. »": "“The doctor changed rooms between 8:30 pm and 9 pm, his bag under his arm.”", "« Julie n’a jamais mis les pieds dans le hall de la soirée. Ses fourneaux ne la lâchent pas. »": "“Julie never set foot in the hall all evening. Her stove won’t let her go.”", "« Je suis passé par la cave dans la soirée, chercher du terreau. »": "“I passed through the cellar during the evening, to fetch some compost.”", "« Quand l’horloge a sonné sept coups, le docteur était à la cave. Il comptait les bouteilles, à mon avis. »": "“When the clock struck seven, the doctor was in the cellar. Counting the bottles, if you ask me.”", "« Quand l’horloge a sonné neuf coups, le docteur et le notaire étaient ensemble. Deux bavards dans la même casserole. »": "“When the clock struck nine, the doctor and the notary were together. Two chatterboxes in the same pot.”", "« À 19 h, le docteur n’était pas avec Basile. Ces deux-là ne mangent pas à la même table. »": "“At 7 pm, the doctor was not with Bud. Those two don’t eat at the same table.”", "« Le notaire a changé de pièce entre 19 h et 19 h 30. Il a toujours faim au mauvais moment. »": "“The notary changed rooms between 7 pm and 7:30 pm. He’s always hungry at the wrong moment.”", "M’endormir moi-même ? Mes lectures y suffisent très bien, madame.": "Put myself to sleep? My own readings do that perfectly well, madam.", "Moi, je fais dormir les graines, madame, pas les notaires.": "I put seeds to sleep, madam, not notaries.", "Ma tisane réveille les morts, madame. Elle ne les endort pas !": "My herbal tea wakes the dead, madam. It doesn’t send people to sleep!", "Cave à surprises": "Cellar of surprises", "La bouteille de 1899 a disparu.": "The bottle of 1899 has disappeared.", "Elle a été emportée à {h}, {lieu}. Un des quatre suspects ment sur toute la ligne.": "It was carried off at {h}, {lieu}. One of the four suspects lies all the way.", "Le Château-Margaux 1899 ! La bouteille préférée de monsieur ! Je l’avais montée de la cave pour le dîner… et elle a disparu !": "The 1899 Château Margaux! The master’s favourite bottle! I had brought it up from the cellar for dinner… and it has disappeared!", "La bouteille a été prise {lieu}, à {h}. Écoutons leurs versions.": "The bottle was taken {lieu}, at {h}. Let’s hear their versions.", "Je l’ai… vendue. Pour rembourser une petite dette. Une toute petite. Avec beaucoup de zéros.": "I… sold it. To pay off a little debt. A tiny one. With lots of zeros.", "Rémi, vous êtes le seul suspect que je retrouve dans chaque chapitre.": "Remy, you are the only suspect I run into in every chapter.", "Le lendemain matin, quelqu’un a dessiné une moustache sur le portrait de l’oncle Aristide.": "The next morning, someone has drawn a moustache on Uncle Aristide’s portrait.", "« À 20 h 30, Hippolyte et Basile n’étaient pas ensemble. Ils se détestent, c’est reposant. »": "“At 8:30 pm, Ivor and Bud were not together. They loathe each other, which is restful.”", "« Basile n’a pas bougé à 19 h 30 comme à 20 h. Comme ses salades. »": "“Bud stayed put at 7:30 pm and at 8 pm. Like his lettuces.”", "« Basile a changé de pièce entre 20 h 30 et 21 h. Une mauvaise herbe, ça se déplace. »": "“Bud changed rooms between 8:30 pm and 9 pm. Weeds get around.”", "« À 21 h, j’étais à la cuisine. Je volais des biscuits, si vous voulez tout savoir. »": "“At 9 pm I was in the kitchen. Stealing biscuits, if you must know.”", "« À 19 h, Hippolyte et moi étions ensemble. Je lui ai emprunté un peu de monnaie. »": "“At 7 pm, Ivor and I were together. I borrowed a little change from him.”", "« À 20 h 30, Lucie et Hippolyte étaient dans la même pièce. Je parie qu’ils parlaient de moi. »": "“At 8:30 pm, Lucy and Ivor were in the same room. I bet they were talking about me.”", "« À 20 h 30, Lucie et Basile étaient ensemble, eux aussi. Cote à deux contre un. »": "“At 8:30 pm, Lucy and Bud were together too. Odds of two to one.”", "« À 20 h 30, j’étais avec Lucie. Parole de joueur. »": "“At 8:30 pm I was with Lucy. Gambler’s honour.”", "« Quand l’horloge a sonné neuf coups, Lucie et Hippolyte étaient ensemble. Je mettrais ma chemise là-dessus. »": "“When the clock struck nine, Lucy and Ivor were together. I’d bet my shirt on it.”", "« À 21 h, Hippolyte et moi étions ensemble. Il gardait la main sur l’argenterie. »": "“At 9 pm, Ivor and I were together. He kept a hand on the silverware.”", "« Je n’ai jamais mis les pieds dans le bureau de la soirée. Je n’aime pas les endroits où l’on compte. »": "“I never set foot in the study all evening. I don’t like places where people count.”", "« Quand l’horloge a sonné sept coups, Hippolyte était à la cuisine. Il goûtait la sauce en douce. »": "“When the clock struck seven, Ivor was in the kitchen. Sneaking a taste of the sauce.”", "« À 21 h, Hippolyte était dans le hall, raide comme un portemanteau. »": "“At 9 pm, Ivor was in the hall, as stiff as a coat stand.”", "« Je n’ai pas quitté ma pièce à 20 h comme à 20 h 30, si je puis me permettre. »": "“I didn’t leave my room at 8 pm or at 8:30 pm, if I may say so.”", "« Monsieur Rémi n’a jamais mis les pieds dans la bibliothèque. Il ne lit pas. »": "“Mr Remy never set foot in the library. He doesn’t read.”", "« Je n’ai jamais mis les pieds dans la cave de la soirée. Je laisse la poussière aux araignées. »": "“I never set foot in the cellar all evening. I leave the dust to the spiders.”", "« Monsieur Rémi est passé par le jardin dans la soirée. Il cherchait des pièces dans la fontaine, je présume. »": "“Mr Remy passed through the garden during the evening. Looking for coins in the fountain, I presume.”", "« Basile est passé par la cave à un moment de la soirée. Avec ses bottes, naturellement. »": "“Bud passed through the cellar at some point in the evening. In his boots, naturally.”", "« Quand l’horloge a sonné sept coups, Mademoiselle Lucie était dans le bureau. Je n’ai pas osé demander pourquoi. »": "“When the clock struck seven, Miss Lucy was in the study. I didn’t dare ask why.”", "« À 19 h 30, j’étais au jardin, si je puis me permettre, à cueillir des roses pour la table. »": "“At 7:30 pm I was in the garden, if I may say so, picking roses for the table.”", "« À 19 h 30, Lucie et Rémi étaient ensemble. Deux ronces dans le même buisson. »": "“At 7:30 pm, Lucy and Remy were together. Two brambles in the same bush.”", "« À 19 h 30, j’étais à la cuisine, pour livrer mes radis. »": "“At 7:30 pm I was in the kitchen, delivering my radishes.”", "Du vin de 1899 ? Je ne bois que du champagne de l’année.": "Wine from 1899? I only drink this year’s champagne.", "Je garde cette bouteille depuis trente ans, madame. Je l’aurais volée bien plus tôt.": "I’ve been looking after that bottle for thirty years, madam. I would have stolen it long ago.", "Moi, je ne bois que l’eau de mon arrosoir.": "I only drink the water from my watering can.", "Le portrait moustachu": "The moustached portrait", "Le portrait de l’oncle a été moustachu.": "Uncle’s portrait has been given a moustache.", "Le gribouillage date de {h}, {lieu}. Tous les constats sont vrais, mais il faudra raisonner par l’absurde : suppose, et vois si ça coince.": "The scribble dates from {h}, {lieu}. All the findings are true, but you’ll have to reason by contradiction: suppose, and see if it jams.", "gribouillage": "scribbling", "L’oncle Aristide… avec une moustache en guidon de vélo ! C’est un sacrilège !": "Uncle Aristide… with a handlebar moustache! It’s sacrilege!", "La peinture était fraîche {lieu} à {h}. Énigme corsée : il faudra sans doute tester des hypothèses.": "The paint was fresh {lieu} at {h}. A tough one: you’ll probably have to test hypotheses.", "Aristide m’a toujours dit que la moustache m’allait mieux qu’à lui. Je voulais vérifier.": "Aristide always told me the moustache suited me better than him. I wanted to check.", "Maître Menvussa. Vous qui n’avez jamais rien vu… vous avez tout dessiné.": "Mr Nott. You who never see a thing… you drew it all.", "La nuit tombe sur le manoir. Un codicille secret vient d’être retrouvé… puis volé.": "Night falls on the manor. A secret codicil has just been found… then stolen.", "Julie et Lucie ne se quittaient pas : à 19 h, à 20 h 30 puis à 21 h 30, elles étaient dans la même pièce, à échanger des ragots.": "Julie and Lucy were inseparable: at 7 pm, at 8:30 pm and then at 9:30 pm they were in the same room, swapping gossip.", "À 21 h, le docteur et Julie étaient dans la même pièce : il lui prescrivait du repos, elle lui servait de la tarte.": "At 9 pm, the doctor and Julie were in the same room: he was prescribing her rest, she was serving him tart.", "Le docteur et Julie n’étaient pas ensemble à 19 h 30, ni à 20 h 30 : elle fuyait ses « consultations ».": "The doctor and Julie were not together at 7:30 pm, nor at 8:30 pm: she was dodging his “consultations”.", "À 19 h, le docteur était seul dans sa pièce, à prendre son propre pouls.": "At 7 pm, the doctor was alone in his room, taking his own pulse.", "À 20 h 30, le notaire était seul dans sa pièce, à relire une clause pour la dixième fois.": "At 8:30 pm, the notary was alone in his room, rereading a clause for the tenth time.", "Julie n’a changé que deux fois de pièce dans la soirée : une cuisinière aime ses habitudes.": "Julie changed rooms only twice during the evening: a cook loves her habits.", "À 19 h comme à 19 h 30, le notaire est resté dans la même pièce, plongé dans ses codicilles.": "At 7 pm and at 7:30 pm, the notary stayed in the same room, buried in his codicils.", "Le docteur a changé quatre fois de pièce : il faisait sa tournée des malades imaginaires.": "The doctor changed rooms four times: he was doing his rounds of imaginary patients.", "À 19 h 30, à 20 h comme à 20 h 30, Julie est restée dans la même pièce : un gâteau ne se surveille pas en marchant.": "At 7:30 pm, at 8 pm and at 8:30 pm, Julie stayed in the same room: you don’t watch a cake while walking.", "À 19 h 30 comme à 20 h, le docteur est resté dans la même pièce, à se tâter le pouls.": "At 7:30 pm and at 8 pm, the doctor stayed in the same room, feeling his own pulse.", "À 20 h 30 comme à 21 h, Lucie et le notaire sont restés chacun dans la même pièce : elle comptait les virgules du testament, lui les relisait.": "At 8:30 pm and at 9 pm, Lucy and the notary each stayed in the same room: she was counting the commas in the will, he was rereading them.", "Julie a changé de pièce entre 20 h 30 et 21 h : la tarte refroidissait ailleurs.": "Julie changed rooms between 8:30 pm and 9 pm: the tart was cooling somewhere else.", "À 19 h, personne dans le salon ni dans le jardin.": "At 7 pm, nobody in the drawing room or the garden.", "À 20 h 30, le bureau et la bibliothèque étaient déserts.": "At 8:30 pm, the study and the library were deserted.", "À 21 h 30, personne dans le salon, dans le jardin ni dans le bureau.": "At 9:30 pm, nobody in the drawing room, the garden or the study.", "Le notaire n’a jamais mis les pieds dans le hall : il y a trop de courants d’air pour un testament.": "The notary never set foot in the hall: far too draughty for a will.", "Lucie est passée par le jardin à un moment de la soirée, pour « prendre l’air ».": "Lucy passed through the garden at some point in the evening, to “get some air”.", "Une moustache ? Je dessine sur les gâteaux, madame, pas sur les tableaux.": "A moustache? I draw on cakes, madam, not on paintings.", "Gribouiller un portrait ? J’ai bien trop bon goût.": "Scribble on a portrait? My taste is far too good for that.", "J’ai une écriture de médecin, madame. Personne n’aurait reconnu une moustache.": "I have a doctor’s handwriting, madam. Nobody would have recognised a moustache.", "Le codicille": "The codicil", "Le codicille secret a été volé.": "The secret codicil has been stolen.", "Une plume de hibou l’a remplacé. Vol à {h}, {lieu}. Les innocents disent vrai, le voleur ment à chaque déclaration.": "An owl feather has taken its place. Theft at {h}, {lieu}. The innocent tell the truth, the thief lies in every statement.", "Le codicille de 1920 ! Celui qui disait que les Larmes de Lune… enfin, celui qui disait quelque chose d’important ! Volé !": "The 1920 codicil! The one that said the Moon Tears… well, the one that said something important! Stolen!", "Et une plume de hibou à sa place. Le vol a eu lieu {lieu} à {h}. Un menteur parmi quatre, sur six créneaux.": "And an owl feather in its place. The theft happened {lieu} at {h}. One liar among four, over six time slots.", "Le Hibou paie bien mieux que l’héritage de tonton. Au revoir, cousine !": "The Owl pays far better than Uncle’s inheritance. Goodbye, cousin!", "Lucie Fer s’enfuit vers le port de Nice et monte à bord du paquebot Bel Azur.": "Lucy Fer flees to the port of Nice and boards the liner Bel Azur.", "Comtesse, faites vos valises. Nous prenons la mer.": "Countess, pack your bags. We are going to sea.", "Fin du chapitre 3.": "End of chapter 3.", "« Quand l’horloge a sonné huit coups, Basile et le docteur étaient ensemble. Le docteur examinait une écharde. »": "“When the clock struck eight, Bud and the doctor were together. The doctor was examining a splinter.”", "« À 21 h, Basile et moi étions dans la même pièce. Il avait de la terre sur les chaussures. Sur mes tapis. »": "“At 9 pm, Bud and I were in the same room. He had soil on his shoes. On my rugs.”", "« À 21 h 30, le docteur et Mademoiselle Lucie étaient ensemble. Mademoiselle toussait de façon… théâtrale. »": "“At 9:30 pm, the doctor and Miss Lucy were together. Miss Lucy was coughing in a… theatrical manner.”", "« À 20 h 30, le docteur et moi n’étions pas ensemble. Je ne fréquente pas la Faculté. »": "“At 8:30 pm, the doctor and I were not together. I don’t keep company with the medical profession.”", "« Je n’ai pas quitté ma pièce à 20 h comme à 20 h 30. Un majordome attend qu’on le sonne. »": "“I didn’t leave my room at 8 pm or at 8:30 pm. A butler waits to be rung for.”", "« Mademoiselle Lucie est passée par le jardin dans la soirée, sans s’essuyer les pieds en rentrant. »": "“Miss Lucy passed through the garden during the evening, without wiping her feet on the way back in.”", "« À 19 h, Basile était au salon. Sans autorisation. »": "“At 7 pm, Bud was in the drawing room. Without permission.”", "« À 19 h 30, le docteur était au jardin, à respirer « le bon air » à pleins poumons. »": "“At 7:30 pm, the doctor was in the garden, breathing in ‘the good air’ by the lungful.”", "« Quand l’horloge a sonné sept coups, Hippolyte et Lucie étaient ensemble. Un chardon et une ortie. »": "“When the clock struck seven, Ivor and Lucy were together. A thistle and a nettle.”", "« Hippolyte n’a pas bougé à 21 h comme à 21 h 30. Un vrai tuteur de tomates. »": "“Ivor stayed put at 9 pm and at 9:30 pm. A real tomato stake.”", "« À 21 h, le docteur était au jardin. Il marchait sur mes semis. »": "“At 9 pm, the doctor was in the garden. Walking on my seedlings.”", "« Quand l’horloge a sonné neuf coups, j’étais dans le hall, à rempoter un ficus. »": "“When the clock struck nine, I was in the hall, repotting a ficus.”", "« À 20 h, Hippolyte et Basile étaient ensemble. Je n’ai rien diagnostiqué de grave. »": "“At 8 pm, Ivor and Bud were together. I diagnosed nothing serious.”", "« À 21 h 30, Basile et Lucie étaient dans la même pièce. Elle avait l’air en pleine forme. Trop. »": "“At 9:30 pm, Bud and Lucy were in the same room. She looked in fine form. Too fine.”", "« Basile n’a pas bougé à 20 h 30 comme à 21 h. Excellent pour son dos. »": "“Bud stayed put at 8:30 pm and at 9 pm. Excellent for his back.”", "« J’ai changé de pièce entre 21 h et 21 h 30. Prescription : marcher. »": "“I changed rooms between 9 pm and 9:30 pm. Prescription: walking.”", "« Lucie est passée par la cave dans la soirée. Mauvais pour les bronches, l’humidité. »": "“Lucy passed through the cellar during the evening. Bad for the lungs, all that damp.”", "« À 19 h, le docteur et moi étions ensemble. Il m’a trouvé une santé insolente. »": "“At 7 pm, the doctor and I were together. He found me in insolently good health.”", "« À 20 h, le docteur et moi étions encore ensemble. Je ne le lâche plus. »": "“At 8 pm, the doctor and I were still together. I’m not letting him out of my sight.”", "« À 21 h 30, Hippolyte et le docteur étaient ensemble. Le duo le plus ennuyeux du manoir. »": "“At 9:30 pm, Ivor and the doctor were together. The most boring duo in the manor.”", "« Le docteur n’a pas bougé à 20 h 30 comme à 21 h. Il se prescrit du repos, lui aussi. »": "“The doctor stayed put at 8:30 pm and at 9 pm. He prescribes himself rest too.”", "« Le docteur a changé de pièce entre 19 h et 19 h 30. Il fuyait une patiente, sans doute. »": "“The doctor changed rooms between 7 pm and 7:30 pm. Fleeing a patient, no doubt.”", "« J’ai changé de pièce entre 21 h et 21 h 30. J’avais mieux à faire. »": "“I changed rooms between 9 pm and 9:30 pm. I had better things to do.”", "« Quand l’horloge a sonné huit coups, j’étais au jardin. Les roses de tonton sont superbes la nuit. »": "“When the clock struck eight, I was in the garden. Uncle’s roses are superb at night.”", "Le codicille ? Je ne sais même pas ce que c’est, madame. Mais je l’ai épousseté.": "The codicil? I don’t even know what that is, madam. But I dusted it.", "Un codi-quoi ? Moi, je ne vole que des boutures.": "A codi-what? The only thing I steal is cuttings.", "Les papiers de famille, très peu pour moi. J’ai assez des ordonnances.": "Family papers are not for me. I have enough with prescriptions.", "Le paquebot Bel Azur": "The liner Bel Azur", "En mer. Personne ne peut descendre, et quelqu’un ment encore.": "At sea. Nobody can get off, and someone is still lying.", "Le compas affolé": "The crazy compass", "Le compas du navire a été saboté.": "The ship’s compass has been sabotaged.", "Un aimant a été collé à {h}, {lieu}. Le saboteur y était seul. Tous les constats sont vrais.": "A magnet was stuck on at {h}, {lieu}. The saboteur was alone there. All the findings are true.", "sabotage": "sabotage", "À bord du Bel Azur, cap sur la Corse. En théorie.": "On board the Bel Azur, heading for Corsica. In theory.", "Quelqu’un a collé un aimant sous le compas ! On tourne en rond depuis une heure !": "Someone has stuck a magnet under the compass! We’ve been going round in circles for an hour!", "L’aimant a été posé {lieu} à {h}.": "The magnet was placed {lieu} at {h}.", "Je testais une intrigue pour mon prochain roman : « Mort sur un paquebot qui tourne en rond ». Ça marche, non ?": "I was testing a plot for my next novel: “Death on a Liner Going Round in Circles”. It works, doesn’t it?", "Trop bien, madame Crispie. Votre éditeur sera ravi, le capitaine beaucoup moins.": "Too well, Mrs Crispy. Your publisher will be delighted; the captain, much less so.", "Le lendemain, quelqu’un coupe toutes les cordes du piano de voyage de Paul Ka.": "The next day, someone cuts every string of Paul Kerr’s travelling piano.", "À 20 h, Marcel racontait à Cécile la vie intime de ses pistons. Cécile n’a rien répondu : elle ne répond jamais.": "At 8 pm, Rusty was telling Cecily about the private life of his pistons. Cecily didn’t reply: she never does.", "À 20 h 30, Agathe interrogeait Cécile pour son prochain roman. Elle a obtenu trois hochements de tête.": "At 8:30 pm, Agatha was interviewing Cecily for her next novel. She got three nods.", "Quand la cloche du bord a sonné neuf coups, le pianiste jouait une polka à Cécile, qui s’est bouché les oreilles.": "When the ship’s bell struck nine, the pianist was playing Cecily a polka; she put her fingers in her ears.", "À 20 h, Agathe était seule, à noircir son carnet.": "At 8 pm, Agatha was alone, filling her notebook.", "Cécile a changé quatre fois de pièce, toujours en silence ; à 22 h 30, elle était enfin seule. Le bonheur.": "Cecily changed rooms four times, always in silence; at 10:30 pm she was finally alone. Bliss.", "Marcel a changé trois fois de pièce, notamment entre 21 h et 21 h 30, puis entre 22 h et 22 h 30.": "Rusty changed rooms three times, notably between 9 pm and 9:30 pm, then between 10 pm and 10:30 pm.", "Le pianiste a changé quatre fois de pièce, mais il n’a pas bougé à 20 h comme à 20 h 30 : il battait la mesure.": "The pianist changed rooms four times, but he stayed put at 8 pm and at 8:30 pm: he was beating time.", "Agathe est passée par la salle à manger dans la soirée, et elle a changé de pièce entre 22 h et 22 h 30.": "Agatha passed through the dining room during the evening, and she changed rooms between 10 pm and 10:30 pm.", "À 21 h 30, la salle des machines, la cabine 7, la salle à manger et le salon de musique étaient déserts.": "At 9:30 pm, the engine room, cabin 7, the dining room and the music room were deserted.", "À 22 h, personne dans la salle à manger : le soufflé était retombé.": "At 10 pm, nobody in the dining room: the soufflé had collapsed.", "À 22 h 30, personne dans la cabine 12, ni dans la cabine 7, ni au salon de musique.": "At 10:30 pm, nobody in cabin 12, nor in cabin 7, nor in the music room.", "Marcel n’a jamais mis les pieds sur la passerelle ni dans la coursive : « Trop loin de mes chaudières. »": "Rusty never set foot on the bridge or in the gangway: “Too far from my boilers.”", "Cécile n’a jamais mis les pieds dans la salle des machines. Trop bruyant.": "Cecily never set foot in the engine room. Too noisy.", "Saboter le compas ? Et finir perdu en mer avec vous tous ? Non merci.": "Sabotage the compass? And end up lost at sea with all of you? No thank you.", "Moi, je ne sais même pas où est le nord. Seulement où est le do.": "I don’t even know where north is. Only where middle C is.", "Silence à bord": "Silence on board", "Le piano a perdu toutes ses cordes.": "The piano has lost all its strings.", "Elles ont été coupées à {h}, {lieu}. Les innocents disent vrai, le coupable ment à chaque fois.": "They were cut at {h}, {lieu}. The innocent tell the truth, the culprit lies every time.", "Mon piano de voyage ! Je l’avais sorti pour l’accorder… Plus une corde ! Comment je joue ma polka, maintenant ?": "My travelling piano! I took it out to tune it… Not a string left! How am I supposed to play my polka now?", "Les cordes ont été coupées {lieu} à {h}. Retour des témoignages : un des quatre ment.": "The strings were cut {lieu} at {h}. Testimonies are back: one of the four is lying.", "Cécile Ence… « silence » ! Mademoiselle voulait simplement un peu de calme. Son nom aurait dû me mettre sur la piste.": "Cecily Hush… hush! The lady simply wanted a little peace and quiet. Her name should have put me on the trail.", "Le lendemain, la casquette du capitaine passe par-dessus bord.": "The next day, the captain’s cap goes overboard.", "« Cécile n’a jamais mis les pieds dans la cabine 7 de la soirée. Je l’aurais entendue… enfin, non. »": "“Cecily never set foot in cabin 7 all evening. I’d have heard her… well, no.”", "« À 21 h, Agathe était au salon de musique, à prendre des notes. Sur moi, j’espère. »": "“At 9 pm, Agatha was in the music room, taking notes. About me, I hope.”", "« À 22 h, Lucie et moi étions ensemble. Un personnage fascinant, cette Lucie. Chapitre douze. »": "“At 10 pm, Lucy and I were together. A fascinating character, that Lucy. Chapter twelve.”", "« À 22 h, Marcel et Cécile étaient ensemble. Lui parlait, elle pas. »": "“At 10 pm, Rusty and Cecily were together. He talked, she didn’t.”", "« À 21 h, Cécile et moi n’étions pas ensemble. Dommage, je voulais l’interviewer. »": "“At 9 pm, Cecily and I were not together. A pity, I wanted to interview her.”", "« Cécile est passée par le salon de musique dans la soirée. Une muette parmi les instruments : quel symbole ! »": "“Cecily passed through the music room during the evening. A mute among the instruments: what symbolism!”", "« À 21 h, Lucie était dans la salle des machines. Une héroïne qui se salit les mains : j’adore. »": "“At 9 pm, Lucy was in the engine room. A heroine who gets her hands dirty: I love it.”", "« À 21 h 30, Marcel était dans la salle des machines. Évidemment. »": "“At 9:30 pm, Rusty was in the engine room. Obviously.”", "« Marcel n’a pas bougé. De 21 h à 21 h 30. »": "“Rusty. Didn’t move. 9 pm, 9:30 pm.”", "« Agathe ? Jamais à la salle à manger. »": "“Agatha? Never in the dining room.”", "« Marcel ? Jamais en cabine 12. »": "“Rusty? Never in cabin 12.”", "« Moi ? Passée par la salle à manger. »": "“Me? Passed through the dining room.”", "« Agathe. Pont promenade. 20 h 30. »": "“Agatha. Promenade deck. 8:30 pm.”", "« Moi. Coursive. 21 h. »": "“Me. Gangway. 9 pm.”", "« Cécile n’a jamais mis les pieds dans la salle des machines. Dommage : c’est le seul endroit où l’on ne s’entend pas parler. »": "“Cecily never set foot in the engine room. A pity: it’s the only place where you can’t hear yourself talk.”", "« À 22 h, Cécile était dans la coursive. Muette, comme toujours. »": "“At 10 pm, Cecily was in the gangway. Silent, as always.”", "Des cordes de piano ? J’ai déjà assez de câbles à réparer, madame.": "Piano strings? I’ve got enough cables to repair already, madam.", "Un piano muet ? Quelle idée d’intrigue… mais ce n’est pas la mienne.": "A silent piano? What a plot idea… but it isn’t mine.", "Couper des cordes ? Je risquerais de m’abîmer les ongles.": "Cut strings? I might chip my nails.", "Casquette à la mer": "Cap overboard", "La casquette du capitaine a fini à la mer.": "The captain’s cap ended up in the sea.", "Elle a été lancée à {h}, {lieu}. Cinq suspects, et le coupable y était seul.": "It was thrown at {h}, {lieu}. Five suspects, and the culprit was alone there.", "plouf": "splash", "Ma casquette ! Trente ans de navigation ! Un capitaine sans casquette, c’est un passager avec des galons !": "My cap! Thirty years at sea! A captain without a cap is just a passenger with stripes!", "Elle a été jetée par un hublot, {lieu}, à {h}. Cinq suspects, toutes les pièces à surveiller.": "It was thrown out of a porthole, {lieu}, at {h}. Five suspects, every room to watch.", "Il m’a fait jouer la même polka quarante-deux fois. QUARANTE-DEUX. J’ai craqué.": "He made me play the same polka forty-two times. FORTY-TWO. I snapped.", "Circonstances atténuantes, monsieur Ka.": "Mitigating circumstances, Mr Kerr.", "Le lendemain, la fin du manuscrit d’Agathe Crispie a disparu.": "The next day, the ending of Agatha Crispy’s manuscript has disappeared.", "À 20 h et à 20 h 30, Marcel parlait chaudières à Cécile, qui n’a pas dit un mot.": "At 8 pm and at 8:30 pm, Rusty was talking boilers to Cecily, who didn’t say a word.", "Quand la cloche a sonné neuf coups, puis à 21 h 30, le pianiste faisait danser Marcel. Mal.": "When the bell struck nine, and again at 9:30 pm, the pianist was making Rusty dance. Badly.", "Le pianiste a changé trois fois de pièce ; à 20 h 30, il était seul, à répéter sa polka.": "The pianist changed rooms three times; at 8:30 pm he was alone, rehearsing his polka.", "À 20 h 30, Agathe était seule, en plein chapitre. Elle a changé de pièce entre 21 h 30 et 22 h.": "At 8:30 pm, Agatha was alone, in the middle of a chapter. She changed rooms between 9:30 pm and 10 pm.", "Quand la cloche a sonné neuf coups, Cécile était seule — enfin. Elle n’a pas bougé à 21 h 30 comme à 22 h.": "When the bell struck nine, Cecily was alone — at last. She stayed put at 9:30 pm and at 10 pm.", "À 22 h, le pianiste était seul. Pour une fois, on ne l’entendait pas.": "At 10 pm, the pianist was alone. For once, nobody could hear him.", "À 22 h, Agathe était seule, à chercher une rime à « paquebot ».": "At 10 pm, Agatha was alone, looking for a rhyme for “steamship”.", "Marcel a changé quatre fois de pièce : ses chaudières le réclament partout.": "Rusty changed rooms four times: his boilers need him everywhere.", "Rémi n’a pas bougé à 20 h 30 comme à 21 h, et il est passé par le salon de musique dans la soirée, pour parier sur la prochaine fausse note.": "Remy stayed put at 8:30 pm and at 9 pm, and he passed through the music room during the evening, to bet on the next wrong note.", "La passerelle était déserte à 21 h 30 : le capitaine dînait.": "The bridge was deserted at 9:30 pm: the captain was having dinner.", "Quand la cloche a sonné dix coups, personne dans la salle à manger, dans la cabine 12 ni dans la coursive.": "When the bell struck ten, nobody in the dining room, in cabin 12 or in the gangway.", "Cécile n’a jamais mis les pieds au salon de musique (trop de bruit), mais elle est passée par la coursive.": "Cecily never set foot in the music room (too much noise), but she did pass through the gangway.", "Agathe est passée par le pont promenade dans la soirée, pour « humer l’intrigue ».": "Agatha passed through the promenade deck during the evening, to “sniff out the plot”.", "Je vis dans la salle des machines, madame. Je ne vois même jamais la mer.": "I live in the engine room, madam. I never even see the sea.", "Jeter une casquette ? Dans mes romans, on jette plutôt des cadavres.": "Throw a cap? In my novels, it’s usually bodies that get thrown.", "Une casquette ? J’aurais pu la revendre, madame, pas la jeter !": "A cap? I could have sold it, madam, not thrown it away!", "Le dernier chapitre": "The last chapter", "La fin du roman d’Agathe Crispie a été volée.": "The ending of Agatha Crispy’s novel has been stolen.", "Les pages ont été prises à {h}, {lieu}. Les innocents disent vrai ; le voleur ment à chaque fois.": "The pages were taken at {h}, {lieu}. The innocent tell the truth; the thief lies every time.", "Les dix dernières pages de mon roman ! Celles où l’on découvre l’assassin !": "The last ten pages of my novel! The ones where you find out who the murderer is!", "Les pages ont disparu {lieu} à {h}. Six créneaux, quatre témoins, un menteur.": "The pages disappeared {lieu} at {h}. Six time slots, four witnesses, one liar.", "Je ne supporte pas le suspense ! Il fallait que je sache qui était l’assassin !": "I can’t stand suspense! I had to know who the murderer was!", "C’était le majordome, capitaine. C’est toujours le majordome. Sauf au manoir.": "It was the butler, Captain. It’s always the butler. Except at the manor.", "En pleine nuit, les machines s’arrêtent. Le paquebot dérive.": "In the middle of the night, the engines stop. The liner is drifting.", "« À 21 h, Cécile et moi étions ensemble. Je lui ai joué une polka. Elle n’a pas applaudi. »": "“At 9 pm, Cecily and I were together. I played her a polka. She didn’t clap.”", "« À 21 h 30, Lucie et Cécile étaient dans la même pièce. Un duo sans paroles. »": "“At 9:30 pm, Lucy and Cecily were in the same room. A duet without words.”", "« À 22 h 30, le capitaine et moi étions ensemble. Il m’a réclamé une marche militaire. »": "“At 10:30 pm, the captain and I were together. He demanded a military march.”", "« Le capitaine n’a pas bougé à 20 h comme à 20 h 30. Ancré comme un piano à queue. »": "“The captain stayed put at 8 pm and at 8:30 pm. Anchored like a grand piano.”", "« Lucie n’a pas bougé à 20 h comme à 20 h 30 non plus. Un soupir dans la partition. »": "“Lucy stayed put at 8 pm and at 8:30 pm too. A rest in the score.”", "« Cécile n’a pas bougé à 21 h 30 comme à 22 h. Ni d’un pouce, ni d’une note. »": "“Cecily stayed put at 9:30 pm and at 10 pm. Not an inch, not a note.”", "« Le capitaine est passé par le salon de musique dans la soirée. Il a marché sur ma partition. »": "“The captain passed through the music room during the evening. He stepped on my sheet music.”", "« Le pianiste n’a pas bougé à 21 h comme à 21 h 30. Il mangeait. Beaucoup. »": "“The pianist stayed put at 9 pm and at 9:30 pm. He was eating. A lot.”", "« À 22 h, le capitaine n’était pas au salon de musique. Je vous le dis gratuitement, pour une fois. »": "“At 10 pm, the captain was not in the music room. I’m telling you for free, for once.”", "« Le capitaine n’a jamais mis les pieds dans la salle des machines. Il a peur de se salir. »": "“The captain never set foot in the engine room. He’s afraid of getting dirty.”", "« Je suis passée par la coursive dans la soirée. Comme tout le monde, non ? »": "“I passed through the gangway during the evening. Like everybody, surely?”", "« À 21 h, Cécile était dans la salle à manger. Elle mâchait en silence, comme le reste. »": "“At 9 pm, Cecily was in the dining room. Chewing in silence, like everything else.”", "« À 21 h 30, le capitaine était dans la coursive, à se chercher un cap. »": "“At 9:30 pm, the captain was in the gangway, trying to find his bearings.”", "« À 20 h, le pianiste et Lucie étaient ensemble, parole de capitaine ! »": "“At 8 pm, the pianist and Lucy were together, on my word as a captain!”", "« Quand la cloche a sonné neuf coups, Lucie et moi étions ensemble ! »": "“When the bell struck nine, Lucy and I were together!”", "« À 21 h 30 aussi, Lucie et moi étions ensemble ! Je la tenais à l’œil, mille hublots ! »": "“At 9:30 pm too, Lucy and I were together! I had my eye on her, by a thousand portholes!”", "« Et à 22 h, encore avec Lucie ! Je ne l’ai pas quittée des yeux ! »": "“And at 10 pm, still with Lucy! I never took my eyes off her!”", "« À 22 h comme à 22 h 30, je n’ai pas bougé : un capitaine reste à son poste ! »": "“At 10 pm and at 10:30 pm I didn’t move: a captain stays at his post!”", "« Cécile n’a jamais mis les pieds au salon de musique, par tous les embruns ! »": "“Cecily never set foot in the music room, by all the sea spray!”", "« À 20 h 30, Lucie était dans la salle à manger, à se goinfrer de homard ! »": "“At 8:30 pm, Lucy was in the dining room, stuffing herself with lobster!”", "« À 22 h 30, le pianiste était dans la salle à manger, à finir les restes ! »": "“At 10:30 pm, the pianist was in the dining room, finishing the leftovers!”", "« Le capitaine. Avec moi. 20 h. »": "“The captain. With me. 8 pm.”", "« 22 h. Le pianiste et Lucie. Ensemble. »": "“10 pm. The pianist and Lucy. Together.”", "« Lucie. Pas bougé. De 20 h 30 à 21 h. »": "“Lucy. Didn’t move. 8:30 pm, 9 pm.”", "« Le capitaine ? Jamais en cabine 7. »": "“The captain? Never in cabin 7.”", "« Le pianiste. Passé par la passerelle. »": "“The pianist. Passed through the bridge.”", "La fin d’un roman ? Je ne lis que des partitions, madame.": "The ending of a novel? I only read sheet music, madam.", "Je connais déjà la fin, très chère : c’est toujours moi qui gagne.": "I already know the ending, darling: I always win.", "Machine arrière": "Full astern", "La clé de la vanne à charbon a été volée.": "The key to the coal valve has been stolen.", "Elle a disparu à {h}, {lieu}. Tous les constats sont vrais, mais l’énigme est corsée : suppose, et vois si ça coince.": "It disappeared at {h}, {lieu}. All the findings are true, but this one is tough: suppose, and see if it jams.", "le saboteur": "the saboteur", "Quelqu’un a volé la clé de la vanne à charbon ! Sans elle, impossible de relancer les machines !": "Someone has stolen the key to the coal valve! Without it, there’s no restarting the engines!", "Je l’avais oubliée {lieu}. Elle a disparu à {h}. Il faudra sans doute faire une hypothèse et la pousser jusqu’au bout.": "I had left it {lieu}. It disappeared at {h}. You’ll probably have to make a hypothesis and push it all the way.", "Le Hibou avait besoin qu’on ralentisse. Son canot automobile n’est pas très rapide.": "The Owl needed us to slow down. His motorboat isn’t very fast.", "Son canot ? Il est donc tout près.": "His boat? Then he’s very close.", "Le soir suivant, une bouteille est jetée à la mer. À l’intérieur, un message.": "The following evening, a bottle is thrown into the sea. Inside, a message.", "Quand la cloche a sonné neuf coups, Marcel apprenait au pianiste le bruit exact d’une bielle qui chante. À 22 h, la leçon continuait.": "When the bell struck nine, Rusty was teaching the pianist the exact sound of a singing connecting rod. At 10 pm, the lesson went on.", "À 21 h et à 21 h 30, Agathe suivait Lucie partout : « Une héroïne pareille, ça ne s’invente pas. »": "At 9 pm and at 9:30 pm, Agatha followed Lucy everywhere: “You couldn’t make up a heroine like that.”", "À 20 h, Lucie était seule, à griffonner un message.": "At 8 pm, Lucy was alone, scribbling a message.", "Marcel a changé quatre fois de pièce ; à 21 h 30, il était seul, à graisser une clé à molette.": "Rusty changed rooms four times; at 9:30 pm he was alone, greasing an adjustable spanner.", "Agathe a changé cinq fois de pièce sans jamais mettre les pieds dans la coursive ; elle est passée par la salle à manger.": "Agatha changed rooms five times without ever setting foot in the gangway; she passed through the dining room.", "Le pianiste a changé cinq fois de pièce. Il est passé par la salle des machines et par la cabine 12, mais jamais par le salon de musique : son piano n’a plus de cordes.": "The pianist changed rooms five times. He passed through the engine room and cabin 12, but never through the music room: his piano has no strings left.", "Lucie a changé de pièce entre 21 h 30 et 22 h.": "Lucy changed rooms between 9:30 pm and 10 pm.", "Quand la cloche a sonné huit coups, personne dans la salle à manger, sur le pont promenade ni sur la passerelle.": "When the bell struck eight, nobody in the dining room, on the promenade deck or on the bridge.", "À 20 h 30, la salle des machines, la cabine 12 et la cabine 7 étaient désertes.": "At 8:30 pm, the engine room, cabin 12 and cabin 7 were deserted.", "À 21 h 30, la salle à manger était vide.": "At 9:30 pm, the dining room was empty.", "À 22 h 30, plus personne dans la salle des machines. C’est bien le problème.": "At 10:30 pm, nobody left in the engine room. That’s exactly the problem.", "Marcel n’a jamais mis les pieds ni dans la cabine 7 ni au salon de musique.": "Rusty never set foot in either cabin 7 or the music room.", "Lucie n’a jamais mis les pieds dans la salle à manger, mais elle est passée par la cabine 12.": "Lucy never set foot in the dining room, but she did pass through cabin 12.", "Ma propre clé ? Je n’ai pas besoin de la voler, madame : je la perds tout seul.": "My own key? I don’t need to steal it, madam: I lose it all by myself.", "Arrêter le navire en pleine intrigue ? Jamais. Le suspense doit continuer.": "Stop the ship in the middle of a plot? Never. The suspense must go on.", "Je joue du piano, madame, pas de la vanne.": "I play the piano, madam, not the valve.", "Bouteille à la mer": "Message in a bottle", "Quelqu’un a envoyé un message au Hibou.": "Someone has sent a message to the Owl.", "La bouteille a été lancée à {h}, {lieu}. Les innocents disent vrai, le messager ment à chaque phrase.": "The bottle was thrown at {h}, {lieu}. The innocent tell the truth, the messenger lies in every sentence.", "message": "message", "Ce message en bouteille dit : « Opéra, samedi, loge de la diva ». Quelqu’un a prévenu le Hibou. La bouteille est partie par un hublot, {lieu}, à {h}.": "This message in a bottle says: “Opera, Saturday, the diva’s dressing room”. Someone has tipped off the Owl. The bottle went out through a porthole, {lieu}, at {h}.", "Il paie en lingots, madame. Moi, je suis payé en charbon.": "He pays in gold bars, madam. I get paid in coal.", "Le Hibou achète tout le monde. Sauf moi.": "The Owl buys everyone. Except me.", "Cette nuit-là, une lampe clignote derrière un hublot. Au loin, un canot répond.": "That night, a lamp blinks behind a porthole. In the distance, a boat answers.", "« À 20 h, Cécile et moi étions ensemble. Une excellente auditrice. »": "“At 8 pm, Cecily and I were together. An excellent listener.”", "« À 20 h 30, Cécile et Marcel étaient ensemble. Lui parlait chaudières, elle regardait la mer. »": "“At 8:30 pm, Cecily and Rusty were together. He talked boilers, she watched the sea.”", "« Quand la cloche a sonné neuf coups, Cécile et Agathe étaient ensemble. Je les ai vues, par tous les embruns ! »": "“When the bell struck nine, Cecily and Agatha were together. I saw them, by all the sea spray!”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé, mille hublots ! »": "“At 9:30 pm and at 10 pm I didn’t move, by a thousand portholes!”", "« Marcel n’a pas bougé à 21 h 30 comme à 22 h. Il ronflait plus fort que ses chaudières. »": "“Rusty stayed put at 9:30 pm and at 10 pm. He was snoring louder than his boilers.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé non plus. Un capitaine est un roc. »": "“At 10 pm and at 10:30 pm I didn’t move either. A captain is a rock.”", "« Je n’ai jamais mis les pieds au salon de musique. La polka me donne le mal de mer. »": "“I never set foot in the music room. Polkas make me seasick.”", "« Cécile n’a jamais mis les pieds dans la salle à manger. Elle ne mange pas, elle observe. »": "“Cecily never set foot in the dining room. She doesn’t eat, she observes.”", "« Quand la cloche a sonné huit coups, Agathe était dans la cabine 7, à taper son roman. »": "“When the bell struck eight, Agatha was in cabin 7, typing her novel.”", "« 22 h. Marcel et Agathe. Ensemble. »": "“10 pm. Rusty and Agatha. Together.”", "« Agathe. Pas bougé. De 21 h à 21 h 30. »": "“Agatha. Didn’t move. 9 pm, 9:30 pm.”", "« À 22 h, le capitaine et Cécile étaient ensemble. Sur la tête de mes pistons. »": "“At 10 pm, the captain and Cecily were together. On the head of my pistons.”", "« À 22 h 30, ils étaient encore ensemble, le capitaine et Cécile. Inséparables comme une bielle et son piston. »": "“At 10:30 pm they were still together, the captain and Cecily. Inseparable as a rod and its piston.”", "« Cécile n’a pas bougé à 21 h comme à 21 h 30. Pas un boulon de travers. »": "“Cecily stayed put at 9 pm and at 9:30 pm. Not a bolt out of place.”", "« Agathe n’a pas bougé à 21 h 30 comme à 22 h. Elle avait trouvé l’inspiration, faut croire. »": "“Agatha stayed put at 9:30 pm and at 10 pm. Found her inspiration, I reckon.”", "« À 22 h 30, Cécile n’était pas sur la passerelle. Je l’aurais vue, j’ai l’œil. »": "“At 10:30 pm, Cecily was not on the bridge. I’d have seen her, I’ve got a good eye.”", "« Le capitaine n’a jamais mis les pieds sur le pont promenade. Trop de passagers à saluer. »": "“The captain never set foot on the promenade deck. Too many passengers to greet.”", "« À 20 h 30, Cécile était sur la passerelle, à regarder les étoiles. »": "“At 8:30 pm, Cecily was on the bridge, looking at the stars.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé : j’écrivais la scène finale. »": "“At 10 pm and at 10:30 pm I didn’t move: I was writing the final scene.”", "« Cécile a changé de pièce entre 22 h et 22 h 30. Sans un mot, évidemment. »": "“Cecily changed rooms between 10 pm and 10:30 pm. Without a word, of course.”", "« Marcel est passé par la salle à manger dans la soirée. De la graisse jusqu’aux coudes. Quel personnage ! »": "“Rusty passed through the dining room during the evening. Grease up to his elbows. What a character!”", "Écrire au Hibou ? Je n’écris qu’au journal de bord, madame !": "Write to the Owl? I only write in the ship’s log, madam!", "Une bouteille à la mer ? Trop de clichés, ma chère. Je n’écris pas ainsi.": "A message in a bottle? Far too clichéd, darling. That’s not how I write.", "Le canot de minuit": "The midnight boat", "Quelqu’un a fait des signaux au canot du Hibou.": "Someone has been signalling to the Owl’s boat.", "La lampe a clignoté à {h}, {lieu}. Les innocents disent vrai, la fuyarde ment toujours. Difficile : il faudra parfois supposer pour avancer.": "The lamp blinked at {h}, {lieu}. The innocent tell the truth, the runaway always lies. Hard: sometimes you’ll have to suppose to move forward.", "la fugitive": "the fugitive", "fuite": "escape", "Des signaux lumineux en pleine mer ! Et à minuit, un canot de sauvetage a disparu… avec quelqu’un dedans !": "Light signals in the middle of the sea! And at midnight, a lifeboat disappeared… with someone in it!", "Les signaux venaient {lieu}, à {h}. Qui les a faits a pris le canot. Énigme corsée : certaines pistes ne tombent qu’en testant une hypothèse.": "The signals were sent {lieu}, at {h}. Whoever made them took the boat. A tough one: some leads only fall into place when you test a hypothesis.", "Trop tard, Hortense ! Rendez-vous à Monte-Carlo… si vous aimez l’opéra.": "Too late, Hortense! See you in Monte Carlo… if you like opera.", "Fin du chapitre 4. Monte-Carlo. Ce samedi, Aria Vibrato chante à l’Opéra.": "End of chapter 4. Monte Carlo. This Saturday, Aria Vibrato sings at the Opera.", "« Lucie. Avec moi. 20 h 30. »": "“Lucy. With me. 8:30 pm.”", "« 22 h 30. Lucie et Rémi. Ensemble. »": "“10:30 pm. Lucy and Remy. Together.”", "« 22 h 30. Le pianiste et Lucie. Ensemble aussi. »": "“10:30 pm. The pianist and Lucy. Together too.”", "« 22 h 30. Lucie et moi ? Pas ensemble. »": "“10:30 pm. Lucy and me? Not together.”", "« Moi. Pont promenade. 20 h. »": "“Me. Promenade deck. 8 pm.”", "« Rémi. Coursive. 22 h. »": "“Remy. Gangway. 10 pm.”", "« À 22 h, Lucie et Rémi étaient ensemble. Ils comptaient des billets. »": "“At 10 pm, Lucy and Remy were together. They were counting banknotes.”", "« Rémi a changé de pièce entre 20 h et 20 h 30. Il m’avait promis de me rembourser. »": "“Remy changed rooms between 8 pm and 8:30 pm. He had promised to pay me back.”", "« Je n’ai jamais mis les pieds dans la salle à manger : je jeûne avant les concerts. »": "“I never set foot in the dining room: I fast before concerts.”", "« Cécile n’a jamais mis les pieds dans la cabine 7. Elle n’aime pas les numéros impairs. »": "“Cecily never set foot in cabin 7. She doesn’t like odd numbers.”", "« À 21 h, j’étais sur la passerelle, à jouer de l’harmonica aux mouettes. »": "“At 9 pm I was on the bridge, playing the harmonica to the seagulls.”", "« À 20 h, le pianiste et moi étions ensemble. Il m’a joué une polka, j’ai survécu. »": "“At 8 pm, the pianist and I were together. He played me a polka; I survived.”", "« À 22 h, Cécile et Rémi n’étaient pas ensemble. Qui voudrait de Rémi ? »": "“At 10 pm, Cecily and Remy were not together. Who would want Remy?”", "« Cécile n’a pas bougé à 22 h comme à 22 h 30. Une statue. Une statue muette. »": "“Cecily stayed put at 10 pm and at 10:30 pm. A statue. A silent statue.”", "« Cécile est passée par la salle à manger dans la soirée. Elle a pris un dessert sans dire merci. »": "“Cecily passed through the dining room during the evening. She took a dessert without saying thank you.”", "« Cécile est passée par la cabine 12, aussi. Une curieuse, cette muette. »": "“Cecily passed through cabin 12, too. Nosy, for a mute.”", "« À 20 h 30, le pianiste et moi étions ensemble. Je lui ai parié qu’il raterait son la. »": "“At 8:30 pm, the pianist and I were together. I bet him he’d miss his A.”", "« Quand la cloche a sonné neuf coups, Lucie et moi étions ensemble. Elle m’a prêté de l’argent. Si, si. »": "“When the bell struck nine, Lucy and I were together. She lent me money. Honestly.”", "« Le pianiste n’a pas bougé à 22 h comme à 22 h 30. Je l’aurais parié, et j’aurais gagné. »": "“The pianist stayed put at 10 pm and at 10:30 pm. I’d have bet on it, and won.”", "« Le pianiste a changé de pièce entre 20 h et 20 h 30. Il fuyait son public. »": "“The pianist changed rooms between 8 pm and 8:30 pm. Fleeing his audience.”", "« Je n’ai jamais mis les pieds sur la passerelle. Le capitaine me doit encore une revanche. »": "“I never set foot on the bridge. The captain still owes me a rematch.”", "« Je n’ai jamais mis les pieds dans la salle à manger non plus. Trop cher. »": "“I never set foot in the dining room either. Too expensive.”", "« Quand la cloche a sonné huit coups, Lucie était sur la passerelle. Elle scrutait l’horizon comme si quelqu’un allait venir. »": "“When the bell struck eight, Lucy was on the bridge. Scanning the horizon as if someone were coming.”", "Des signaux ? Moi, je ne connais que le solfège.": "Signals? The only ones I know are in sol-fa.", "Des signaux au canot ? Je n’ai même pas de quoi payer une lampe, madame.": "Signals to the boat? I can’t even afford a lamp, madam.", "L’Opéra de Monte-Carlo": "The Monte Carlo Opera", "Rideau ! Ici, même les coupables chantent à moitié faux.": "Curtain up! Here, even the culprits sing half out of tune.", "Prima donna": "Prima donna", "Le diadème de la diva a disparu.": "The diva’s tiara has disappeared.", "Il a été pris à {h}, {lieu}. Les innocents disent toujours vrai. Le coupable mêle le vrai et le faux : au moins une vraie déclaration, au moins une fausse.": "It was taken at {h}, {lieu}. The innocent always tell the truth. The culprit mixes truth and lies: at least one true statement, at least one false.", "la coupable": "the culprit", "L’Opéra de Monte-Carlo, deux heures avant la première.": "The Monte Carlo Opera, two hours before opening night.", "Mon diadème ! Je ne peux pas chanter Tosca tête nue !": "My tiara! I can’t sing Tosca bareheaded!", "Nouvelle règle, et elle est plus vicieuse : le coupable mélange le vrai et le faux. Au moins une de ses phrases est vraie, au moins une est fausse.": "A new rule, and a nastier one: the culprit mixes truth and lies. At least one of their sentences is true, at least one is false.", "Il manquait des paillettes ! Une diva sans paillettes, c’est une choriste.": "It was missing sequins! A diva without sequins is just a chorus girl.", "Paulette Paillette… Je n’aurais pas dû chercher plus loin.": "Sally Sequin… I needn’t have looked any further.", "À la répétition, le maestro cherche sa baguette partout.": "At rehearsal, the maestro searches everywhere for his baton.", "« À 20 h, Sam et moi étions ensemble. Il me soufflait mon texte ; je le connaissais déjà, évidemment. »": "“At 8 pm, Sam and I were together. He was prompting my lines; I already knew them, obviously.”", "« Quand la pendule a sonné neuf coups, Paulette et Sam étaient ensemble. Deux petites mains de l’ombre. »": "“When the clock struck nine, Sally and Sam were together. Two little hands behind the scenes.”", "« À 21 h 30, Sam et moi étions encore ensemble. Il me suit partout : c’est le prix de la gloire. »": "“At 9:30 pm, Sam and I were still together. He follows me everywhere: the price of fame.”", "« À 20 h, Paulette n’était pas avec moi : mon costume attendait ses paillettes. »": "“At 8 pm, Sally was not with me: my costume was waiting for its sequins.”", "« Paulette n’a pas bougé à 20 h 30 comme à 21 h. Elle cousait ma cape. Ma cape ! »": "“Sally stayed put at 8:30 pm and at 9 pm. She was sewing my cape. My cape!”", "« Paulette n’a pas bougé à 21 h comme à 21 h 30 non plus. Elle cousait. »": "“Sally stayed put at 9 pm and at 9:30 pm as well. She was sewing.”", "« Quand la pendule a sonné huit coups, Paulette était sur la scène, à ramasser mes paillettes. »": "“When the clock struck eight, Sally was on the stage, picking up my sequins.”", "« À 20 h 30, Enzo et moi étions ensemble. Je lui ai recousu un bouton, il ne m’a pas dit merci. »": "“At 8:30 pm, Enzo and I were together. I sewed a button back on for him; he didn’t say thank you.”", "« Enzo est passé par les cintres dans la soirée. Il voulait voir la salle d’en haut. »": "“Enzo passed through the flies during the evening. He wanted to see the house from above.”", "« … à 20 h 30, Paulette et moi étions ensemble… elle m’a piqué avec une épingle… »": "“… at 8:30 pm, Sally and I were together… she pricked me with a pin…”", "« … à 20 h 30, Enzo n’était pas avec Paulette… elle a eu de la chance… »": "“… at 8:30 pm, Enzo was not with Sally… lucky her…”", "« … Enzo n’a pas bougé à 20 h comme à 20 h 30… il faisait ses vocalises… »": "“… Enzo stayed put at 8 pm and at 8:30 pm… doing his vocal exercises…”", "« … moi, je n’ai pas bougé à 21 h comme à 21 h 30… comme d’habitude… »": "“… me, I stayed put at 9 pm and at 9:30 pm… as usual…”", "« … Enzo est passé par la scène dans la soirée… sans moi, il aurait oublié pourquoi… »": "“… Enzo passed through the stage during the evening… without me, he’d have forgotten why…”", "Un diadème ? J’ai assez de lumière sur scène, madame !": "A tiara? I get enough light on stage, madam!", "Moi, je reste dans mon trou, madame. Je ne vois jamais la diva que de dessous.": "I stay in my box, madam. I only ever see the diva from below.", "Baguette magique": "Magic baton", "La baguette du maestro a disparu.": "The maestro’s baton has disappeared.", "Elle a été prise à {h}, {lieu}. Le coupable mêle le vrai et le faux, les autres disent vrai.": "It was taken at {h}, {lieu}. The culprit mixes truth and lies, the others tell the truth.", "Ma baguette ! Sans elle, l’orchestre joue n’importe comment ! Enfin… plus que d’habitude.": "My baton! Without it, the orchestra plays any old how! Well… more than usual.", "Elle a disparu {lieu} à {h}. Le coupable dit vrai… à moitié.": "It disappeared {lieu} at {h}. The culprit tells the truth… by halves.", "Il dirige si lentement ! Je voulais chanter mon air en moins de dix minutes, pour une fois.": "He conducts so slowly! For once, I wanted to sing my aria in under ten minutes.", "Un ténor pressé. On aura tout vu.": "A tenor in a hurry. Now I’ve seen everything.", "Pendant la générale, le rideau tombe en plein milieu du premier acte.": "During the dress rehearsal, the curtain drops right in the middle of the first act.", "« 21 h 30. Sam pas avec moi. Noté. »": "“9:30 pm. Sam not with me. Noted.”", "« Enzo est passé par la loge de la diva. Noté sur ma feuille de service. »": "“Enzo passed through the diva’s dressing room. Noted on my running sheet.”", "« Sam est passé par la scène. Noté aussi. »": "“Sam passed through the stage. Noted too.”", "« … à 20 h, Enzo et moi étions ensemble… je lui soufflais ses répliques… il les oubliait quand même… »": "“… at 8 pm, Enzo and I were together… I was prompting his lines… he forgot them anyway…”", "« … quand la pendule a sonné neuf coups, Enzo et moi étions encore ensemble… il ne me lâche pas… »": "“… when the clock struck nine, Enzo and I were still together… he won’t let go of me…”", "« … à 21 h, j’étais au foyer… à manger un petit four… ne le dites à personne… »": "“… at 9 pm, I was in the foyer… eating a petit four… don’t tell anyone…”", "« À 21 h comme à 21 h 30, je n’ai pas bougé. Une voix comme la mienne se repose. »": "“At 9 pm and at 9:30 pm I didn’t move. A voice like mine needs rest.”", "« À 21 h 30, Sam était dans la loge de la diva. Il fouinait. »": "“At 9:30 pm, Sam was in the diva’s dressing room. Snooping around.”", "« À 22 h, j’étais au parterre, à vérifier l’acoustique. »": "“At 10 pm I was in the stalls, checking the acoustics.”", "Une baguette ? J’ai déjà mes cordes et mes poulies, madame.": "A baton? I’ve already got my ropes and my pulleys, madam.", "La baguette ? J’ai déjà le livret, c’est bien assez lourd.": "The baton? I’ve already got the script, that’s heavy enough.", "Le rideau tombe": "The curtain falls", "Le rideau est tombé en pleine générale.": "The curtain fell in the middle of the dress rehearsal.", "Quelqu’un a actionné le levier à {h}, {lieu}. Les innocents disent vrai, le coupable ment à chaque fois.": "Someone pulled the lever at {h}, {lieu}. The innocent tell the truth, the culprit lies every time.", "chute": "fall", "Mon rideau est tombé tout seul ! Enfin… pas tout seul. Quelqu’un a touché au levier.": "My curtain came down all by itself! Well… not all by itself. Someone touched the lever.", "Le levier a été actionné {lieu} à {h}. Ici, le coupable ment sur tout.": "The lever was pulled {lieu} at {h}. Here, the culprit lies about everything.", "Je me suis assoupi contre le levier… Souffler les répliques, c’est épuisant.": "I dozed off against the lever… Prompting is exhausting.", "Un souffleur qui s’endort. Il y a des métiers à risque.": "A prompter who falls asleep. Some jobs are dangerous.", "Le soir même, le texte du souffleur est introuvable.": "That same evening, the prompter’s script is nowhere to be found.", "« À 20 h 30, Sam et moi étions ensemble. Dans la même mesure, si j’ose dire. »": "“At 8:30 pm, Sam and I were together. In the same bar, if I may say so.”", "« À 20 h comme à 20 h 30, je n’ai pas bougé : un maestro ne quitte pas son pupitre. »": "“At 8 pm and at 8:30 pm I didn’t move: a maestro doesn’t leave his podium.”", "« Sam n’a pas bougé à 20 h 30 comme à 21 h. Una pausa lunga, molto lunga. »": "“Sam stayed put at 8:30 pm and at 9 pm. Una pausa lunga, molto lunga.”", "« À 21 h comme à 21 h 30, je n’ai pas bougé. Tempo giusto. »": "“At 9 pm and at 9:30 pm I didn’t move. Tempo giusto.”", "« À 22 h 30, Paulette était dans les cintres. Elle cousait là-haut, pianissimo. »": "“At 10:30 pm, Sally was in the flies. She was sewing up there, pianissimo.”", "« … Paulette a changé de pièce entre 21 h et 21 h 30… »": "“… Sally changed rooms between 9 pm and 9:30 pm…”", "« … à 20 h, je n’étais pas au parterre… je ne me montre jamais au public… »": "“… at 8 pm, I was not in the stalls… I never show myself to the audience…”", "« … le maestro n’a jamais mis les pieds dans la machinerie… trop de bruit pour ses oreilles… »": "“… the maestro never set foot in the machinery room… too noisy for his ears…”", "« … quand la pendule a sonné huit coups, Aria était dans les coulisses… elle chauffait sa voix… »": "“… when the clock struck eight, Aria was in the wings… warming up her voice…”", "« Quand la pendule a sonné neuf coups, le maestro et moi étions ensemble. Il avait perdu un bouton. »": "“When the clock struck nine, the maestro and I were together. He had lost a button.”", "« À 20 h, Aria était dans la loge de la diva. Où voulez-vous qu’elle soit ? »": "“At 8 pm, Aria was in the diva’s dressing room. Where else would she be?”", "« À 22 h, j’étais dans la machinerie, à repriser un velours. »": "“At 10 pm I was in the machinery room, darning a velvet drape.”", "« À 22 h, le maestro et moi étions ensemble. Il battait la mesure, je battais des records. »": "“At 10 pm, the maestro and I were together. He was beating time, I was beating records.”", "« À 22 h 30, Sam et moi étions ensemble. Il m’a soufflé une note. Fausse. »": "“At 10:30 pm, Sam and I were together. He prompted me a note. A wrong one.”", "« À 20 h 30 comme à 21 h, je n’ai pas bougé : vocalises. »": "“At 8:30 pm and at 9 pm I didn’t move: vocal exercises.”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé. Une diva ne quitte pas la lumière. »": "“At 9:30 pm and at 10 pm I didn’t move. A diva doesn’t leave the spotlight.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé non plus. Une diva ne court pas. »": "“At 10 pm and at 10:30 pm I didn’t move either. A diva doesn’t run.”", "« À 20 h, Paulette était dans la loge de la diva, à me coudre des paillettes. »": "“At 8 pm, Sally was in the diva’s dressing room, sewing sequins on for me.”", "Faire tomber le rideau pendant MA générale ? Jamais, madame. Je le fais tomber à la fin.": "Bring the curtain down during MY dress rehearsal? Never, madam. I bring it down at the end.", "Je couds les rideaux, madame. Je ne les décroche pas.": "I sew curtains, madam. I don’t take them down.", "Couper la générale juste avant mon solo ? Vous plaisantez !": "Cut the dress rehearsal just before my solo? You must be joking!", "Trou de mémoire": "A slip of memory", "Le livret du souffleur a disparu.": "The prompter’s script has disappeared.", "Il a été pris à {h}, {lieu}. Le coupable mêle le vrai et le faux, les trois autres disent vrai.": "It was taken at {h}, {lieu}. The culprit mixes truth and lies, the other three tell the truth.", "Mon livret ! Toutes les répliques de ce soir ! Sans lui, je souffle dans le vide !": "My script! All of tonight’s lines! Without it, I’m prompting into thin air!", "Le livret a disparu {lieu} à {h}. Quatre suspects, et le coupable dit vrai… parfois.": "The script disappeared {lieu} at {h}. Four suspects, and the culprit tells the truth… sometimes.", "Je voulais improviser, chéri. Le génie ne se souffle pas.": "I wanted to improvise, darling. Genius can’t be prompted.", "Et la poinçonneuse, c’était aussi du génie ?": "And the ticket punch, was that genius too?", "À la répétition suivante, tout l’orchestre joue faux.": "At the next rehearsal, the whole orchestra plays out of tune.", "« À 21 h 30, le régisseur et moi étions ensemble. Il me chronométrait. »": "“At 9:30 pm, the stage manager and I were together. He was timing me.”", "« Paulette a changé de pièce entre 21 h et 21 h 30. Elle me cherchait, forcément. »": "“Sally changed rooms between 9 pm and 9:30 pm. Looking for me, naturally.”", "« J’ai changé de pièce entre 21 h 30 et 22 h, pour une entrée triomphale. »": "“I changed rooms between 9:30 pm and 10 pm, for a triumphant entrance.”", "« Le régisseur n’a jamais mis les pieds dans les cintres. Il a le vertige. »": "“The stage manager never set foot in the flies. He’s afraid of heights.”", "« 22 h. Enzo et Paulette. Ensemble. Noté. »": "“10 pm. Enzo and Sally. Together. Noted.”", "« Enzo. Pas bougé. De 21 h à 21 h 30. »": "“Enzo. Didn’t move. 9 pm, 9:30 pm.”", "« Moi. Changé de pièce entre 21 h 30 et 22 h. »": "“Me. Changed rooms between 9:30 pm and 10 pm.”", "« Aria est passée par la fosse d’orchestre. Noté. »": "“Aria passed through the orchestra pit. Noted.”", "« 21 h 30. Paulette. Fosse d’orchestre. »": "“9:30 pm. Sally. Orchestra pit.”", "« À 20 h 30, le régisseur et moi étions ensemble, à chercher une épingle. »": "“At 8:30 pm, the stage manager and I were together, looking for a pin.”", "« Enzo n’a pas bougé à 20 h comme à 20 h 30 : il se regardait dans un miroir. »": "“Enzo stayed put at 8 pm and at 8:30 pm: he was looking at himself in a mirror.”", "« Je suis passée par la machinerie dans la soirée. Des paillettes partout, après. »": "“I passed through the machinery room during the evening. Sequins everywhere, afterwards.”", "« À 20 h 30, le régisseur et Paulette étaient ensemble. Je les ai vus, ma chère. »": "“At 8:30 pm, the stage manager and Sally were together. I saw them, darling.”", "« À 22 h, Enzo était sur la scène, à me voler la vedette. »": "“At 10 pm, Enzo was on the stage, stealing my limelight.”", "Le livret ? Je connais mon rôle par cœur, madame. Enfin… presque.": "The script? I know my part by heart, madam. Well… almost.", "Un livret ? Je ne lis que les plans de scène.": "A script? The only thing I read is stage plans.", "Je fais des ourlets, madame, pas des trous de mémoire.": "I make hems, madam, not memory gaps.", "Le diapason trafiqué": "The doctored tuning fork", "Le diapason de l’orchestre a été trafiqué.": "The orchestra’s tuning fork has been tampered with.", "Il a été limé à {h}, {lieu}. Tous les constats sont vrais. Énigme difficile : suppose, et cherche la contradiction.": "It was filed down at {h}, {lieu}. All the findings are true. A hard puzzle: suppose, and look for the contradiction.", "Tout l’orchestre est un demi-ton trop bas ! Je chante comme une casserole !": "The whole orchestra is a semitone flat! I sound like a saucepan!", "Le diapason a été limé {lieu} à {h}. Pas de témoignages ici, mais une énigme corsée.": "The tuning fork was filed {lieu} at {h}. No testimonies here, but a tough puzzle.", "Ce ténor chante trop haut ! Je voulais qu’il chante faux, juste une fois.": "That tenor sings too high! I wanted him to sing out of tune, just once.", "Résultat : tout le monde chante faux. Bravo, maestro.": "Result: everybody sings out of tune. Bravo, maestro.", "Cette nuit-là, une voix fantôme résonne dans l’opéra désert.": "That night, a ghostly voice echoes through the empty opera house.", "À 20 h, le maestro donnait ses dernières consignes à Enzo : ils se trouvaient dans la même pièce.": "At 8 pm, the maestro was giving Enzo his final instructions: they were in the same room.", "À 20 h, le régisseur et Sam se trouvaient dans la même pièce, à se disputer un projecteur.": "At 8 pm, the stage manager and Sam were in the same room, fighting over a spotlight.", "À 22 h, le maestro, le régisseur et Sam étaient dans la même pièce : une vraie réunion de crise, sans crise.": "At 10 pm, the maestro, the stage manager and Sam were in the same room: a proper crisis meeting, minus the crisis.", "À 21 h, Enzo était seul dans sa pièce, à s’admirer dans un miroir.": "At 9 pm, Enzo was alone in his room, admiring himself in a mirror.", "À 21 h 30, le maestro comme Enzo étaient seuls dans leur pièce : l’un battait la mesure, l’autre la contre-battait.": "At 9:30 pm, the maestro and Enzo were each alone in their room: one was beating time, the other beating against it.", "À 22 h 30, le maestro et le régisseur étaient chacun seuls dans leur pièce, à ruminer.": "At 10:30 pm, the maestro and the stage manager were each alone in their room, brooding.", "Le maestro a changé cinq fois de pièce : un chef d’orchestre ne tient pas en place.": "The maestro changed rooms five times: a conductor can’t keep still.", "Le régisseur a changé quatre fois de pièce : il court derrière chaque décor.": "The stage manager changed rooms four times: he runs after every piece of scenery.", "Sam a changé cinq fois de pièce : un souffleur sort de son trou plus souvent qu’on ne croit.": "Sam changed rooms five times: a prompter leaves his box more often than you’d think.", "À 21 h comme à 21 h 30, Enzo est resté dans la même pièce, à s’échauffer la voix.": "At 9 pm and at 9:30 pm, Enzo stayed in the same room, warming up his voice.", "À 21 h 30 comme à 22 h, le régisseur est resté dans la même pièce, à surveiller ses fils.": "At 9:30 pm and at 10 pm, the stage manager stayed in the same room, keeping an eye on his ropes.", "À 22 h comme à 22 h 30, Enzo est resté dans la même pièce, à soigner sa gorge.": "At 10 pm and at 10:30 pm, Enzo stayed in the same room, nursing his throat.", "À 21 h, le maestro n’était pas dans le parterre : on ne dirige pas un public.": "At 9 pm, the maestro was not in the stalls: you don’t conduct an audience.", "À 22 h 30, Sam n’était pas dans le foyer : on n’y souffle personne.": "At 10:30 pm, Sam was not in the foyer: there’s nobody to prompt there.", "Le maestro est passé par le parterre à un moment de la soirée, pour vérifier l’acoustique.": "The maestro passed through the stalls at some point in the evening, to check the acoustics.", "Le régisseur est passé par la loge de la diva à un moment de la soirée, pour réparer un miroir.": "The stage manager passed through the diva’s dressing room at some point in the evening, to repair a mirror.", "Enzo est passé par la machinerie, pour « vérifier l’écho ».": "Enzo passed through the machinery room, to “check the echo”.", "Trafiquer un diapason ? Je ne sais même pas lequel est le la.": "Tamper with a tuning fork? I don’t even know which one is the A.", "Moi, je souffle les paroles, madame. Pas les notes.": "I prompt words, madam. Not notes.", "Fausser l’orchestre ? Je chante assez faux tout seul, merci !": "Put the orchestra out of tune? I sing out of tune enough on my own, thank you!", "La voix des cintres": "The voice in the flies", "Une voix mystérieuse chante la nuit.": "A mysterious voice sings at night.", "On l’a entendue à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai.": "It was heard at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth.", "chant": "singing", "Une voix ! En pleine nuit ! Elle chante mieux que moi ! C’est forcément un fantôme !": "A voice! In the middle of the night! It sings better than I do! It must be a ghost!", "Les fantômes n’ont
