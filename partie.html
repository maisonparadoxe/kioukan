<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kioukan · Partie rapide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Yellowtail&display=swap">
<style>
/* Concept : boîte de jeu d'enquête. Aplats pastel, polaroïds des suspects, plan vu de dessus, grille sur papier déchiré.
   Mobile : une colonne (affaire, suspects, plan, chronologie, constats). Large : chronologie à gauche, plan et constats à droite. */
:root {
  --bg: #d9ebfb;
  --panel: #ffffff;
  --panel-2: #eceffd;
  --cell: #f3f5ff;
  --ink: #2b2f55;
  --ink-2: #666c91;
  --rule: #e0e5f5;
  --accent: #6a78c9;
  --accent-d: #4d5aa8;
  --accent-ink: #ffffff;
  --pink: #f4b6c9;
  --pink-2: #fbdde7;
  --lav: #e7e3fa;
  --given: #fbd3df;
  --ok: #2f9e77;
  --bad: #dc4f6b;
  --bad-bg: #ffe1e7;
  --shadow: 0 6px 16px rgba(60, 80, 140, 0.16);
  --wall: #2b2f55;
  --door: #fff3cf;
  --wood-a: #f7dbe2; --wood-b: #ebbccb;
  --check-a: #fde9ef; --check-c: #f6c7d6;
  --tile-a: #e3e7fb; --tile-b: #cdd4f3;
  --diamond-a: #ece3f8; --diamond-c: #d6c8f0;
  --grass-a: #cdeac3; --grass-c: #a9d89d;
  --steel-a: #dde3f2; --steel-b: #bcc6e0;
  --fu: #f0a3b9; --fu2: #c9bdf0; --fw: #ffffff; --fpot: #b5806a; --fg: #6dbb84; --fg2: #4f9f6c; --ftv: #3a3f6b; --win: #bfe2f7;
  --s0: #f08a5d;
  --s1: #3bb39f;
  --s2: #8e7cf0;
  --s3: #ee6fa5;
  --s4: #e8b730;
  --display: 'Yellowtail', 'Brush Script MT', cursive;
  --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: var(--sans);
  --tw: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171c3d;
    --panel: #252b57;
    --panel-2: #323a70;
    --cell: #1d2348;
    --ink: #eef0ff;
    --ink-2: #aeb4da;
    --rule: #353d6b;
    --accent: #8d9cf0;
    --accent-d: #5f6ec9;
    --accent-ink: #11153a;
    --pink: #c97b97;
    --pink-2: #4a2f55;
    --lav: #343b72;
    --given: #6b3f66;
    --ok: #4fd68c;
    --bad: #ff7d93;
    --bad-bg: #55243c;
    --shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    --wall: #0b0e24;
    --door: #ffe9a8;
    --wood-a: #5b4666; --wood-b: #6e5780;
    --check-a: #5a4465; --check-c: #6c5379;
    --tile-a: #3d4676; --tile-b: #4b5590;
    --diamond-a: #46407a; --diamond-c: #574f90;
    --grass-a: #3b6b55; --grass-c: #4b806a;
    --steel-a: #424a78; --steel-b: #545d93;
    --fu: #c97b97; --fu2: #8d82cf; --fw: #eef0ff; --fg: #58ab78; --fg2: #3f8f5f; --win: #8fc0e8;
    --s0: #ff9a6e;
    --s1: #4fd1bb;
    --s2: #a99aff;
    --s3: #ff86b8;
    --s4: #f2c53f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171c3d;
  --panel: #252b57;
  --panel-2: #323a70;
  --cell: #1d2348;
  --ink: #eef0ff;
  --ink-2: #aeb4da;
  --rule: #353d6b;
  --accent: #8d9cf0;
  --accent-d: #5f6ec9;
  --accent-ink: #11153a;
  --pink: #c97b97;
  --pink-2: #4a2f55;
  --lav: #343b72;
  --given: #6b3f66;
  --ok: #4fd68c;
  --bad: #ff7d93;
  --bad-bg: #55243c;
  --shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  --wall: #0b0e24;
  --door: #ffe9a8;
  --wood-a: #5b4666; --wood-b: #6e5780;
  --check-a: #5a4465; --check-c: #6c5379;
  --tile-a: #3d4676; --tile-b: #4b5590;
  --diamond-a: #46407a; --diamond-c: #574f90;
  --grass-a: #3b6b55; --grass-c: #4b806a;
  --steel-a: #424a78; --steel-b: #545d93;
  --fu: #c97b97; --fu2: #8d82cf; --fw: #eef0ff; --fg: #58ab78; --fg2: #3f8f5f; --win: #8fc0e8;
  --s0: #ff9a6e;
  --s1: #4fd1bb;
  --s2: #a99aff;
  --s3: #ff86b8;
  --s4: #f2c53f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* En-tête */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 14px 20px; margin-bottom: 18px;
}
.brand { min-width: 0; }
h1 { margin: 0; font: 400 clamp(60px, 18vw, 84px)/0.9 var(--display); color: var(--ink); text-shadow: 3px 4px 0 var(--pink); }
.dossier {
  margin: 8px 0 0; display: inline-block; font: 700 13px/1.2 var(--sans); color: var(--ink);
  background: var(--panel); padding: 5px 12px; border-radius: 999px; box-shadow: var(--shadow);
}
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls .seg { flex: 1 1 auto; }
.controls .seg button { flex: 1 1 auto; }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); }
.seg button {
  border: 0; background: transparent; padding: 8px 14px; min-height: 40px; border-radius: 999px;
  font: 700 14.5px var(--sans); cursor: pointer; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }

.btn {
  border: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
  padding: 9px 16px; min-height: 42px; border-radius: 999px; font: 800 14.5px var(--sans); cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--bad); color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Mise en page */
.layout { display: flex; flex-direction: column; gap: 18px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; }
#verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
#suspects[hidden] { display: none; }
@media (min-width: 700px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 22px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
@media (min-width: 700px) and (min-height: 520px) {
  /* indices et plan restent à l'écran pendant qu'on remplit la grille */
  .layout > .col:last-child { position: sticky; top: 10px; max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 4px 6px 10px; margin: -4px -6px 0; }
}
.panel { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
@media (min-width: 480px) { .panel { padding: 18px; } :root { --tw: 60px; } }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 800 19px/1.1 var(--sans); color: var(--ink); }
.sub { font: 700 13px var(--sans); color: var(--ink-2); }

/* L'affaire */
.eyebrow {
  display: inline-block; margin: 0 0 8px; padding: 3px 11px; border-radius: 999px; background: var(--pink-2); color: var(--bad);
  font: 800 12px/1.4 var(--sans); letter-spacing: 0.08em; text-transform: uppercase;
}
.case h2 { margin: 0 0 8px; font: 800 21px/1.25 var(--sans); text-wrap: balance; }
.case h2 em { font-style: normal; background: var(--pink-2); padding: 0 8px; border-radius: 8px; white-space: nowrap; }
.case p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.case p b { color: var(--ink); font-weight: 800; }

/* Polaroïds */
.pola {
  margin: 0; padding: 5px 5px 0; background: #fff; color: #2b2f55; border: 1.5px solid #2b2f55; border-radius: 4px;
  box-shadow: 0 3px 8px rgba(43, 47, 85, 0.22); min-width: 0;
}
.pola-img { aspect-ratio: 1; overflow: hidden; background: color-mix(in srgb, var(--c) 40%, #fff); border: 1.5px solid rgba(43, 47, 85, 0.5); }
.pola-img svg { display: block; width: 100%; height: 100%; }
.pola figcaption { text-align: center; padding: 1px 0 6px; line-height: 1.1; }
.pola .pn { display: block; font: 400 22px/1.1 var(--display); overflow-wrap: anywhere; }
.pola small { display: block; font: 700 12px/1.2 var(--sans); color: #666c91; }
.pola .guilty { color: #dc4f6b; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
.strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; padding: 2px 4px 6px; }
@media (min-width: 600px) { .strip { grid-template-columns: repeat(var(--N), minmax(0, 1fr)); } }
.strip .pola:nth-child(odd) { transform: rotate(-1.6deg); }
.strip .pola:nth-child(even) { transform: rotate(1.3deg); }
.mini { display: inline-block; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c) 45%, #fff); border: 2.5px solid var(--c); }
.mini svg { display: block; width: 100%; height: 100%; }

/* Plan */
.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chip {
  border: 0; background: var(--panel-2); border-radius: 999px; padding: 4px 0; min-height: 34px;
  font: 700 13px var(--sans); color: var(--ink-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }
.chip.crime::after { content: ""; position: absolute; top: -2px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); border: 2px solid var(--panel); }
.plan { display: block; width: 100%; height: auto; overflow: visible; }
.pt-wood .pa-a { fill: var(--wood-a); } .pt-wood .pa-b { stroke: var(--wood-b); fill: none; stroke-width: 0.9; }
.pt-check .pa-a { fill: var(--check-a); } .pt-check .pa-c { fill: var(--check-c); }
.pt-tile .pa-a { fill: var(--tile-a); } .pt-tile .pa-b { stroke: var(--tile-b); fill: none; stroke-width: 1; }
.pt-diamond .pa-a { fill: var(--diamond-a); } .pt-diamond .pa-c { fill: var(--diamond-c); }
.pt-grass .pa-a { fill: var(--grass-a); } .pt-grass .pa-c { fill: var(--grass-c); }
.pt-steel .pa-a { fill: var(--steel-a); } .pt-steel .pa-b { stroke: var(--steel-b); fill: none; stroke-width: 0.9; }
.furn .fu { fill: var(--fu); } .furn .fu2 { fill: var(--fu2); } .furn .fw { fill: var(--fw); } .furn .fpot { fill: var(--fpot); }
.furn .fg { fill: var(--fg); } .furn .fg2 { fill: var(--fg2); } .furn .ftv { fill: var(--ftv); } .furn .win { fill: var(--win); }
.furn .fl { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.9; fill: none; }
.furn rect, .furn ellipse, .furn circle { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.8; }
.deco .rail { stroke: var(--wall); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.deco .wheel { fill: var(--panel-2); stroke: var(--wall); stroke-width: 2.4; }
.wall { fill: none; stroke: var(--wall); stroke-width: 3.4; stroke-linejoin: round; }
.crimeroom { fill: none; stroke: var(--bad); stroke-width: 2.2; stroke-dasharray: 6 4; }
.door { fill: var(--door); stroke: var(--wall); stroke-width: 1.2; }
.pill rect { fill: #fff; stroke: #2b2f55; stroke-width: 1.1; }
.pill text { font: 800 7.6px var(--sans); letter-spacing: 0.04em; fill: #2b2f55; text-anchor: middle; dominant-baseline: central; }
.crimemark polygon { fill: var(--bad); stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
.crimemark path { stroke: #fff; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.tok .halo { fill: #fff; opacity: 0.9; }
.tok .face { fill: color-mix(in srgb, var(--c) 45%, #fff); }
.tok .ring { fill: none; stroke: var(--c); stroke-width: 2.4; }
.tok.culprit .ring { stroke: var(--bad); stroke-width: 3.6; }
.legend { margin: 12px 0 0; font: 700 13px var(--sans); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; }
.legend span { background: var(--panel-2); border-radius: 999px; padding: 4px 11px; display: inline-flex; align-items: center; }
.legend i { display: inline-block; margin-right: 7px; }
.legend .lg-door { width: 16px; height: 8px; background: var(--door); border: 1.5px solid var(--wall); border-radius: 2px; }
.legend .lg-crime { width: 16px; height: 11px; border: 2px dashed var(--bad); border-radius: 2px; }

/* Chronologie */
.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; align-items: stretch; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding: 0 1px 4px; min-width: 0; text-align: center; }
.who b { font-weight: 800; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; line-height: 1.1; }
.who small { font-size: 10.5px; color: var(--ink-2); line-height: 1; font-weight: 700; }
.time {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px;
  min-height: 48px; padding: 0 6px; border: 0; border-radius: 12px; background: transparent;
  font: 800 13px var(--sans); color: var(--ink-2); cursor: pointer; text-align: left; font-variant-numeric: tabular-nums;
}
.time.sel { background: var(--panel-2); color: var(--ink); }
.time small { font: 800 9.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--bad); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px;
  border: 2px solid var(--rule); border-radius: 12px; box-shadow: inset 5px 0 0 var(--c);
  background: var(--cell); color: var(--ink); font: 700 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.board.dense .cell { font-size: 11.5px; }
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); border-color: transparent; cursor: default; }
.cell.given svg { position: absolute; top: 4px; right: 4px; color: var(--ink); opacity: 0.7; }
.cell.bad { background: var(--bad-bg); border-color: var(--bad); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font: 700 13px var(--sans); color: var(--ink-2); }
.status .err { color: var(--bad); font-weight: 800; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--rule); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px; }
.switch { min-height: 44px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.loading { padding: 28px 0; text-align: center; font: 700 14px var(--sans); color: var(--ink-2); }
/* la grille se pose sur une feuille au bord déchiré */
#board-panel {
  padding-bottom: 22px; box-shadow: none; border-radius: 16px 16px 0 0;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
}

/* Verdict */
.verdict { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; border: 3px solid var(--bad); }
.v-top { display: flex; align-items: center; gap: 18px; width: 100%; }
.v-top .pola { width: 104px; flex: none; transform: rotate(-3deg); }
.stamp {
  display: inline-block; font: 800 25px/1.05 var(--sans); text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--bad); border: 4px double var(--bad); border-radius: 10px; padding: 8px 12px; transform: rotate(-5deg);
}
.verdict p { margin: 0; }
.verdict .sub { color: var(--ink-2); }

/* Constats */
.opts { margin: -2px 0 8px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-top: 2px dashed var(--rule); font-size: 15px; }
.clues .clue:first-child { border-top: 0; }
.clue .ico {
  width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--rule);
  display: grid; place-items: center; color: var(--accent-ink); background: var(--panel);
}
.clue.ok .ico { background: var(--ok); border-color: var(--ok); color: #fff; }
.clue.bad .ico { background: var(--bad); border-color: var(--bad); color: #fff; }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--bad); font-weight: 800; }
.clue.rule .txt { font-weight: 800; }
.clue.rule.ok .txt { font-weight: 400; }
.empty-note { margin: 0; padding: 10px 0 2px; color: var(--ink-2); font-size: 14px; }

/* Règles */
.rules summary { cursor: pointer; font: 800 19px/1.1 var(--sans); color: var(--ink); list-style-position: inside; padding: 10px 0; min-height: 44px; }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 15px; }
.rules ol b { color: var(--ink); font-weight: 800; }

/* Sélecteur de pièce */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 20, 50, 0.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto;
  background: var(--panel); border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(15, 20, 50, 0.3);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: 0; } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 800 17px var(--sans); }
.trail { margin: 0 0 12px; font: 700 13px var(--sans); color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { overflow-wrap: anywhere;
  min-height: 52px; padding: 6px 4px; border: 0; border-radius: 14px; background: var(--panel-2);
  font: 800 14px/1.1 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.room-btn small { font: 700 11px var(--sans); color: var(--ink-2); }
.room-btn.far { background: transparent; box-shadow: inset 0 0 0 2px var(--rule); color: var(--ink-2); font-weight: 700; }
.room-btn.cur { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-d); }
.room-btn.cur small { color: var(--accent-ink); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }

}

<script>
/* Illustrations : portraits plats des suspects, sols et mobilier vus de dessus. */
(function () {
  'use strict';
  var INK = '#2b2f55';

  /* Un portrait par suspect : peau, cheveux, coupe, tenue, accessoires. */
  var LOOKS = {
    'Mme Vernet':      { skin: '#f3cdb3', hair: '#d9d9e3', style: 'bun',   shirt: '#7f8fd6', x: ['pearls'] },
    'Dr Aubry':        { skin: '#ecbd99', hair: '#3a2c2a', style: 'short', shirt: '#f4f6ff', x: ['glasses'] },
    'Lucas':           { skin: '#e4aa80', hair: '#d9672a', style: 'curly', shirt: '#5bb59a', x: [] },
    'Colonel Marchal': { skin: '#f0c2a0', hair: '#eceaf2', style: 'short', shirt: '#b3413f', x: ['mustache', 'cap'] },
    'Inès':            { skin: '#c98b61', hair: '#241c2c', style: 'long',  shirt: '#e7849f', x: ['earrings'] },
    'Mme Delaunay':    { skin: '#f3cdb3', hair: '#a5482c', style: 'wavy',  shirt: '#3b3f6e', x: ['hat'] },
    'Dr Moreau':       { skin: '#d9a07a', hair: '#2b2224', style: 'short', shirt: '#6ec0c9', x: ['glasses', 'beard'] },
    'Baron Voss':      { skin: '#f0c2a0', hair: '#8c8da5', style: 'bald',  shirt: '#2f3157', x: ['mustache', 'tophat', 'bowtie'] },
    'Roux':            { skin: '#e4aa80', hair: '#4a3427', style: 'short', shirt: '#4c6fb8', x: ['cap'] },
    'Mlle Ferrand':    { skin: '#f6d6bf', hair: '#f0c75e', style: 'bob',   shirt: '#9a7ee0', x: ['earrings'] },
    'Mme Lefèvre':     { skin: '#f0c2a0', hair: '#b9bccb', style: 'bun',   shirt: '#d98a86', x: ['glasses'] },
    'M. Costa':        { skin: '#e0a37b', hair: '#1f1a22', style: 'short', shirt: '#2b2f55', x: ['mustache', 'bowtie'] },
    'Dr Bellamy':      { skin: '#f3cdb3', hair: '#d8a83a', style: 'short', shirt: '#f4f6ff', x: ['glasses'] },
    'Mme Okafor':      { skin: '#6d4430', hair: '#1c1620', style: 'afro',  shirt: '#f0a94e', x: ['earrings'] },
    'Chef Duval':      { skin: '#eab491', hair: '#5a3b2a', style: 'short', shirt: '#ffffff', x: ['mustache', 'toque'] }
  };
  var DEFAULT = { skin: '#eab491', hair: '#3a2c2a', style: 'short', shirt: '#7f8fd6', x: [] };

  function has(L, k) { return L.x.indexOf(k) >= 0; }

  function inner(name) {
    var L = LOOKS[name] || DEFAULT, H = L.hair, S = L.skin, h = '', st = L.style;
    /* derrière la tête */
    if (st === 'long') h += '<path d="M16 30Q12 54 20 62L44 62Q52 54 48 30Z" fill="' + H + '"/>';
    if (st === 'afro') h += '<circle cx="32" cy="24" r="19" fill="' + H + '"/>';
    if (st === 'bun') h += '<circle cx="32" cy="9" r="6.5" fill="' + H + '"/>';
    if (st === 'wavy') h += '<path d="M17 28Q12 44 18 54Q22 50 21 44L43 44Q42 50 46 54Q52 44 47 28Z" fill="' + H + '"/>';
    /* buste */
    h += '<path d="M5 64Q7 45 32 45Q57 45 59 64Z" fill="' + L.shirt + '"/>';
    if (has(L, 'bowtie')) h += '<path d="M32 49L24 45L24 53ZM32 49L40 45L40 53Z" fill="#d94a63"/><circle cx="32" cy="49" r="2" fill="#b23550"/>';
    if (has(L, 'pearls')) h += '<g fill="#fff" stroke="#c9cbe0" stroke-width=".6"><circle cx="24" cy="46.5" r="1.8"/><circle cx="28" cy="48.5" r="1.8"/><circle cx="32" cy="49.2" r="1.8"/><circle cx="36" cy="48.5" r="1.8"/><circle cx="40" cy="46.5" r="1.8"/></g>';
    /* cou et tête */
    h += '<rect x="27" y="38" width="10" height="10" rx="3" fill="' + S + '"/>';
    h += '<ellipse cx="32" cy="29" rx="12" ry="14" fill="' + S + '"/>';
    h += '<ellipse cx="20" cy="31" rx="2" ry="3" fill="' + S + '"/><ellipse cx="44" cy="31" rx="2" ry="3" fill="' + S + '"/>';
    /* cheveux de face */
    if (st === 'short' || st === 'long' || st === 'bun' || st === 'afro') h += '<path d="M19.5 28Q17 11 32 11.5Q47 11 44.5 28Q41 19.5 32 19.5Q23 19.5 19.5 28Z" fill="' + H + '"/>';
    if (st === 'wavy') h += '<path d="M19 29Q15 10 32 11Q49 10 45 29Q42 20 32 20Q22 20 19 29Z" fill="' + H + '"/>';
    if (st === 'curly') h += '<g fill="' + H + '"><circle cx="21" cy="19" r="6.5"/><circle cx="28" cy="13" r="7"/><circle cx="37" cy="13" r="7"/><circle cx="43" cy="19" r="6.5"/><circle cx="32" cy="17" r="6"/></g>';
    if (st === 'bob') h += '<path d="M17.5 36Q13 9 32 10Q51 9 46.5 36Q44 35 44 28Q40 19.5 32 19.5Q24 19.5 20 28Q20 35 17.5 36Z" fill="' + H + '"/>';
    if (st === 'bald') h += '<path d="M19.5 28Q19 22 22 19Q20 26 20.5 31Z M44.5 28Q45 22 42 19Q44 26 43.5 31Z" fill="' + H + '"/>';
    /* visage */
    h += '<circle cx="27" cy="30" r="1.7" fill="' + INK + '"/><circle cx="37" cy="30" r="1.7" fill="' + INK + '"/>';
    h += '<circle cx="24.5" cy="34.5" r="2.4" fill="#ef8aa1" opacity=".35"/><circle cx="39.5" cy="34.5" r="2.4" fill="#ef8aa1" opacity=".35"/>';
    if (has(L, 'beard')) h += '<path d="M20.5 32Q21 48 32 48.5Q43 48 43.5 32Q40 41 32 41Q24 41 20.5 32Z" fill="' + H + '"/>';
    h += '<path d="M29 37.5Q32 40 35 37.5" fill="none" stroke="' + INK + '" stroke-width="1.4" stroke-linecap="round"/>';
    if (has(L, 'mustache')) h += '<path d="M23.5 36.5Q28 32.5 32 35.5Q36 32.5 40.5 36.5Q36 38 32 36.5Q28 38 23.5 36.5Z" fill="' + H + '"/>';
    if (has(L, 'glasses')) h += '<g fill="#fff" fill-opacity=".25" stroke="' + INK + '" stroke-width="1.3"><circle cx="27" cy="30" r="4.4"/><circle cx="37" cy="30" r="4.4"/></g><path d="M31.4 30H32.6" stroke="' + INK + '" stroke-width="1.3"/>';
    if (has(L, 'earrings')) h += '<circle cx="20" cy="36" r="1.8" fill="#f2c14b"/><circle cx="44" cy="36" r="1.8" fill="#f2c14b"/>';
    /* couvre-chefs */
    if (has(L, 'cap')) h += '<path d="M19 20Q19 8 32 8Q45 8 45 20Z" fill="' + (L.shirt === '#b3413f' ? '#8f2f2e' : '#2f4a8c') + '"/><rect x="17" y="19" width="30" height="3.5" rx="1.7" fill="#1f2a55"/><circle cx="32" cy="14" r="1.8" fill="#f2c14b"/>';
    if (has(L, 'tophat')) h += '<rect x="19" y="16" width="26" height="4" rx="2" fill="#1d1f3a"/><rect x="23" y="1" width="18" height="17" rx="2" fill="#1d1f3a"/><rect x="23" y="12" width="18" height="3.2" fill="#d94a63"/>';
    if (has(L, 'hat')) h += '<ellipse cx="32" cy="14" rx="19" ry="4.5" fill="#e7849f"/><path d="M22 14Q22 4 32 4Q42 4 42 14Z" fill="#e7849f"/><path d="M22 12H42" stroke="#fff" stroke-width="2.4"/><circle cx="40" cy="9" r="2.2" fill="#fff"/>';
    if (has(L, 'toque')) h += '<rect x="22" y="12" width="20" height="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="24" cy="9" r="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="32" cy="6" r="7" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="40" cy="9" r="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/>';
    return h;
  }
  function avatar(name) {
    return '<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + inner(name) + '</svg>';
  }

  /* Sols (motifs répétés) */
  function defs() {
    return '<defs>' +
      '<pattern id="pf-wood" class="pt-wood" width="14" height="12" patternUnits="userSpaceOnUse"><rect class="pa-a" width="14" height="12"/><path class="pa-b" d="M0 .5H14M0 6.5H14M4 .5V6.5M11 6.5V12.5"/></pattern>' +
      '<pattern id="pf-check" class="pt-check" width="16" height="16" patternUnits="userSpaceOnUse"><rect class="pa-a" width="16" height="16"/><rect class="pa-c" width="8" height="8"/><rect class="pa-c" x="8" y="8" width="8" height="8"/></pattern>' +
      '<pattern id="pf-tile" class="pt-tile" width="14" height="14" patternUnits="userSpaceOnUse"><rect class="pa-a" width="14" height="14"/><path class="pa-b" d="M0 .5H14M.5 0V14"/></pattern>' +
      '<pattern id="pf-diamond" class="pt-diamond" width="20" height="20" patternUnits="userSpaceOnUse"><rect class="pa-a" width="20" height="20"/><path class="pa-c" d="M10 2L18 10L10 18L2 10Z"/></pattern>' +
      '<pattern id="pf-grass" class="pt-grass" width="16" height="16" patternUnits="userSpaceOnUse"><rect class="pa-a" width="16" height="16"/><g class="pa-c"><circle cx="3" cy="4" r="1.3"/><circle cx="11" cy="9" r="1.3"/><circle cx="6" cy="13" r="1.1"/></g></pattern>' +
      '<pattern id="pf-steel" class="pt-steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect class="pa-a" width="12" height="12"/><path class="pa-b" d="M0 6.5H12"/></pattern>' +
      '<pattern id="pf-deck" class="pt-wood" width="30" height="8" patternUnits="userSpaceOnUse"><rect class="pa-a" width="30" height="8"/><path class="pa-b" d="M0 .5H30M18 0V8"/></pattern>' +
      '<pattern id="pf-seats" class="pt-seats" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#c0505a"/><rect x="2" y="2" width="8" height="6" rx="2" fill="#e07a82"/></pattern>' +
      '<pattern id="pf-felt" class="pt-felt" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#3f8a5a"/><circle cx="8" cy="8" r="0.8" fill="#5aa874"/></pattern>' +
      '<clipPath id="tokclip"><circle cx="32" cy="32" r="32"/></clipPath>' +
      '</defs>';
  }

  /* Mobilier (x, y, w, h en unités du plan) */
  function r(c, x, y, w, h, rx) { return '<rect class="' + c + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx === undefined ? 2.5 : rx) + '"/>'; }
  function furn(t, x, y, w, h) {
    var s = '', m;
    switch (t) {
      case 'bed':
        m = Math.min(w, h);
        s += r('fu', x, y, w, h, 3);
        if (w >= h) { s += r('fu2', x + m * 0.55, y, w - m * 0.55, h, 2) + r('fw', x + 2, y + 2, m * 0.42, h - 4, 2); }
        else { s += r('fu2', x, y + m * 0.55, w, h - m * 0.55, 2) + r('fw', x + 2, y + 2, w - 4, m * 0.42, 2); }
        break;
      case 'sofa':
        s += r('fu', x, y, w, h, 4) + r('fu2', x, y, w, h * 0.38, 4) + r('fu2', x, y, 5, h, 3) + r('fu2', x + w - 5, y, 5, h, 3);
        break;
      case 'table':
        s += (w > h * 1.25) ? r('fu2', x, y, w, h, 4) + r('fw', x + 2, y + 2, w - 4, h - 4, 3) : '<ellipse class="fu2" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" rx="' + w / 2 + '" ry="' + h / 2 + '"/>';
        break;
      case 'chair': s += r('fu2', x, y + h * 0.3, w, h * 0.7, 3) + r('fu', x, y, w, h * 0.35, 2); break;
      case 'plant':
        s += r('fpot', x + w * 0.28, y + h * 0.66, w * 0.44, h * 0.34, 1.5) +
          '<circle class="fg" cx="' + (x + w / 2) + '" cy="' + (y + h * 0.4) + '" r="' + Math.min(w, h) * 0.42 + '"/>' +
          '<circle class="fg2" cx="' + (x + w * 0.38) + '" cy="' + (y + h * 0.36) + '" r="' + Math.min(w, h) * 0.2 + '"/>';
        break;
      case 'tv': s += r('ftv', x, y, w, h * 0.78, 2) + r('fu', x + w * 0.35, y + h * 0.78, w * 0.3, h * 0.22, 1); break;
      case 'shelf':
        s += r('fu', x, y, w, h, 2);
        for (m = x + 8; m < x + w - 3; m += 9) s += '<path class="fl" d="M' + m + ' ' + y + 'V' + (y + h) + '"/>';
        break;
      case 'counter':
        s += r('fu', x, y, w, h, 3) + r('fw', x + 1.5, y + 1.5, w - 3, h * 0.4, 2);
        if (w > 44) for (m = x + 10; m < x + w - 6; m += 14) s += '<circle class="ftv" cx="' + m + '" cy="' + (y + h * 0.72) + '" r="2"/>';
        break;
      case 'desk': s += r('fu', x, y, w, h, 3) + r('fw', x + w * 0.3, y + 2.5, w * 0.28, h * 0.4, 1.5) + '<circle class="fu2" cx="' + (x + w * 0.8) + '" cy="' + (y + h * 0.5) + '" r="2.6"/>'; break;
      case 'crate':
        s += r('fu2', x, y, w, h, 2.5) + r('fw', x + w / 2 - 1.4, y, 2.8, h, 0) + r('fw', x, y + h / 2 - 1.4, w, 2.8, 0) + '<circle class="fu" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="2.6"/>';
        break;
      case 'barrel': s += '<ellipse class="fu" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" rx="' + w / 2 + '" ry="' + h / 2 + '"/><path class="fl" d="M' + (x + 2) + ' ' + (y + h / 2) + 'H' + (x + w - 2) + '"/>'; break;
      case 'win': s += r('win', x, y, w, h, 1.5); break;
      case 'tree':
        s += '<circle class="fg" cx="' + x + '" cy="' + y + '" r="' + w / 2 + '"/><circle class="fg2" cx="' + (x - w * 0.12) + '" cy="' + (y - w * 0.1) + '" r="' + w * 0.26 + '"/>';
        break;
      case 'stool': s += '<circle class="fu" cx="' + x + '" cy="' + y + '" r="' + w / 2 + '"/>'; break;
      case 'vent': s += r('fu2', x, y, w, h, 2) + '<path class="fl" d="M' + (x + 3) + ' ' + (y + h / 2) + 'H' + (x + w - 3) + '"/>'; break;
      case 'wheel':
        s += '<circle class="fu2" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 2 + '"/><circle class="fw" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 5 + '"/>';
        for (m = 0; m < 8; m++) s += '<path class="fl" d="M' + (x + w / 2) + ' ' + (y + h / 2) + 'L' + (x + w / 2 + Math.cos(m * 0.785) * w / 2) + ' ' + (y + h / 2 + Math.sin(m * 0.785) * w / 2) + '"/>';
        break;
      case 'piano': s += r('ftv', x, y, w, h, 6) + r('fw', x + 4, y + h - 7, w - 8, 4, 1); break;
      case 'mirror': s += r('fw', x, y, w, h, 3) + r('win', x + 2, y + 2, w - 4, h - 4, 2); break;
      case 'roulette':
        s += '<circle class="fu" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 2 + '"/><circle class="ftv" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 3 + '"/><circle class="fw" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 9 + '"/>';
        break;
      case 'safe': s += r('ftv', x, y, w, h, 2) + '<circle class="fw" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="' + w / 5 + '"/>'; break;
      case 'lift': s += r('fu2', x, y, w, h, 2) + '<path class="fl" d="M' + (x + w / 2) + ' ' + y + 'V' + (y + h) + '"/>'; break;
    }

          : 'Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier », qui contrôle toute la grille d’un coup.') + '</p>';
    }
    $('board-panel').innerHTML = h;
  }

  function renderCluesLiar() {
    var P = state.puz, A = analyse(), show = showMarks(), L = state.liarGuess, S = P.S, s, h = '';
    var total = A.items.length;
    h += '<div class="panel-hd"><h2 class="label">Déclarations</h2><span class="sub">' +
      (show ? (L < 0 ? 'désigne un menteur' : A.okCount + '/' + total + ' confirmées') : total + ' constats') + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>Masquer les déclarations confirmées</span></label>';
    function li(it, text) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      var tag = (st === 'true' || st === 'false') ? '<span class="tag">' + (st === 'true' ? 'vrai' : 'faux') + '</span>' : '';
      return '<li class="clue ' + st + (it.rule ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + text + ' ' + tag + '</span></li>';
    }
    var rule = A.items.filter(function (it) { return it.rule; })[0];
    h += '<ul class="clues">' + li(rule, 'Le menteur est le meurtrier : lui seul se trouvait ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) + '.') + '</ul>';
    var facts = P.clues.filter(function (c) { return c.by === undefined; });
    if (facts.length) {
      h += '<div class="speaker"><b>Preuves</b><span class="tag">certaines</span></div><ul class="clues proof-list">' +
        facts.map(function (c) { return '<li class="clue ok proof"><span class="ico">' + ICON.lock + '</span><span class="txt">' + E.clueText(P, c) + '</span></li>'; }).join('') + '</ul>';
    }
    for (s = 0; s < S; s++) {
      var mix = (P.mode === 'half' && L === s) ? A.items.filter(function (it) { return it.mix; })[0] : null;
      var rows = (mix ? li(mix, 'Au moins une de ses déclarations est vraie et au moins une est fausse.') : '') + A.items.filter(function (it) { return !it.rule && !it.mix && it.c.by === s; }).map(function (it) {
        return li(it, '« ' + E.statementText(P, it.c) + ' »');
      }).join('');
      var who = L < 0 ? '' : (L === s ? '<span class="tag liar-tag">' + (P.mode === 'half' ? 'ment en partie' : 'ment : tout est faux') + '</span>' : '<span class="tag">dit vrai</span>');
      h += '<div class="sp s' + s + '">' + pola(s, '<small>' + SUSPECTS[s].role + '</small>' + who) +
        (rows ? '<ul class="clues bubbles">' + rows + '</ul>' : '<p class="empty-note">Toutes ses déclarations sont confirmées.</p>') + '</div>';
    }
    $('clues-panel').innerHTML = h;
  }

  function renderClues() {
    if (isLiar(state.puz)) { renderCluesLiar(); return; }
    var A = analyse(), show = showMarks();
    var h = '<div class="panel-hd"><h2 class="label">Constats</h2><span class="sub">' +
      (show ? A.okCount + '/' + A.items.length + ' confirmés' : A.items.length + ' constats') + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>Masquer les constats confirmés</span></label>';
    var rows = A.items.map(function (it) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      return '<li class="clue ' + st + (it.c.type === 'crime' ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + E.clueText(state.puz, it.c) + '</span></li>';
    }).join('');
    h += rows ? '<ul class="clues">' + rows + '</ul>' : '<p class="empty-note">Tous les constats sont confirmés.</p>';
    $('clues-panel').innerHTML = h;
  }

  function mineCount() {
    var P = state.puz;
    return P.clues.filter(function (c) { return c.by === P.liar; }).length;
  }
  function falseCount() {
    var P = state.puz, gs = function (s, t) { return P.solution[s * P.T + t]; };
    return P.clues.filter(function (c) { return c.by === P.liar && E.evalClue(P, c, gs) !== 'ok'; }).length;
  }

  function renderVerdict() {
    var P = state.puz, el = $('verdict');
    if (!state.solved) { el.innerHTML = ''; return; }
    var c = SUSPECTS[P.culprit];
    el.innerHTML = '<div class="panel verdict"><div class="v-top">' + pola(P.culprit, '<small class="guilty">coupable</small>') + '<div class="stamp">Affaire classée</div></div>' +
      (P.mode === 'half'
        ? '<p><b>' + c.name + '</b> mêlait le vrai et le faux : ' + falseCount() + ' de ' + (c.f ? 'ses' : 'ses') + ' ' + mineCount() + ' déclarations ' + (falseCount() > 1 ? 'étaient fausses' : 'était fausse') + '. ' + (c.f ? 'Elle' : 'Il') + ' était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          '. Les autres suspects disaient toujours vrai.</p>'
        : P.mode === 'liar'
        ? '<p><b>' + c.name + '</b> mentait. ' + (c.f ? 'Elle' : 'Il') + ' était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          ', et chacune de ses déclarations était fausse. Les autres suspects disaient vrai.</p>'
        : '<p><b>' + c.name + '</b> était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          '. Tous les autres alibis tiennent.</p>') +
      '<p class="sub">' + (state.early ? 'Accusation exacte alors que ' + state.early + ' case' + (state.early > 1 ? 's' : '') + ' de la chronologie restaient à remplir. ' : '') +
      (state.hints ? state.hints + ' indice' + (state.hints > 1 ? 's' : '') + ' utilisé' + (state.hints > 1 ? 's' : '') + '. ' : 'Aucun indice utilisé. ') +
      (state.wrong ? state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '.' : 'Aucune fausse accusation.') + '</p>' +
      '<button type="button" class="btn primary" data-act="new">Affaire suivante</button></div>';
  }

  function renderSheet() {
    var root = $('sheet-root'), p = state.picker;
    if (state.accuse && state.puz) {
      var P0 = state.puz, ab = '';
      for (var q0 = 0; q0 < P0.S; q0++) {
        var out = state.accused.indexOf(q0) >= 0;
        ab += '<button type="button" class="acc-btn s' + q0 + (out ? ' out' : '') + '" data-act="accpick" data-s="' + q0 + '"' + (out ? ' disabled' : '') + '>' +
          pola(q0, '<small>' + (out ? 'innocent' : SUSPECTS[q0].role) + '</small>') + '</button>';
      }
      root.innerHTML = '<div class="scrim" data-act="close"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-label="Désigner le coupable">' +
        '<div class="sheet-hd"><b class="acc-t">J’accuse…</b></div>' +
        '<p class="trail">Qui est le meurtrier ? Une mauvaise réponse est comptée comme une erreur.</p>' +
        '<div class="acc-grid" style="--n:' + (P0.S <= 4 ? P0.S : 3) + '">' + ab + '</div>' +
        '<div class="sheet-ft"><button type="button" class="btn sm" data-act="close">Annuler</button></div></div>';
      var f0 = root.querySelector('.acc-btn:not(:disabled)'); if (f0) f0.focus();
      return;
    }
    if (!p) { root.innerHTML = ''; return; }
    var P = state.puz, T = P.T, s = p.s, t = p.t, cur = g(s, t);
    var prev = t > 0 ? g(s, t - 1) : -1, next = t < T - 1 ? g(s, t + 1) : -1;
    var trail = [];
    if (t > 0) trail.push(tl(t - 1) + ' ' + (prev >= 0 ? ROOMS[prev].name : '?'));
    trail.push('<b>' + tl(t) + ' ?</b>');
    if (t < T - 1) trail.push(tl(t + 1) + ' ' + (next >= 0 ? ROOMS[next].name : '?'));
    var btns = ROOMS.map(function (room, r) {
      var far = (prev >= 0 && !((STEP[prev] >> r) & 1)) || (next >= 0 && !((STEP[r] >> next) & 1));
      return '<button type="button" class="room-btn' + (r === cur ? ' cur' : '') + (far ? ' far' : '') + '" data-act="pick" data-r="' + r + '">' +
        room.name + (far ? '<small>trop loin</small>' : '') + '</button>';
    }).join('');
    root.innerHTML = '<div class="scrim" data-act="close"></div>' +
      '<div class="sheet s' + s + '" role="dialog" aria-modal="true" aria-label="Choisir une ' + E.SCENE.unit + '">' +
      '<div class="sheet-hd">' + mini(s) + '<b>' + SUSPECTS[s].name + '</b></div>' +
      '<p class="trail">' + trail.join(' → ') + '</p>' +
      '<div class="room-grid">' + btns + '</div>' +
      '<div class="sheet-ft"><button type="button" class="btn sm" data-act="clear">Effacer la case</button><button type="button" class="btn sm" data-act="close">Fermer</button></div></div>';
    var first = root.querySelector('.room-btn.cur') || root.querySelector('.room-btn');
    if (first) first.focus();
  }

  function renderAll() {
    renderScenes(); renderModes(); renderLevels(); renderRules(); renderCase(); renderSuspects(); renderMap(); renderBoard(); renderVerdict(); renderClues(); renderSheet();
  }

  /* ---------- Actions ---------- */
  function newCase(level, seed, mode, scene) {
    state.scene = scene || state.scene;
    state.level = level || state.level;
    state.mode = mode || state.mode;
    lsSet('alibis.level', state.level);
    lsSet('alibis.mode', state.mode);
    lsSet('alibis.scene', state.scene);
    renderScenes(); renderModes(); renderLevels();
    $('board-panel').innerHTML = '<p class="loading">Instruction du dossier…</p>';
    $('case').innerHTML = ''; $('suspects').innerHTML = ''; $('map-panel').innerHTML = ''; $('clues-panel').innerHTML = ''; $('verdict').innerHTML = '';
    state.picker = null; renderSheet();
    setTimeout(function () {
      var sd = seed || (Math.floor(Math.random() * 9000) + 1000);
      bindScene();
      var P = E.generate(sd, state.level, state.mode);
      state.puz = P;
      state.grid = []; state.given = [];
      for (var i = 0; i < P.S * P.T; i++) { state.grid.push(-1); state.given.push(false); }
      P.clues.forEach(function (c) { if (c.type === 'at' && c.by === undefined) { state.grid[c.s * P.T + c.t] = c.r; state.given[c.s * P.T + c.t] = true; } });
      state.selT = 0; state.checked = false; state.hints = 0; state.solved = false; state.liarGuess = -1; state.accuse = false; state.accused = []; state.wrong = 0; state.early = 0;
      renderAll();
    }, 30);
  }

  function afterChange() {
    state.checked = false;
    var P = state.puz;
    if (!state.solved && gridCorrect() && (!isLiar(P) || state.liarGuess === P.liar)) {
      state.solved = true;
      state.selT = P.crime.t;
    }
    renderMap(); renderBoard(); renderVerdict(); renderClues();
  }

  function setCell(s, t, v) {
    var idx = s * state.puz.T + t;
    if (state.given[idx] || state.solved) return;
    state.grid[idx] = v;
    afterChange();
  }

  function closeSheet() {
    var p = state.picker;
    state.picker = null; state.accuse = false; renderSheet();
    if (p) {
      var el = document.querySelector('.cell[data-s="' + p.s + '"][data-t="' + p.t + '"]');
      if (el && !el.disabled) el.focus();
    }
  }

  function hint() {
    var P = state.puz, wrong = [];
    state.grid.forEach(function (v, i) { if (v !== P.solution[i]) wrong.push(i); });
    if (!wrong.length) return;
    var i = wrong[Math.floor(Math.random() * wrong.length)];
    state.grid[i] = P.solution[i]; state.given[i] = true; state.hints++;
    state.selT = i % P.T;
    afterChange();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !state.puz && el.getAttribute('data-act') !== 'new' && el.getAttribute('data-act') !== 'level') return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'new': newCase(state.level); break;
      case 'mode': if (el.getAttribute('data-mode') !== state.mode) newCase(state.level, null, el.getAttribute('data-mode')); break;
      case 'liar':
        var ls = +el.getAttribute('data-s');
        state.liarGuess = state.liarGuess === ls ? -1 : ls;
        afterChange();
        break;
      case 'scene': if (el.getAttribute('data-scene') !== state.scene) newCase(state.level, null, null, el.getAttribute('data-scene')); break;
      case 'level': newCase(el.getAttribute('data-level')); break;
      case 'time': state.selT = +el.getAttribute('data-t'); renderMap(); renderBoard(); break;
      case 'cell':
        if (el.disabled) break;
        state.picker = { s: +el.getAttribute('data-s'), t: +el.getAttribute('data-t') };
        state.selT = state.picker.t;
        renderMap(); renderBoard(); renderSheet();
        break;
      case 'pick':
        if (state.picker) { var p = state.picker; setCell(p.s, p.t, +el.getAttribute('data-r')); closeSheet(); }
        break;
      case 'clear':
        if (state.picker) { var q = state.picker; setCell(q.s, q.t, -1); closeSheet(); }
        break;
      case 'close': closeSheet(); break;
      case 'check': state.checked = true; renderBoard(); renderClues(); break;
      case 'hint': hint(); break;
      case 'accuse': if (!state.solved) { state.accuse = true; renderSheet(); } break;
      case 'accpick':
        var as = +el.getAttribute('data-s'), P2 = state.puz;
        state.accuse = false;
        if (as === P2.culprit) {
          var emp = 0;
          state.grid.forEach(function (v, i) { if (v !== P2.solution[i]) emp++; });
          state.early = emp; state.grid = P2.solution.slice(); state.solved = true; state.selT = P2.crime.t;
          if (isLiar(P2)) state.liarGuess = P2.culprit;
        } else { state.wrong++; state.accused.push(as); }
        renderSheet(); renderMap(); renderBoard(); renderVerdict(); renderClues();
        break;
      case 'reset':
        state.grid = state.grid.map(function (v, i) { return state.given[i] ? v : -1; });
        state.liarGuess = -1;
        afterChange();
        break;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'live') { state.live = e.target.checked; state.checked = false; renderBoard(); renderClues(); }
    if (e.target.id === 'hideok') { state.hideOk = e.target.checked; renderClues(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (state.picker || state.accuse)) closeSheet();
  });

  /* ---------- Démarrage ---------- */
  var saved = lsGet('alibis.level');
  if (saved && LEVELS[saved]) state.level = saved;
  var savedMode = lsGet('alibis.mode');
  if (savedMode === 'liar' || savedMode === 'half' || savedMode === 'classic') state.mode = savedMode;
  var savedScene = lsGet('alibis.scene');
  if (SCENE_UI[savedScene]) state.scene = savedScene;
  var rules = $('rules');
  if (!lsGet('alibis.seen')) { rules.open = true; lsSet('alibis.seen', '1'); }
  window.Alibis = { state: state, newCase: newCase };
  newCase(state.level);
})();

</script>

</body>
</html>
