<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kioukan · Partie rapide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap">
<style>
/* Concept : épisode de webtoon. On lit l'histoire en faisant défiler de grandes cases pleine largeur
   séparées par du blanc, avec une lumière de cinéma et des bulles ovales. L'enquête suit, sur des
   cartes claires et douces, comme une application de lecture. */
:root {
  --bg: #f6f3ef;
  --gutter: #ffffff;
  --paper: #ffffff;
  --panel-2: #f1ece6;
  --cell: #fbf9f6;
  --ink: #26201f;
  --ink-2: #77706b;
  --line: #e7e0d8;
  --line-2: #d6cdc3;
  --accent: #c2414f;
  --accent-ink: #ffffff;
  --accent-2: #3d5a96;
  --red: #d23c4c;
  --red-bg: #fde4e6;
  --given: #f7e7cf;
  --ok: #2f9a6a;
  --shadow: 0 6px 22px rgba(60, 40, 30, 0.10);
  --s0: #4f7fc4;
  --s1: #2f9a6a;
  --s2: #c9824a;
  --s3: #8a5bb3;
  --s4: #c2414f;
  --wall: #3a2a28; --door: #fff3cf;
  --wood-a: #f7dbe2; --wood-b: #ebbccb; --check-a: #fde9ef; --check-c: #f6c7d6; --tile-a: #e3e7fb; --tile-b: #cdd4f3;
  --diamond-a: #ece3f8; --diamond-c: #d6c8f0; --grass-a: #cdeac3; --grass-c: #a9d89d; --steel-a: #dde3f2; --steel-b: #bcc6e0;
  --fu: #f0a3b9; --fu2: #c9bdf0; --fw: #ffffff; --fpot: #b5806a; --fg: #6dbb84; --fg2: #4f9f6c; --ftv: #3a3f6b; --win: #bfe2f7;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
    --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
    --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
    --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
    --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
  --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
  --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
  --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
  --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 16px; }
h1 { margin: 0; font: 900 clamp(40px, 12vw, 60px)/0.95 var(--serif); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.mode-tag { margin: 0; font: 600 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }

/* Épisode : couverture puis bande verticale */
#intro { max-width: 640px; margin: 0 auto; }
/* sur grand écran, une case de BD tient dans la hauteur de l'écran */
@media (min-width: 700px) { #intro { max-width: max(360px, min(640px, 82vh)); } }
.cover { text-align: center; padding: 6px 0 18px; }
.kicker { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.lvl-title { margin: 0; font: italic 700 30px/1.15 var(--serif); text-wrap: balance; }
.lvl-title span { display: block; margin-bottom: 4px; font: 600 12px var(--sans); font-style: normal; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.strip { background: var(--gutter); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 28px 0 40px; display: flex; flex-direction: column; gap: 46px; }
@media (min-width: 672px) { .strip { margin-inline: 0; border-radius: 6px; } }
.beat { position: relative; }
.says { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 6px; padding: 0 14px; margin-bottom: -26px; }
.wbubble {
  position: relative; margin: 0; max-width: 80%; padding: 20px 28px; background: #fff; color: #231b1b;
  border: 1.6px solid #2a201f; border-radius: 50%; text-align: center;
  font: 600 13.5px/1.35 var(--sans); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance;
}
.wbubble.l { align-self: flex-start; }
.wbubble.r { align-self: flex-end; }
.wbubble::after {
  content: ""; position: absolute; top: calc(100% - 4px); width: 18px; height: 22px; background: #fff;
  border-right: 1.6px solid #2a201f; clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.wbubble.l::after { left: 30%; transform: skewX(14deg); }
.wbubble.r::after { right: 30%; transform: scaleX(-1) skewX(14deg); }
.wpanel { position: relative; margin: 0; overflow: hidden; background: #222; }
.wbg, .wbg svg, .wbg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.wchar { position: absolute; bottom: 0; transform: translateX(-50%); }
.wchar .wport { display: block; width: 100%; height: auto; }
.wcap {
  position: absolute; z-index: 2; margin: 0; max-width: 74%; padding: 8px 12px; background: rgba(255, 252, 247, 0.92); color: #231b1b;
  border: 1px solid rgba(40, 30, 30, 0.6); font: 400 13.5px/1.4 var(--sans);
}
.wcap.tl { top: 12px; left: 12px; } .wcap.br { bottom: 12px; right: 12px; } .wcap.bl { bottom: 12px; left: 12px; }
.sfx {
  position: absolute; z-index: 2; white-space: nowrap; font: italic 900 42px/1 var(--serif); color: #fff; transform: rotate(var(--r));
  -webkit-text-stroke: 1.6px #2a201f; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.sfx.center { transform: translate(-50%, -50%) rotate(var(--r)); font-size: 54px; color: #ffe0d6; }
.go { text-align: center; margin: 22px 0 0; }

/* Boutons */
.btn {
  display: inline-block; text-decoration: none; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink);
  padding: 9px 16px; min-height: 42px; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 22px; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn.accuse { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* Jeu */
.layout { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; } #verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
@media (min-width: 700px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
@media (min-width: 700px) and (min-height: 520px) {
  /* indices et plan restent à l'écran pendant qu'on remplit la grille */
  .layout > .col:last-child { position: sticky; top: 10px; max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 4px 6px 10px; margin: -4px -6px 0; }
}
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; scroll-margin-top: 12px; }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 700 19px/1.15 var(--serif); }
.sub { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

.eyebrow { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.case h2 { margin: 0 0 6px; font: 700 21px/1.3 var(--serif); text-wrap: balance; }
.case h2 em { font-style: italic; color: var(--accent); }
.case p { margin: 0; color: var(--ink-2); }
.case p b { color: var(--ink); }

.fiches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fiche { margin: 0; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--cell); border: 1px solid var(--line); }
.fiche-img { aspect-ratio: 5 / 6; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #fff8f2), color-mix(in srgb, var(--c) 45%, #f6efe8)); overflow: hidden; }
.fiche-img svg, .fiche-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fiche figcaption { text-align: center; padding: 6px 4px 8px; line-height: 1.15; }
.fiche .fn { display: block; font: 700 16px var(--serif); }
.fiche small { display: block; font: 600 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.fiche .guilty { color: var(--red); }
.mini { display: inline-block; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c, #c9a48a) 30%, #fff8f2); border: 2px solid var(--c, var(--line-2)); vertical-align: middle; }
.mini svg, .mini img { display: block; width: 100%; height: 100%; transform: scale(1.5) translateY(14%); object-fit: cover; }

.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 3px 0; min-height: 36px; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.crime::after { content: ""; position: absolute; top: -3px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--paper); }
.train-frame { border-radius: 12px; overflow: hidden; }
.lc-train { display: block; width: 100%; height: auto; }
.lc-train [stroke="#1c1b22"] { stroke: #3a2a28; stroke-width: 0.8; }
.lc-plate { font: 700 5.6px var(--sans); letter-spacing: 0.1em; text-anchor: middle; dominant-baseline: central; fill: #2a2020; }
.lc-plate.crime { fill: #fff; }
.lc-roof-t { font: 700 6.5px var(--sans); letter-spacing: 0.3em; text-anchor: middle; fill: rgba(255, 240, 220, 0.6); }
.lc-tok.culprit { filter: drop-shadow(0 0 2px #ff5a5a) drop-shadow(0 0 3px #ff5a5a); }
.legend { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; margin-right: 6px; vertical-align: middle; }
.lg-door { width: 8px; height: 14px; background: #2a2a30; border-radius: 2px; }
.lg-ladder { width: 12px; height: 5px; background: #e3b23c; border-radius: 2px; }
.lg-crime { width: 16px; height: 12px; border: 2px dashed #e2483d; border-radius: 2px; }

.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding-bottom: 4px; min-width: 0; text-align: center; }
.who .mini { width: 40px; height: 40px; }
.who b { font: 700 14px/1.1 var(--serif); overflow-wrap: anywhere; }
.who small { font: 600 10.5px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.time { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; min-height: 48px; padding: 0 6px; border: 0; border-radius: 10px; background: transparent; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.time.sel { background: var(--panel-2); color: var(--ink); }
.time small { font: 700 9.5px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px; border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: inset 0 -3px 0 var(--c); background: var(--cell); color: var(--ink); font: 600 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); cursor: default; }
.cell.given svg { position: absolute; top: 4px; right: 5px; opacity: 0.6; }
.cell.bad { background: var(--red-bg); border-color: var(--red); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.status .err { color: var(--red); font-weight: 600; }
.reply { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.reply.r { justify-content: flex-end; }
.reply .bubble.small { margin: 0; padding: 10px 16px; background: #fff; color: #231b1b; border: 1.4px solid #2a201f; border-radius: 22px; font: 600 12.5px/1.35 var(--sans); text-transform: uppercase; }
.reply .mini { width: 42px; height: 42px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-height: 36px; }
.switch { min-height: 44px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.hintline { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }

.opts { margin: -2px 0 6px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 14.5px; }
.clue:first-child { border-top: 0; }
.clue .ico { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: #fff; }
.clue.ok .ico { background: var(--ok); border-color: var(--ok); }
.clue.bad .ico { background: var(--red); border-color: var(--red); }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--red); font-weight: 600; }
.clue.rule .txt { font-weight: 600; }
.empty-note { margin: 0; color: var(--ink-2); }

.verdict { display: flex; flex-direction: column; gap: 12px; border-color: var(--red); }
.v-top { display: flex; align-items: center; gap: 16px; }
.v-top .fiche { width: 108px; flex: none; }
.stamp { font: italic 900 28px/1.05 var(--serif); color: var(--red); }
.verdict p { margin: 0; }
.verdict .sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13.5px; }
.strip.epi { margin-inline: -16px; border-radius: 0; padding-top: 34px; }
.next { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.soon { font-size: 13px; color: var(--ink-2); }

.rules summary { cursor: pointer; font: 700 18px var(--serif); padding: 10px 0; min-height: 44px; }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 7px; color: var(--ink-2); font-size: 14.5px; }
.rules ol b { color: var(--ink); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 10, 12, 0.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; background: var(--paper);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.16s ease-out; } @keyframes rise { from { transform: translateY(20px); } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 700 17px var(--serif); }
.trail { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { min-height: 52px; padding: 6px 4px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--cell); font: 600 13.5px/1.15 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow-wrap: anywhere; }
.room-btn small { font-size: 11px; color: var(--ink-2); font-weight: 400; }
.room-btn.far { border-style: dashed; color: var(--ink-2); }
.room-btn.cur { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.room-btn.cur small { color: var(--paper); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.acc-t { font: italic 900 26px var(--serif); color: var(--red); }
.acc-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.acc-btn { border: 0; background: transparent; padding: 0; cursor: pointer; min-width: 0; text-align: inherit; }
.acc-btn:active .fiche { transform: scale(0.97); }
.acc-btn.out { opacity: 0.45; cursor: default; }
.acc-btn.out .fiche-img { filter: grayscale(1); }

/* Plans vus de dessus */
.plan { display: block; width: 100%; height: auto; background: var(--panel-2); }
.pt-wood .pa-a { fill: var(--wood-a); } .pt-wood .pa-b { stroke: var(--wood-b); fill: none; stroke-width: 0.9; }
.pt-check .pa-a { fill: var(--check-a); } .pt-check .pa-c { fill: var(--check-c); }
.pt-tile .pa-a { fill: var(--tile-a); } .pt-tile .pa-b { stroke: var(--tile-b); fill: none; stroke-width: 1; }
.pt-diamond .pa-a { fill: var(--diamond-a); } .pt-diamond .pa-c { fill: var(--diamond-c); }
.pt-grass .pa-a { fill: var(--grass-a); } .pt-grass .pa-c { fill: var(--grass-c); }
.pt-steel .pa-a { fill: var(--steel-a); } .pt-steel .pa-b { stroke: var(--steel-b); fill: none; stroke-width: 0.9; }
.furn .fu { fill: var(--fu); } .furn .fu2 { fill: var(--fu2); } .furn .fw { fill: var(--fw); } .furn .fpot { fill: var(--fpot); }
.furn .fg { fill: var(--fg); } .furn .fg2 { fill: var(--fg2); } .furn .ftv { fill: var(--ftv); } .furn .win { fill: var(--win); }
.furn .fl { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.9; fill: none; }
.furn rect, .furn ellipse, .furn circle { stroke: var(--wall); stroke-opacity: 0.3; stroke-width: 0.8; }
.wall { fill: none; stroke: var(--wall); stroke-width: 3; stroke-linejoin: round; }
.crimeroom { fill: none; stroke: #e2483d; stroke-width: 2.2; stroke-dasharray: 6 4; }
.door { fill: var(--door); stroke: var(--wall); stroke-width: 1.2; }
.pill rect { fill: #fff; stroke: #3a2a28; stroke-width: 1; }

/* Liste des épisodes */
#episodes { max-width: 640px; margin: 0 auto 14px; }
.ep-toggle { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; text-align: left; padding: 10px 16px; min-height: 48px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--paper); cursor: pointer; box-shadow: var(--shadow); }

.ep-ch h3 small { margin-left: auto; font: 600 12px var(--sans); font-style: normal; color: var(--ink-2); }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ep-btn { display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; gap: 0 8px; align-items: center; text-align: left; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--cell); cursor: pointer; min-height: 48px; }
.ep-btn b { grid-row: 1 / 3; font: 700 15px var(--serif); color: var(--accent); text-align: center; }
.ep-btn span { font: 600 12.5px/1.2 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-btn small { font-size: 10.5px; color: var(--ink-2); }
.ep-btn.done { background: color-mix(in srgb, var(--ok) 12%, var(--cell)); }
.ep-btn.done small { color: var(--ok); }
.ep-btn.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ep-btn:disabled { opacity: 0.45; cursor: default; }
.blurb { margin: 6px auto 12px; max-width: 34ch; font: italic 400 15px/1.4 var(--serif); color: var(--ink-2); }

.liar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.liar-q { font: italic 900 20px var(--serif); color: var(--red); }

.speaker b { font: 700 15px var(--serif); }
.tag { display: inline-block; font: 600 10.5px var(--sans); letter-spacing: 0.04em; color: var(--ink-2); background: var(--panel-2); border-radius: 999px; padding: 2px 8px; white-space: nowrap; vertical-align: middle; }
.tag.liar-tag { color: #fff; background: var(--red); }

.sp .mini { width: 42px; height: 42px; }
.sp-name { margin: 2px 0 6px; }

.clue.proof .txt { color: var(--ink); }
.board.dense .cell { font-size: 11.5px; }
.skip { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.who small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; }
.board.dense .who b, .board[style*="--cols:4"] .who b { font-size: 13px; }
.fiche figcaption .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Portraits « carte » : image sur fond papier, sans détourage */
.wchar .pcard { border-radius: 10px 10px 0 0; border: 3px solid #fffaf0; border-bottom: 0; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(60, 40, 30, 0.35); background: #f5e9d2; }
.fiche-img img.pcard { object-position: 50% 18%; }
.mini img.pcard { transform: scale(1.35) translateY(4%); object-position: 50% 30%; }

/* Introduction en texte */
.story-text { margin: 4px 0 8px; display: grid; gap: 10px; }
.snar { margin: 0; font: 400 16px/1.55 var(--sans); color: var(--ink); }
.sline { margin: 0; display: flex; gap: 10px; align-items: flex-start; }
.sline .mini { width: 44px; height: 44px; margin-top: 2px; }
.sline .sq { font: italic 400 16px/1.5 var(--serif); }
.sline .sq b { font: 700 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; font-style: normal; color: var(--ink-2); margin-right: 4px; }
/* Portraits noir et blanc : le blanc prend la couleur du suspect */
.pbw { mix-blend-mode: multiply; }
.fiche-img img.pbw { object-position: 50% 12%; }
.mini img.pbw { transform: scale(1.25) translateY(2%); object-position: 50% 20%; }
.wchar .pbw { mix-blend-mode: normal; background: #fffdf8; }

/* Partie rapide : complément au style du mode histoire (style-wt.css). */
.top { align-items: flex-end; margin-bottom: 18px; }
.brand { min-width: 0; }
.dossier { margin: 6px 0 0; font: 600 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; width: 100%; }
.controls .seg { flex: 1 1 auto; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 7px 14px; min-height: 40px; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (min-width: 700px) { .controls { width: auto; } }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.case .eyebrow { display: block; }
.case h2 em { font-style: italic; color: var(--accent); white-space: nowrap; }

/* Fiches des suspects (anciennement polaroïds) */
.pola { margin: 0; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--cell); border: 1px solid var(--line); color: var(--ink); }
.pola-img { aspect-ratio: 5 / 6; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #fff8f2), color-mix(in srgb, var(--c) 45%, #f6efe8)); }
.pola-img svg, .pola-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pola figcaption { text-align: center; padding: 6px 4px 8px; line-height: 1.15; }
.pola .pn { display: block; font: 700 15px var(--serif); overflow-wrap: anywhere; }
.pola small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 10.5px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.pola .guilty { color: var(--red); }
.sp .pola { width: 64px; }

/* Plan */
.deco .rail { stroke: var(--wall); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.deco .wheel { fill: var(--panel-2); stroke: var(--wall); stroke-width: 2.4; }
.crimemark polygon { fill: var(--red); stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
.crimemark path { stroke: #fff; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.tok .halo { fill: #fff; opacity: 0.92; }
.tok .face { fill: color-mix(in srgb, var(--c) 30%, #fff8f2); }
.tok .ring { fill: none; stroke: var(--c); stroke-width: 2.2; }
.tok.culprit .ring { stroke: var(--red); stroke-width: 3.4; }
.loading { padding: 28px 0; text-align: center; font: 600 14px var(--sans); color: var(--ink-2); }

uit suivante, un cri d’horreur retentit à bord. Celui du professeur Tumulus…": "The next night, a scream of horror rings out on board. Professor Barrow’s…", "AAAAH !": "AAAAH!", "Le papyrus à la soupe": "The Papyrus in the Soup", "Le papyrus du professeur a fini dans la soupe.": "The professor’s papyrus ended up in the soup.", "La soupière a été renversée à {h}, {lieu}, par la seule personne présente. Qui a noyé Ramsès Deux-Fois ?": "The soup tureen was knocked over at {h}, {lieu}, by the only person there. Who drowned Ramses the Second Helping?", "le coupable": "the culprit", "méfait": "mischief", "Mon papyrus de Ramsès Deux-Fois ! Trempé dans la soupe à l’oignon ! Trois mille ans d’histoire, et ça sent la ciboulette !": "My papyrus of Ramses the Second Helping! Soaked in onion soup! Three thousand years of history, and it smells of chives!", "La soupière a été renversée à {h}, {lieu}. Une seule personne s’y trouvait.": "The tureen was knocked over at {h}, {lieu}. Only one person was there.", "Ce soir, le professeur Tumulus n’a pas quitté la voiture-bar. Restent trois suspects.": "Tonight, Professor Barrow never left the bar car. That leaves three suspects.", "Je voulais seulement le faire sécher… sur la soupière. Elle était chaude, c’était pratique !": "I only wanted to dry it… on the tureen. It was hot, it was handy!", "Un papyrus n’est pas une serviette, Ernest. Même en wagon-restaurant.": "A papyrus is not a napkin, Ernest. Even in a dining car.", "Troisième nuit. Le contrôleur cherche désespérément quelque chose…": "Third night. The inspector is desperately looking for something…", "La poinçonneuse": "The Ticket Punch", "La poinçonneuse du contrôleur a disparu.": "The inspector’s ticket punch has disappeared.", "Elle a été dérobée à {h}, {lieu}. Jean Bilet était au fourgon, il est hors de cause. Lequel des trois autres passagers ?": "It was stolen at {h}, {lieu}. Jack Punch was in the luggage van, so he is in the clear. Which of the other three passengers did it?", "Ma poinçonneuse ! Sans elle, je ne peux plus poinçonner ! Un contrôleur qui ne poinçonne pas, c’est un passager !": "My ticket punch! Without it, I can’t punch! An inspector who doesn’t punch is just a passenger!", "On l’a prise {lieu}, à {h}. Le voleur y était seul.": "It was taken {lieu}, at {h}. The thief was alone there.", "Cette fois, la nuit sera plus longue : six créneaux à reconstituer.": "This time the night will be longer: six time slots to reconstruct.", "Je voulais faire des confettis pour ma première à l’Opéra. Les confettis poinçonnés, c’est très chic.": "I wanted to make confetti for my opening night at the Opera. Punched confetti is very chic.", "Chic, peut-être. Légal, certainement pas.": "Chic, perhaps. Legal, certainly not.", "Quatrième nuit. C’est Bijou, le caniche, qui disparaît.": "Fourth night. This time it’s Jewel the poodle who vanishes.", "OUAF !": "WOOF!", "Un caniche sans billet": "A Poodle Without a Ticket", "Bijou le caniche a été enlevé.": "Jewel the poodle has been kidnapped.", "Le chien a été emmené à {h}, {lieu}, par une personne seule avec lui. Retrouve-la.": "The dog was taken at {h}, {lieu}, by someone alone with it. Find them.", "enlèvement": "kidnapping", "Bijou ! Mon Bijou ! Quelqu’un a enlevé mon caniche !": "Jewel! My Jewel! Someone has kidnapped my poodle!", "On l’a entendu gémir {lieu} à {h}. Son ravisseur était seul avec lui.": "Whimpering was heard {lieu} at {h}. The kidnapper was alone with the dog.", "Le professeur Tumulus dormait sous ses papyrus et le neveu ronflait. Restent trois suspects.": "Professor Barrow was asleep under his papyri and the nephew was snoring. That leaves three suspects.", "Le règlement est clair : pas de billet, pas de voyage. Même pour un caniche.": "The rules are clear: no ticket, no travel. Even for a poodle.", "Le caniche voyage avec sa maîtresse, monsieur Bilet. Il a même un collier, lui.": "The poodle travels with its mistress, Mr Punch. It even has a collar, which is more than I can say for you.", "Cinquième nuit. La diva Aria Vibrato ne peut plus chanter une note…": "Fifth night. The diva Aria Vibrato can’t sing a single note…", "Fausse note": "A Sour Note", "Les pastilles de la diva ont été piégées.": "The diva’s throat lozenges have been tampered with.", "Quelqu’un a glissé des bonbons au piment dans la boîte d’Aria Vibrato à {h}, {lieu}. Lequel des quatre ?": "Someone slipped chilli sweets into Aria Vibrato’s tin at {h}, {lieu}. Which of the four?", "Mes pastilles pour la voix ! Remplacées par des bonbons au piment ! Ma voix… elle est partie en fumée !": "My voice lozenges! Swapped for chilli sweets! My voice… it went up in smoke!", "Quatre suspects, cette fois. L’échange a eu lieu {lieu}, à {h}.": "Four suspects this time. The swap took place {lieu}, at {h}.", "La comtesse, elle, ne quittait pas Bijou d’une semelle.": "The countess, meanwhile, never let Jewel out of her sight.", "Elle faisait ses vocalises toute la nuit ! Même mes momies ne pouvaient plus dormir.": "She did her vocal warm-ups all night long! Even my mummies couldn’t sleep.", "Il existe des bouchons d’oreilles, professeur. Ils sont moins épicés.": "Earplugs exist, Professor. They are less spicy.", "Sixième nuit. Le train freine brutalement en pleine campagne.": "Sixth night. The train brakes sharply in the middle of the countryside.", "SKRIIII !": "SKREEEE!", "Signal d’alarme": "Pull the Cord", "Le signal d’alarme a été tiré.": "The emergency cord has been pulled.", "Le train s’est arrêté net à {h}. La poignée se trouve {lieu}, et le coupable y était seul. Qui a fait ça ?": "The train stopped dead at {h}. The handle is {lieu}, and the culprit was alone there. Who did this?", "alarme": "alarm", "Quelqu’un a tiré le signal d’alarme ! Une heure de retard ! Vous savez combien de billets je vais devoir re-poinçonner ?": "Someone pulled the emergency cord! An hour late! Do you know how many tickets I’ll have to re-punch?", "La poignée a été tirée {lieu}, à {h}. Le coupable était seul.": "The handle was pulled {lieu}, at {h}. The culprit was alone.", "Je pensais que c’était la poignée des toilettes ! Et puis… je voulais descendre à Monaco. Le casino, vous comprenez.": "I thought it was the toilet chain! And then… I wanted to get off at Monaco. The casino, you understand.", "Rémi, encore vous. Je commence à connaître votre chronologie par cœur.": "Remy, you again. I’m starting to know your timeline by heart.", "Au matin du septième jour, la comtesse ouvre son écrin. Le collier est là… mais il est faux.": "On the morning of the seventh day, the countess opens her jewel case. The necklace is there… but it’s fake.", "La plume du Hibou": "The Owl’s Feather", "Le vrai collier a été remplacé par une copie.": "The real necklace has been replaced by a copy.", "Une plume de hibou a été trouvée dans l’écrin. L’échange a eu lieu à {h}, {lieu}. Qui travaille pour le Hibou ?": "An owl feather was found in the case. The swap took place at {h}, {lieu}. Who works for the Owl?", "échange": "swap", "C’est du verre ! On a échangé mes Larmes de Lune contre une vulgaire copie ! Et il y a… une plume !": "It’s glass! My Moon Tears have been swapped for a cheap copy! And there’s… a feather!", "Une plume de hibou. La signature d’un cambrioleur célèbre. L’échange a eu lieu {lieu}, à {h}.": "An owl feather. The signature of a famous burglar. The swap took place {lieu}, at {h}.", "Dernier mystère avant Nice. Rémi, puni, n’a pas quitté sa tante de la nuit : il est hors de cause.": "Last mystery before Nice. Remy, grounded, never left his aunt all night: he is in the clear.", "Un monsieur masqué m’a donné un très gros pourboire pour échanger deux colliers. Je croyais que c’était un jeu de société !": "A masked gentleman gave me a very generous tip to swap two necklaces. I thought it was a parlour game!", "Le Hibou. Il a déjà filé avec le vrai collier. Mais un hibou, ça finit toujours par rentrer au nid.": "The Owl. He has already made off with the real necklace. But an owl always comes back to its nest.", "Fin du chapitre 1. Direction Nice, et le Grand Hôtel des Mouettes.": "End of chapter 1. Next stop: Nice, and the Grand Hôtel des Mouettes.", "À 22 h, Rémi a emprunté dix francs à Ernest « jusqu’à demain ». À 23 h, Ernest le cherchait pour récupérer son argent : ils n’étaient pas dans la même voiture.": "At 10 pm, Remy borrowed ten francs from Ernest \"until tomorrow\". At 11 pm, Ernest was looking for him to get his money back: they were not in the same car.", "De 21 h à 21 h 30, Aria a fait ses vocalises sans bouger d’un pouce : une diva ne se déplace pas pendant ses gammes.": "From 9 pm to 9:30 pm, Aria did her vocal exercises without moving an inch: a diva does not move during her scales.", "Ernest a changé trois fois de voiture dans la soirée, plateau à la main : une fois entre 21 h et 21 h 30, une autre entre 22 h et 22 h 30.": "Ernest changed cars three times during the evening, tray in hand: once between 9 pm and 9:30 pm, and once between 10 pm and 10:30 pm.", "Rémi est passé par le fourgon à un moment de la soirée. Pour y cacher ses créanciers, paraît-il.": "Remy passed through the luggage van at some point in the evening. To hide from his creditors, apparently.", "Au cours de la soirée, Aria est passée au wagon-restaurant réclamer du miel pour sa gorge. Ernest y est passé lui aussi, à un moment ou à un autre.": "During the evening, Aria passed through the dining car to ask for honey for her throat. Ernest passed through too, at one time or another.", "Le contrôleur a vérifié le billet d’Aria quand la pendule a sonné dix coups… puis encore à 23 h, « par précaution ». Les deux fois, ils étaient dans la même voiture.": "The inspector checked Aria’s ticket when the clock struck ten… then again at 11 pm, \"just in case\". Both times, they were in the same car.", "À 21 h comme à 22 h, Ernest astiquait l’argenterie, seul dans sa voiture.": "At 9 pm and at 10 pm, Ernest was polishing the silverware, alone in his car.", "Jean Bilet a changé de voiture quatre fois dans la soirée. Un contrôleur ne tient pas en place.": "Jack Punch changed cars four times during the evening. An inspector can’t sit still.", "Ernest a changé trois fois de voiture, mais de 22 h 30 à 23 h, il n’a pas quitté la sienne : il recollait une soupière.": "Ernest changed cars three times, but from 10:30 pm to 11 pm he stayed put: he was gluing a soup tureen back together.", "À 21 h 30, Aria n’était plus dans la voiture où elle se trouvait à 21 h : elle fuyait un courant d’air.": "At 9:30 pm, Aria was no longer in the car she had been in at 9 pm: she was fleeing a draught.", "Dans la soirée, Aria est passée par le salon-fumoir (en toussant ostensiblement) et Ernest par la voiture-bar.": "During the evening, Aria passed through the smoking lounge (coughing ostentatiously) and Ernest through the bar car.", "À 21 h 30, le professeur Tumulus expliquait à Aria comment on momifie un chat. Elle faisait semblant d’écouter, juste à côté de lui.": "At 9:30 pm, Professor Barrow was explaining to Aria how to mummify a cat. She pretended to listen, right next to him.", "Rémi a suivi Aria comme son ombre à 22 h et à 22 h 30, pour lui emprunter de quoi jouer. Entre ces deux heures, elle a changé de voiture pour le semer… en vain.": "Remy followed Aria like a shadow at 10 pm and 10:30 pm, to borrow gambling money. Between those two times she changed cars to shake him off… in vain.", "Quand la pendule a sonné onze coups, le professeur faisait la sieste, seul dans sa voiture. Et le wagon-lit A était désert.": "When the clock struck eleven, the professor was napping, alone in his car. And sleeper A was deserted.", "Aria a changé trois fois de voiture dans la soirée, mais elle n’a pas bougé de 22 h 30 à 23 h : elle se remaquillait.": "Aria changed cars three times during the evening, but she didn’t move from 10:30 pm to 11 pm: she was touching up her make-up.", "Rémi a changé trois fois de voiture, mais de 21 h à 21 h 30 il est resté au même endroit, à recompter ses dettes.": "Remy changed cars three times, but from 9 pm to 9:30 pm he stayed put, recounting his debts.", "Le professeur a changé trois fois de voiture. Il n’a pas bougé de 21 h 30 à 22 h, ni de 22 h 30 à 23 h : il dort beaucoup.": "The professor changed cars three times. He didn’t move from 9:30 pm to 10 pm, nor from 10:30 pm to 11 pm: he sleeps a lot.", "Ni Rémi ni le professeur n’ont mis les pieds dans la voiture-bar de la soirée : l’un n’a plus un sou, l’autre ne boit que de la tisane.": "Neither Remy nor the professor set foot in the bar car all evening: one is out of money, the other only drinks herbal tea.", "Le professeur est passé par le wagon-lit A à un moment de la soirée, à la recherche de ses lunettes (qu’il avait sur le nez).": "The professor passed through sleeper A at some point in the evening, looking for his glasses (which he was wearing).", "À 21 h, Ernest a proposé un café au contrôleur, qui l’a refusé : « Pas pendant le service. »": "At 9 pm, Ernest offered the inspector a coffee, who refused: \"Not while on duty.\"", "Quand la pendule a sonné dix coups, puis encore à 22 h 30, Ernest servait du miel chaud à Aria, qui se plaignait de sa gorge.": "When the clock struck ten, and again at 10:30 pm, Ernest was serving hot honey to Aria, who was complaining about her throat.", "À 23 h, le contrôleur exigeait le billet d’Aria. Ernest, lui, n’était pas avec eux.": "At 11 pm, the inspector was demanding Aria’s ticket. Ernest was not with them.", "Ernest a changé quatre fois de voiture dans la soirée, dont une fois entre 21 h 30 et 22 h.": "Ernest changed cars four times during the evening, once of them between 9:30 pm and 10 pm.", "Le contrôleur a changé quatre fois de voiture, notamment entre 21 h 30 et 22 h, puis entre 22 h et 22 h 30.": "The inspector changed cars four times, notably between 9:30 pm and 10 pm, then between 10 pm and 10:30 pm.", "Le wagon-restaurant était désert à 21 h et à 22 h : le chef était en grève.": "The dining car was deserted at 9 pm and at 10 pm: the chef was on strike.", "Ernest n’a jamais mis les pieds dans le salon-fumoir de la soirée : la fumée lui fait pleurer les yeux.": "Ernest never set foot in the smoking lounge all evening: the smoke makes his eyes water.", "Le contrôleur n’a mis les pieds ni dans le wagon-lit A, ni dans la voiture-bar. Le règlement, c’est le règlement.": "The inspector set foot in neither sleeper A nor the bar car. Rules are rules.", "Au cours de la soirée, Aria est passée par le salon-fumoir et, à un moment, sur le toit du train pour « respirer l’air des cimes ».": "During the evening, Aria passed through the smoking lounge and, at one point, onto the roof of the train to \"breathe the mountain air\".", "Le contrôleur est passé par le wagon-restaurant à un moment de la soirée.": "The inspector passed through the dining car at some point in the evening.", "À 21 h comme à 21 h 30, Rémi était avec le professeur, à essayer de lui vendre une « authentique » momie de chat.": "At 9 pm and at 9:30 pm, Remy was with the professor, trying to sell him an \"authentic\" cat mummy.", "À 22 h 30, le contrôleur a surpris Rémi sans billet. Il l’a noté deux fois dans son carnet.": "At 10:30 pm, the inspector caught Remy without a ticket. He wrote it down twice in his notebook.", "Quand la pendule a sonné onze coups, Ernest consolait Rémi, qui venait de perdre aux cartes.": "When the clock struck eleven, Ernest was comforting Remy, who had just lost at cards.", "Le professeur a changé trois fois de voiture, mais il n’a pas bougé de 22 h à 22 h 30 : il ronflait.": "The professor changed cars three times, but he didn’t move from 10 pm to 10:30 pm: he was snoring.", "Le professeur est passé par le wagon-lit A au cours de la soirée.": "The professor passed through sleeper A during the evening.", "Ernest n’a changé que deux fois de voiture dans la soirée, dont une fois entre 21 h et 21 h 30.": "Ernest changed cars only twice during the evening, once of them between 9 pm and 9:30 pm.", "Le contrôleur a changé trois fois de voiture, mais de 22 h 30 à 23 h, il n’a pas bougé : il remplissait son carnet.": "The inspector changed cars three times, but from 10:30 pm to 11 pm he didn’t move: he was filling in his notebook.", "Trois lieux déserts : le wagon-lit A à 21 h, la voiture-bar à 22 h et le toit du train à 22 h 30.": "Three deserted spots: sleeper A at 9 pm, the bar car at 10 pm and the roof of the train at 10:30 pm.", "Trois serments : le professeur n’a jamais mis les pieds dans la voiture-bar, Rémi jamais dans le wagon-restaurant, et le contrôleur jamais sur le toit.": "Three oaths: the professor never set foot in the bar car, Remy never in the dining car, and the inspector never on the roof.", "Ernest est monté sur le toit du train à un moment de la soirée, pour secouer une nappe.": "Ernest climbed onto the roof of the train at some point in the evening, to shake out a tablecloth.", "Quand la pendule a sonné neuf coups, ils étaient tous les quatre dans la même voiture pour le tournoi de belote : Rémi, Ernest, Aria et le professeur.": "When the clock struck nine, all four were in the same car for the belote tournament: Remy, Ernest, Aria and the professor.", "À 22 h, Aria, Rémi et le professeur partageaient la même voiture… et la même tarte.": "At 10 pm, Aria, Remy and the professor shared the same car… and the same tart.", "À 22 h 30 comme à 23 h, Ernest était seul dans sa voiture, à compter ses pourboires.": "At 10:30 pm and at 11 pm, Ernest was alone in his car, counting his tips.", "Ernest a changé trois fois de voiture dans la soirée, mais pas entre 21 h et 21 h 30 : la belote, c’est sacré.": "Ernest changed cars three times during the evening, but not between 9 pm and 9:30 pm: belote is sacred.", "Aria n’a pas bougé de 22 h à 22 h 30 : elle avait trouvé un public.": "Aria didn’t move from 10 pm to 10:30 pm: she had found an audience.", "Le professeur n’a pas bougé de 22 h 30 à 23 h : il dormait.": "The professor didn’t move from 10:30 pm to 11 pm: he was sleeping.", "Personne dans le salon-fumoir à 22 h 30. Personne sur le toit ni dans le wagon-restaurant à 23 h.": "Nobody in the smoking lounge at 10:30 pm. Nobody on the roof or in the dining car at 11 pm.", "Le professeur est passé par le salon-fumoir à un moment de la soirée, sa pipe éteinte à la main.": "The professor passed through the smoking lounge at some point in the evening, an unlit pipe in his hand.", "À 21 h, puis de nouveau à 23 h, Aria répétait son grand air devant le professeur.": "At 9 pm, and again at 11 pm, Aria rehearsed her big aria in front of the professor.", "À 21 h 30, Ernest apportait un grog à Aria.": "At 9:30 pm, Ernest brought Aria a hot toddy.", "À 21 h 30, le contrôleur a réveillé le professeur pour contrôler son billet. Le professeur s’est rendormi aussitôt et n’a pas bougé jusqu’à 22 h.": "At 9:30 pm, the inspector woke the professor to check his ticket. The professor fell straight back asleep and didn’t move until 10 pm.", "Quand la pendule a sonné dix coups, Aria signait un autographe au contrôleur… sur son carnet de contraventions.": "When the clock struck ten, Aria was signing an autograph for the inspector… in his book of fines.", "À 22 h 30, Aria s’était isolée pour se concentrer : personne d’autre dans sa voiture. La voiture-bar, elle, était vide.": "At 10:30 pm, Aria had shut herself away to concentrate: nobody else in her car. The bar car was empty.", "À 23 h 30, le professeur était seul, penché sur un hiéroglyphe.": "At 11:30 pm, the professor was alone, bent over a hieroglyph.", "Le professeur a changé quatre fois de voiture et il est passé par le toit du train à un moment de la soirée.": "The professor changed cars four times and passed over the roof of the train at some point in the evening.", "À 22 h, à 22 h 30 et à 23 h, Ernest était toujours dans la même voiture, à préparer les plateaux du petit-déjeuner.": "At 10 pm, 10:30 pm and 11 pm, Ernest was always in the same car, preparing the breakfast trays.", "Le contrôleur n’a pas bougé de 23 h à 23 h 30.": "The inspector didn’t move from 11 pm to 11:30 pm.", "Aria et Ernest sont tous deux passés par le salon-fumoir dans la soirée, pas forcément au même moment.": "Aria and Ernest both passed through the smoking lounge during the evening, not necessarily at the same time.", "Le contrôleur est passé par le wagon-lit A à un moment de la soirée, pour compter les couchettes.": "The inspector passed through sleeper A at some point in the evening, to count the berths.", "Hmm. Son alibi tient. Reprenons la chronologie.": "Hmm. Their alibi holds. Let’s go back over the timeline.", "Je retire ce que j’ai dit. Mon carnet n’a pas dit son dernier mot.": "I take back what I said. My notebook has not had its final word.", "Fausse piste. Le coupable doit bien rire.": "A false lead. The culprit must be laughing.", "Ce n’était pas l’heure ni la bonne personne. Recomptons.": "Wrong time, wrong person. Let’s recount.", "Moi ? Je n’ai même pas de quoi m’offrir un alibi !": "Me? I can’t even afford an alibi!", "Quelle audace ! Je n’ai que faire des bijoux des autres : j’ai les miens.": "How dare you! I have no use for other people’s jewels: I have my own.", "Vingt ans de service, et pas une petite cuillère ne m’a jamais manqué !": "Twenty years of service, and not one teaspoon has ever gone missing!", "Je contrôle les billets, madame, pas les soupçons.": "I check tickets, madam, not suspicions.", "J’étudie les momies, pas les cambriolages. Elles au moins ne me dérangent pas.": "I study mummies, not burglaries. At least they don’t disturb me.", "Moi ? Votre cliente ? Vous perdez la tête, ma chère Hortense.": "Me? Your client? You’re losing your mind, my dear Hortense.", "L’Express de minuit": "The Midnight Express", "Paris – Nice, en wagon-lit. Un collier, un caniche et beaucoup trop de suspects pour un seul train.": "Paris to Nice, by sleeper train. A necklace, a poodle and far too many suspects for a single g</b> flags your mistakes in red.", "<b>J’accuse !</b> Dès que tu es sûr, désigne le coupable. Une mauvaise accusation compte comme une erreur.": "<b>I accuse!</b> As soon as you are sure, name the culprit. A wrong accusation counts as a mistake.", "Mode d’emploi": "Instructions", "Un crime a été commis. Reconstitue qui était où, et à quelle heure, pour démasquer le coupable.": "A crime has been committed. Work out who was where, and when, to unmask the culprit.", "Deux façons de jouer": "Two ways to play", "une enquête en épisodes, avec ses personnages et ses dialogues.": "an episodic investigation, with its characters and dialogue.", "une affaire au hasard, avec le décor (manoir, train, hôtel), le mode et la difficulté de ton choix.": "a random case, with the setting (manor, train, hotel), mode and difficulty of your choice."});

<script>
/* Illustrations : portraits plats des suspects, sols et mobilier vus de dessus. */
(function () {
  'use strict';
  var INK = '#2b2f55';

  /* Un portrait par suspect : peau, cheveux, coupe, tenue, accessoires. */
  var LOOKS = {
    'Mme Vernet':      { skin: '#f3cdb3', hair: '#d9d9e3', style: 'bun',   shirt: '#7f8fd6', x: ['pearls'] },
    'Dr Aubry':        { skin: '#ecbd99', hair: '#3a2c2a', style: 'short', shirt: '#f4f6ff', x: ['glasses'] },
    'Lucas':           { skin: '#e4aa80', hair: '#d9672a', style: 'curly', shirt: '#5bb59a', x: [] },
    'Colonel Marchal': { skin: '#f0c2a0', hair: '#eceaf2', style: 'short', shirt: '#b3413f', x: ['mustache', 'cap'] },
    'Inès':            { skin: '#c98b61', hair: '#241c2c', style: 'long',  shirt: '#e7849f', x: ['earrings'] },
    'Mme Delaunay':    { skin: '#f3cdb3', hair: '#a5482c', style: 'wavy',  shirt: '#3b3f6e', x: ['hat'] },
    'Dr Moreau':       { skin: '#d9a07a', hair: '#2b2224', style: 'short', shirt: '#6ec0c9', x: ['glasses', 'beard'] },
    'Baron Voss':      { skin: '#f0c2a0', hair: '#8c8da5', style: 'bald',  shirt: '#2f3157', x: ['mustache', 'tophat', 'bowtie'] },
    'Roux':            { skin: '#e4aa80', hair: '#4a3427', style: 'short', shirt: '#4c6fb8', x: ['cap'] },
    'Mlle Ferrand':    { skin: '#f6d6bf', hair: '#f0c75e', style: 'bob',   shirt: '#9a7ee0', x: ['earrings'] },
    'Mme Lefèvre':     { skin: '#f0c2a0', hair: '#b9bccb', style: 'bun',   shirt: '#d98a86', x: ['glasses'] },
    'M. Costa':        { skin: '#e0a37b', hair: '#1f1a22', style: 'short', shirt: '#2b2f55', x: ['mustache', 'bowtie'] },
    'Dr Bellamy':      { skin: '#f3cdb3', hair: '#d8a83a', style: 'short', shirt: '#f4f6ff', x: ['glasses'] },
    'Mme Okafor':      { skin: '#6d4430', hair: '#1c1620', style: 'afro',  shirt: '#f0a94e', x: ['earrings'] },
    'Chef Duval':      { skin: '#eab491', hair: '#5a3b2a', style: 'short', shirt: '#ffffff', x: ['mustache', 'toque'] }
  };
  var DEFAULT = { skin: '#eab491', hair: '#3a2c2a', style: 'short', shirt: '#7f8fd6', x: [] };

  function has(L, k) { return L.x.indexOf(k) >= 0; }

  function inner(name) {
    var L = LOOKS[name] || DEFAULT, H = L.hair, S = L.skin, h = '', st = L.style;
    /* derrière la tête */
    if (st === 'long') h += '<path d="M16 30Q12 54 20 62L44 62Q52 54 48 30Z" fill="' + H + '"/>';
    if (st === 'afro') h += '<circle cx="32" cy="24" r="19" fill="' + H + '"/>';
    if (st === 'bun') h += '<circle cx="32" cy="9" r="6.5" fill="' + H + '"/>';
    if (st === 'wavy') h += '<path d="M17 28Q12 44 18 54Q22 50 21 44L43 44Q42 50 46 54Q52 44 47 28Z" fill="' + H + '"/>';
    /* buste */
    h += '<path d="M5 64Q7 45 32 45Q57 45 59 64Z" fill="' + L.shirt + '"/>';
    if (has(L, 'bowtie')) h += '<path d="M32 49L24 45L24 53ZM32 49L40 45L40 53Z" fill="#d94a63"/><circle cx="32" cy="49" r="2" fill="#b23550"/>';
    if (has(L, 'pearls')) h += '<g fill="#fff" stroke="#c9cbe0" stroke-width=".6"><circle cx="24" cy="46.5" r="1.8"/><circle cx="28" cy="48.5" r="1.8"/><circle cx="32" cy="49.2" r="1.8"/><circle cx="36" cy="48.5" r="1.8"/><circle cx="40" cy="46.5" r="1.8"/></g>';
    /* cou et tête */
    h += '<rect x="27" y="38" width="10" height="10" rx="3" fill="' + S + '"/>';
    h += '<ellipse cx="32" cy="29" rx="12" ry="14" fill="' + S + '"/>';
    h += '<ellipse cx="20" cy="31" rx="2" ry="3" fill="' + S + '"/><ellipse cx="44" cy="31" rx="2" ry="3" fill="' + S + '"/>';
    /* cheveux de face */
    if (st === 'short' || st === 'long' || st === 'bun' || st === 'afro') h += '<path d="M19.5 28Q17 11 32 11.5Q47 11 44.5 28Q41 19.5 32 19.5Q23 19.5 19.5 28Z" fill="' + H + '"/>';
    if (st === 'wavy') h += '<path d="M19 29Q15 10 32 11Q49 10 45 29Q42 20 32 20Q22 20 19 29Z" fill="' + H + '"/>';
    if (st === 'curly') h += '<g fill="' + H + '"><circle cx="21" cy="19" r="6.5"/><circle cx="28" cy="13" r="7"/><circle cx="37" cy="13" r="7"/><circle cx="43" cy="19" r="6.5"/><circle cx="32" cy="17" r="6"/></g>';
    if (st === 'bob') h += '<path d="M17.5 36Q13 9 32 10Q51 9 46.5 36Q44 35 44 28Q40 19.5 32 19.5Q24 19.5 20 28Q20 35 17.5 36Z" fill="' + H + '"/>';
    if (st === 'bald') h += '<path d="M19.5 28Q19 22 22 19Q20 26 20.5 31Z M44.5 28Q45 22 42 19Q44 26 43.5 31Z" fill="' + H + '"/>';
    /* visage */
    h += '<circle cx="27" cy="30" r="1.7" fill="' + INK + '"/><circle cx="37" cy="30" r="1.7" fill="' + INK + '"/>';
    h += '<circle cx="24.5" cy="34.5" r="2.4" fill="#ef8aa1" opacity=".35"/><circle cx="39.5" cy="34.5" r="2.4" fill="#ef8aa1" opacity=".35"/>';
    if (has(L, 'beard')) h += '<path d="M20.5 32Q21 48 32 48.5Q43 48 43.5 32Q40 41 32 41Q24 41 20.5 32Z" fill="' + H + '"/>';
    h += '<path d="M29 37.5Q32 40 35 37.5" fill="none" stroke="' + INK + '" stroke-width="1.4" stroke-linecap="round"/>';
    if (has(L, 'mustache')) h += '<path d="M23.5 36.5Q28 32.5 32 35.5Q36 32.5 40.5 36.5Q36 38 32 36.5Q28 38 23.5 36.5Z" fill="' + H + '"/>';
    if (has(L, 'glasses')) h += '<g fill="#fff" fill-opacity=".25" stroke="' + INK + '" stroke-width="1.3"><circle cx="27" cy="30" r="4.4"/><circle cx="37" cy="30" r="4.4"/></g><path d="M31.4 30H32.6" stroke="' + INK + '" stroke-width="1.3"/>';
    if (has(L, 'earrings')) h += '<circle cx="20" cy="36" r="1.8" fill="#f2c14b"/><circle cx="44" cy="36" r="1.8" fill="#f2c14b"/>';
    /* couvre-chefs */
    if (has(L, 'cap')) h += '<path d="M19 20Q19 8 32 8Q45 8 45 20Z" fill="' + (L.shirt === '#b3413f' ? '#8f2f2e' : '#2f4a8c') + '"/><rect x="17" y="19" width="30" height="3.5" rx="1.7" fill="#1f2a55"/><circle cx="32" cy="14" r="1.8" fill="#f2c14b"/>';
    if (has(L, 'tophat')) h += '<rect x="19" y="16" width="26" height="4" rx="2" fill="#1d1f3a"/><rect x="23" y="1" width="18" height="17" rx="2" fill="#1d1f3a"/><rect x="23" y="12" width="18" height="3.2" fill="#d94a63"/>';
    if (has(L, 'hat')) h += '<ellipse cx="32" cy="14" rx="19" ry="4.5" fill="#e7849f"/><path d="M22 14Q22 4 32 4Q42 4 42 14Z" fill="#e7849f"/><path d="M22 12H42" stroke="#fff" stroke-width="2.4"/><circle cx="40" cy="9" r="2.2" fill="#fff"/>';
    if (has(L, 'toque')) h += '<rect x="22" y="12" width="20" height="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="24" cy="9" r="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="32" cy="6" r="7" fill="#fff" stroke="#d8dbee" stroke-width=".8"/><circle cx="40" cy="9" r="6" fill="#fff" stroke="#d8dbee" stroke-width=".8"/>';
    return h;
  }
  function avatar(name) {
    return '<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + inner(name) + '</svg>';

        }

      else if (crimeSt === 'ok' && L >= 0 && gl === P.crime.room) rst = 'ok';
      if (rst === 'bad') {
        errors++;
        if (crimeSt === 'bad') E.badCells(P, { type: 'crime' }, g).forEach(function (rc) { bad[rc[0] * T + rc[1]] = 1; });
        if (L >= 0 && gl >= 0 && gl !== P.crime.room) bad[L * T + P.crime.t] = 1;

        else st = ((tv === 'ok') === (c.by !== L)) ? 'ok' : 'bad';
        if (st === 'bad') {

  }

      h += '<div class="liar"><span class="liar-q">Qui ment ?</span><div class="liar-btns">';
      for (s = 0; s < S; s++) {
        h += '<button type="button" class="liar-btn s' + ci(s) + '" data-act="liar" data-s="' + s + '" aria-pressed="' + (state.liarGuess === s) + '">' + mini(s) + SUSPECTS[s].short + '</button>';
      }
      h += '</div></div>';
    }
    h += '<div class="status"><span>' + A.filled + '/' + (S * T) + ' ' + TR('cases') + '</span>' +
      (show ? '<span class="' + (A.errors ? 'err' : '') + '">' + A.errors + ' ' + TR(pl(A.errors, 'contradiction', 'contradictions')) + '</span>' : '<span>' + TR('vérification en direct désactivée') + '</span>') +
      (isLiar(P) && !state.solved && state.liarGuess < 0 && gridCorrect() ? '<span class="err">' + TR('chronologie complète : désigne le menteur') + '</span>' : '') +
      (state.wrong && !state.solved ? '<span class="err">' + state.wrong + ' ' + TR(pl(state.wrong, 'fausse accusation', 'fausses accusations')) + ' (' + state.accused.map(function (x) { return SUSPECTS[x].short; }).join(', ') + ' : ' + TR('innocent') + ')</span>' : '') +
      '</div>';
    if (!state.solved) {
      h += '<div class="actions"><label class="switch"><input type="checkbox" id="live"' + (state.live ? ' checked' : '') + '><span>' + TR('Vérification en direct') + '</span></label>' +
        '<div class="btns">' +
        (state.live ? '' : '<button type="button" class="btn sm" data-act="check" title="' + TR('Contrôle toute la grille d’un coup') + '">' + TR('Vérifier') + '</button>') +
        '<button type="button" class="btn sm" data-act="hint">' + TR('Indice') + '</button>' +
        '<button type="button" class="btn sm" data-act="reset">' + TR('Effacer') + '</button>' +
        '<button type="button" class="btn sm accuse" data-act="accuse">' + TR('J’accuse !') + '</button></div></div>' +
        '<p class="hintline">' + (state.live
          ? TR('Vérification en direct : les erreurs s’affichent tout de suite en rouge.')
          : TR('Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier », qui contrôle toute la grille d’un coup.')) + '</p>';
    }
    $('board-panel').innerHTML = h;
  }

  function renderCluesLiar() {
    var P = state.puz, A = analyse(), show = showMarks(), L = state.liarGuess, S = P.S, s, h = '';
    var total = A.items.length;
    h += '<div class="panel-hd"><h2 class="label">' + TR('Déclarations') + '</h2><span class="sub">' +
      (show ? (L < 0 ? TR('désigne un menteur') : A.okCount + '/' + total + ' ' + TR('confirmées')) : total + ' ' + TR('constats')) + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>' + TR('Masquer les déclarations confirmées') + '</span></label>';
    function li(it, text) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      var tag = (st === 'true' || st === 'false') ? '<span class="tag">' + (st === 'true' ? 'vrai' : 'faux') + '</span>' : '';
      return '<li class="clue ' + st + (it.rule ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + text + ' ' + tag + '</span></li>';
    }
    var rule = A.items.filter(function (it) { return it.rule; })[0];
    h += '<ul class="clues">' + li(rule, EN ? 'The liar is the killer: only they were ' + inRoom(P.crime.room) + ' at ' + tl(P.crime.t) + '.' : 'Le menteur est le meurtrier : lui seul se trouvait ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) + '.') + '</ul>';
    var facts = P.clues.filter(function (c) { return c.by === undefined; });
    if (facts.length) {
      h += '<div class="speaker"><b>' + TR('Preuves') + '</b><span class="tag">' + TR('certaines') + '</span></div><ul class="clues proof-list">' +
        facts.map(function (c) { return '<li class="clue ok proof"><span class="ico">' + ICON.lock + '</span><span class="txt">' + E.clueText(P, c) + '</span></li>'; }).join('') + '</ul>';
    }
    for (s = 0; s < S; s++) {
      var mix = (P.mode === 'half' && L === s) ? A.items.filter(function (it) { return it.mix; })[0] : null;
      var rows = (mix ? li(mix, TR('Au moins une de ses déclarations est vraie et au moins une est fausse.')) : '') + A.items.filter(function (it) { return !it.rule && !it.mix && it.c.by === s; }).map(function (it) {
        return li(it, EN ? '“' + E.statementText(P, it.c) + '”' : '« ' + E.statementText(P, it.c) + ' »');
      }).join('');
      var who = L < 0 ? '' : (L === s ? '<span class="tag liar-tag">' + TR(P.mode === 'half' ? 'ment en partie' : 'ment : tout est faux') + '</span>' : '<span class="tag">' + TR('dit vrai') + '</span>');
      h += '<div class="sp s' + ci(s) + '">' + pola(s, '<small>' + SUSPECTS[s].role + '</small>' + who) +
        (rows ? '<ul class="clues bubbles">' + rows + '</ul>' : '<p class="empty-note">' + TR('Toutes ses déclarations sont confirmées.') + '</p>') + '</div>';
    }
    $('clues-panel').innerHTML = h;
  }

  function renderClues() {
    if (isLiar(state.puz)) { renderCluesLiar(); return; }
    var A = analyse(), show = showMarks();
    var h = '<div class="panel-hd"><h2 class="label">' + TR('Constats') + '</h2><span class="sub">' +
      (show ? A.okCount + '/' + A.items.length + ' ' + TR('confirmés') : A.items.length + ' ' + TR('constats')) + '</span></div>';
    h += '<label class="switch opts"><input type="checkbox" id="hideok"' + (state.hideOk ? ' checked' : '') + '><span>' + TR('Masquer les constats confirmés') + '</span></label>';
    var rows = A.items.map(function (it) {
      var st = show ? it.st : 'pending';
      if (state.hideOk && st === 'ok') return '';
      return '<li class="clue ' + st + (it.c.type === 'crime' ? ' rule' : '') + '"><span class="ico">' + ICON[st] + '</span><span class="txt">' + E.clueText(state.puz, it.c) + '</span></li>';
    }).join('');
    h += rows ? '<ul class="clues">' + rows + '</ul>' : '<p class="empty-note">' + TR('Tous les constats sont confirmés.') + '</p>';
    $('clues-panel').innerHTML = h;
  }

  function mineCount() {
    var P = state.puz;
    return P.clues.filter(function (c) { return c.by === P.liar; }).length;
  }
  function falseCount() {
    var P = state.puz, gs = function (s, t) { return P.solution[s * P.T + t]; };
    return P.clues.filter(function (c) { return c.by === P.liar && E.evalClue(P, c, gs) !== 'ok'; }).length;
  }

  function renderVerdict() {
    var P = state.puz, el = $('verdict');
    if (!state.solved) { el.innerHTML = ''; return; }
    var c = SUSPECTS[P.culprit];
    el.innerHTML = '<div class="panel verdict"><div class="v-top">' + pola(P.culprit, '<small class="guilty">' + TR('coupable') + '</small>') + '<div class="stamp">' + TR('Affaire classée') + '</div></div>' +
      (EN
        ? (P.mode === 'half'
          ? '<p><b>' + c.name + '</b> mixed truth and lies: ' + falseCount() + ' of ' + (c.f ? 'her' : 'his') + ' ' + mineCount() + ' statements ' + (falseCount() > 1 ? 'were false' : 'was false') + '. ' + (c.f ? 'She' : 'He') + ' was alone ' + inRoom(P.crime.room) + ' at ' + tl(P.crime.t) + '. The other suspects always told the truth.</p>'
          : P.mode === 'liar'
          ? '<p><b>' + c.name + '</b> was lying. ' + (c.f ? 'She' : 'He') + ' was alone ' + inRoom(P.crime.room) + ' at ' + tl(P.crime.t) + ', and every one of ' + (c.f ? 'her' : 'his') + ' statements was false. The other suspects told the truth.</p>'
          : '<p><b>' + c.name + '</b> was alone ' + inRoom(P.crime.room) + ' at ' + tl(P.crime.t) + '. Every other alibi holds.</p>')
        : '') + (EN ? '' :
      (P.mode === 'half'
        ? '<p><b>' + c.name + '</b> mêlait le vrai et le faux : ' + falseCount() + ' de ' + (c.f ? 'ses' : 'ses') + ' ' + mineCount() + ' déclarations ' + (falseCount() > 1 ? 'étaient fausses' : 'était fausse') + '. ' + (c.f ? 'Elle' : 'Il') + ' était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          '. Les autres suspects disaient toujours vrai.</p>'
        : P.mode === 'liar'
        ? '<p><b>' + c.name + '</b> mentait. ' + (c.f ? 'Elle' : 'Il') + ' était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          ', et chacune de ses déclarations était fausse. Les autres suspects disaient vrai.</p>'
        : '<p><b>' + c.name + '</b> était ' + (c.f ? 'seule' : 'seul') + ' ' + inRoom(P.crime.room) + ' à ' + tl(P.crime.t) +
          '. Tous les autres alibis tiennent.</p>')) +
      '<p class="sub">' + (EN
        ? ((state.early ? 'Correct accusation with ' + state.early + ' timeline cell' + (state.early > 1 ? 's' : '') + ' still empty. ' : '') +
           (state.hints ? state.hints + ' hint' + (state.hints > 1 ? 's' : '') + ' used. ' : 'No hints used. ') +
           (state.wrong ? state.wrong + ' wrong accusation' + (state.wrong > 1 ? 's' : '') + '.' : 'No wrong accusations.'))
        : ((state.early ? 'Accusation exacte alors que ' + state.early + ' case' + (state.early > 1 ? 's' : '') + ' de la chronologie restaient à remplir. ' : '') +
           (state.hints ? state.hints + ' indice' + (state.hints > 1 ? 's' : '') + ' utilisé' + (state.hints > 1 ? 's' : '') + '. ' : 'Aucun indice utilisé. ') +
           (state.wrong ? state.wrong + ' fausse' + (state.wrong > 1 ? 's' : '') + ' accusation' + (state.wrong > 1 ? 's' : '') + '.' : 'Aucune fausse accusation.'))) + '</p>' +
      '<button type="button" class="btn primary" data-act="new">' + TR('Affaire suivante') + '</button></div>';
  }

  function renderSheet() {
    var root = $('sheet-root'), p = state.picker;
    if (state.accuse && state.puz) {
      var P0 = state.puz, ab = '';
      for (var q0 = 0; q0 < P0.S; q0++) {
        var out = state.accused.indexOf(q0) >= 0;
        ab += '<button type="button" class="acc-btn s' + ci(q0) + (out ? ' out' : '') + '" data-act="accpick" data-s="' + q0 + '"' + (out ? ' disabled' : '') + '>' +
          pola(q0, '<small>' + (out ? TR('innocent') : SUSPECTS[q0].role) + '</small>') + '</button>';
      }
      root.innerHTML = '<div class="scrim" data-act="close"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + TR('Désigner le coupable') + '">' +
        '<div class="sheet-hd"><b class="acc-t">' + TR('J’accuse…') + '</b></div>' +
        '<p class="trail">' + TR('Qui est le meurtrier ? Une mauvaise réponse est comptée comme une erreur.') + '</p>' +
        '<div class="acc-grid" style="--n:' + (P0.S <= 4 ? P0.S : 3) + '">' + ab + '</div>' +
        '<div class="sheet-ft"><button type="button" class="btn sm" data-act="close">' + TR('Annuler') + '</button></div></div>';
      var f0 = root.querySelector('.acc-btn:not(:disabled)'); if (f0) f0.focus();
      return;
    }
    if (!p) { root.innerHTML = ''; return; }
    var P = state.puz, T = P.T, s = p.s, t = p.t, cur = g(s, t);
    var prev = t > 0 ? g(s, t - 1) : -1, next = t < T - 1 ? g(s, t + 1) : -1;
    var trail = [];
    if (t > 0) trail.push(tl(t - 1) + ' ' + (prev >= 0 ? ROOMS[prev].name : '?'));
    trail.push('<b>' + tl(t) + ' ?</b>');
    if (t < T - 1) trail.push(tl(t + 1) + ' ' + (next >= 0 ? ROOMS[next].name : '?'));
    var btns = ROOMS.map(function (room, r) {
      var far = (prev >= 0 && !((STEP[prev] >> r) & 1)) || (next >= 0 && !((STEP[r] >> next) & 1));
      return '<button type="button" class="room-btn' + (r === cur ? ' cur' : '') + (far ? ' far' : '') + '" data-act="pick" data-r="' + r + '">' +
        room.name + (far ? '<small>' + TR('trop loin') + '</small>' : '') + '</button>';
    }).join('');
    root.innerHTML = '<div class="scrim" data-act="close"></div>' +
      '<div class="sheet s' + ci(s) + '" role="dialog" aria-modal="true" aria-label="' + (EN ? 'Choose a ' : 'Choisir une ') + E.SCENE.unit + '">' +
      '<div class="sheet-hd">' + mini(s) + '<b>' + SUSPECTS[s].name + '</b></div>' +
      '<p class="trail">' + trail.join(' → ') + '</p>' +
      '<div class="room-grid">' + btns + '</div>' +
      '<div class="sheet-ft"><button type="button" class="btn sm" data-act="clear">' + TR('Effacer la case') + '</button><button type="button" class="btn sm" data-act="close">' + TR('Fermer') + '</button></div></div>';
    var first = root.querySelector('.room-btn.cur') || root.querySelector('.room-btn');
    if (first) first.focus();
  }

  function renderAll() {
    renderScenes(); renderModes(); renderLevels(); renderRules(); renderCase(); renderSuspects(); renderMap(); renderBoard(); renderVerdict(); renderClues(); renderSheet();
  }

  /* ---------- Actions ---------- */
  function newCase(level, seed, mode, scene) {
    state.scene = scene || state.scene;
    state.level = level || state.level;
    state.mode = mode || state.mode;
    lsSet('kioukan.level', state.level);
    lsSet('kioukan.mode', state.mode);
    lsSet('kioukan.scene', state.scene);
    renderScenes(); renderModes(); renderLevels();
    $('board-panel').innerHTML = '<p class="loading">' + TR('Instruction du dossier…') + '</p>';
    $('case').innerHTML = ''; $('suspects').innerHTML = ''; $('map-panel').innerHTML = ''; $('clues-panel').innerHTML = ''; $('verdict').innerHTML = '';
    state.picker = null; renderSheet();
    setTimeout(function () {
      var sd = seed || (Math.floor(Math.random() * 9000) + 1000);
      bindScene();
      var P = E.generate(sd, state.level, state.mode);
      state.puz = P;
      state.grid = []; state.given = [];
      for (var i = 0; i < P.S * P.T; i++) { state.grid.push(-1); state.given.push(false); }
      P.clues.forEach(function (c) { if (c.type === 'at' && c.by === undefined) { state.grid[c.s * P.T + c.t] = c.r; state.given[c.s * P.T + c.t] = true; } });
      state.selT = 0; state.checked = false; state.hints = 0; state.solved = false; state.liarGuess = -1; state.accuse = false; state.accused = []; state.wrong = 0; state.early = 0;
      renderAll();
    }, 30);
  }

  function afterChange() {
    state.checked = false;
    var P = state.puz;
    if (!state.solved && gridCorrect() && (!isLiar(P) || state.liarGuess === P.liar)) {
      state.solved = true; if (window.KSFX) window.KSFX.play('win');
      state.selT = P.crime.t;
    }
    renderMap(); renderBoard(); renderVerdict(); renderClues();
  }

  function setCell(s, t, v) {
    var idx = s * state.puz.T + t;
    if (state.given[idx] || state.solved) return;
    var e0 = analyse().errors;
    state.grid[idx] = v;
    afterChange();
    if (window.KSFX && !state.solved && v >= 0) { if (state.far) state.far = false; else window.KSFX.play(state.live && analyse().errors > e0 ? 'malus' : 'pick'); }
  }

  function closeSheet() {
    var p = state.picker;
    state.picker = null; state.accuse = false; renderSheet();
    if (p) {
      var el = document.querySelector('.cell[data-s="' + p.s + '"][data-t="' + p.t + '"]');
      if (el && !el.disabled) el.focus();
    }
  }

  function hint() {
    var P = state.puz, wrong = [];
    state.grid.forEach(function (v, i) { if (v !== P.solution[i]) wrong.push(i); });
    if (!wrong.length) return;
    var i = wrong[Math.floor(Math.random() * wrong.length)];
    state.grid[i] = P.solution[i]; state.given[i] = true; state.hints++;
    state.selT = i % P.T;
    afterChange();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !state.puz && el.getAttribute('data-act') !== 'new' && el.getAttribute('data-act') !== 'level') return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'new': newCase(state.level); break;
      case 'mode': if (el.getAttribute('data-mode') !== state.mode) newCase(state.level, null, el.getAttribute('data-mode')); break;
      case 'liar':
        var ls = +el.getAttribute('data-s');
        state.liarGuess = state.liarGuess === ls ? -1 : ls;
        afterChange();
        break;
      case 'scene': if (el.getAttribute('data-scene') !== state.scene) newCase(state.level, null, null, el.getAttribute('data-scene')); break;
      case 'level': newCase(el.getAttribute('data-level')); break;
      case 'time': state.selT = +el.getAttribute('data-t'); renderMap(); renderBoard(); break;
      case 'cell':
        if (el.disabled) break;
        state.picker = { s: +el.getAttribute('data-s'), t: +el.getAttribute('data-t') };
        state.selT = state.picker.t;
        renderMap(); renderBoard(); renderSheet();
        break;
      case 'pick':
        state.far = el.classList.contains('far'); if (state.far && window.KSFX) window.KSFX.play('forbid');
        if (state.picker) { var p = state.picker; setCell(p.s, p.t, +el.getAttribute('data-r')); closeSheet(); }
        break;
      case 'clear':
        if (state.picker) { var q = state.picker; setCell(q.s, q.t, -1); closeSheet(); }
        break;
      case 'close': closeSheet(); break;
      case 'check': state.checked = true; renderBoard(); renderClues(); break;
      case 'hint': hint(); break;
      case 'accuse': if (!state.solved) { state.accuse = true; renderSheet(); } break;
      case 'accpick':
        var as = +el.getAttribute('data-s'), P2 = state.puz;
        state.accuse = false;
        if (as === P2.culprit) {
          var emp = 0;
          state.grid.forEach(function (v, i) { if (v !== P2.solution[i]) emp++; });
          state.early = emp; state.grid = P2.solution.slice(); state.solved = true; if (window.KSFX) window.KSFX.play('win'); state.selT = P2.crime.t;
          if (isLiar(P2)) state.liarGuess = P2.culprit;
        } else { state.wrong++; state.accused.push(as); if (window.KSFX) window.KSFX.play('wrong'); }
        renderSheet(); renderMap(); renderBoard(); renderVerdict(); renderClues();
        break;
      case 'reset':
        state.grid = state.grid.map(function (v, i) { return state.given[i] ? v : -1; });
        state.liarGuess = -1;
        afterChange();
        break;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'live') { state.live = e.target.checked; state.checked = false; renderBoard(); renderClues(); }
    if (e.target.id === 'hideok') { state.hideOk = e.target.checked; renderClues(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (state.picker || state.accuse)) closeSheet();
  });

  /* ---------- Démarrage ---------- */
  var saved = lsGet('kioukan.level');
  if (saved && LEVELS[saved]) state.level = saved;
  var savedMode = lsGet('kioukan.mode');
  if (savedMode === 'liar' || savedMode === 'half' || savedMode === 'classic') state.mode = savedMode;
  var savedScene = lsGet('kioukan.scene');
  if (SCENE_UI[savedScene]) state.scene = savedScene;
  var rules = $('rules');
  if (!lsGet('kioukan.seen')) { rules.open = true; lsSet('kioukan.seen', '1'); }
  window.Kioukan = { state: state, newCase: newCase };
  newCase(state.level);
})();

</script>

</body>
</html>
