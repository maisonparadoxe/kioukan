t in the dining room: I fast before concerts.”", "« Cécile n’a jamais mis les pieds dans la cabine 7. Elle n’aime pas les numéros impairs. »": "“Cecily never set foot in cabin 7. She doesn’t like odd numbers.”", "« À 21 h, j’étais sur la passerelle, à jouer de l’harmonica aux mouettes. »": "“At 9 pm I was on the bridge, playing the harmonica to the seagulls.”", "« À 20 h, le pianiste et moi étions ensemble. Il m’a joué une polka, j’ai survécu. »": "“At 8 pm, the pianist and I were together. He played me a polka; I survived.”", "« À 22 h, Cécile et Rémi n’étaient pas ensemble. Qui voudrait de Rémi ? »": "“At 10 pm, Cecily and Remy were not together. Who would want Remy?”", "« Cécile n’a pas bougé à 22 h comme à 22 h 30. Une statue. Une statue muette. »": "“Cecily stayed put at 10 pm and at 10:30 pm. A statue. A silent statue.”", "« Cécile est passée par la salle à manger dans la soirée. Elle a pris un dessert sans dire merci. »": "“Cecily passed through the dining room during the evening. She took a dessert without saying thank you.”", "« Cécile est passée par la cabine 12, aussi. Une curieuse, cette muette. »": "“Cecily passed through cabin 12, too. Nosy, for a mute.”", "« À 20 h 30, le pianiste et moi étions ensemble. Je lui ai parié qu’il raterait son la. »": "“At 8:30 pm, the pianist and I were together. I bet him he’d miss his A.”", "« Quand la cloche a sonné neuf coups, Lucie et moi étions ensemble. Elle m’a prêté de l’argent. Si, si. »": "“When the bell struck nine, Lucy and I were together. She lent me money. Honestly.”", "« Le pianiste n’a pas bougé à 22 h comme à 22 h 30. Je l’aurais parié, et j’aurais gagné. »": "“The pianist stayed put at 10 pm and at 10:30 pm. I’d have bet on it, and won.”", "« Le pianiste a changé de pièce entre 20 h et 20 h 30. Il fuyait son public. »": "“The pianist changed rooms between 8 pm and 8:30 pm. Fleeing his audience.”", "« Je n’ai jamais mis les pieds sur la passerelle. Le capitaine me doit encore une revanche. »": "“I never set foot on the bridge. The captain still owes me a rematch.”", "« Je n’ai jamais mis les pieds dans la salle à manger non plus. Trop cher. »": "“I never set foot in the dining room either. Too expensive.”", "« Quand la cloche a sonné huit coups, Lucie était sur la passerelle. Elle scrutait l’horizon comme si quelqu’un allait venir. »": "“When the bell struck eight, Lucy was on the bridge. Scanning the horizon as if someone were coming.”", "Des signaux ? Moi, je ne connais que le solfège.": "Signals? The only ones I know are in sol-fa.", "Des signaux au canot ? Je n’ai même pas de quoi payer une lampe, madame.": "Signals to the boat? I can’t even afford a lamp, madam.", "L’Opéra de Monte-Carlo": "The Monte Carlo Opera", "Rideau ! Ici, même les coupables chantent à moitié faux.": "Curtain up! Here, even the culprits sing half out of tune.", "Prima donna": "Prima donna", "Le diadème de la diva a disparu.": "The diva’s tiara has disappeared.", "Il a été pris à {h}, {lieu}. Les innocents disent toujours vrai. Le coupable mêle le vrai et le faux : au moins une vraie déclaration, au moins une fausse.": "It was taken at {h}, {lieu}. The innocent always tell the truth. The culprit mixes truth and lies: at least one true statement, at least one false.", "la coupable": "the culprit", "L’Opéra de Monte-Carlo, deux heures avant la première.": "The Monte Carlo Opera, two hours before opening night.", "Mon diadème ! Je ne peux pas chanter Tosca tête nue !": "My tiara! I can’t sing Tosca bareheaded!", "Nouvelle règle, et elle est plus vicieuse : le coupable mélange le vrai et le faux. Au moins une de ses phrases est vraie, au moins une est fausse.": "A new rule, and a nastier one: the culprit mixes truth and lies. At least one of their sentences is true, at least one is false.", "Il manquait des paillettes ! Une diva sans paillettes, c’est une choriste.": "It was missing sequins! A diva without sequins is just a chorus girl.", "Paulette Paillette… Je n’aurais pas dû chercher plus loin.": "Sally Sequin… I needn’t have looked any further.", "À la répétition, le maestro cherche sa baguette partout.": "At rehearsal, the maestro searches everywhere for his baton.", "« À 20 h, Sam et moi étions ensemble. Il me soufflait mon texte ; je le connaissais déjà, évidemment. »": "“At 8 pm, Sam and I were together. He was prompting my lines; I already knew them, obviously.”", "« Quand la pendule a sonné neuf coups, Paulette et Sam étaient ensemble. Deux petites mains de l’ombre. »": "“When the clock struck nine, Sally and Sam were together. Two little hands behind the scenes.”", "« À 21 h 30, Sam et moi étions encore ensemble. Il me suit partout : c’est le prix de la gloire. »": "“At 9:30 pm, Sam and I were still together. He follows me everywhere: the price of fame.”", "« À 20 h, Paulette n’était pas avec moi : mon costume attendait ses paillettes. »": "“At 8 pm, Sally was not with me: my costume was waiting for its sequins.”", "« Paulette n’a pas bougé à 20 h 30 comme à 21 h. Elle cousait ma cape. Ma cape ! »": "“Sally stayed put at 8:30 pm and at 9 pm. She was sewing my cape. My cape!”", "« Paulette n’a pas bougé à 21 h comme à 21 h 30 non plus. Elle cousait. »": "“Sally stayed put at 9 pm and at 9:30 pm as well. She was sewing.”", "« Quand la pendule a sonné huit coups, Paulette était sur la scène, à ramasser mes paillettes. »": "“When the clock struck eight, Sally was on the stage, picking up my sequins.”", "« À 20 h 30, Enzo et moi étions ensemble. Je lui ai recousu un bouton, il ne m’a pas dit merci. »": "“At 8:30 pm, Enzo and I were together. I sewed a button back on for him; he didn’t say thank you.”", "« Enzo est passé par les cintres dans la soirée. Il voulait voir la salle d’en haut. »": "“Enzo passed through the flies during the evening. He wanted to see the house from above.”", "« … à 20 h 30, Paulette et moi étions ensemble… elle m’a piqué avec une épingle… »": "“… at 8:30 pm, Sally and I were together… she pricked me with a pin…”", "« … à 20 h 30, Enzo n’était pas avec Paulette… elle a eu de la chance… »": "“… at 8:30 pm, Enzo was not with Sally… lucky her…”", "« … Enzo n’a pas bougé à 20 h comme à 20 h 30… il faisait ses vocalises… »": "“… Enzo stayed put at 8 pm and at 8:30 pm… doing his vocal exercises…”", "« … moi, je n’ai pas bougé à 21 h comme à 21 h 30… comme d’habitude… »": "“… me, I stayed put at 9 pm and at 9:30 pm… as usual…”", "« … Enzo est passé par la scène dans la soirée… sans moi, il aurait oublié pourquoi… »": "“… Enzo passed through the stage during the evening… without me, he’d have forgotten why…”", "Un diadème ? J’ai assez de lumière sur scène, madame !": "A tiara? I get enough light on stage, madam!", "Moi, je reste dans mon trou, madame. Je ne vois jamais la diva que de dessous.": "I stay in my box, madam. I only ever see the diva from below.", "Baguette magique": "Magic baton", "La baguette du maestro a disparu.": "The maestro’s baton has disappeared.", "Elle a été prise à {h}, {lieu}. Le coupable mêle le vrai et le faux, les autres disent vrai.": "It was taken at {h}, {lieu}. The culprit mixes truth and lies, the others tell the truth.", "Ma baguette ! Sans elle, l’orchestre joue n’importe comment ! Enfin… plus que d’habitude.": "My baton! Without it, the orchestra plays any old how! Well… more than usual.", "Elle a disparu {lieu} à {h}. Le coupable dit vrai… à moitié.": "It disappeared {lieu} at {h}. The culprit tells the truth… by halves.", "Il dirige si lentement ! Je voulais chanter mon air en moins de dix minutes, pour une fois.": "He conducts so slowly! For once, I wanted to sing my aria in under ten minutes.", "Un ténor pressé. On aura tout vu.": "A tenor in a hurry. Now I’ve seen everything.", "Pendant la générale, le rideau tombe en plein milieu du premier acte.": "During the dress rehearsal, the curtain drops right in the middle of the first act.", "« 21 h 30. Sam pas avec moi. Noté. »": "“9:30 pm. Sam not with me. Noted.”", "« Enzo est passé par la loge de la diva. Noté sur ma feuille de service. »": "“Enzo passed through the diva’s dressing room. Noted on my running sheet.”", "« Sam est passé par la scène. Noté aussi. »": "“Sam passed through the stage. Noted too.”", "« … à 20 h, Enzo et moi étions ensemble… je lui soufflais ses répliques… il les oubliait quand même… »": "“… at 8 pm, Enzo and I were together… I was prompting his lines… he forgot them anyway…”", "« … quand la pendule a sonné neuf coups, Enzo et moi étions encore ensemble… il ne me lâche pas… »": "“… when the clock struck nine, Enzo and I were still together… he won’t let go of me…”", "« … à 21 h, j’étais au foyer… à manger un petit four… ne le dites à personne… »": "“… at 9 pm, I was in the foyer… eating a petit four… don’t tell anyone…”", "« À 21 h comme à 21 h 30, je n’ai pas bougé. Une voix comme la mienne se repose. »": "“At 9 pm and at 9:30 pm I didn’t move. A voice like mine needs rest.”", "« À 21 h 30, Sam était dans la loge de la diva. Il fouinait. »": "“At 9:30 pm, Sam was in the diva’s dressing room. Snooping around.”", "« À 22 h, j’étais au parterre, à vérifier l’acoustique. »": "“At 10 pm I was in the stalls, checking the acoustics.”", "Une baguette ? J’ai déjà mes cordes et mes poulies, madame.": "A baton? I’ve already got my ropes and my pulleys, madam.", "La baguette ? J’ai déjà le livret, c’est bien assez lourd.": "The baton? I’ve already got the script, that’s heavy enough.", "Le rideau tombe": "The curtain falls", "Le rideau est tombé en pleine générale.": "The curtain fell in the middle of the dress rehearsal.", "Quelqu’un a actionné le levier à {h}, {lieu}. Les innocents disent vrai, le coupable ment à chaque fois.": "Someone pulled the lever at {h}, {lieu}. The innocent tell the truth, the culprit lies every time.", "chute": "fall", "Mon rideau est tombé tout seul ! Enfin… pas tout seul. Quelqu’un a touché au levier.": "My curtain came down all by itself! Well… not all by itself. Someone touched the lever.", "Le levier a été actionné {lieu} à {h}. Ici, le coupable ment sur tout.": "The lever was pulled {lieu} at {h}. Here, the culprit lies about everything.", "Je me suis assoupi contre le levier… Souffler les répliques, c’est épuisant.": "I dozed off against the lever… Prompting is exhausting.", "Un souffleur qui s’endort. Il y a des métiers à risque.": "A prompter who falls asleep. Some jobs are dangerous.", "Le soir même, le texte du souffleur est introuvable.": "That same evening, the prompter’s script is nowhere to be found.", "« À 20 h 30, Sam et moi étions ensemble. Dans la même mesure, si j’ose dire. »": "“At 8:30 pm, Sam and I were together. In the same bar, if I may say so.”", "« À 20 h comme à 20 h 30, je n’ai pas bougé : un maestro ne quitte pas son pupitre. »": "“At 8 pm and at 8:30 pm I didn’t move: a maestro doesn’t leave his podium.”", "« Sam n’a pas bougé à 20 h 30 comme à 21 h. Una pausa lunga, molto lunga. »": "“Sam stayed put at 8:30 pm and at 9 pm. Una pausa lunga, molto lunga.”", "« À 21 h comme à 21 h 30, je n’ai pas bougé. Tempo giusto. »": "“At 9 pm and at 9:30 pm I didn’t move. Tempo giusto.”", "« À 22 h 30, Paulette était dans les cintres. Elle cousait là-haut, pianissimo. »": "“At 10:30 pm, Sally was in the flies. She was sewing up there, pianissimo.”", "« … Paulette a changé de pièce entre 21 h et 21 h 30… »": "“… Sally changed rooms between 9 pm and 9:30 pm…”", "« … à 20 h, je n’étais pas au parterre… je ne me montre jamais au public… »": "“… at 8 pm, I was not in the stalls… I never show myself to the audience…”", "« … le maestro n’a jamais mis les pieds dans la machinerie… trop de bruit pour ses oreilles… »": "“… the maestro never set foot in the machinery room… too noisy for his ears…”", "« … quand la pendule a sonné huit coups, Aria était dans les coulisses… elle chauffait sa voix… »": "“… when the clock struck eight, Aria was in the wings… warming up her voice…”", "« Quand la pendule a sonné neuf coups, le maestro et moi étions ensemble. Il avait perdu un bouton. »": "“When the clock struck nine, the maestro and I were together. He had lost a button.”", "« À 20 h, Aria était dans la loge de la diva. Où voulez-vous qu’elle soit ? »": "“At 8 pm, Aria was in the diva’s dressing room. Where else would she be?”", "« À 22 h, j’étais dans la machinerie, à repriser un velours. »": "“At 10 pm I was in the machinery room, darning a velvet drape.”", "« À 22 h, le maestro et moi étions ensemble. Il battait la mesure, je battais des records. »": "“At 10 pm, the maestro and I were together. He was beating time, I was beating records.”", "« À 22 h 30, Sam et moi étions ensemble. Il m’a soufflé une note. Fausse. »": "“At 10:30 pm, Sam and I were together. He prompted me a note. A wrong one.”", "« À 20 h 30 comme à 21 h, je n’ai pas bougé : vocalises. »": "“At 8:30 pm and at 9 pm I didn’t move: vocal exercises.”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé. Une diva ne quitte pas la lumière. »": "“At 9:30 pm and at 10 pm I didn’t move. A diva doesn’t leave the spotlight.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé non plus. Une diva ne court pas. »": "“At 10 pm and at 10:30 pm I didn’t move either. A diva doesn’t run.”", "« À 20 h, Paulette était dans la loge de la diva, à me coudre des paillettes. »": "“At 8 pm, Sally was in the diva’s dressing room, sewing sequins on for me.”", "Faire tomber le rideau pendant MA générale ? Jamais, madame. Je le fais tomber à la fin.": "Bring the curtain down during MY dress rehearsal? Never, madam. I bring it down at the end.", "Je couds les rideaux, madame. Je ne les décroche pas.": "I sew curtains, madam. I don’t take them down.", "Couper la générale juste avant mon solo ? Vous plaisantez !": "Cut the dress rehearsal just before my solo? You must be joking!", "Trou de mémoire": "A slip of memory", "Le livret du souffleur a disparu.": "The prompter’s script has disappeared.", "Il a été pris à {h}, {lieu}. Le coupable mêle le vrai et le faux, les trois autres disent vrai.": "It was taken at {h}, {lieu}. The culprit mixes truth and lies, the other three tell the truth.", "Mon livret ! Toutes les répliques de ce soir ! Sans lui, je souffle dans le vide !": "My script! All of tonight’s lines! Without it, I’m prompting into thin air!", "Le livret a disparu {lieu} à {h}. Quatre suspects, et le coupable dit vrai… parfois.": "The script disappeared {lieu} at {h}. Four suspects, and the culprit tells the truth… sometimes.", "Je voulais improviser, chéri. Le génie ne se souffle pas.": "I wanted to improvise, darling. Genius can’t be prompted.", "Et la poinçonneuse, c’était aussi du génie ?": "And the ticket punch, was that genius too?", "À la répétition suivante, tout l’orchestre joue faux.": "At the next rehearsal, the whole orchestra plays out of tune.", "« À 21 h 30, le régisseur et moi étions ensemble. Il me chronométrait. »": "“At 9:30 pm, the stage manager and I were together. He was timing me.”", "« Paulette a changé de pièce entre 21 h et 21 h 30. Elle me cherchait, forcément. »": "“Sally changed rooms between 9 pm and 9:30 pm. Looking for me, naturally.”", "« J’ai changé de pièce entre 21 h 30 et 22 h, pour une entrée triomphale. »": "“I changed rooms between 9:30 pm and 10 pm, for a triumphant entrance.”", "« Le régisseur n’a jamais mis les pieds dans les cintres. Il a le vertige. »": "“The stage manager never set foot in the flies. He’s afraid of heights.”", "« 22 h. Enzo et Paulette. Ensemble. Noté. »": "“10 pm. Enzo and Sally. Together. Noted.”", "« Enzo. Pas bougé. De 21 h à 21 h 30. »": "“Enzo. Didn’t move. 9 pm, 9:30 pm.”", "« Moi. Changé de pièce entre 21 h 30 et 22 h. »": "“Me. Changed rooms between 9:30 pm and 10 pm.”", "« Aria est passée par la fosse d’orchestre. Noté. »": "“Aria passed through the orchestra pit. Noted.”", "« 21 h 30. Paulette. Fosse d’orchestre. »": "“9:30 pm. Sally. Orchestra pit.”", "« À 20 h 30, le régisseur et moi étions ensemble, à chercher une épingle. »": "“At 8:30 pm, the stage manager and I were together, looking for a pin.”", "« Enzo n’a pas bougé à 20 h comme à 20 h 30 : il se regardait dans un miroir. »": "“Enzo stayed put at 8 pm and at 8:30 pm: he was looking at himself in a mirror.”", "« Je suis passée par la machinerie dans la soirée. Des paillettes partout, après. »": "“I passed through the machinery room during the evening. Sequins everywhere, afterwards.”", "« À 20 h 30, le régisseur et Paulette étaient ensemble. Je les ai vus, ma chère. »": "“At 8:30 pm, the stage manager and Sally were together. I saw them, darling.”", "« À 22 h, Enzo était sur la scène, à me voler la vedette. »": "“At 10 pm, Enzo was on the stage, stealing my limelight.”", "Le livret ? Je connais mon rôle par cœur, madame. Enfin… presque.": "The script? I know my part by heart, madam. Well… almost.", "Un livret ? Je ne lis que les plans de scène.": "A script? The only thing I read is stage plans.", "Je fais des ourlets, madame, pas des trous de mémoire.": "I make hems, madam, not memory gaps.", "Le diapason trafiqué": "The doctored tuning fork", "Le diapason de l’orchestre a été trafiqué.": "The orchestra’s tuning fork has been tampered with.", "Il a été limé à {h}, {lieu}. Tous les constats sont vrais. Énigme difficile : suppose, et cherche la contradiction.": "It was filed down at {h}, {lieu}. All the findings are true. A hard puzzle: suppose, and look for the contradiction.", "Tout l’orchestre est un demi-ton trop bas ! Je chante comme une casserole !": "The whole orchestra is a semitone flat! I sound like a saucepan!", "Le diapason a été limé {lieu} à {h}. Pas de témoignages ici, mais une énigme corsée.": "The tuning fork was filed {lieu} at {h}. No testimonies here, but a tough puzzle.", "Ce ténor chante trop haut ! Je voulais qu’il chante faux, juste une fois.": "That tenor sings too high! I wanted him to sing out of tune, just once.", "Résultat : tout le monde chante faux. Bravo, maestro.": "Result: everybody sings out of tune. Bravo, maestro.", "Cette nuit-là, une voix fantôme résonne dans l’opéra désert.": "That night, a ghostly voice echoes through the empty opera house.", "À 20 h, le maestro donnait ses dernières consignes à Enzo : ils se trouvaient dans la même pièce.": "At 8 pm, the maestro was giving Enzo his final instructions: they were in the same room.", "À 20 h, le régisseur et Sam se trouvaient dans la même pièce, à se disputer un projecteur.": "At 8 pm, the stage manager and Sam were in the same room, fighting over a spotlight.", "À 22 h, le maestro, le régisseur et Sam étaient dans la même pièce : une vraie réunion de crise, sans crise.": "At 10 pm, the maestro, the stage manager and Sam were in the same room: a proper crisis meeting, minus the crisis.", "À 21 h, Enzo était seul dans sa pièce, à s’admirer dans un miroir.": "At 9 pm, Enzo was alone in his room, admiring himself in a mirror.", "À 21 h 30, le maestro comme Enzo étaient seuls dans leur pièce : l’un battait la mesure, l’autre la contre-battait.": "At 9:30 pm, the maestro and Enzo were each alone in their room: one was beating time, the other beating against it.", "À 22 h 30, le maestro et le régisseur étaient chacun seuls dans leur pièce, à ruminer.": "At 10:30 pm, the maestro and the stage manager were each alone in their room, brooding.", "Le maestro a changé cinq fois de pièce : un chef d’orchestre ne tient pas en place.": "The maestro changed rooms five times: a conductor can’t keep still.", "Le régisseur a changé quatre fois de pièce : il court derrière chaque décor.": "The stage manager changed rooms four times: he runs after every piece of scenery.", "Sam a changé cinq fois de pièce : un souffleur sort de son trou plus souvent qu’on ne croit.": "Sam changed rooms five times: a prompter leaves his box more often than you’d think.", "À 21 h comme à 21 h 30, Enzo est resté dans la même pièce, à s’échauffer la voix.": "At 9 pm and at 9:30 pm, Enzo stayed in the same room, warming up his voice.", "À 21 h 30 comme à 22 h, le régisseur est resté dans la même pièce, à surveiller ses fils.": "At 9:30 pm and at 10 pm, the stage manager stayed in the same room, keeping an eye on his ropes.", "À 22 h comme à 22 h 30, Enzo est resté dans la même pièce, à soigner sa gorge.": "At 10 pm and at 10:30 pm, Enzo stayed in the same room, nursing his throat.", "À 21 h, le maestro n’était pas dans le parterre : on ne dirige pas un public.": "At 9 pm, the maestro was not in the stalls: you don’t conduct an audience.", "À 22 h 30, Sam n’était pas dans le foyer : on n’y souffle personne.": "At 10:30 pm, Sam was not in the foyer: there’s nobody to prompt there.", "Le maestro est passé par le parterre à un moment de la soirée, pour vérifier l’acoustique.": "The maestro passed through the stalls at some point in the evening, to check the acoustics.", "Le régisseur est passé par la loge de la diva à un moment de la soirée, pour réparer un miroir.": "The stage manager passed through the diva’s dressing room at some point in the evening, to repair a mirror.", "Enzo est passé par la machinerie, pour « vérifier l’écho ».": "Enzo passed through the machinery room, to “check the echo”.", "Trafiquer un diapason ? Je ne sais même pas lequel est le la.": "Tamper with a tuning fork? I don’t even know which one is the A.", "Moi, je souffle les paroles, madame. Pas les notes.": "I prompt words, madam. Not notes.", "Fausser l’orchestre ? Je chante assez faux tout seul, merci !": "Put the orchestra out of tune? I sing out of tune enough on my own, thank you!", "La voix des cintres": "The voice in the flies", "Une voix mystérieuse chante la nuit.": "A mysterious voice sings at night.", "On l’a entendue à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai.": "It was heard at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth.", "chant": "singing", "Une voix ! En pleine nuit ! Elle chante mieux que moi ! C’est forcément un fantôme !": "A voice! In the middle of the night! It sings better than I do! It must be a ghost!", "Les fantômes n’ont pas d’alibi. La voix venait {lieu} à {h}.": "Ghosts don’t have alibis. The voice was heard {lieu} at {h}.", "Trente ans que je baisse le rideau sur les autres. J’avais envie de chanter, moi aussi.": "Thirty years bringing the curtain down on everyone else. I wanted to sing too.", "Et vous chantez rudement bien, monsieur Rideau.": "And you sing jolly well, Mr Tenn.", "Soir de première. Un bouquet anonyme arrive pour la diva… avec une plume.": "Opening night. An anonymous bouquet arrives for the diva… with a feather.", "« À 20 h, le régisseur et moi étions ensemble. Il comptait les secondes, je comptais les paillettes. »": "“At 8 pm, the stage manager and I were together. He was counting seconds, I was counting sequins.”", "« À 20 h 30, Aria et moi étions ensemble. Retouches de dernière minute. »": "“At 8:30 pm, Aria and I were together. Last-minute alterations.”", "« Le régisseur n’a pas bougé à 21 h 30 comme à 22 h. Il surveillait ses cordes comme moi mes bobines. »": "“The stage manager stayed put at 9:30 pm and at 10 pm. He watched his ropes the way I watch my spools.”", "« … à 22 h, Aria et le régisseur étaient ensemble… elle répétait… il chronométrait… »": "“… at 10 pm, Aria and the stage manager were together… she was rehearsing… he was timing…”", "« … à 20 h comme à 20 h 30, je n’ai pas bougé… dans mon trou, comme toujours… »": "“… at 8 pm and at 8:30 pm I didn’t move… in my box, as always…”", "« … Paulette est passée par la fosse d’orchestre… »": "“… Sally passed through the orchestra pit…”", "« … quand la pendule a sonné dix coups, Aria était dans la machinerie… je l’ai entendue avant de la voir… »": "“… when the clock struck ten, Aria was in the machinery room… I heard her before I saw her…”", "« Je suis passée par les cintres dans la soirée. Pour l’acoustique, voyons. »": "“I passed through the flies during the evening. For the acoustics, naturally.”", "« À 22 h, Sam était dans la fosse d’orchestre. Il me soufflait des fausses notes. »": "“At 10 pm, Sam was in the orchestra pit. He was prompting me wrong notes.”", "« 21 h 30. Sam et Aria. Ensemble. »": "“9:30 pm. Sam and Aria. Together.”", "« 21 h 30. Sam et moi. Ensemble. Noté. »": "“9:30 pm. Sam and me. Together. Noted.”", "Chanter la nuit ? Je dors avec mes épingles, madame.": "Sing at night? I sleep with my pins, madam.", "Je chuchote, madame. Je ne chante jamais.": "I whisper, madam. I never sing.", "Si c’était moi, toute la ville l’aurait entendu, madame.": "If it had been me, the whole town would have heard it, madam.", "Bouquet final": "Grand finale", "Un bouquet du Hibou a été livré.": "A bouquet from the Owl has been delivered.", "Il a été déposé à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai.": "It was left at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth.", "la messagère": "the messenger", "livraison": "delivery", "Un bouquet de roses noires… et un mot : « Casino, minuit, le Hibou vous attend ».": "A bouquet of black roses… and a note: “Casino, midnight, the Owl awaits you”.", "Le bouquet a été déposé {lieu} à {h}. Six créneaux, et le coupable dit vrai à moitié.": "The bouquet was left {lieu} at {h}. Six time slots, and the culprit tells half the truth.", "Cette fois, je n’ai même pas couru. Le Hibou vous attend, Hortense. Il vous connaît bien.": "This time I didn’t even run. The Owl is waiting for you, Hortense. He knows you well.", "Il me connaît ? Alors je le connais aussi.": "He knows me? Then I know him too.", "Fin du chapitre 5. Minuit approche. Le Casino de Monte-Carlo brille de mille feux.": "End of chapter 5. Midnight approaches. The Monte Carlo Casino glitters with a thousand lights.", "« Paulette a changé de pièce entre 20 h et 20 h 30. Une habilleuse court toujours. »": "“Sally changed rooms between 8 pm and 8:30 pm. A dresser is always on the run.”", "« Lucie a changé de pièce entre 22 h et 22 h 30. Elle avait l’air pressée. »": "“Lucy changed rooms between 10 pm and 10:30 pm. She seemed in a hurry.”", "« Lucie est passée par la loge de la diva dans la soirée. Elle admirait mes affiches. »": "“Lucy passed through the diva’s dressing room during the evening. She was admiring my posters.”", "« À 20 h 30, j’étais dans la loge de la diva. Simple visite de courtoisie. »": "“At 8:30 pm I was in the diva’s dressing room. Just a courtesy call.”", "« Enzo n’a pas bougé à 20 h comme à 20 h 30. Il se contemplait. »": "“Enzo stayed put at 8 pm and at 8:30 pm. He was contemplating himself.”", "« Quand la pendule a sonné neuf coups, Enzo était dans les cintres. Il vocalisait pour les pigeons. »": "“When the clock struck nine, Enzo was in the flies. Singing scales to the pigeons.”", "« Enzo n’a pas bougé à 21 h 30 comme à 22 h. Ni de la mesure, d’ailleurs. »": "“Enzo stayed put at 9:30 pm and at 10 pm. Nor did he keep time, for that matter.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé. Le chef reste au pupitre. »": "“At 10 pm and at 10:30 pm I didn’t move. The conductor stays at his podium.”", "« Paulette n’a pas bougé à 22 h comme à 22 h 30. Fermata. »": "“Sally stayed put at 10 pm and at 10:30 pm. Fermata.”", "« Paulette a changé de pièce entre 21 h et 21 h 30. Allegro. »": "“Sally changed rooms between 9 pm and 9:30 pm. Allegro.”", "« Paulette n’a jamais mis les pieds au parterre. Le parterre, c’est pour le public. »": "“Sally never set foot in the stalls. The stalls are for the audience.”", "« À 22 h 30, Enzo était sur la scène. Hélas. »": "“At 10:30 pm, Enzo was on the stage. Alas.”", "« À 22 h, Enzo et le maestro étaient ensemble, à se disputer le tempo. »": "“At 10 pm, Enzo and the maestro were together, arguing about the tempo.”", "« À 21 h 30, Enzo et moi n’étions pas ensemble. Pour une fois, j’ai eu la paix. »": "“At 9:30 pm, Enzo and I were not together. For once, I had some peace.”", "« Le maestro n’a pas bougé à 20 h comme à 20 h 30. Il battait la mesure dans le vide. »": "“The maestro stayed put at 8 pm and at 8:30 pm. Beating time to nothing.”", "« Le maestro est passé par le parterre dans la soirée, en saluant des fauteuils vides. »": "“The maestro passed through the stalls during the evening, bowing to empty seats.”", "« À 21 h 30, Lucie était au parterre. Elle n’applaudissait personne. »": "“At 9:30 pm, Lucy was in the stalls. She wasn’t applauding anyone.”", "Des fleurs du Hibou ? On ne m’en offre déjà pas assez !": "Flowers from the Owl? I don’t get enough as it is!", "Je suis trop occupé à saluer, madame, pour livrer des bouquets.": "I’m far too busy taking bows, madam, to deliver bouquets.", "Je pique des fleurs sur les chapeaux, pas dans les loges.": "I pin flowers on hats, not in dressing rooms.", "Le Casino de Monte-Carlo": "The Monte Carlo Casino", "Rien ne va plus : le Hibou abat ses dernières cartes.": "Rien ne va plus: the Owl plays its last cards.", "Rien ne va plus": "Rien ne va plus", "La roulette a été truquée.": "The roulette wheel has been rigged.", "Le mécanisme a été modifié à {h}, {lieu}. Tous les constats sont vrais, mais il faudra tester des hypothèses.": "The mechanism was altered at {h}, {lieu}. All the findings are true, but you’ll have to test hypotheses.", "la tricheuse": "the cheat", "triche": "cheating", "Le Casino de Monte-Carlo. Ici, tout le monde a quelque chose à cacher. Surtout dans ses manches.": "The Monte Carlo Casino. Here, everyone has something to hide. Especially up their sleeves.", "La roulette est truquée ! Le 17 sort à chaque fois ! Rien ne va plus !": "The roulette is rigged! 17 comes up every time! Rien ne va plus!", "Le mécanisme a été trafiqué {lieu} à {h}. Énigme corsée.": "The mechanism was tampered with {lieu} at {h}. A tough puzzle.", "Le 17, c’est mon chiffre porte-bonheur. Je l’ai juste… un peu aidé.": "17 is my lucky number. I just… gave it a little help.", "Banco, madame. Vous avez perdu.": "All in, madam. And you’ve lost.", "Au comptoir de la caisse, on découvre des jetons en chocolat.": "At the cash desk, someone finds chocolate chips.", "À 21 h, René et Rémi étaient dans la même pièce : Rémi tentait d’emprunter une mise, René l’en dissuadait.": "At 9 pm, Noah and Remy were in the same room: Remy was trying to borrow a stake, Noah was talking him out of it.", "Le directeur et Bernadette n’étaient pas ensemble à 22 h 30 : elle évitait ses questions sur sa chance.": "The manager and Betty were not together at 10:30 pm: she was dodging his questions about her luck.", "À 21 h puis à 22 h, Bernadette était seule dans sa pièce, à embrasser ses dés porte-bonheur.": "At 9 pm and then at 10 pm, Betty was alone in her room, kissing her lucky dice.", "René a changé cinq fois de pièce : un croupier tourne autour de toutes les tables.": "Noah changed rooms five times: a croupier makes the rounds of every table.", "À 21 h comme à 21 h 30, Rémi est resté dans la même pièce : plus personne ne voulait lui prêter d’argent.": "At 9 pm and at 9:30 pm, Remy stayed in the same room: nobody would lend him money any more.", "Rémi a changé quatre fois de pièce : il cherchait un prêteur.": "Remy changed rooms four times: he was looking for a lender.", "Le directeur a changé cinq fois de pièce, toujours là où l’on n’avait pas besoin de lui.": "The manager changed rooms five times, always wherever he wasn’t needed.", "Bernadette a changé cinq fois de pièce, au gré de ses pressentiments.": "Betty changed rooms five times, following her hunches.", "À 22 h 30, Rémi n’était pas dans la salle de jeu : il n’avait plus de quoi y entrer.": "At 10:30 pm, Remy was not in the gaming room: he couldn’t afford to go in any more.", "À 21 h, personne dans le hall, sur la terrasse ni dans le salon privé.": "At 9 pm, nobody in the hall, on the terrace or in the private lounge.", "À 21 h 30, la terrasse était déserte : il pleuvait.": "At 9:30 pm, the terrace was deserted: it was raining.", "À 22 h, personne au bar américain : les verres restaient pleins, c’est tout dire.": "At 10 pm, nobody at the American bar: the glasses stayed full, which says it all.", "À 23 h 30, personne au bar américain, dans le hall ni dans le bureau.": "At 11:30 pm, nobody at the American bar, in the hall or in the office.", "Ni le directeur ni Bernadette n’ont jamais mis les pieds dans la caisse : ils préfèrent regarder l’argent de loin.": "Neither the manager nor Betty ever set foot in the cash desk: they prefer to look at money from a distance.", "René est passé par le salon privé à un moment de la soirée, pour servir une partie confidentielle.": "Noah passed through the private lounge at some point in the evening, to deal a confidential game.", "Rémi est passé par la caisse dans la soirée, en espérant qu’on l’y oublie.": "Remy passed through the cash desk during the evening, hoping they’d forget him there.", "Bernadette est passée par la terrasse et par le salon privé dans la soirée, pour chercher ses porte-bonheur.": "Betty passed through the terrace and the private lounge during the evening, looking for her lucky charms.", "Truquer ma propre roulette ? Rien ne va plus, madame, mais pas à ce point !": "Rig my own roulette wheel? Rien ne va plus, madam, but not to that extent!", "Si je savais truquer une roulette, madame, je ne serais pas fauché !": "If I knew how to rig a roulette wheel, madam, I wouldn’t be broke!", "Truquer mon casino ? Il gagne déjà tout seul, madame.": "Rig my casino? It already wins all by itself, madam.", "Jetons en chocolat": "Chocolate chips", "Les jetons de la caisse ont été remplacés.": "The chips in the cash desk have been swapped.", "Des jetons en chocolat ont pris la place des vrais à {h}, {lieu}. Les innocents disent vrai, le faussaire ment toujours. Difficile.": "Chocolate chips took the place of the real ones at {h}, {lieu}. The innocent tell the truth, the forger always lies. Hard.", "le faussaire": "the forger", "Des jetons en chocolat ! Dans MA caisse ! Ils fondent sur la table de black-jack !": "Chocolate chips! In MY cash desk! They’re melting on the blackjack table!", "L’échange a eu lieu {lieu} à {h}. Un menteur parmi quatre, et pas des plus faciles.": "The swap took place {lieu} at {h}. One liar among four, and not the easiest one.", "Faites vos jeux… ou plutôt, faites vos goûters. Le Hibou m’a promis une confiserie à Nice.": "Place your bets… or rather, place your snacks. The Owl promised me a sweet shop in Nice.", "Encore lui. Il est forcément ici, ce soir.": "Him again. He must be here tonight.", "Le directeur pose une minute sa mallette des recettes. Une minute de trop.": "The manager puts down his takings case for one minute. One minute too many.", "« À 22 h 30 comme à 23 h, je n’ai pas bougé. Dans MA maison, je surveille. »": "“At 10:30 pm and at 11 pm I didn’t move. In MY house, I keep watch.”", "« René est passé par le bureau dans la soirée. Mon bureau ! »": "“Noah passed through the office during the evening. My office!”", "« À 21 h 30, Rémi était dans le hall, à mendier une avance. »": "“At 9:30 pm, Remy was in the hall, begging for an advance.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé. J’étais en veine. »": "“At 10 pm and at 10:30 pm I didn’t move. I was on a winning streak.”", "« Le directeur n’a pas bougé à 23 h comme à 23 h 30. Je parie dix francs que c’est vrai. »": "“The manager stayed put at 11 pm and at 11:30 pm. I bet ten francs it’s true.”", "« Le directeur est passé par le salon privé dans la soirée. Dix contre un qu’il y comptait des billets. »": "“The manager passed through the private lounge during the evening. Ten to one he was counting banknotes there.”", "« Bernadette est passée par la terrasse, pour souffler sur ses dés. »": "“Betty passed through the terrace, to blow on her dice.”", "« Quand la pendule a sonné neuf coups, j’étais dans la salle de jeu. Évidemment. »": "“When the clock struck nine, I was in the gaming room. Obviously.”", "« À 22 h, Rémi et moi étions ensemble. Il m’a porté la poisse. »": "“At 10 pm, Remy and I were together. He brought me bad luck.”", "« À 22 h 30, le directeur et moi étions ensemble. Il m’a refusé un crédit. Le 17 lui en voudra. »": "“At 10:30 pm, the manager and I were together. He refused me credit. Number 17 will hold it against him.”", "« Le directeur n’a pas bougé à 21 h comme à 21 h 30. Collé à sa recette. »": "“The manager stayed put at 9 pm and at 9:30 pm. Glued to his takings.”", "« René n’a pas bougé à 21 h 30 comme à 22 h. Un croupier ne lâche pas sa table. »": "“Noah stayed put at 9:30 pm and at 10 pm. A croupier doesn’t leave his table.”", "« Rémi n’a jamais mis les pieds sur la terrasse. Il a peur du vent… et de ses créanciers. »": "“Remy never set foot on the terrace. He’s afraid of the wind… and of his creditors.”", "« Je suis passée par le salon privé dans la soirée. Banco ! »": "“I passed through the private lounge during the evening. All in!”", "« Quand la pendule a sonné neuf coups, j’étais dans le hall. J’ai touché la statue, pour la chance. »": "“When the clock struck nine, I was in the hall. I touched the statue, for luck.”", "« À 22 h 30, Rémi et Bernadette étaient ensemble. Rien ne va plus. »": "“At 10:30 pm, Remy and Betty were together. Rien ne va plus.”", "« À 22 h 30, Bernadette et moi étions ensemble aussi. Faites vos jeux. »": "“At 10:30 pm, Betty and I were together too. Place your bets.”", "« À 23 h 30, Rémi et moi n’étions pas ensemble. Les mauvais payeurs, je les évite. »": "“At 11:30 pm, Remy and I were not together. I avoid bad payers.”", "« Je n’ai jamais mis les pieds dans le salon privé. Les jeux sont faits. »": "“I never set foot in the private lounge. Les jeux sont faits.”", "« Quand la pendule a sonné onze coups, Rémi était dans la salle de jeu. Il misait ses boutons de manchette. »": "“When the clock struck eleven, Remy was in the gaming room. He was betting his cufflinks.”", "Des jetons en chocolat ? Je préfère les vrais, ils fondent moins vite.": "Chocolate chips? I prefer the real ones, they melt more slowly.", "Si c’était moi, madame, je les aurais mangés.": "If it were me, madam, I’d have eaten them.", "Je mise mes vrais jetons, ma chère. Le chocolat, je le mange.": "I bet my real chips, darling. Chocolate, I eat.", "La mallette du directeur": "The manager’s case", "La mallette du directeur a été vidée.": "The manager’s case has been emptied.", "Elle a été ouverte à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai.": "It was opened at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth.", "la voleuse": "the thief", "Ma mallette ! Les recettes de la soirée ! Et une plume de hibou, bien sûr !": "My case! The evening’s takings! And an owl feather, of course!", "Ouverte {lieu} à {h}. Le coupable mêle le vrai et le faux.": "Opened {lieu} at {h}. The culprit mixes truth and lies.", "D’accord, vous m’avez eue. Mais je n’ai jamais vu le visage du Hibou. Il porte toujours un masque… et une voilette.": "All right, you’ve caught me. But I’ve never seen the Owl’s face. He always wears a mask… and a veil.", "Une voilette ? Le Hibou serait… une femme ?": "A veil? Could the Owl be… a woman?", "À la table de baccara, les gains de Bernadette Banco s’envolent.": "At the baccarat table, Betty Allin’s winnings vanish into thin air.", "« À 23 h 30, René et moi étions ensemble. Il me porte chance. »": "“At 11:30 pm, Noah and I were together. He brings me luck.”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé : j’avais une main de rêve. »": "“At 9:30 pm and at 10 pm I didn’t move: I had a dream hand.”", "« Quand la pendule a sonné neuf coups, Lucie était sur la terrasse. Elle guettait la mer, cette chipie. »": "“When the clock struck nine, Lucy was on the terrace. Watching the sea, the little minx.”", "« À 22 h 30, Bernadette et moi étions ensemble. Elle perdait, je comptais. »": "“At 10:30 pm, Betty and I were together. She was losing, I was counting.”", "« Rémi n’a jamais mis les pieds dans le salon privé. On n’y fait pas crédit. »": "“Remy never set foot in the private lounge. No credit given there.”", "« Quand la pendule a sonné neuf coups, Bernadette et René étaient ensemble. Elle lui soufflait sur les doigts, pour la chance. »": "“When the clock struck nine, Betty and Noah were together. She was blowing on his fingers, for luck.”", "« À 23 h 30, Lucie et moi étions ensemble. Elle me doit de l’argent. Ou l’inverse. »": "“At 11:30 pm, Lucy and I were together. She owes me money. Or the other way round.”", "« Lucie n’a pas bougé à 21 h 30 comme à 22 h. Je l’aurais parié. D’ailleurs, je l’ai parié. »": "“Lucy stayed put at 9:30 pm and at 10 pm. I’d have bet on it. In fact, I did bet on it.”", "« René est passé par la terrasse dans la soirée, prendre l’air entre deux tours. »": "“Noah passed through the terrace during the evening, for some air between two spins.”", "« À 21 h 30, j’étais sur la terrasse, à prendre l’air. Et des paris. »": "“At 9:30 pm I was on the terrace, getting some air. And some bets.”", "« Quand la pendule a sonné dix coups, j’étais dans le hall. J’attendais quelqu’un de généreux. »": "“When the clock struck ten, I was in the hall. Waiting for someone generous.”", "« Quand la pendule a sonné onze coups, Lucie était dans la salle de jeu. Elle gagnait, évidemment. »": "“When the clock struck eleven, Lucy was in the gaming room. Winning, obviously.”", "« À 23 h, j’étais au bar américain. On y fait encore crédit. Enfin, on y faisait. »": "“At 11 pm I was at the American bar. They still give credit there. Well, they used to.”", "« À 22 h 30, Bernadette et Lucie n’étaient pas ensemble. Mesdames, les jeux sont faits. »": "“At 10:30 pm, Betty and Lucy were not together. Ladies, les jeux sont faits.”", "« Bernadette est passée par le bar américain. Rien ne va plus. »": "“Betty passed through the American bar. Rien ne va plus.”", "Vider une mallette ? Je préfère la remplir à la roulette.": "Empty a case? I’d rather fill it up at the roulette table.", "Si j’avais vidé une mallette, madame, je vous aurais payé un café !": "If I had emptied a case, madam, I’d have bought you a coffee!", "Je compte l’argent, madame. Je ne le déplace pas.": "I count money, madam. I don’t move it.", "Banco !": "All in!", "Les gains de Bernadette Banco ont disparu.": "Betty Allin’s winnings have disappeared.", "Ils ont été pris à {h}, {lieu}. Cinq suspects et des constats tous vrais.": "They were taken at {h}, {lieu}. Five suspects, and every finding is true.", "Mes gains ! Toute ma soirée ! Je les avais posés une seconde !": "My winnings! My whole evening! I only put them down for a second!", "Cinq suspects, dont deux vieilles connaissances. Les gains ont disparu {lieu} à {h}.": "Five suspects, two of them old acquaintances. The winnings disappeared {lieu} at {h}.", "Je suis serveur ici le samedi… Le monsieur, enfin la dame masquée, m’a encore donné un pourboire.": "I wait tables here on Saturdays… The masked gentleman, I mean the masked lady, gave me another tip.", "Ernest ! Depuis le train, vous travaillez pour elle ?": "Ernest! Have you been working for her ever since the train?", "Soudain, des centaines de plumes de hibou tombent du plafond.": "Suddenly, hundreds of owl feathers fall from the ceiling.", "Quand la pendule a sonné neuf coups, le directeur expliquait à Rémi pourquoi le casino ne fait pas crédit.": "When the clock struck nine, the manager was explaining to Remy why the casino doesn’t give credit.", "À 22 h, Ernest tendait un plateau à Rémi, qui a pris deux coupes. À 23 h, Ernest l’évitait : ils n’étaient plus ensemble.": "At 10 pm, Ernest held out a tray to Remy, who took two glasses. At 11 pm, Ernest was avoiding him: they were no longer together.", "À 22 h, le directeur faisait les honneurs du casino à Aria, qui vocalisait entre deux phrases.": "At 10 pm, the manager was showing Aria around the casino; she sang scales between sentences.", "Quand la pendule a sonné onze coups, le directeur et le croupier comptaient la recette.": "When the clock struck eleven, the manager and the croupier were counting the takings.", "René était seul à 21 h et à 22 h. Et à 21 h, il n’était pas dans la salle de jeu, contrairement à ses habitudes.": "Noah was alone at 9 pm and at 10 pm. And at 9 pm he was not in the gaming room, unusually for him.", "Rémi a changé trois fois de pièce. À 21 h 30, il était seul ; à 22 h 30 comme à 23 h, il n’a pas bougé.": "Remy changed rooms three times. At 9:30 pm he was alone; at 10:30 pm and at 11 pm he stayed put.", "Le directeur a changé quatre fois de pièce ; à 22 h 30, il était seul, à faire les cent pas.": "The manager changed rooms four times; at 10:30 pm he was alone, pacing up and down.", "Ernest a changé quatre fois de pièce, plateau en équilibre.": "Ernest changed rooms four times, tray balanced on his hand.", "René a changé quatre fois de pièce : un croupier va là où sont les jetons.": "Noah changed rooms four times: a croupier goes where the chips are.", "Aria a changé trois fois de pièce, en vocalisant à chaque porte.": "Aria changed rooms three times, singing scales at every door.", "Quand la pendule a sonné neuf coups, le hall et la caisse étaient vides.": "When the clock struck nine, the hall and the cash desk were empty.", "À 21 h 30, personne dans la salle de jeu : on changeait les tapis.": "At 9:30 pm, nobody in the gaming room: they were changing the baize.", "À 22 h 30, le salon privé était désert.": "At 10:30 pm, the private lounge was deserted.", "Les gains de Bernadette ? Je ne les ai jamais vus partir… c’est bien ça qui me surprend.": "Betty’s winnings? I never saw them leave… which is exactly what surprises me.", "Je ramasse les mises, madame. Pas les gains des clientes.": "I collect the stakes, madam. Not the customers’ winnings.", "Des gains ? Je ne sais même pas à quoi ça ressemble.": "Winnings? I don’t even know what they look like.", "Voler une joueuse ? Je préfère qu’on me jette des fleurs.": "Rob a gambler? I’d rather people threw flowers at me.", "Pluie de plumes": "A shower of feathers", "Une pluie de plumes a semé la panique.": "A shower of feathers has caused panic.", "Elles ont été lâchées à {h}, {lieu}. Les innocents disent vrai, le coupable ment toujours. Difficile.": "They were released at {h}, {lieu}. The innocent tell the truth, the culprit always lies. Hard.", "diversion": "diversion", "Des plumes partout ! Dans les cartes, dans les verres, dans ma moustache !": "Feathers everywhere! In the cards, in the glasses, in my moustache!", "Une diversion. Les plumes ont été lâchées {lieu} à {h}. Un menteur parmi quatre, et la comtesse elle-même témoigne.": "A diversion. The feathers were released {lieu} at {h}. One liar among four, and the countess herself is a witness.", "Elle m’a promis le premier rôle à la Scala. Une diva ne refuse pas la Scala.": "She promised me the lead role at La Scala. A diva doesn’t turn down La Scala.", "« Elle ». Vous avez dit « elle ».": "“She”. You said “she”.", "Pendant la confusion, le chapeau et le carnet d’Hortense disparaissent.": "In the confusion, Hortense’s hat and notebook disappear.", "« Aria n’a pas bougé à 22 h comme à 22 h 30, ma chère. Une diva, ça se pose. »": "“Aria stayed put at 10 pm and at 10:30 pm, darling. A diva likes to settle.”", "« Le directeur n’a pas bougé à 22 h 30 comme à 23 h. Il fait un très joli meuble, ma chère. »": "“The manager stayed put at 10:30 pm and at 11 pm. He makes a very pretty piece of furniture, darling.”", "« J’ai changé de pièce entre 22 h et 22 h 30. Une comtesse ne reste pas en place. »": "“I changed rooms between 10 pm and 10:30 pm. A countess never stays still.”", "« À 21 h 30, la comtesse et Rémi étaient ensemble. Il lui empruntait une broche, je crois. »": "“At 9:30 pm, the countess and Remy were together. He was borrowing a brooch from her, I believe.”", "« Quand la pendule a sonné onze coups, le directeur et moi étions ensemble. Il m’a offert des roses. »": "“When the clock struck eleven, the manager and I were together. He gave me roses.”", "« Le directeur n’a pas bougé à 21 h comme à 21 h 30. Il m’attendait, naturellement. »": "“The manager stayed put at 9 pm and at 9:30 pm. Waiting for me, naturally.”", "« Rémi a changé de pièce entre 21 h et 21 h 30. Il fuyait un créancier. Ou moi. »": "“Remy changed rooms between 9 pm and 9:30 pm. Fleeing a creditor. Or me.”", "« Je n’ai jamais mis les pieds dans le bureau. Mauvais pour la voix. »": "“I never set foot in the office. Bad for the voice.”", "« Rémi n’a jamais mis les pieds dans la salle de jeu. Il est guéri ! »": "“Remy never set foot in the gaming room. He’s cured!”", "« À 22 h 30, j’étais à la caisse, à échanger un autographe contre des jetons. »": "“At 10:30 pm I was at the cash desk, trading an autograph for chips.”", "« Quand la pendule a sonné onze coups, la comtesse était dans le bureau. Elle a tant d’affaires à régler. »": "“When the clock struck eleven, the countess was in the office. She has so much business to attend to.”", "« À 22 h 30, Rémi et moi étions ensemble. Il me réclamait une avance. Refusée. »": "“At 10:30 pm, Remy and I were together. He was asking me for an advance. Refused.”", "« À 23 h 30, Aria et Rémi étaient ensemble. Dans MA maison, je vois tout. »": "“At 11:30 pm, Aria and Remy were together. In MY house, I see everything.”", "« À 22 h 30, la comtesse et Aria n’étaient pas ensemble. Deux reines ne partagent pas un trône. »": "“At 10:30 pm, the countess and Aria were not together. Two queens don’t share a throne.”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé. Un directeur ne court pas : il règne. »": "“At 9:30 pm and at 10 pm I didn’t move. A manager doesn’t run: he reigns.”", "« Rémi n’a pas bougé à 21 h 30 comme à 22 h. Il attendait qu’on lui prête de l’argent. Il attend encore. »": "“Remy stayed put at 9:30 pm and at 10 pm. Waiting for someone to lend him money. He’s still waiting.”", "« J’ai changé de pièce entre 22 h et 22 h 30, pour une tournée d’inspection. »": "“I changed rooms between 10 pm and 10:30 pm, for a tour of inspection.”", "« Quand la pendule a sonné neuf coups, j’étais dans le hall, à accueillir mes clients. »": "“When the clock struck nine, I was in the hall, welcoming my guests.”", "« Quand la pendule a sonné onze coups, Rémi était dans le hall, à faire semblant de partir. »": "“When the clock struck eleven, Remy was in the hall, pretending to leave.”", "« À 23 h 30, j’étais au bar américain. Pour surveiller, naturellement. »": "“At 11:30 pm I was at the American bar. Keeping watch, naturally.”", "« À 22 h, la comtesse et Aria n’étaient pas ensemble. Je parie qu’elles se boudaient. »": "“At 10 pm, the countess and Aria were not together. I bet they were sulking.”", "« J’ai changé de pièce entre 22 h et 22 h 30. La chance tourne, il faut la suivre. »": "“I changed rooms between 10 pm and 10:30 pm. Luck turns; you have to follow it.”", "« Je n’ai jamais mis les pieds sur la terrasse. Le vent emporte les billets. »": "“I never set foot on the terrace. The wind blows the banknotes away.”", "« Aria est passée par le hall dans la soirée. On l’a entendue avant de la voir. »": "“Aria passed through the hall during the evening. We heard her before we saw her.”", "« La comtesse est passée par le salon privé. Forcément : il est privé. »": "“The countess passed through the private lounge. Of course: it’s private.”", "« À 23 h 30, la comtesse était dans le bureau. Elle aime les coffres, la comtesse. »": "“At 11:30 pm, the countess was in the office. She does like safes, the countess.”", "Des plumes ? Ma chère, je ne porte que des perles.": "Feathers? Darling, I only wear pearls.", "Semer la panique dans mon casino ? C’est mauvais pour les affaires, madame.": "Spread panic in my casino? Bad for business, madam.", "Des plumes ? Je dors sur un oreiller de paille, madame.": "Feathers? I sleep on a straw pillow, madam.", "Double jeu": "Double game", "Le chapeau et le carnet d’Hortense ont été volés.": "Hortense’s hat and notebook have been stolen.", "Ils ont été pris à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai.": "They were taken at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth.", "Mon chapeau ! Et mon carnet, encore ! On me les a pris {lieu} à {h}.": "My hat! And my notebook, again! They were taken from me {lieu} at {h}.", "Allons, ma chère Hortense, ce n’est qu’un chapeau.": "Come now, my dear Hortense, it’s only a hat.", "Je voulais protéger quelqu’un… Une personne de ma famille. Dans votre carnet, vous aviez presque deviné.": "I wanted to protect someone… Someone in my family. In your notebook, you had almost guessed.", "Votre famille, Rémi ? Vous n’avez qu’une tante.": "Your family, Remy? You only have an aunt.", "Gala de clôture. Les vraies Larmes de Lune sont exposées sous une cloche de verre… puis s’évaporent.": "Closing gala. The real Moon Tears are on display under a glass dome… then evaporate.", "« Quand la pendule a sonné neuf coups, Rémi et Bernadette étaient ensemble. Ils pariaient sur mes bijoux. »": "“When the clock struck nine, Remy and Betty were together. They were betting on my jewels.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé, ma chère Hortense. »": "“At 10 pm and at 10:30 pm I didn’t move, my dear Hortense.”", "« Bernadette n’a pas bougé à 22 h comme à 22 h 30 non plus. Elle couvait ses jetons, ma chère. »": "“Betty stayed put at 10 pm and at 10:30 pm as well. Brooding over her chips, darling.”", "« René est passé par le bar américain dans la soirée. Un croupier assoiffé, quelle tristesse. »": "“Noah passed through the American bar during the evening. A thirsty croupier, how sad.”", "« À 22 h, la comtesse et moi étions ensemble. Elle a misé sur le 17. »": "“At 10 pm, the countess and I were together. She bet on 17.”", "« À 23 h 30, la comtesse et Rémi étaient ensemble. Faites vos jeux, madame la comtesse. »": "“At 11:30 pm, the countess and Remy were together. Place your bets, Countess.”", "« La comtesse est passée par le bureau dans la soirée. Rien ne va plus, me suis-je dit. »": "“The countess passed through the office during the evening. Rien ne va plus, I said to myself.”", "« À 22 h 30, Rémi était dans le salon privé. Sans invitation. »": "“At 10:30 pm, Remy was in the private lounge. Without an invitation.”", "« Quand la pendule a sonné onze coups, Bernadette était sur la terrasse, à parler à la lune. »": "“When the clock struck eleven, Betty was on the terrace, talking to the moon.”", "« Je suis passé par la caisse dans la soirée. Pour regarder, seulement. »": "“I passed through the cash desk during the evening. Just to look.”", "« Quand la pendule a sonné onze coups, Bernadette était au bar américain. Je lui ai offert un verre. Avec son argent. »": "“When the clock struck eleven, Betty was at the American bar. I bought her a drink. With her money.”", "« Rémi n’a pas bougé à 23 h comme à 23 h 30. Il avait misé sa chemise. »": "“Remy stayed put at 11 pm and at 11:30 pm. He had bet his shirt.”", "« La comtesse n’a pas bougé à 23 h comme à 23 h 30 non plus. Elle portait chance au 17. »": "“The countess stayed put at 11 pm and at 11:30 pm as well. She was bringing 17 luck.”", "« René est passé par le salon privé dans la soirée. J’ai croisé les doigts. »": "“Noah passed through the private lounge during the evening. I crossed my fingers.”", "« À 22 h, j’étais au bar américain. Banco ! »": "“At 10 pm I was at the American bar. All in!”", "Votre chapeau ? Avec tout le respect que je vous dois, Hortense, il n’est pas à mon goût.": "Your hat? With all due respect, Hortense, it isn’t to my taste.", "Je ne vole pas de chapeaux, madame. Je ne les tire même pas.": "I don’t steal hats, madam. I don’t even tip them.", "Je joue gros, ma chère, mais pas avec vos affaires.": "I play for high stakes, darling, but not with your belongings.", "Le dernier vol du Hibou.": "The Owl’s last theft.", "Le collier a disparu à {h}, {lieu}. Le coupable mêle le vrai et le faux ; les autres disent vrai. Démasque le Hibou.": "The necklace disappeared at {h}, {lieu}. The culprit mixes truth and lies; the others tell the truth. Unmask the Owl.", "le Hibou": "the Owl", "dernier vol": "last theft", "Les Larmes de Lune étaient sous la cloche il y a une minute ! Elles ont disparu !": "The Moon Tears were under the dome a minute ago! They’ve disappeared!", "Dernière affaire. Le collier a disparu {lieu} à {h}. Le Hibou est parmi ces quatre-là. Et il mêle le vrai et le faux.": "Last case. The necklace disappeared {lieu} at {h}. The Owl is among these four. And mixes truth and lies.", "Bravo, ma chère Hortense. Oui, c’était moi. L’assurance paie très bien les colliers volés… et je m’ennuyais tellement à Paris.": "Bravo, my dear Hortense. Yes, it was me. The insurance pays very well for stolen necklaces… and I was so terribly bored in Paris.", "Vous avez volé votre propre collier, comtesse. Puis vous m’avez engagée pour le retrouver.": "You stole your own necklace, Countess. Then you hired me to find it.", "Il fallait bien quelqu’un d’intelligent pour rendre le jeu amusant.": "Somebody clever was needed to make the game amusing.", "Chapeau, comtesse. Mais la prison n’a pas de wagon-lit.": "Hats off, Countess. But prison has no sleeping car.", "FIN. L’Express de minuit repart vers Paris. Hortense Lafleur a enfin le temps de lire un bon roman policier.": "THE END. The Midnight Express sets off back to Paris. Hortense Bloom finally has time to read a good detective novel.", "« Aria n’a pas bougé à 21 h comme à 21 h 30, ma chère. Elle chauffait sa voix. »": "“Aria stayed put at 9 pm and at 9:30 pm, darling. She was warming up her voice.”", "« À 22 h 30, le directeur était dans le salon privé, ma chère. Il y fait ses petits comptes. »": "“At 10:30 pm, the manager was in the private lounge, darling. He does his little sums there.”", "« Aria n’a pas bougé à 21 h comme à 21 h 30. Je l’aurais parié. »": "“Aria stayed put at 9 pm and at 9:30 pm. I’d have bet on it.”", "« Le directeur a changé de pièce entre 22 h 30 et 23 h. Il trottait comme un caniche. »": "“The manager changed rooms between 10:30 pm and 11 pm. Trotting about like a poodle.”", "« À 22 h 30, Aria et moi étions ensemble. Elle m’a chanté du Puccini. Gratuitement ! »": "“At 10:30 pm, Aria and I were together. She sang me some Puccini. For free!”", "« Rémi n’a pas bougé à 21 h comme à 21 h 30. Il guettait quelque chose. »": "“Remy stayed put at 9 pm and at 9:30 pm. He was watching for something.”", "« Aria n’a pas bougé à 22 h comme à 22 h 30. Dans MA maison, les divas se posent. »": "“Aria stayed put at 10 pm and at 10:30 pm. In MY house, divas settle down.”", "« La comtesse n’a pas bougé à 22 h 30 comme à 23 h. Une cliente modèle. »": "“The countess stayed put at 10:30 pm and at 11 pm. A model guest.”", "« Aria est passée par le salon privé dans la soirée. Elle y a laissé son parfum. »": "“Aria passed through the private lounge during the evening. She left her perfume there.”", "« À 23 h 30, Rémi et moi étions ensemble. Il m’a demandé un autographe… pour le revendre. »": "“At 11:30 pm, Remy and I were together. He asked me for an autograph… to sell it on.”", "« Le directeur n’a pas bougé à 21 h comme à 21 h 30. Il m’écoutait chanter, j’imagine. »": "“The manager stayed put at 9 pm and at 9:30 pm. Listening to me sing, I imagine.”", "« Quand la pendule a sonné neuf coups, le directeur était sur la terrasse, à fumer son cigare. »": "“When the clock struck nine, the manager was on the terrace, smoking his cigar.”", "« À 23 h 30, Rémi était dans le hall, à mendier un dernier jeton. »": "“At 11:30 pm, Remy was in the hall, begging for one last chip.”", "« À 23 h 30, le directeur était à la caisse, à recompter ses sous. »": "“At 11:30 pm, the manager was at the cash desk, recounting his pennies.”", "« À 23 h 30, la comtesse était dans la salle de jeu. Fraîche comme une rose. »": "“At 11:30 pm, the countess was in the gaming room. As fresh as a daisy.”", "Moi, le Hibou ? Je suis à peine capable d’être un moineau, madame.": "Me, the Owl? I can barely manage to be a sparrow, madam.", "Le Hibou ? Il m’a déjà coûté mes Larmes de Lune, madame !": "The Owl? He has already cost me my Moon Tears, madam!", "Je suis un rossignol, madame, je vous l’ai déjà dit !": "I’m a nightingale, madam, I’ve told you before!", "Accuser le directeur ? Dans son propre hôtel ? Quel manque de savoir-vivre.": "Accuse the manager? In his own hotel? How terribly ill-mannered.", "Je fais les lits, pas les mauvais coups.": "I make beds, not mischief.", "Je porte les bagages, pas les accusations !": "I carry luggage, not accusations!", "Je secoue des shakers, pas des coffres-forts.": "I shake cocktails, not safes.", "Ma chère, je n’ai jamais rien volé. On me l’offre, nuance.": "Darling, I have never stolen a thing. People give it to me. There’s a difference.", "Mamma mia ! Je suis innocent comme un risotto !": "Mamma mia! I’m as innocent as a risotto!", "Moi ? Je n’ai rien vu, rien entendu… et je n’ai rien fait.": "Me? I saw nothing, heard nothing… and did nothing.", "J’arrache les mauvaises herbes, pas les objets de valeur.": "I pull up weeds, not valuables.", "J’étais à mes fourneaux. Demandez donc à mes carottes.": "I was at my stove. Ask my carrots.", "Accusez-moi encore, et je vous jette un regard noir.": "Accuse me again and I’ll give you a filthy look.", "Un majordome ne vole pas, madame. Il débarrasse.": "A butler doesn’t steal, madam. He clears away.", "Mon diagnostic : vous faites fausse route.": "My diagnosis: you’re barking up the wrong tree.", "Mille sabords… euh, mille regrets : ce n’est pas moi !": "Shiver me timbers… er, shiver me regrets: it wasn’t me!", "J’étais dans le cambouis jusqu’aux oreilles !": "I was up to my ears in engine grease!", "Je ne joue que du piano, pas la comédie.": "I play the piano, not the fool.", "Si j’avais fait le coup, ma chère, vous ne l’auriez jamais deviné.": "If I had done it, darling, you would never have guessed.", "Moi ? Je suis ténor, pas voleur ! Do de poitrine, main sur le cœur !": "Me? I’m a tenor, not a thief! High C from the chest, hand on heart!", "Vous jouez faux, madame l’enquêtrice.": "You’re playing out of tune, Madam Detective.", "Je couds des paillettes, je ne découds pas les alibis.": "I sew on sequins, I don’t unpick alibis.", "Je baisse le rideau, pas les bras.": "I lower the curtain, not my guard.", "J’en ai le souffle coupé !": "It takes my breath away!", "Faites vos jeux, madame… mais pas avec moi.": "Place your bets, madam… but not on me.", "Je dirige ce casino. Je ne le vole pas, je le ruine légalement.": "I run this casino. I don’t rob it, I ruin it legally.", "Je joue gros, mais je joue honnête !": "I play for high stakes, but I play fair!"});
</script>
<script>/* Effets sonores synthétisés (WebAudio, aucun fichier) : composteur, coq, Big Ben, jeu. */
(function () {
  var ctx = null, master = null, on = true, vol = 0.7;
  try { on = localStorage.getItem('kioukan.sound') !== 'off'; var sv = parseFloat(localStorage.getItem('kioukan.volume')); if (sv >= 0 && sv <= 1) vol = sv; } catch (e) { /* rien */ }
  function ac() {
    if (!ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = 0.8 * vol; master.connect(ctx.destination); setTimeout(decodeAll, 0);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function osc(type, f0, f1, t, dur, peak, dest) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, Math.min(0.01, dur / 3), peak, dur); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, peak, f, q, type) {
    var n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    env(g, t, 0.002, peak, dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
  }

  /* vrais enregistrements : chargés à la demande, décodés au premier usage */
  var SAMPLES = { tic: 'audio/tic.mp3', flip: 'audio/flip.mp3', bonus: 'audio/bonus.mp3', coin: 'audio/coin.mp3', tear: 'audio/tear.mp3', malus: 'audio/malus.mp3', forbid: 'audio/forbid.mp3', ok: 'audio/ok.mp3', ko: 'audio/ko.mp3', victory: 'audio/victory.mp3' }, bufs = {}, raw = {};
  /* nom du jeu -> [échantillon, gain] ; sans échantillon prêt, on retombe sur la version synthétisée */
  var MAP = { tick: ['tic', 0.9], flip: ['flip', 0.6], pick: ['bonus', 0.55], hint: ['coin', 0.8], erase: ['tear', 0.7], win: ['ok', 0.8], wrong: ['ko', 0.8], malus: ['malus', 0.7], forbid: ['forbid', 0.7], victory: ['victory', 0.8] };
  function sampleLoad(name) {
    if (raw[name] || !SAMPLES[name] || !window.fetch) return;
    raw[name] = fetch(SAMPLES[name]).then(function (r) { return r.arrayBuffer(); }).catch(function () { return null; });
  }
  function decodeAll() {
    Object.keys(SAMPLES).forEach(function (n) {
      sampleLoad(n);
      raw[n].then(function (ab) { if (!ab || bufs[n]) return null; return new Promise(function (ok, ko) { ctx.decodeAudioData(ab.slice(0), ok, ko); }); })
        .then(function (b) { if (b) bufs[n] = b; }).catch(function () { /* rien */ });
    });
  }
  function samplePlay(name, gain) {
    sampleLoad(name);
    var go = function (b) { var s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = b; g.gain.value = gain || 1; s.connect(g); g.connect(master); s.start(); };
    if (bufs[name]) { go(bufs[name]); return; }
    raw[name].then(function (ab) { if (!ab) return null; return new Promise(function (ok, ko) { ctx.decodeAudioData(ab.slice(0), ok, ko); }); })
      .then(function (b) { if (b) { bufs[name] = b; go(b); } }).catch(function () { /* rien */ });
  }
  var S = {
    /* composteur de billet : clic métallique, coup sourd, petit tintement */
    punch: function (t) {
      noise(t, 0.03, 0.9, 3200, 3);
      osc('sine', 190, 55, t + 0.01, 0.11, 0.9);
      noise(t + 0.012, 0.05, 0.5, 900, 1.2);
      osc('triangle', 2900, 2600, t + 0.05, 0.22, 0.12);
      osc('triangle', 4300, 4100, t + 0.05, 0.14, 0.06);
    },
    click: function (t) { noise(t, 0.02, 0.35, 2400, 2); osc('sine', 900, 600, t, 0.04, 0.12); },
    tick: function (t) { noise(t, 0.015, 0.3, 3000, 4); osc('square', 1500, 1500, t, 0.02, 0.04); },
    pick: function (t) { osc('triangle', 520, 780, t, 0.09, 0.22); osc('sine', 1040, 1040, t + 0.03, 0.08, 0.08); },
    hint: function (t) { osc('sine', 880, 880, t, 0.16, 0.2); osc('sine', 1320, 1320, t + 0.09, 0.28, 0.16); },
    erase: function (t) { noise(t, 0.12, 0.25, 1800, 0.7, 'highpass'); },
    accuse: function (t) { osc('sawtooth', 220, 220, t, 0.28, 0.12); osc('sawtooth', 277, 277, t, 0.28, 0.1); osc('sawtooth', 330, 330, t, 0.28, 0.09); },
    wrong: function (t) { osc('sawtooth', 160, 110, t, 0.38, 0.28); osc('square', 150, 100, t + 0.02, 0.34, 0.1); },
    win: function (t) {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { osc('triangle', f, f, t + i * 0.1, 0.5, 0.2); osc('sine', f * 2, f * 2, t + i * 0.1, 0.4, 0.06); });
      noise(t + 0.45, 0.4, 0.12, 6000, 1, 'highpass');
    }
  };

  var DUR = {};
  window.KSFX = {
    play: function (name) {
      if (!on || vol <= 0 || !S[name]) return;
      var c = ac(); if (!c) return;
      var m = MAP[name];
      if (m) { sampleLoad(m[0]); if (bufs[m[0]]) { samplePlay(m[0], m[1]); return; } if (!S[name]) { samplePlay(m[0], m[1]); return; } }
      try { S[name](c.currentTime + 0.01); } catch (e) { /* rien */ }
    },
    force: function (name) { var c = ac(); if (!c) return; var m = MAP[name]; if (m && (bufs[m[0]] || !S[name])) { samplePlay(m[0], m[1]); return; } if (S[name]) { try { S[name](c.currentTime + 0.01); } catch (e) { /* rien */ } } },
    dur: function (name) { return (DUR[name] || 0.4) * 1000; },
    preload: function (name) { sampleLoad(name); },
    preloadAll: function () { for (var k in SAMPLES) sampleLoad(k); },
    isOn: function () { return on && vol > 0; },
    vol: function () { return vol; },
    setVol: function (v) { vol = Math.max(0, Math.min(1, v)); if (vol > 0 && !on) on = true; if (master) master.gain.value = 0.8 * vol; try { localStorage.setItem('kioukan.volume', String(vol)); localStorage.setItem('kioukan.sound', on ? 'on' : 'off'); } catch (e) { /* rien */ } sync(); },
    set: function (v) { on = !!v; if (on && vol <= 0) vol = 0.7; if (master) master.gain.value = 0.8 * vol; try { localStorage.setItem('kioukan.sound', on ? 'on' : 'off'); localStorage.setItem('kioukan.volume', String(vol)); } catch (e) { /* rien */ } sync(); if (on) window.KSFX.play('click'); }
  };

  var ICON_ON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  function sync() {
    var b = document.querySelectorAll('[data-sound-toggle]'), fr = window.KIOUKAN_LANG !== 'en', muted = !on || vol <= 0;
    for (var i = 0; i < b.length; i++) {
      b[i].innerHTML = muted ? ICON_OFF : ICON_ON;
      b[i].setAttribute('aria-expanded', b[i].parentNode.classList.contains('open') ? 'true' : 'false');
      b[i].setAttribute('aria-label', fr ? 'Réglages du son' : 'Sound settings');
      b[i].title = b[i].getAttribute('aria-label');
      var w = b[i].parentNode, r = w.querySelector('.snd-range'), m = w.querySelector('.snd-mute');
      if (r) { r.value = Math.round(vol * 100); r.setAttribute('aria-label', fr ? 'Volume' : 'Volume'); }
      if (m) m.textContent = fr ? (muted ? 'Activer le son' : 'Couper le son') : (muted ? 'Turn sound on' : 'Mute');
    }
  }
  function build() {
    var b = document.querySelectorAll('[data-sound-toggle]');
    for (var i = 0; i < b.length; i++) {
      (function (btn) {
        var w = document.createElement('span'); w.className = 'sndwrap';
        btn.parentNode.insertBefore(w, btn); w.appendChild(btn);
        var pop = document.createElement('div'); pop.className = 'sndpop'; pop.hidden = true;
        pop.innerHTML = '<input type="range" class="snd-range" min="0" max="100" step="5"><button type="button" class="snd-mute"></button>';
        w.appendChild(pop);
        btn.setAttribute('aria-haspopup', 'true');
        btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pop.hidden = !pop.hidden; w.classList.toggle('open', !pop.hidden); sync(); if (!pop.hidden) window.KSFX.force('click'); });
        var r = pop.querySelector('.snd-range');
        r.addEventListener('input', function () { window.KSFX.setVol(r.value / 100); });
        r.addEventListener('change', function () { window.KSFX.play('pick'); });
        pop.querySelector('.snd-mute').addEventListener('click', function (e) { e.stopPropagation(); window.KSFX.set(!(on && vol > 0)); });
        pop.addEventListener('click', function (e) { e.stopPropagation(); });
        document.addEventListener('click', function () { if (!pop.hidden) { pop.hidden = true; w.classList.remove('open'); sync(); } });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { pop.hidden = true; w.classList.remove('open'); btn.focus(); sync(); } });

    build(); sync(); window.KSFX.preloadAll();
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target : null; if (!t) return;

      }
      var act = t.closest('[data-act]');
      if (act) {
        var a = act.getAttribute('data-act');
        var map = { cell: 'tick', clear: 'erase', reset: 'erase', hint: 'hint', accuse: 'accuse', time: 'tick', liar: 'tick', next: 'punch', ep: 'punch', new: 'punch', skip: 'click', replay: 'click', list: 'flip', share: 'pick', close: 'click', check: 'click' };
        if (map[a]) window.KSFX.play(map[a]);
      } else if (t.closest('.btn, .navbtn, button')) { if (!t.closest('.ld-list, .acc-btn')) window.KSFX.play('click'); }
    }, true);
  });
})();

body{background:var(--bg);font-family:var(--sans)}

/* navigation */
.topnav{max-width:1040px;margin:0 auto 14px;display:flex;gap:18px;align-items:center;font:600 13px var(--sans)}
.navbtn{color:var(--ink);text-decoration:none;border-bottom:1.5px solid transparent;padding:6px 0;transition:transform .18s cubic-bezier(.3,1.6,.5,1),color .15s,border-color .15s}

/* titres */
.logo,h1,.lvl-title,.demo-end h3{font-family:var(--display)!important;font-weight:400!important;font-style:normal!important}
h1,.logo{letter-spacing:-.01em;color:var(--ink);text-shadow:none}
h1::after,.logo::after{content:".";color:var(--accent)}
.lvl-title{letter-spacing:0;font-size:32px;line-height:1.05}
.motto{font-family:var(--display);font-style:normal}
.collection,.mode-tag,.kicker,.lvl-title span{font-family:var(--sans)!important;font-weight:600!important;letter-spacing:.16em!important}
.label,h2.label{font:600 12px var(--sans)!important;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2)}
details.panel>summary{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);cursor:pointer}

/* panneaux : filet noir en haut, le reste léger */
.panel,.card,.mode,.fiche,details{border:1px solid var(--line)!important;border-top:3px solid var(--ink)!important;border-radius:0!important;box-shadow:none!important}
select,.lvl-select,.ep-picker{border:1px solid var(--ink)!important;border-radius:0!important;box-shadow:none!important}
.scene{border:0!important;border-radius:0!important}

/* boutons */
button,.btn,a.btn{border:1.5px solid var(--ink)!important;border-radius:0!important;box-shadow:none!important;font-family:var(--sans);font-weight:600;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .15s,color .15s,box-shadow .15s}
button:not(:disabled):not(.time):not(.ep-btn):hover,button:not(:disabled):not(.time):not(.ep-btn):focus-visible,.btn:hover,a.btn:hover,.btn:focus-visible{transform:translate(-2px,-3px);box-shadow:4px 5px 0 var(--accent)!important}

button.primary,.btn.primary{background:var(--btn);border-color:var(--btn)!important;color:var(--btn-ink)}

.seg button{margin:0}
.pcard{border:0!important;border-radius:0!important;box-shadow:none!important}
.mini{border:2px solid var(--ink)!important}

/* carnet */
.clue{border-top:1px solid var(--line)!important}
.clue.rule .txt{font-weight:600;border-left:3px solid var(--accent);padding-left:10px}

/* démo */

<script>Object.assign(window.KIOUKAN_EN || (window.KIOUKAN_EN = {}), {"« À 19 h, le docteur était au jardin, à respirer « le bon air » à pleins poumons. »": "“At 7 pm, the doctor was in the garden, breathing in ‘the good air’ by the lungful.”", "« À 21 h, Marcel était dans la coursive. Un mécanicien hors de sa salle des machines : quel rebondissement ! »": "“At 9 pm, Rusty was in the gangway. A mechanic out of his engine room: what a twist!”", "« À 20 h, Lucie était dans la salle à manger, à se goinfrer de homard ! »": "“At 8 pm, Lucy was in the dining room, stuffing herself with lobster!”", "« À 21 h 30, j’étais sur la scène, à répéter mon grand air. »": "“At 9:30 pm, I was on the stage, rehearsing my big aria.”", "« À 22 h, Enzo était sur la scène. Hélas. »": "“At 10 pm, Enzo was on the stage. Alas.”", "« À 22 h, Rémi était au bar américain, à mendier une avance. »": "“At 10 pm, Remy was at the American bar, begging for an advance.”", "« À 21 h, j’étais dans le hall, à guetter les gros joueurs. Et leurs pourboires. »": "“At 9 pm, I was in the hall, watching for the high rollers. And their tips.”", "Le contrôleur est passé par le salon-fumoir dans la soirée, pour poinçonner les cigares.": "The conductor passed through the smoking lounge during the evening, to punch the cigars.", "« À 20 h, il n’y avait personne à la cave. Je l’atteste. »": "“At 8 pm, there was nobody in the cellar. I can attest to it.”", "« Je suis passé par la salle des machines dans la soirée. Forcément. »": "“I passed through the engine room during the evening. Obviously.”", "« À 20 h, Lucie et moi étions dans la même pièce. Elle m’a demandé comment on arrête un moteur. »": "“At 8 pm, Lucy and I were in the same room. She asked me how you stop an engine.”", "Marcel n’a jamais mis les pieds dans la salle à manger : trop de nappes blanches pour ses mains pleines de cambouis.": "Rusty never set foot in the dining room: too many white tablecloths for his greasy hands.", "« Je n’ai pas bougé à 20 h 30 comme à 21 h : je faisais mes vocalises. »": "“I didn’t move at 8:30 pm and at 9 pm: I was doing my vocal exercises.”", "« Sam est passé par la scène dans la soirée. Il cherchait son trou, je suppose. »": "“Sam passed through the stage during the evening. Looking for his box, I suppose.”", "« À 21 h, il n’y avait personne en coulisses. J’y ai cherché un public, en vain. »": "“At 9 pm, there was nobody in the wings. I looked for an audience there, in vain.”", "« À 21 h, la fosse d’orchestre était vide. Les musiciens prenaient leur pause. »": "“At 9 pm, the orchestra pit was empty. The musicians were on their break.”", "« Le régisseur a changé de pièce entre 20 h 30 et 21 h. Une corde à surveiller, sans doute. »": "“The stage manager changed rooms between 8:30 pm and 9 pm. A rope to keep an eye on, no doubt.”", "« À 21 h, personne dans la fosse d’orchestre. J’y ai ramassé trois boutons. »": "“At 9 pm, nobody in the orchestra pit. I picked up three buttons there.”", "« Sam n’a pas bougé à 21 h comme à 21 h 30. Il révisait son livret. »": "“Sam stayed put at 9 pm and at 9:30 pm. He was going over his script.”", "« Et Enzo n’a pas bougé à 22 h comme à 22 h 30. Il saluait. Longuement. »": "“And Enzo stayed put at 10 pm and at 10:30 pm. He was taking his bows. At length.”", "« À 21 h 30, il n’y avait personne au bar américain. J’ai dû me servir moi-même. »": "“At 9:30 pm, there was nobody at the American bar. I had to serve myself.”", "« À 21 h 30, Rémi et moi n’étions pas ensemble. Il porte la poisse. »": "“At 9:30 pm, Remy and I were not together. He brings bad luck.”"});</script>
<script>/* Campagne 2 : textes anglais (clé = texte français) et noms anglais des nouveaux personnages. */
