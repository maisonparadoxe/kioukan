  Object.assign(window.KIOUKAN_EN || (window.KIOUKAN_EN = {}), {"Le Palais de justice":"The Law Courts","Paris, six mois après Monte-Carlo. Le procès de la Comtesse s’achève, et Hortense hérite d’un adjoint très poli.":"Paris, six months after Monte Carlo. The Countess’s trial is ending, and Hortense inherits a very polite assistant.","L’Hôtel Drouot":"The Hôtel Drouot","Paris, la salle des ventes. Ici, tout se vend. Même les secrets. Et pour la première fois, il y a un mort.":"Paris, the auction house. Everything is for sale here. Even secrets. And for the first time, there is a body.","Le château de Montfaucon":"Montfaucon Castle","Sologne. Des portraits, des armures… et des passages que tout le monde ne connaît pas.":"Sologne. Portraits, suits of armour… and passages that not everyone knows about.","Le train de nuit pour Venise":"The night train to Venice","Paris – Venise en voiture-lits. Dans le noir des tunnels, on assomme plus vite qu’on ne poinçonne.":"Paris – Venice by sleeper. In the dark of the tunnels, people get knocked out faster than tickets get punched.","Le carnaval de Venise":"The Venice Carnival","Des masques, des gondoles, deux jumelles… et une arme qui ne se trouve pas toujours là où on frappe.":"Masks, gondolas, twin sisters… and a weapon that is not always where the blow falls.","L’hospice du Grand-Col":"The Grand-Col hospice","Bloqués par la neige dans les Alpes. Puis la lumière s’éteint, et plus personne ne voit rien.":"Snowed in high in the Alps. Then the lights go out, and nobody can see a thing.","La banque de Genève":"The Geneva bank","Une banque suisse où chaque porte a sa serrure, et chaque serrure sa clé.":"A Swiss bank where every door has its lock, and every lock its key.","Le musée de cire":"The wax museum","Retour à Paris. Dans ce musée, on sait toujours où le crime a eu lieu. Jamais quand.":"Back in Paris. In this museum, we always know where the crime happened. Never when.","La Dernière Vente":"The Final Sale","Retour à Drouot. Toutes les règles à la fois, et un dernier mensonge à démasquer.":"Back to Drouot. Every rule at once, and one last lie to unmask.","Le marteau de la juge":"The judge’s gavel","Paris, six mois après Monte-Carlo.":"Paris, six months after Monte Carlo.","Le procès de la Comtesse Diane de Carat touche à sa fin.":"The trial of Countess Diana Carat is drawing to a close.","Mon marteau ! Mon marteau d’audience a disparu ! Comment voulez-vous que je rende la justice sans taper sur quelque chose ?":"My gavel! My courtroom gavel is gone! How am I supposed to deliver justice without hitting something?","Inspecteur Armand Songe, de la Sûreté. On m’a chargé de vous seconder, madame Lafleur. C’est un honneur.":"Inspector Philip Fibbs, of the Sûreté. I have been assigned to assist you, Mrs Bloom. It is an honour.","Un nouveau venu. Très poli.":"A newcomer. Very polite.","Le marteau a été pris {lieu} à {h}. Le voleur y était seul. Au travail, inspecteur.":"The gavel was taken {lieu} at {h}. The thief was alone there. To work, Inspector.","Je voulais juste l’emprunter. Pour faire monter les enchères quand ils vendront les bijoux de ma tante. Adjugé, vendu… à moi !":"I only wanted to borrow it. To push the bidding up when they sell my aunt’s jewels. Going, going… gone to me!","Rendez ce marteau, Rémi. On ne rachète pas le collier de sa tante avec un marteau volé.":"Give back that gavel, Remy. You don’t buy back your aunt’s necklace with a stolen gavel.","Le verdict tombe : la Comtesse est condamnée.":"The verdict falls: the Countess is convicted.","Ses bijoux seront vendus aux enchères à l’Hôtel Drouot, au profit des assurances.":"Her jewels will be auctioned at the Hôtel Drouot, to repay the insurers.","Le marteau de la juge a disparu.":"The judge’s gavel has disappeared.","Il a été pris à {h}, {lieu}, par la seule personne présente. Trois personnes rôdaient au Palais cet après-midi-là.":"It was taken at {h}, {lieu}, by the only person there. Three people were lurking around the Law Courts that afternoon.","le voleur":"the thief","vol":"theft","Le collier sous scellés":"The sealed necklace","Les scellés ! Quelqu’un a ouvert la boîte du collier au greffe ! Je suis le notaire chargé de la vente, on va m’accuser !":"The seals! Someone opened the necklace box in the clerk’s office! I’m the notary in charge of the sale, they’ll blame me!","Rassurez-vous, maître : le collier est toujours là. Mais quelqu’un a brisé les scellés {lieu} à {h}. Et il était seul.":"Don’t worry, Mr Nott: the necklace is still there. But someone broke the seals {lieu} at {h}. And they were alone.","Mettez-moi sur la liste, madame Lafleur. La règle est la même pour tout le monde.":"Put me on the list, Mrs Bloom. The rule is the same for everyone.","Je voulais juste le voir, ce collier. Trente ans que je garde des voleurs, et je n’avais jamais vu ce qu’ils volaient.":"I just wanted to see it, that necklace. Thirty years guarding thieves, and I’d never seen what they stole.","Ma chère Hortense. Vous croyez vraiment que j’étais seule ?":"My dear Hortense. Do you really think I was working alone?","Au parloir, quelques minutes plus tard.":"In the visiting room, a few minutes later.","Que voulez-vous dire, comtesse ?":"What do you mean, Countess?","La Comtesse ne répond pas. Elle sourit.":"The Countess doesn’t answer. She smiles.","Dans le couloir flotte un léger parfum de violette.":"In the corridor hangs a faint scent of violets.","Les scellés du collier ont été brisés.":"The seals on the necklace have been broken.","Quelqu’un a ouvert la boîte des Larmes de Lune à {h}, {lieu}. Il y était seul. L’inspecteur Songe a tenu à figurer parmi les suspects.":"Someone opened the Moon Tears box at {h}, {lieu}. They were alone there. Inspector Fibbs insisted on being one of the suspects.","le coupable":"the culprit","méfait":"misdeed","Adjugé, assassiné":"Going, going, murdered","L’Hôtel Drouot, la veille de la grande vente.":"The Hôtel Drouot, the day before the big sale.","Maître Adjugé Vandu, le commissaire-priseur, prépare le catalogue.":"Master Hammond Down, the auctioneer, is preparing the catalogue.","À la fermeture, on le retrouve sans vie.":"At closing time, he is found dead.","Cette fois, ce n’est plus un vol, inspecteur. C’est un meurtre.":"This time it’s not a theft, Inspector. It’s murder.","Maître Vandu a été frappé {lieu} à {h}. Son assassin était seul avec lui.":"Mr Down was struck {lieu} at {h}. His killer was alone with him.","Nouveau : la victime a sa ligne dans la grille. Retrouve aussi ses déplacements. À l’heure du crime, elle était avec son meurtrier, et elle n’a plus bougé ensuite.":"New: the victim has a row in the grid. Work out their movements too. At the time of the crime, they were with their killer, and they did not move after that.","Je ne voulais pas… On m’avait promis une fortune. Une lettre, glissée sous ma porte. Elle sentait la violette.":"I didn’t mean to… I was promised a fortune. A letter, slipped under my door. It smelled of violets.","Une lettre ? Signée de qui ?":"A letter? Signed by whom?","Pas de nom. Juste un dessin : un hibou.":"No name. Just a drawing: an owl.","Hippolyte Plateau est arrêté.":"Ivor Tray is arrested.","Mais le Hibou est en prison. Alors qui signe ces lettres ?":"But the Owl is in prison. So who is signing these letters?","Maître Vandu a été assassiné.":"Mr Down has been murdered.","Il a été tué à {h}, {lieu}. Le meurtrier était seul avec lui. Reconstitue aussi les déplacements de la victime jusqu’à sa mort.":"He was killed at {h}, {lieu}. The killer was alone with him. Work out the victim’s movements too, up to the moment of death.","le meurtrier":"the killer","meurtre":"murder","Le catalogue raturé":"The scribbled catalogue","Quelqu’un a raturé le catalogue ! L’estimation des Larmes de Lune est passée d’un million… à trois francs !":"Someone has scribbled over the catalogue! The estimate for the Moon Tears went from a million… to three francs!","Ana Gramme, critique d’art. Vous savez que « Hortense Lafleur » donne « L’enfer sur hôtel » ? À une lettre près.":"Anna Gram, art critic. Did you know “Hortense Bloom” makes “No somber hotel”? Perfectly.","Elle adore les anagrammes.":"She loves anagrams.","Le catalogue a été trafiqué {lieu} à {h}. Une seule personne y était.":"The catalogue was tampered with {lieu} at {h}. Only one person was there.","Trois francs, c’est une estimation très raisonnable. Pour moi.":"Three francs is a very reasonable estimate. For me.","On n’achète pas un collier au prix d’une baguette, madame Pépite.":"You don’t buy a necklace for the price of a loaf of bread, Mrs Nugget.","Le catalogue de la vente a été raturé.":"The sale catalogue has been scribbled over.","Les estimations ont été modifiées à {h}, {lieu}. La coupable ou le coupable y était seul.":"The estimates were changed at {h}, {lieu}. The culprit was alone there.","sabotage":"sabotage","Le faux Fragonard":"The fake Fragonard","Ce Fragonard est un faux ! La peinture est encore fraîche, et la signature dit « Fragonarde ».":"This Fragonard is a fake! The paint is still wet, and the signature says “Fragonarde”.","Le vrai tableau a été échangé {lieu} à {h}. Le faussaire était seul.":"The real painting was swapped {lieu} at {h}. The forger was alone.","Avouez qu’il est réussi ! J’ai juste raté le E. Je comptais le vendre pour racheter le collier de ma tante.":"Admit it’s good! I only got the E wrong. I was going to sell it to buy back my aunt’s necklace.","Votre talent mérite mieux, Rémi. Une école d’art, par exemple. Ou une bonne leçon.":"Your talent deserves better, Remy. Art school, for instance. Or a good lesson.","Un faux tableau a remplacé le vrai.":"A fake painting has replaced the real one.","L’échange a eu lieu à {h}, {lieu}. Le faussaire y était seul.":"The swap took place at {h}, {lieu}. The forger was alone there.","le faussaire":"the forger","faux":"forgery","Monsieur Moustache":"Mr Whiskers","Monsieur Moustache a disparu ! Le chat du vestiaire ! Il dort toujours sur les manteaux de fourrure !":"Mr Whiskers is gone! The cloakroom cat! He always sleeps on the fur coats!","Lise Défait, ancienne femme de chambre du Grand Hôtel, fait le ménage à Drouot.":"Sheila Sheets, once a chambermaid at the Grand Hotel, now cleans at Drouot.","On l’a enfermé {lieu} à {h}. Son ravisseur était seul avec lui.":"Someone shut him in {lieu} at {h}. His kidnapper was alone with him.","Comme une victime, le chat a sa ligne dans la grille. Une fois enfermé, il n’a plus bougé.":"Like a victim, the cat has a row in the grid. Once shut in, he did not move.","Mon prochain roman s’appelle « Le Chat du commissaire-priseur ». Il me fallait un modèle !":"My next novel is called “The Auctioneer’s Cat”. I needed a model!","Prenez des notes, Agathe. Pas des chats.":"Take notes, Agatha. Not cats.","Monsieur Moustache, le chat du vestiaire, a été enlevé.":"Mr Whiskers, the cloakroom cat, has been kidnapped.","Il a été enfermé à {h}, {lieu}, par une personne seule avec lui. Retrouve aussi les déplacements du chat.":"He was shut in at {h}, {lieu}, by someone alone with him. Work out the cat’s movements too.","le ravisseur":"the kidnapper","enlèvement":"kidnapping","La lettre au hibou":"The owl letter","Une lettre dans la poche de mon manteau. « Rentrez chez vous, madame Lafleur, ou vous finirez comme Vandu. » Et un hibou dessiné en bas.":"A letter in my coat pocket. “Go home, Mrs Bloom, or you’ll end up like Down.” And an owl drawn at the bottom.","Elle sent la violette. Votre manteau était au vestiaire. On l’y a glissée à {h}.":"It smells of violets. Your coat was in the cloakroom. It was slipped in at {h}.","Et celui qui l’a glissée était seul {lieu}. Retrouvons-le.":"And whoever slipped it in was alone {lieu}. Let’s find them.","Un monsieur m’a donné cent francs pour la glisser. Je ne l’ai pas vu : il portait un chapeau, et il sentait la violette.":"A gentleman gave me a hundred francs to slip it in. I didn’t see him: he wore a hat, and he smelled of violets.","Encore la violette. Inspecteur, notez.":"Violets again. Inspector, make a note.","C’est noté, madame Lafleur. Je note tout.":"Noted, Mrs Bloom. I note everything.","Une lettre de menace a été glissée dans le manteau d’Hortense.":"A threatening letter was slipped into Hortense’s coat.","Elle a été déposée à {h}, {lieu}, par une personne seule. L’inspecteur Songe a encore tenu à figurer parmi les suspects.":"It was left at {h}, {lieu}, by someone alone. Inspector Fibbs once again insisted on being a suspect.","le messager":"the messenger","chantage":"blackmail","La loupe d’or":"The golden magnifier","Ma loupe en or ! Je voulais examiner les diamants du collier avant d’enchérir, et elle a disparu !":"My gold magnifying glass! I wanted to examine the necklace’s diamonds before bidding, and it’s gone!","Paul Ochon, le directeur du Grand Hôtel, rêve d’exposer le collier dans son hall.":"Paul Pillow, manager of the Grand Hotel, dreams of displaying the necklace in his lobby.","Elle a été prise {lieu} à {h}. La voleuse ou le voleur y était seul.":"It was taken {lieu} at {h}. The thief was alone there.","Je voulais voir le collier de près, moi aussi. Une critique d’art ne se fie jamais aux photographies.":"I wanted to see the necklace up close too. An art critic never trusts photographs.","Pourquoi ce collier vous intéresse-t-il tant, mademoiselle Gramme ?":"Why are you so interested in this necklace, Miss Gram?","Disons que je travaille pour quelqu’un qui veut l’acheter.":"Let’s say I work for someone who wants to buy it.","La loupe en or de Paul Ochon a disparu.":"Paul Pillow’s gold magnifying glass has disappeared.","Elle a été prise à {h}, {lieu}, par la seule personne présente.":"It was taken at {h}, {lieu}, by the only person there.","La réserve vide":"The empty storeroom","La nuit avant la vente.":"The night before the sale.","Le collier dort dans la réserve, sous la garde de Barnabé, le gardien de nuit.":"The necklace sleeps in the storeroom, guarded by Barnaby, the night watchman.","Le collier a disparu ! Et Barnabé est ficelé comme un saucisson !":"The necklace is gone! And Barnaby is trussed up like a sausage!","On l’a attaché {lieu} à {h}. Le voleur était seul avec lui. Barnabé a sa ligne dans la grille : ensuite, il n’a plus bougé.":"He was tied up {lieu} at {h}. The thief was alone with him. Barnaby has a row in the grid: after that, he did not move.","Un chauffeur en livrée m’a payée pour le sortir par le quai. Il y avait des armoiries sur la voiture. Un faucon.":"A chauffeur in livery paid me to take it out through the dock. There was a coat of arms on the car. A falcon.","Un faucon… Les Montfaucon. Inspecteur, nous partons pour la Sologne.":"A falcon… The Montfaucons. Inspector, we’re off to the Sologne.","Fin du chapitre 8.":"End of chapter 8.","La vente est reportée. Direction le château de Montfaucon.":"The sale is postponed. Next stop: Montfaucon Castle.","Le collier a été volé dans la réserve.":"The necklace was stolen from the storeroom.","Le gardien Barnabé a été ligoté à {h}, {lieu}, par le voleur, seul avec lui. Ensuite, Barnabé n’a plus bougé.":"Barnaby the watchman was tied up at {h}, {lieu}, by the thief, alone with him. After that, Barnaby did not move.","Le courant d’air":"The draught","Ma tabatière ! Celle de mon arrière-grand-oncle ! On me l’a prise dans la crypte, où je la cache. Enfin, où je la cachais.":"My snuffbox! My great-great-uncle’s! It was taken from the crypt, where I hide it. Well, where I used to hide it.","Elle a disparu {lieu} à {h}. Une seule personne y était. Mais il y a un drôle de courant d’air dans la bibliothèque…":"It disappeared {lieu} at {h}. Only one person was there. But there’s a strange draught in the library…","Nouveau : un passage secret relie la bibliothèque à la crypte. Seuls ceux qui le connaissent peuvent l’emprunter. Les autres passent par les portes.":"New: a secret passage links the library to the crypt. Only those who know it can use it. Everyone else goes through the doors.","Je jardine aussi sous terre, monsieur le marquis. J’ai trouvé ce passage en cherchant des truffes.":"I garden underground too, my lord. I found this passage while looking for truffles.","Des truffes ? Dans ma bibliothèque ?":"Truffles? In my library?","Rendez la tabatière, Basile. Et gardez les truffes.":"Return the snuffbox, Bud. And keep the truffles.","La tabatière du marquis a disparu.":"The marquis’s snuffbox has disappeared.","Elle a été prise à {h}, {lieu}. Un passage secret relie la bibliothèque à la crypte, mais seul Basile Bouture le connaît.":"It was taken at {h}, {lieu}. A secret passage links the library to the crypt, but only Bud Cutting knows it.","Le portrait qui cligne de l’œil":"The winking portrait","Madame Lafleur ! Le portrait du grand-père du marquis… on lui a découpé les yeux ! Il me regarde à travers le mur !":"Mrs Bloom! The portrait of the marquis’s grandfather… someone cut out his eyes! He’s watching me through the wall!","Ernest Couchette, l’ancien steward de l’Express, a été engagé comme valet pour la saison.":"Ernest Bunkley, the old steward from the Express, has been hired as a valet for the season.","La toile a été découpée {lieu} à {h}. Une seule personne y était.":"The canvas was cut {lieu} at {h}. Only one person was there.","Je voulais surveiller la galerie sans être vue. Un trou dans un portrait, c’est le plus vieux truc du monde.":"I wanted to watch the gallery without being seen. A hole in a portrait is the oldest trick in the book.","Et qui espionniez-vous, Lucie ?":"And who were you spying on, Lucy?","Le marquis. La nuit, il parle tout seul à son collier.":"The marquis. At night, he talks to his necklace.","Un portrait de la galerie a perdu ses yeux.":"A portrait in the gallery has lost its eyes.","La toile a été découpée à {h}, {lieu}. Un escalier dérobé relie la chambre du marquis à la salle d’armes : Lucie Fer et Julie Enne le connaissent.":"The canvas was cut at {h}, {lieu}. A hidden staircase links the marquis’s bedroom to the armoury: Lucy Fer and Julie Anne know it.","Le collier de la chapelle":"The chapel necklace","Ce n’est pas le vrai collier ! Les Larmes de Lune ont une petite rayure sous le fermoir. Celui-ci n’en a pas.":"This is not the real necklace! The Moon Tears have a tiny scratch under the clasp. This one doesn’t.","Le faux a été déposé dans le reliquaire de la chapelle, à {h}. Par une personne seule.":"The fake was placed in the chapel reliquary at {h}. By someone alone.","C’est moi. J’ai fait faire une copie pour mes invités. Le vrai, je l’ai… prêté. À un homme qui prenait le train pour Venise.":"It was me. I had a copy made for my guests. The real one, I… lent it. To a man taking the train to Venice.","Prêté ? Vous l’avez vendu, monsieur le marquis.":"Lent? You sold it, my lord.","Il fallait bien réparer le toit !":"The roof needed fixing!","Un faux collier dort dans la chapelle.":"A fake necklace sleeps in the chapel.","Il a été déposé à {h}, {lieu}, par la seule personne présente. Le passage de la bibliothèque à la crypte est connu du marquis et de Basile.":"It was placed at {h}, {lieu}, by the only person there. The library passage to the crypt is known to the marquis and to Bud.","Le notaire dans la crypte":"The notary in the crypt","Un bruit de casserole résonne sous la chapelle.":"A sound like a saucepan echoes under the chapel.","Maître Menvussa a été assommé dans la crypte ! Il respire, mais il ne se souvient même plus de son prénom.":"Mr Nott has been knocked out in the crypt! He’s breathing, but he can’t even remember his own first name.","On l’a frappé {lieu} à {h}. Son agresseur était seul avec lui.":"He was struck {lieu} at {h}. His attacker was alone with him.","J’ai cru que c’était un cambrioleur ! Il fouillait dans le noir… Alors j’ai frappé. Avec ma louche.":"I thought he was a burglar! He was rummaging in the dark… So I hit him. With my ladle.","Il cherchait le vrai collier, Julie. Comme tout le monde ici.":"He was looking for the real necklace, Julie. Like everyone here.","Maître Menvussa a été assommé.":"Mr Nott has been knocked out.","Il a été frappé à {h}, {lieu}, par une personne seule avec lui. Ensuite, il n’a plus bougé. Julie Enne connaît le passage de la bibliothèque.":"He was struck at {h}, {lieu}, by someone alone with him. After that, he did not move. Julie Anne knows the library passage.","l’agresseur":"the attacker","agression":"assault","La tisane du marquis":"The marquis’s herbal tea","Ma tisane avait un goût de… dodo. J’ai dormi quatorze heures ! On a voulu m’empoisonner !":"My tea tasted of… sleepy-byes. I slept fourteen hours! Someone tried to poison me!","La poudre a été versée {lieu} à {h}. Et cette fois, le coupable ment dans tout ce qu’il déclare. Comme au manoir des Oliviers.":"The powder was poured {lieu} at {h}. And this time, the culprit lies in every statement. Just like at the Olive Tree Manor.","Une dose de rien du tout ! Je voulais juste qu’il dorme pendant que je fouillais sa chambre.":"A tiny little dose! I only wanted him asleep while I searched his room.","Fouiller quoi, docteur ?":"Searched for what, doctor?","Une lettre m’a dit qu’il gardait un secret sous son matelas. Une lettre qui sentait la violette.":"A letter told me he kept a secret under his mattress. A letter that smelled of violets.","Quelqu’un a endormi le marquis.":"Someone put the marquis to sleep.","Un somnifère a été versé dans sa tisane à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai. Le marquis connaît l’escalier dérobé.":"A sleeping powder was poured into his tea at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth. The marquis knows the hidden staircase.","empoisonnement":"poisoning","Le corbeau de Sologne":"The Sologne poison pen","Encore une lettre ! « Le marquis paiera, ou tout le monde saura qu’il a vendu le collier. »":"Another letter! “The marquis will pay, or everyone will know he sold the necklace.”","Elle a été posée {lieu} à {h}. Par quelqu’un qui y était seul.":"It was left {lieu} at {h}. By someone who was alone there.","Je n’ai fait que la poser ! On me l’avait laissée dans la serre, avec un billet de cent francs.":"I only put it there! It had been left for me in the greenhouse, with a hundred-franc note.","Et un parfum de violette, je suppose.":"And a whiff of violets, I suppose.","Une lettre de chantage menace le marquis.":"A blackmail letter threatens the marquis.","Elle a été déposée à {h}, {lieu}, par la seule personne présente. Basile Bouture et Ana Gramme connaissent le passage de la bibliothèque.":"It was left at {h}, {lieu}, by the only person there. Bud Cutting and Anna Gram know the library passage.","Mort au château":"Death at the castle","Dernière nuit à Montfaucon.":"Last night at Montfaucon.","L’orage gronde sur la Sologne.":"Thunder rolls over the Sologne.","Au matin, Julie trouve le marquis dans sa chambre. Il ne se réveillera pas.":"In the morning, Julie finds the marquis in his bedroom. He will not wake up.","Il a été tué {lieu} à {h}. Son assassin était seul avec lui. Et il connaissait un passage secret.":"He was killed {lieu} at {h}. His killer was alone with him. And he knew a secret passage.","Il allait parler. Il savait à qui il avait vendu le collier… La lettre disait de le faire taire. Avec un hibou dessiné dessus.":"He was going to talk. He knew who he’d sold the necklace to… The letter said to silence him. With an owl drawn on it.","Le Hibou est en prison, docteur.":"The Owl is in prison, doctor.","Alors quelqu’un se sert de son nom, madame Lafleur.":"Then someone is using her name, Mrs Bloom.","Fin du chapitre 9.":"End of chapter 9.","L’acheteur du collier a pris le train de nuit pour Venise. Hortense aussi.":"The necklace’s buyer has taken the night train to Venice. So has Hortense.","Le marquis de Montfaucon a été assassiné.":"The Marquis de Montfaucon has been murdered.","Il a été tué à {h}, {lieu}, par une personne seule avec lui. Le docteur Cament connaît l’escalier dérobé ; Julie Enne, le passage de la bibliothèque.":"He was killed at {h}, {lieu}, by someone alone with him. Dr Cation knows the hidden staircase; Julie Anne, the library passage.","La valise du fourgon":"The suitcase in the luggage van","Une passagère assommée dans le fourgon à bagages ! Et sans billet pour le fourgon, en plus !":"A passenger knocked out in the luggage van! And no ticket for the luggage van, either!","Jean Bilet, le contrôleur de l’Express, a changé de ligne.":"Jack Punch, the ticket inspector from the Express, has changed lines.","Aïe… On m’a frappée par derrière. Mais je me souviens très bien de ma soirée, jusqu’au coup.":"Ouch… Someone hit me from behind. But I remember my evening very well, right up to the blow.","C’est arrivé {lieu} à {h}. Lucie peut témoigner de tout ce qui précède.":"It happened {lieu} at {h}. Lucy can testify to everything before that.","Nouveau : un assommé ne bouge plus après le coup, mais il se souvient de tout ce qui s’est passé avant. Ses témoignages sont fiables.":"New: a knocked-out person does not move after the blow, but remembers everything that happened before. Their statements can be trusted.","Elle m’a surpris en train de fouiller les bagages. J’ai paniqué… avec une valise.":"She caught me going through the luggage. I panicked… with a suitcase.","Vous cherchiez le collier, Rémi ?":"Were you looking for the necklace, Remy?","Tout le monde le cherche, dans ce train !":"Everyone on this train is looking for it!","Lucie Fer a été assommée dans le fourgon.":"Lucy Fer was knocked out in the luggage van.","Elle a été frappée à {h}, {lieu}, par une personne seule avec elle. Ensuite, elle n’a plus bougé. Ses souvenirs d’avant le coup sont fiables.":"She was struck at {h}, {lieu}, by someone alone with her. After that, she did not move. Her memories from before the blow can be trusted.","Le carnet du contrôleur":"The inspector’s notebook","Mon carnet ! Toute la liste des passagers ! Qui est monté, qui est descendu, qui a payé…":"My notebook! The whole passenger list! Who got on, who got off, who paid…","On l’a pris {lieu} à {h}. La voleuse ou le voleur était seul.":"It was taken {lieu} at {h}. The thief was alone.","Je voulais savoir qui m’avait assommée. Et dans ce carnet, il y a un nom souligné trois fois : Paul Ka, voiture-salon.":"I wanted to know who knocked me out. And in that notebook, one name is underlined three times: Paul Kerr, lounge car.","Le pianiste. Intéressant.":"The pianist. Interesting.","Le carnet du contrôleur a disparu.":"The ticket inspector’s notebook has disappeared.","Il a été pris à {h}, {lieu}, par la seule personne présente.":"It was taken at {h}, {lieu}, by the only person there.","Le piano qui sonne faux":"The out-of-tune piano","Ce piano sonne comme une casserole ! On a bourré les cordes avec quelque chose !":"This piano sounds like a saucepan! Someone stuffed something into the strings!","Le piano a été trafiqué {lieu} à {h}. Une seule personne y était.":"The piano was tampered with {lieu} at {h}. Only one person was there.","J’y… rangeais un paquet. Un petit paquet. Pour un ami.":"I was… storing a parcel in it. A little parcel. For a friend.","Le paquet a disparu, monsieur Ka. Il ne reste que le papier.":"The parcel is gone, Mr Kerr. Only the wrapping is left.","Le passeur, c’était lui.":"He was the courier.","Mais le collier a déjà changé de mains.":"But the necklace has already changed hands.","Le piano de la voiture-salon sonne faux.":"The lounge car piano is out of tune.","Quelqu’un l’a trafiqué à {h}, {lieu}. Il y était seul.":"Someone tampered with it at {h}, {lieu}. They were alone there.","Le contrôleur dans le noir":"The inspector in the dark","Un tunnel. Le noir complet. Puis un bruit sourd.":"A tunnel. Pitch black. Then a dull thud.","On m’a frappé avec un objet très lourd. Et très parfumé. Mais je me souviens de tout, jusqu’au coup.":"I was hit with something very heavy. And very perfumed. But I remember everything, right up to the blow.","C’est arrivé {lieu} à {h}. Son agresseur était seul avec lui.":"It happened {lieu} at {h}. His attacker was alone with him.","Avec mon coffret à maquillage. Il voulait me faire payer un supplément pour mes quarante-deux malles !":"With my make-up case. He wanted to charge me a supplement for my forty-two trunks!","Quarante-deux malles, Aria ?":"Forty-two trunks, Aria?","Je chante à la Fenice ! On n’y va pas en tenue de voyage !":"I’m singing at La Fenice! One doesn’t arrive in travelling clothes!","Le contrôleur a été assommé.":"The ticket inspector has been knocked out.","Jean Bilet a été frappé à {h}, {lieu}, par une personne seule avec lui. Ensuite, il n’a plus bougé. L’inspecteur Songe fait partie des suspects.":"Jack Punch was struck at {h}, {lieu}, by someone alone with him. After that, he did not move. Inspector Fibbs is one of the suspects.","L’étui à violon":"The violin case","Mon paquet… je l’avais caché dans le fourgon, dans un étui à violon. L’étui est vide !":"My parcel… I’d hidden it in the luggage van, in a violin case. The case is empty!","On l’a vidé {lieu} à {h}. La voleuse ou le voleur y était seul. Et il ment dans tout ce qu’il dit.":"It was emptied {lieu} at {h}. The thief was alone there. And lies in every statement.","Je l’ai racheté, en quelque sorte. Pour mon client. Il paiera à Venise.":"I bought it back, so to speak. For my client. He’ll pay in Venice.","Qui est votre client, mademoiselle Gramme ?":"Who is your client, Miss Gram?","Un collectionneur. Il donne un bal masqué demain soir. Vous êtes invitée.":"A collector. He’s giving a masked ball tomorrow night. You’re invited.","Le paquet du passeur a été volé.":"The courier’s parcel has been stolen.","L’étui à violon a été vidé à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai.":"The violin case was emptied at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth.","Sur le toit du train":"On the roof of the train","Ma casquette ! On l’a accrochée tout là-haut, sur le toit du train !":"My cap! Someone hung it right up there, on the roof of the train!","Quelqu’un l’a montée {lieu} à {h}. Il y était seul. Par ce froid, il fallait le vouloir.":"Someone took it up {lieu} at {h}. They were alone. In this cold, they really wanted to.","J’avais parié avec Aria que je monterais sur le toit. Il me fallait une preuve !":"I bet Aria I’d climb onto the roof. I needed proof!","Et qu’avez-vous gagné, Rémi ?":"And what did you win, Remy?","Un rhume.":"A cold.","La casquette du contrôleur a fini sur le toit.":"The ticket inspector’s cap ended up on the roof.","Quelqu’un l’a déposée à {h}, {lieu}, seul. Cinq suspects, dont l’inspecteur Songe.":"Someone left it at {h}, {lieu}, alone. Five suspects, including Inspector Fibbs.","Terminus Venise":"Venice, end of the line","Dernière nuit avant Venise.":"Last night before Venice.","Au petit matin, Ernest trouve Jean Bilet sans vie.":"At dawn, Ernest finds Jack Punch dead.","Il a été tué {lieu} à {h}. Son meurtrier était seul avec lui. Jean Bilet notait tout : il en savait trop.":"He was killed {lieu} at {h}. His killer was alone with him. Jack Punch wrote everything down: he knew too much.","Il avait mon nom dans son carnet ! La lettre disait : « Le contrôleur sait. » Elle était signée d’un hibou.":"He had my name in his notebook! The letter said: “The ticket man knows.” It was signed with an owl.","Encore le hibou. Et encore la violette.":"The owl again. And violets again.","Le Hibou a donc un complice dehors, madame Lafleur. Je le trouverai.":"So the Owl has an accomplice on the outside, Mrs Bloom. I will find him.","Fin du chapitre 10.":"End of chapter 10.","Le train entre en gare de Venise. Le collier, lui, est déjà au palais Ca’ Doppio.":"The train pulls into Venice. The necklace is already at the Ca’ Doppio palace.","Jean Bilet a été assassiné.":"Jack Punch has been murdered.","Le contrôleur a été tué à {h}, {lieu}, par une personne seule avec lui. Retrouve aussi ses déplacements jusqu’à sa mort.":"The ticket inspector was killed at {h}, {lieu}, by someone alone with him. Work out his movements too, up to his death.","La tarte du maestro":"The maestro’s pie","Une tarte à la crème ! En pleine figure ! Pendant que je dirigeais la valse !":"A cream pie! Right in the face! While I was conducting the waltz!","C’est arrivé {lieu} à {h}. Plusieurs personnes étaient peut-être près de lui. Mais une seule était passée par les cuisines prendre la tarte.":"It happened {lieu} at {h}. Several people may have been near him. But only one had gone through the kitchens to fetch the pie.","Nouveau : l’arme. Plusieurs suspects peuvent être avec la victime. Le coupable est le seul d’entre eux à être passé par la pièce de l’arme avant les faits.":"New: the weapon. Several suspects may be with the victim. The culprit is the only one of them who went through the weapon’s room beforehand.","Il a dit que je chantais comme une gondole qui grince. Une tarte, c’était le minimum.":"He said I sing like a creaking gondola. A pie was the least he deserved.","La critique est aisée, Enzo. La tarte aussi, apparemment.":"Criticism is easy, Enzo. So is pie, apparently.","Le maestro a été entarté.":"The maestro has been pied.","La tarte a été lancée à {h}, {lieu}. Elle venait des cuisines. Parmi ceux qui étaient avec le maestro, le coupable est le seul à y être passé avant.":"The pie was thrown at {h}, {lieu}. It came from the kitchens. Of those who were with the maestro, the culprit is the only one who had been there before.","attentat pâtissier":"pastry attack","Une Doppio peut en cacher une autre":"One Doppio may hide another","Le masque d’or du carnaval a disparu ! Je l’avais posé dans le cabinet des masques !":"The golden carnival mask is gone! I left it in the mask cabinet!","Nous sommes Pia et Paola Doppio, les danseuses du bal. Et non, on ne nous distingue pas.":"We are Pia and Paola Doppio, the dancers at the ball. And no, nobody can tell us apart.","Deux jumelles. Le même masque, la même robe.":"Twin sisters. Same mask, same dress.","Le masque a été pris {lieu} à {h}. Le voleur était seul. Attention : quand un témoin dit avoir vu « une des jumelles », il ne sait pas laquelle.":"The mask was taken {lieu} at {h}. The thief was alone. Careful: when a witness says they saw “one of the twins”, they don’t know which.","Nouveau : les jumelles. « Une des jumelles était là » veut dire Pia, ou Paola, ou les deux.":"New: the twins. “One of the twins was there” means Pia, or Paola, or both.","Nous devions danser avec le même masque. Il n’y en avait qu’un !":"We were supposed to dance in the same mask. There was only one!","Ma sœur ne partage jamais rien.":"My sister never shares anything.","Le masque d’or a disparu.":"The golden mask has disappeared.","Il a été pris à {h}, {lieu}, par la seule personne présente. « Une des jumelles » veut dire Pia, Paola, ou les deux.":"It was taken at {h}, {lieu}, by the only person there. “One of the twins” means Pia, Paola, or both.","La gondole à la dérive":"The drifting gondola","Ma gondole ! L’amarre a été coupée ! Elle part vers l’Adriatique !":"My gondola! The mooring rope was cut! It’s drifting towards the Adriatic!","André Vivalto, ancien chef de la sécurité du Grand Hôtel, aujourd’hui riche collectionneur.":"André Vivalto, once head of security at the Grand Hotel, now a wealthy collector.","L’amarre a été coupée {lieu} à {h}. Une seule personne y était.":"The rope was cut {lieu} at {h}. Only one person was there.","Je voulais empêcher monsieur Vivalto de partir avant le bal. Il me doit trois robes !":"I wanted to stop Mr Vivalto leaving before the ball. He owes me three dresses!","Vivalto voulait partir ? Avec le collier, peut-être.":"Vivalto wanted to leave? With the necklace, perhaps.","La gondole de Vivalto part à la dérive.":"Vivalto’s gondola is drifting away.","L’amarre a été coupée à {h}, {lieu}, par la seule personne présente.":"The rope was cut at {h}, {lieu}, by the only person there.","Le poivre du ténor":"The tenor’s pepper","Atchoum ! Mon miel est plein de poivre ! Ma voix ! Atchoum !":"Atchoo! My honey is full of pepper! My voice! Atchoo!","Bonjour. Je suis… notaire, je crois. On m’a dit que je m’appelais Gérard.":"Good evening. I am… a notary, I believe. I’m told my name is Seymour.","Depuis le coup dans la crypte, le notaire ne se souvient plus de grand-chose.":"Since the blow in the crypt, the notary doesn’t remember much.","Le miel a été poivré {lieu} à {h}. Le poivre vient des cuisines : parmi ceux qui étaient avec Enzo, seul le coupable y est passé avant.":"The honey was peppered {lieu} at {h}. The pepper comes from the kitchens: of those who were with Enzo, only the culprit went there beforehand.","Du poivre ? J’ai cru que c’était du sel. Ou de la cannelle. Je ne sais plus très bien ce qu’est la cannelle.":"Pepper? I thought it was salt. Or cinnamon. I’m not quite sure what cinnamon is any more.","Ce n’est rien, maître. On vous le rappellera.":"Never mind, Mr Nott. We’ll remind you.","Le miel du ténor a été poivré.":"The tenor’s honey has been peppered.","C’est arrivé à {h}, {lieu}. Le poivre venait des cuisines. Parmi ceux qui étaient avec Enzo, le coupable est le seul à y être passé avant.":"It happened at {h}, {lieu}. The pepper came from the kitchens. Of those who were with Enzo, the culprit is the only one who had been there before.","Le carnet du notaire":"The notary’s notebook","Mon carnet ! J’y avais écrit tout ce dont je me souviens. Ça tenait sur une page, mais c’était une belle page !":"My notebook! I wrote down everything I remember in it. It fitted on one page, but it was a lovely page!","Il a disparu {lieu} à {h}. Le voleur y était seul.":"It disappeared {lieu} at {h}. The thief was alone there.","Il y avait écrit : « J’ai vu l’homme à la violette dans la crypte. » Je voulais savoir qui c’était.":"It said: “I saw the violet man in the crypt.” I wanted to know who he was.","Vous jouez avec le feu, Vivalto.":"You’re playing with fire, Vivalto.","Je suis collectionneur, madame. Je collectionne aussi les secrets.":"I’m a collector, madam. I collect secrets too.","Le carnet du notaire a disparu.":"The notary’s notebook has disappeared.","Les deux masques":"The two masks","On a volé la clé de ma vitrine ! Celle où je garde mes plus belles pièces !":"Someone stole the key to my display cabinet! The one where I keep my finest pieces!","Elle a été prise {lieu} à {h}, par une personne seule. Et cette personne ment dans tout ce qu’elle dit.":"It was taken {lieu} at {h}, by someone alone. And that person lies in every statement.","Pia jurait que j’en étais incapable. J’ai gagné le pari.":"Pia swore I couldn’t do it. I won the bet.","Paola ! Rends cette clé avant que maman l’apprenne !":"Paola! Give that key back before Mamma finds out!","Une jumelle peut en cacher une autre, mais pas longtemps.":"One twin may hide another, but not for long.","La clé de la vitrine de Vivalto a disparu.":"The key to Vivalto’s display cabinet has disappeared.","Elle a été prise à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai.":"It was taken at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth.","Bal masqué, bal tragique":"Masked ball, fatal ball","Minuit. Le grand bal masqué bat son plein.":"Midnight. The grand masked ball is in full swing.","Dans le salon des miroirs, André Vivalto s’effondre.":"In the hall of mirrors, André Vivalto collapses.","Un stylet du cabinet des masques. Il a été frappé {lieu} à {h}. Plusieurs danseurs étaient peut-être près de lui, mais un seul était passé prendre le stylet.":"A stiletto from the mask cabinet. He was stabbed {lieu} at {h}. Several dancers may have been near him, but only one had gone to fetch the stiletto.","La lettre disait que Vivalto savait qui était l’homme à la violette. Qu’il fallait l’arrêter avant qu’il parle. Je l’ai suivie comme une partition.":"The letter said Vivalto knew who the violet man was. That he had to be stopped before he talked. I followed it like a score.","Et le collier, maestro ?":"And the necklace, maestro?","Vivalto l’avait déjà confié à un chauffeur. Pour la Suisse. Par le col.":"Vivalto had already handed it to a chauffeur. For Switzerland. Over the pass.","Fin du chapitre 11.":"End of chapter 11.","Une voiture file vers les Alpes. Hortense la suit, avec quelques passagers de trop.":"A car races towards the Alps. Hortense follows it, with a few passengers too many.","André Vivalto a été assassiné au bal.":"André Vivalto has been murdered at the ball.","Il a été frappé à {h}, {lieu}, avec un stylet du cabinet des masques. Parmi ceux qui étaient avec lui, le meurtrier est le seul à être passé par ce cabinet avant.":"He was stabbed at {h}, {lieu}, with a stiletto from the mask cabinet. Of those who were with him, the killer is the only one who had been through that cabinet beforehand.","La tomme de l’hospice":"The hospice cheese","La voiture est bloquée par la neige au col.":"The car is snowed in at the pass.","Les moines de l’hospice accueillent tout le monde.":"The monks of the hospice take everyone in.","Notre tomme de l’an dernier ! Volée dans la cave pendant la panne de courant !":"Our cheese from last year! Stolen from the cellar during the power cut!","La panne a eu lieu à {h}. Personne n’a rien vu à ce moment-là. Le voleur était seul {lieu}.":"The power cut was at {h}. Nobody saw anything at that moment. The thief was alone {lieu}.","Nouveau : la panne. Aucun témoignage ne porte sur l’heure dans le noir, et cette colonne de la grille reste noire. Il suffit de trouver le coupable.":"New: the power cut. No statement concerns the hour in the dark, and that column of the grid stays black. You only need to find the culprit.","Mille sabords… Vingt ans en mer, et je n’ai jamais goûté un fromage pareil. Il fallait que je sache s’il était aussi bon dans le noir.":"Shiver me timbers… Twenty years at sea, and I’ve never tasted a cheese like it. I had to know if it was just as good in the dark.","Et alors, capitaine ?":"And was it, Captain?","Meilleur.":"Better.","La tomme de l’hospice a été volée.":"The hospice cheese has been stolen.","Elle a disparu à {h}, en pleine panne, {lieu}. Le voleur y était seul. Personne ne peut dire où se trouvait chacun à ce moment-là.":"It disappeared at {h}, during the power cut, {lieu}. The thief was alone there. Nobody can say where anyone was at that moment.","Le tonnelet du saint-bernard":"The Saint Bernard’s barrel","Le tonnelet de Barry est vide ! Notre meilleur chien de sauvetage… et son eau-de-vie !":"Barry’s barrel is empty! Our best rescue dog… and his brandy!","Il a été vidé {lieu} à {h}, en pleine panne. Le coupable était seul avec le chien.":"It was emptied {lieu} at {h}, during the power cut. The culprit was alone with the dog.","J’avais froid ! Je conduis cette voiture depuis Venise, et elle n’a pas de chauffage !":"I was cold! I’ve been driving this car since Venice, and it has no heating!","C’est donc vous, le chauffeur de Vivalto, Marcel ?":"So you’re Vivalto’s chauffeur, Rusty?","Mécanicien, chauffeur, ce qu’on veut. Tant qu’on me paie.":"Mechanic, chauffeur, whatever you like. As long as I get paid.","Le tonnelet du chien Barry a été vidé.":"Barry the dog’s barrel has been emptied.","C’est arrivé à {h}, pendant la panne, {lieu}. Le coupable y était seul.":"It happened at {h}, during the power cut, {lieu}. The culprit was alone there.","Frère Bernard dans le noir":"Brother Bernard in the dark","Nouvelle panne. Un cri, un bruit sourd.":"Another power cut. A cry, a dull thud.","On m’a assommé avec un chandelier. Je me souviens de toute ma soirée… jusqu’au noir.":"I was knocked out with a candlestick. I remember my whole evening… until the dark.","C’est arrivé à {h}, dans le noir, {lieu}. L’agresseur était seul avec lui.":"It happened at {h}, in the dark, {lieu}. The attacker was alone with him.","Je l’ai pris pour un fantôme ! Une grande robe, une capuche, dans le noir… J’ai lu trop de romans d’Agathe Crispie.":"I thought he was a ghost! A long robe, a hood, in the dark… I’ve read too many Agatha Crispy novels.","Les fantômes ne sentent pas le fromage, madame Ence.":"Ghosts don’t smell of cheese, Mrs Hush.","Frère Bernard a été assommé pendant la panne.":"Brother Bernard was knocked out during the power cut.","Il a été frappé à {h}, {lieu}, par une personne seule avec lui. Ensuite, il n’a plus bougé. Ses souvenirs d’avant le coup sont fiables.":"He was struck at {h}, {lieu}, by someone alone with him. After that, he did not move. His memories from before the blow can be trusted.","Le scarabée d’or":"The golden scarab","Mon scarabée d’or ! Je l’emportais à Genève pour le faire expertiser ! Volé pendant la panne !":"My golden scarab! I was taking it to Geneva to be valued! Stolen during the power cut!","On l’a pris {lieu} à {h}. Dans le noir, mais seul.":"It was taken {lieu} at {h}. In the dark, but alone.","Il brillait dans le noir ! J’ai cru que c’était une luciole des neiges.":"It was glowing in the dark! I thought it was a snow firefly.","Il n’y a pas de lucioles à deux mille mètres, Pia.":"There are no fireflies at two thousand metres, Pia.","Ni de scarabées d’or, d’habitude.":"Nor golden scarabs, usually.","Le scarabée d’or du professeur a disparu.":"The professor’s golden scarab has disappeared.","Il a été pris à {h}, pendant la panne, {lieu}, par la seule personne présente.":"It was taken at {h}, during the power cut, {lieu}, by the only person there.","Les chaînes de neige":"The snow chains","Les chaînes de neige ! Quelqu’un les a cachées dans la paille du chenil ! Sans elles, impossible de repartir !":"The snow chains! Someone hid them in the straw in the kennels! Without them, we can’t leave!","Elles y ont été cachées à {h}, pendant la panne. Une seule personne était {lieu}.":"They were hidden there at {h}, during the power cut. Only one person was {lieu}.","Je ne voulais pas partir ! Les moines chantent si bien, ici. Et les chiens sont si doux.":"I didn’t want to leave! The monks sing so beautifully here. And the dogs are so soft.","Le collier repart avec la voiture, Paola. Vous le saviez ?":"The necklace is leaving with the car, Paola. Did you know?","Le collier ? Dans la voiture ?":"The necklace? In the car?","Les chaînes de neige ont été cachées.":"The snow chains have been hidden.","Quelqu’un les a cachées à {h}, pendant la panne, {lieu}. Il y était seul.":"Someone hid them at {h}, during the power cut, {lieu}. They were alone there.","Le journal du professeur":"The professor’s diary","Mon journal de fouilles ! J’y avais noté une chose étrange… sur quelqu’un de ce voyage. Il a disparu !":"My excavation diary! I’d noted something strange in it… about someone on this trip. It’s gone!","Il a été pris {lieu} à {h}. Le voleur était seul, et il ment dans tout ce qu’il déclare.":"It was taken {lieu} at {h}. The thief was alone, and lies in every statement.","Je voulais savoir s’il parlait de moi. Il me regarde toujours comme une momie.":"I wanted to know if he was writing about me. He always looks at me like a mummy.","Il ne parlait pas de vous, Cécile. Et une page avait déjà été arrachée avant votre passage.":"He wasn’t writing about you, Cecily. And a page had already been torn out before you got there.","Le journal du professeur Tumulus a disparu.":"Professor Barrow’s diary has disappeared.","Il a été pris à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai.":"It was taken at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth.","Nuit blanche au Grand-Col":"Sleepless night at the Grand-Col","La dernière nuit. La tempête redouble.":"The last night. The storm grows stronger.","Puis, encore une fois, la lumière s’éteint.":"Then, once again, the lights go out.","Quand elle revient, le professeur Tumulus gît dans la chapelle.":"When they come back on, Professor Barrow lies dead in the chapel.","Il a été tué {lieu} à {h}, dans le noir. Son meurtrier était seul avec lui.":"He was killed {lieu} at {h}, in the dark. His killer was alone with him.","Il avait reconnu quelqu’un. La lettre disait de le faire taire avant Genève. Elle était glissée dans le moteur, avec un hibou dessiné dessus.":"He had recognised someone. The letter said to silence him before Geneva. It was tucked into the engine, with an owl drawn on it.","Qui avait-il reconnu, Marcel ?":"Who had he recognised, Rusty?","Je ne sais pas ! Moi, je conduis, c’est tout.":"I don’t know! I just drive, that’s all.","Fin du chapitre 12.":"End of chapter 12.","La neige s’arrête. Le collier attend à Genève, dans un coffre.":"The snow stops. The necklace is waiting in Geneva, in a safe.","Le professeur Tumulus a été assassiné.":"Professor Barrow has been murdered.","Il a été tué à {h}, pendant la panne, {lieu}, par une personne seule avec lui. Retrouve aussi ses déplacements jusqu’à sa mort.":"He was killed at {h}, during the power cut, {lieu}, by someone alone with him. Work out his movements too, up to his death.","Le coffre 13":"Safe number 13","Le coffre 13 a été ouvert ! En vingt ans, jamais un coffre de la banque Lombard n’a été ouvert. Sauf par son propriétaire. Et encore, sur rendez-vous.":"Safe 13 has been opened! In twenty years, no safe at the Lombard bank has ever been opened. Except by its owner. And even then, by appointment.","Frank Suisse, directeur de la banque. Ponctuel à la seconde.":"Frank Swiss, director of the bank. Punctual to the second.","La salle des coffres est fermée à clé. Il n’y a qu’une clé, et c’est vous qui l’aviez au début de la soirée.":"The vault is locked. There is only one key, and you had it at the start of the evening.","Nouveau : les portes fermées à clé. Pour en franchir une, il faut la clé, ou passer avec celui qui la porte. Deux personnes dans la même pièce peuvent se passer la clé.":"New: locked doors. To go through one, you need the key, or to go through with whoever carries it. Two people in the same room can pass the key between them.","Je ne l’ai pas volé ! Je l’ai ouvert, pour vérifier la serrure. Il n’existe pas de serrure qui me résiste. C’est une question d’honneur.":"I didn’t steal it! I opened it, to check the lock. There’s no lock I can’t beat. It’s a matter of honour.","Vous êtes le serrurier de la banque, monsieur Pièce !":"You’re the bank’s locksmith, Mr Pick!","Justement. Il fallait bien tester mon travail.":"Exactly. I had to test my own work.","Le coffre 13 a été ouvert.":"Safe 13 has been opened.","Il a été ouvert à {h}, {lieu}, par la seule personne présente. Les portes de la salle des coffres sont fermées à clé ; au début de la soirée, la clé est chez Frank Suisse.":"It was opened at {h}, {lieu}, by the only person there. The vault doors are locked; at the start of the evening, Frank Swiss has the key.","effraction":"break-in","Le jeton porte-bonheur":"The lucky chip","Mon jeton porte-bonheur ! Celui du casino ! Je l’avais laissé sur le bureau du directeur pendant notre rendez-vous !":"My lucky chip! From the casino! I left it on the director’s desk during our meeting!","Jacques Potte, directeur du casino de Monte-Carlo, venu placer ses économies.":"Jack Potts, manager of the Monte Carlo casino, here to deposit his savings.","Il a été pris {lieu} à {h}. La porte du bureau est fermée à clé, et c’est Gaspard qui l’avait au départ.":"It was taken {lieu} at {h}. The office door is locked, and Gus had the key at the start.","Je voulais le porter rien qu’une soirée ! Depuis Monte-Carlo, je perds tout.":"I only wanted to wear it for one evening! Since Monte Carlo, I lose everything.","Un porte-bonheur ne porte bonheur qu’à son propriétaire, Bernadette.":"A lucky charm only brings luck to its owner, Betty.","Le jeton porte-bonheur de Jacques Potte a disparu.":"Jack Potts’s lucky chip has disappeared.","Il a été pris à {h}, {lieu}, par la seule personne présente. La porte entre les guichets et le bureau est fermée ; la clé est d’abord chez Gaspard Pièce.":"It was taken at {h}, {lieu}, by the only person there. The door between the counters and the office is locked; Gus Pick has the key at first.","la voleuse":"the thief","Le registre des coffres":"The safe register","Le registre des coffres a été falsifié ! Le coffre où dort le collier n’appartient plus à personne. Plus de propriétaire, plus de trace !":"The safe register has been forged! The safe holding the necklace no longer belongs to anyone. No owner, no trace!","On m’a confié la clé de la salle du conseil, madame Lafleur. Je sers le café aux banquiers, maintenant.":"I’ve been given the key to the boardroom, Mrs Bloom. I serve coffee to bankers now.","Ernest change souvent de métier.":"Ernest changes jobs a lot.","Le registre a été trafiqué {lieu} à {h}. Une seule personne y était.":"The register was tampered with {lieu} at {h}. Only one person was there.","Un client m’a demandé la plus grande discrétion. C’est la règle de la maison : on ne pose pas de questions.":"A client asked for the utmost discretion. It’s the house rule: no questions asked.","Quel client, monsieur Suisse ?":"Which client, Mr Swiss?","Il a payé en liquide. Et il sentait… la violette, je crois.":"He paid in cash. And he smelled of… violets, I believe.","Le registre des coffres a été falsifié.":"The safe register has been forged.","Le faux a été fait à {h}, {lieu}, par la seule personne présente. La porte de la salle du conseil est fermée ; la clé est d’abord chez Ernest.":"The forgery was done at {h}, {lieu}, by the only person there. The boardroom door is locked; Ernest has the key at first.","Ernest au coffre":"Ernest in the vault","Des coups sourds résonnent dans la salle des coffres.":"Dull thumps echo from the vault.","Au secours ! On m’a enfermé avec les coffres ! J’ai du café, mais pas de sucre !":"Help! I’ve been locked in with the safes! I’ve got coffee, but no sugar!","On l’a poussé à l’intérieur {lieu} à {h}. Le coupable était seul avec lui.":"He was pushed inside {lieu} at {h}. The culprit was alone with him.","Il me suivait partout ! Je voulais juste qu’il me lâche cinq minutes !":"He followed me everywhere! I just wanted him to leave me alone for five minutes!","Je vous suivais parce que vous aviez renversé du café sur la moquette, mademoiselle.":"I followed you because you spilled coffee on the carpet, miss.","Ernest a été enfermé dans la salle des coffres.":"Ernest has been locked in the vault.","Il y a été poussé à {h}, {lieu}, par une personne seule avec lui. Ensuite, il n’a plus bougé. Les portes de la salle des coffres sont fermées ; la clé est d’abord chez Gaspard Pièce.":"He was pushed in at {h}, {lieu}, by someone alone with him. After that, he did not move. The vault doors are locked; Gus Pick has the key at first.","enfermement":"locking-in","Le faux billet":"The fake banknote","Un faux billet de mille francs ! Dans MA banque ! Et l’encre n’est même pas sèche !":"A fake thousand-franc note! In MY bank! And the ink isn’t even dry!","On l’a glissé dans la caisse {lieu} à {h}. Le faussaire était seul.":"It was slipped into the till {lieu} at {h}. The forger was alone.","C’était pour rire ! Pia dessine les billets, et moi je les glisse. On fait ça à chaque carnaval.":"It was a joke! Pia draws the notes, and I slip them in. We do it every carnival.","Paola ! Pas devant la détective !":"Paola! Not in front of the detective!","Un faux billet a été glissé dans la banque.":"A fake banknote was slipped into the bank.","Il a été déposé à {h}, {lieu}, par la seule personne présente. La porte du bureau du directeur est fermée ; la clé est d’abord chez Frank Suisse.":"It was left at {h}, {lieu}, by the only person there. The director’s office door is locked; Frank Swiss has the key at first.","la faussaire":"the forger","Le conseil secret":"The secret board meeting","Une lettre sur la table du conseil ! « Ouvrez le coffre du collier, ou toute la Suisse saura ce que vous cachez. »":"A letter on the boardroom table! “Open the necklace safe, or all of Switzerland will know what you’re hiding.”","Elle a été déposée {lieu} à {h}, par quelqu’un de seul. Et ce quelqu’un ment dans tout ce qu’il dit.":"It was left {lieu} at {h}, by someone alone. And that someone lies in every statement.","D’accord, c’est moi. Mon client veut le collier, et il le veut avant la vente de Drouot.":"All right, it was me. My client wants the necklace, and he wants it before the Drouot sale.","Votre client, Ana. Son nom.":"Your client, Anna. His name.","Je ne l’ai jamais vu. Il m’écrit. Ses lettres sentent la violette, et il signe d’un hibou. Comme les autres.":"I’ve never seen him. He writes to me. His letters smell of violets, and he signs with an owl. Like the others.","Une lettre de chantage menace le banquier.":"A blackmail letter threatens the banker.","Elle a été déposée à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai. La porte de la salle du conseil est fermée ; la clé est d’abord chez Frank Suisse.":"It was left at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth. The boardroom door is locked; Frank Swiss has the key at first.","le corbeau":"the poison pen","Le coffre de minuit":"The midnight vault","Minuit. La banque est fermée.":"Midnight. The bank is closed.","Ou presque.":"Or almost.","Au matin, Jacques Potte est retrouvé dans la salle des coffres. Mort.":"In the morning, Jack Potts is found in the vault. Dead.","Il a été tué {lieu} à {h}. Son meurtrier était seul avec lui. Et pour entrer, il fallait la clé… ou son porteur.":"He was killed {lieu} at {h}. His killer was alone with him. And to get in, you needed the key… or its bearer.","Il avait vu le visage de l’homme à la violette, au casino, il y a des années. La lettre disait : « Il va parler à la détective. »":"He’d seen the violet man’s face at the casino, years ago. The letter said: “He’s going to talk to the detective.”","Et le collier, René ?":"And the necklace, Noah?","Il est parti hier. Dans une caisse. Pour un musée de cire, à Paris.":"It left yesterday. In a crate. For a wax museum in Paris.","Fin du chapitre 13.":"End of chapter 13.","Retour à Paris.":"Back to Paris.","Jacques Potte a été assassiné dans la salle des coffres.":"Jack Potts has been murdered in the vault.","Il a été tué à {h}, {lieu}, par une personne seule avec lui. Les portes de la salle des coffres sont fermées ; la clé est d’abord chez Gaspard Pièce.":"He was killed at {h}, {lieu}, by someone alone with him. The vault doors are locked; Gus Pick has the key at first.","La tête du roi":"The king’s head","La tête de Louis XIV a disparu ! Il reste le corps, et la perruque est par terre !":"Louis XIV’s head is gone! The body is still there, and the wig is on the floor!","Cyrielle Bougie, sculptrice du musée. Elle a toujours les doigts pleins de cire.":"Candice Wick, the museum’s sculptor. Her fingers are always covered in wax.","On sait où : dans la galerie des rois. Mais on ne sait pas quand. Le gardien est passé plusieurs fois : la tête était là, puis elle n’était plus là.":"We know where: in the gallery of kings. But we don’t know when. The guard went by several times: the head was there, then it wasn’t.","Nouveau : le bon moment. Le lieu est connu, pas l’heure. Parmi les heures possibles, une seule où un seul suspect était dans la pièce : c’est l’heure du vol, et c’est le voleur.":"New: the right moment. The place is known, not the time. Among the possible times, only one has a single suspect in the room: that is the time of the theft, and that is the thief.","Je l’ai mise dans mon trou de souffleur, pour me tenir compagnie. Elle est de très bon conseil.":"I put it in my prompter’s box to keep me company. It gives very good advice.","Un Roi-Soleil souffleur, Sam ? Il doit se retourner dans sa tombe.":"A Sun King as a prompter, Sam? He must be turning in his grave.","La tête de Louis XIV a disparu.":"Louis XIV’s head has disappeared.","Elle a été prise dans la galerie des rois, à l’une de ces heures : {heures}. À l’heure du vol, et seulement à celle-là, il n’y avait qu’une personne dans la galerie.":"It was taken in the gallery of kings, at one of these times: {heures}. At the time of the theft, and only then, there was just one person in the gallery.","La couronne de l’impératrice":"The empress’s crown","La couronne de Joséphine ! Elle était sur sa tête de cire, et maintenant elle est sur… rien !":"Josephine’s crown! It was on her wax head, and now it’s on… nothing!","Max Valise, l’ancien groom du Grand Hôtel, est aujourd’hui guide au musée.":"Lou Gage, the old bellboy from the Grand Hotel, is now a guide at the museum.","Encore la galerie des rois. Encore une heure à trouver.":"The gallery of kings again. Another time to find.","Je l’ai empruntée pour la recoudre ! Les perles tombaient. Une habilleuse ne supporte pas une couronne mal cousue.":"I borrowed it to sew it back together! The pearls were falling off. A dresser can’t stand a badly sewn crown.","On demande la permission, Paulette. Même à une impératrice en cire.":"You ask permission, Sally. Even from a wax empress.","La couronne de Joséphine a disparu.":"Josephine’s crown has disappeared.","Elle a été prise dans la galerie des rois, à l’une de ces heures : {heures}. À l’heure du vol, il n’y avait qu’une personne dans la galerie.":"It was taken in the gallery of kings, at one of these times: {heures}. At the time of the theft, there was just one person in the gallery.","La diva de cire":"The wax diva","On m’a assommée dans la loge des artistes ! Avec une louche ! Une louche pleine de cire tiède !":"Someone knocked me out in the dressing room! With a ladle! A ladle full of warm wax!","Une louche de l’atelier. C’est arrivé {lieu} à {h}. Plusieurs personnes étaient peut-être là, mais une seule était passée par l’atelier avant.":"A ladle from the workshop. It happened {lieu} at {h}. Several people may have been there, but only one had been through the workshop beforehand.","Je voulais prendre l’empreinte de son visage pour sa statue ! Elle bougeait tout le temps. Alors j’ai… calmé le modèle.":"I wanted to take a cast of her face for her statue! She kept moving. So I… calmed the model down.","Calmé le modèle ?!":"Calmed the model down?!","Pas de statue de cette façon, Cyrielle.":"No statues that way, Candice.","Aria Vibrato a été assommée.":"Aria Vibrato has been knocked out.","Elle a été frappée à {h}, {lieu}, avec une louche de l’atelier des cires. Parmi ceux qui étaient avec elle, le coupable est le seul à être passé par l’atelier avant. Ensuite, Aria n’a plus bougé.":"She was struck at {h}, {lieu}, with a ladle from the wax workshop. Of those who were with her, the culprit is the only one who had been through the workshop beforehand. After that, Aria did not move.","Le fantôme du petit théâtre":"The ghost of the little theatre","Quelqu’un a scié les cordes du rideau du petit théâtre ! Il est tombé sur le premier rang… qui était vide, heureusement.":"Someone sawed through the curtain ropes in the little theatre! It fell on the front row… which was empty, luckily.","On sait où. Reste à savoir quand.":"We know where. Now we need to know when.","Je voulais une sortie spectaculaire ! Un ténor ne sort pas de scène : il disparaît derrière un rideau qui tombe.":"I wanted a spectacular exit! A tenor doesn’t leave the stage: he vanishes behind a falling curtain.","Il y avait une répétition prévue, Enzo.":"There was a rehearsal scheduled, Enzo.","Ah. J’ai oublié de regarder le programme.":"Ah. I forgot to check the programme.","Les cordes du rideau ont été sciées.":"The curtain ropes have been sawn through.","C’est arrivé dans le petit théâtre, à l’une de ces heures : {heures}. Le coupable y était seul.":"It happened in the little theatre, at one of these times: {heures}. The culprit was alone there.","Le palais des mirages":"The palace of illusions","Le grand miroir du palais des mirages a été volé ! Il reste un trou dans le mur… et dans le trou, un autre miroir.":"The big mirror in the palace of illusions has been stolen! There’s a hole in the wall… and in the hole, another mirror.","On sait où, pas quand. Et n’oublions pas : « une des jumelles » ne dit pas laquelle.":"We know where, not when. And remember: “one of the twins” doesn’t say which.","Nous voulions savoir laquelle de nous deux était la plus belle. Il nous fallait un miroir qui ne ment pas.":"We wanted to know which of us was the prettiest. We needed a mirror that doesn’t lie.","Il a dit que c’était moi.":"It said I was.","Un miroir a disparu du palais des mirages.":"A mirror has disappeared from the palace of illusions.","Il a été pris au palais des mirages, à l’une de ces heures : {heures}. La voleuse ou le voleur y était seul.":"It was taken in the palace of illusions, at one of these times: {heures}. The thief was alone there.","La lettre dans la cire":"The letter in the wax","Une lettre ! Coulée dans la cire de la statue de la Comtesse ! « Je sais qui tu es. Paie, ou je parle. »":"A letter! Cast into the wax of the Countess’s statue! “I know who you are. Pay, or I talk.”","Elle a été cachée {lieu} à {h}, par quelqu’un de seul. Et ce quelqu’un ment dans tout ce qu’il dit.":"It was hidden {lieu} at {h}, by someone alone. And that someone lies in every statement.","J’ai vu l’homme à la violette au Grand Hôtel, il y a longtemps. Je portais ses valises. Je voulais juste un peu d’argent pour me taire.":"I saw the violet man at the Grand Hotel, long ago. I carried his bags. I only wanted a little money to keep quiet.","Qui est-ce, Max ? Dites-le-moi, c’est dangereux.":"Who is he, Lou? Tell me, it’s dangerous.","Demain, madame Lafleur. Demain, je vous dirai tout.":"Tomorrow, Mrs Bloom. Tomorrow I’ll tell you everything.","Une lettre de chantage a été cachée dans la cire.":"A blackmail letter was hidden in the wax.","Elle a été déposée à {h}, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai.":"It was left at {h}, {lieu}, by the only person there. The culprit lies; the others tell the truth.","Au pied de la Comtesse":"At the Countess’s feet","Le lendemain matin.":"The next morning.","Max Valise est retrouvé sans vie au pied de la statue de la Comtesse, dans la salle des grands criminels.":"Lou Gage is found dead at the feet of the Countess’s statue, in the chamber of great criminals.","On sait où. On ne sait pas quand. Il allait tout me dire…":"We know where. We don’t know when. He was going to tell me everything…","La lettre disait : « Le groom va parler. » Et elle promettait le collier. Le vrai. Pour moi, si je le faisais.":"The letter said: “The bellboy is going to talk.” And it promised the necklace. The real one. For me, if I did it.","Le collier était caché dans la statue de la Comtesse, n’est-ce pas ?":"The necklace was hidden in the Countess’s statue, wasn’t it?","Je l’ai remis dans sa caisse. Pour Drouot. La vente a lieu demain.":"I put it back in its crate. For Drouot. The sale is tomorrow.","Fin du chapitre 14.":"End of chapter 14.","Retour au point de départ : la vente des Larmes de Lune.":"Back to where it all began: the sale of the Moon Tears.","Max Valise a été assassiné.":"Lou Gage has been murdered.","Il a été tué dans la salle des grands criminels, à l’une de ces heures : {heures}. À l’heure du crime, le meurtrier était le seul suspect dans la salle. Aux autres heures, la salle était vide, ou il y avait du monde.":"He was killed in the chamber of great criminals, at one of these times: {heures}. At the time of the crime, the killer was the only suspect in the room. At the other times, the room was empty, or there was a crowd.","La clé de la réserve":"The storeroom key","Hôtel Drouot.":"Hôtel Drouot.","La grande vente commence dans une heure.":"The big sale starts in an hour.","Le catalogue des Larmes de Lune a disparu de la réserve ! Je m’en souviens, cette fois ! J’ai tout noté !":"The Moon Tears catalogue has vanished from the storeroom! I remember this time! I wrote everything down!","La réserve est fermée à clé. Au début, la clé était chez Ginette, qui veut tout acheter.":"The storeroom is locked. At the start, Goldie had the key, and she wants to buy everything.","Je voulais voir la photo du collier une dernière fois. C’était celui de ma tante, quand même.":"I wanted to see the photo of the necklace one last time. It was my aunt’s, after all.","Vous êtes plus sentimental que vous ne le dites, Rémi.":"You’re more sentimental than you let on, Remy.","Le catalogue a disparu de la réserve.":"The catalogue has disappeared from the storeroom.","Il a été pris à {h}, {lieu}, par la seule personne présente. Les portes de la réserve sont fermées ; la clé est d’abord chez Ginette Pépite.":"It was taken at {h}, {lieu}, by the only person there. The storeroom doors are locked; Goldie Nugget has the key at first.","Le cadre vide":"The empty frame","Un cadre doré se brise.":"A gilded frame shatters.","On m’a assommé avec un cadre. Vide, heureusement. Je me souviens de tout jusque-là, madame.":"Someone knocked me out with a frame. An empty one, luckily. I remember everything up to then, madam.","Le cadre venait de la réserve. C’est arrivé {lieu} à {h}. Parmi ceux qui étaient avec Ernest, une seule personne était passée par la réserve avant.":"The frame came from the storeroom. It happened {lieu} at {h}. Of those who were with Ernest, only one had been through the storeroom beforehand.","Il m’a prise pour Pia ! Il voulait me rendre un mouchoir qu’elle avait perdu. Ça m’énerve, qu’on nous confonde !":"He thought I was Pia! He wanted to give me back a handkerchief she’d lost. It drives me mad when people mix us up!","Toujours au mauvais endroit, au mauvais moment. C’est mon talent, madame.":"Always in the wrong place at the wrong time. It’s my gift, madam.","Ernest a été assommé avec un cadre.":"Ernest has been knocked out with a frame.","Il a été frappé à {h}, {lieu}, avec un cadre de la réserve. Parmi ceux qui étaient avec lui, le coupable est le seul à être passé par la réserve avant. Ensuite, Ernest n’a plus bougé.":"He was struck at {h}, {lieu}, with a frame from the storeroom. Of those who were with him, the culprit is the only one who had been through the storeroom beforehand. After that, Ernest did not move.","la coupable":"the culprit","Panne à Drouot":"Power cut at Drouot","Les lumières de Drouot s’éteignent d’un coup.":"The lights at Drouot go out all at once.","Mes boucles d’oreilles ! On me les a retirées dans le noir !":"My earrings! Someone took them off me in the dark!","La panne a eu lieu à {h}. La voleuse ou le voleur était seul {lieu}, et ment dans tout ce qu’il dit.":"The power cut was at {h}. The thief was alone {lieu}, and lies in every statement.","Pour mon roman ! « Les Boucles de la diva ». Il fallait que je sache si c’était faisable dans le noir.":"For my novel! “The Diva’s Earrings”. I had to know if it could be done in the dark.","C’est faisable, Agathe. Et ça se voit quand même.":"It can, Agatha. And it shows all the same.","Les boucles d’oreilles d’Aria ont disparu pendant la panne.":"Aria’s earrings disappeared during the power cut.","Elles ont été prises à {h}, en pleine panne, {lieu}, par la seule personne présente. Le coupable ment ; les autres disent vrai.":"They were taken at {h}, during the power cut, {lieu}, by the only person there. The culprit lies; the others tell the truth.","Le marteau d’ivoire":"The ivory gavel","Le marteau d’ivoire de maître Vandu, exposé en sa mémoire, a disparu de la salle d’exposition !":"Mr Down’s ivory gavel, displayed in his memory, has disappeared from the viewing room!","Il fallait bien un marteau pour la vente ! Et je compte adjuger le collier… à moi-même.":"We needed a gavel for the sale! And I intend to knock the necklace down… to myself.","Ce n’est pas ainsi que fonctionnent les enchères, madame Pépite. Rendez-le au bureau.":"That’s not how auctions work, Mrs Nugget. Put it back in the office.","Le marteau de maître Vandu a disparu.":"Mr Down’s gavel has disappeared.","Il a été pris dans la salle d’exposition, à l’une de ces heures : {heures}. La voleuse ou le voleur y était seul.":"It was taken in the viewing room, at one of these times: {heures}. The thief was alone there.","Le dernier faux":"The last fake","Le collier de la vente est un faux ! Encore un ! On l’a échangé ce matin !":"The necklace in the sale is a fake! Another one! It was swapped this morning!","Cette fois, deux personnes mentent : la coupable ou le coupable, et un complice.":"This time, two people are lying: the culprit, and an accomplice.","Nouveau : deux menteurs. Le coupable ment dans tout ce qu’il dit, et un complice aussi. Tous les autres disent vrai.":"New: two liars. The culprit lies in every statement, and so does an accomplice. Everyone else tells the truth.","C’est moi. Mon client m’avait donné la copie. Il m’avait juré que l’inspecteur me couvrirait.":"It was me. My client gave me the copy. He swore the inspector would cover for me.","L’inspecteur ? Inspecteur Songe… vous avez menti dans votre déposition.":"The inspector? Inspector Fibbs… you lied in your statement.","Une erreur de mémoire, madame Lafleur. Ça arrive à tout le monde. Même à vous.":"A slip of memory, Mrs Bloom. It happens to everyone. Even you.","Le collier de la vente a été remplacé par un faux.":"The necklace in the sale has been replaced with a fake.","L’échange a eu lieu à {h}, {lieu}, par la seule personne présente. Deux suspects mentent dans tout ce qu’ils disent : le coupable et un complice.":"The swap took place at {h}, {lieu}, by the only person there. Two suspects lie in every statement: the culprit and an accomplice.","Les lettres au hibou":"The owl letters","Toutes les lettres au hibou ! Je les gardais dans le bureau du commissaire-priseur. Elles ont disparu !":"All the owl letters! I kept them in the auctioneer’s office. They’re gone!","Elles ont été prises à {h}, madame Lafleur, {lieu}. Et vous dites qu’il y a encore deux menteurs ?":"They were taken at {h}, Mrs Bloom, {lieu}. And you say there are two liars again?","On m’a demandé de les brûler. Une lettre glissée sous ma porte… et l’inspecteur m’a dit que c’était pour l’enquête.":"I was asked to burn them. A letter slipped under my door… and the inspector told me it was for the investigation.","Encore lui. Inspecteur Songe, où étiez-vous quand le marquis est mort ? Et pendant la panne au Grand-Col ?":"Him again. Inspector Fibbs, where were you when the marquis died? And during the power cut at the Grand-Col?","Toujours à vos côtés, madame Lafleur. Vous ne l’aviez pas remarqué ?":"Always by your side, Mrs Bloom. Hadn’t you noticed?","Un parfum de violette flotte dans le bureau.":"A scent of violets hangs in the office.","Les lettres au hibou ont disparu.":"The owl letters have disappeared.","Elles ont été prises à {h}, {lieu}, par la seule personne présente. Deux suspects mentent : le coupable et un complice.":"They were taken at {h}, {lieu}, by the only person there. Two suspects lie: the culprit and an accomplice.","La vente des Larmes de Lune commence enfin.":"The sale of the Moon Tears finally begins.","La Comtesse a été extraite de prison pour y assister.":"The Countess has been brought from prison to attend.","Lot numéro un : les Larmes de Lune. Mise à prix…":"Lot number one: the Moon Tears. Starting price…","Un coup de marteau. Pas sur le pupitre : sur la tête d’Ana Gramme.":"A bang of the gavel. Not on the rostrum: on Anna Gram’s head.","Ana a été frappée {lieu} à {h}, avec le marteau du bureau. Parmi ceux qui étaient avec elle, un seul était passé le prendre. Et deux personnes mentent.":"Anna was struck {lieu} at {h}, with the gavel from the office. Of those who were with her, only one had gone to fetch it. And two people are lying.","Bravo, madame Lafleur. Vous y avez mis le temps.":"Bravo, Mrs Bloom. You took your time.","La violette. Le hibou. Les lettres. Vous écriviez au nom de votre mère, inspecteur.":"The violets. The owl. The letters. You were writing in your mother’s name, Inspector.","Armand ! Je t’avais dit de ne pas…":"Philip! I told you not to…","Votre fils, comtesse. Le complice que vous m’annonciez au parloir. Vous venez de vous trahir.":"Your son, Countess. The accomplice you hinted at in the visiting room. You’ve just given yourself away.","Je voulais seulement lui rendre son collier. Et faire payer ceux qui l’avaient envoyée en prison.":"I only wanted to give her back her necklace. And make those who sent her to prison pay.","Inspecteur Songe, vous êtes en état d’arrestation. Je garde vos menottes en souvenir.":"Inspector Fibbs, you are under arrest. I’ll keep your handcuffs as a souvenir.","FIN. Les Larmes de Lune sont rendues aux assurances.":"THE END. The Moon Tears go back to the insurers.","Hortense Lafleur a enfin le temps de finir son roman policier. Sauf si…":"Hortense Bloom finally has time to finish her detective novel. Unless…","Ana Gramme a été assommée en pleine vente.":"Anna Gram has been knocked out in the middle of the sale.","Elle a été frappée à {h}, {lieu}, avec le marteau d’ivoire du bureau du commissaire-priseur. Parmi ceux qui étaient avec elle, le coupable est le seul à être passé par le bureau avant. Deux suspects mentent : le coupable et un complice.":"She was struck at {h}, {lieu}, with the auctioneer’s ivory gavel from the office. Of those who were with her, the culprit is the only one who had been through the office beforehand. Two suspects lie: the culprit and an accomplice.","Moi, madame Lafleur ? Je suis de votre côté. Je l’ai toujours été.":"Me, Mrs Bloom? I’m on your side. I always have been.","Objection ! Je juge les coupables, je ne les imite pas.":"Objection! I judge culprits, I don’t imitate them.","Trente ans que je garde des voleurs. Je sais comment ils finissent.":"Thirty years guarding thieves. I know how they end up.","Je critique l’art, madame. Je ne le vole pas.":"I critique art, madam. I don’t steal it.","Un Montfaucon ne s’abaisse pas. Il fait faire.":"A Montfaucon never stoops. He has it done.","Ce n’est pas moi ! C’est peut-être ma sœur. Ou peut-être pas.":"It wasn’t me! Maybe it was my sister. Or maybe not.","Vous me confondez avec Pia. Tout le monde nous confond.":"You’re confusing me with Pia. Everyone confuses us.","Je fais vœu de silence, madame. Pas vœu de mensonge.":"I took a vow of silence, madam. Not a vow of lying.","La banque Lombard est neutre, madame. Moi aussi.":"The Lombard bank is neutral, madam. So am I.","Si c’était moi, vous n’auriez trouvé aucune trace. Je suis serrurier.":"If it were me, you’d have found no trace. I’m a locksmith.","Accusez-moi si vous voulez, mais ça ne tiendra pas. Ça fondra.":"Accuse me if you like, but it won’t hold. It’ll melt.","Ma chère Hortense, je suis en prison. C’est un alibi en béton.":"My dear Hortense, I’m in prison. That’s a cast-iron alibi.","tarte":"pie","poison":"poison"});

    var used = {}, out = [], i, k;

    for (k = 0; k < 15; k++) if (!used[k]) free.push(k);

  };
