 9:30 pm. The chef, for his part, passed through the lift at some point in the evening, singing.", "J’ai déjà mon trousseau, madame : vingt-trois clés, et aucune n’ouvre le bonheur.": "I already have my own bunch, madam: twenty-three keys, and none of them opens the door to happiness.", "Une clé ? Moi, je n’ouvre que des bouteilles.": "A key? The only thing I open is bottles.", "La seule clé qui m’intéresse, c’est la clé du garde-manger !": "The only key I care about is the key to the pantry!", "Cocktail secret": "Secret cocktail", "Le carnet de cocktails du barman a été volé.": "The barman’s cocktail notebook has been stolen.", "Il a été subtilisé à {h}, {lieu}. Le voleur y était seul, peut-être un peu assoiffé.": "It was swiped at {h}, {lieu}. The thief was alone there, perhaps a little thirsty.", "Mon carnet de recettes ! Le secret du « Mouette Sauvage » ! Trente ans de shaker, envolés !": "My recipe book! The secret of the “Wild Gull”! Thirty years of shaking, gone!", "Le carnet a disparu {lieu}, à {h}.": "The notebook disappeared {lieu}, at {h}.", "Mamma mia… je voulais la recette pour ma sauce. Une sauce Mouette Sauvage, ça aurait fait un malheur !": "Mamma mia… I wanted the recipe for my sauce. A Wild Gull sauce would have been a smash hit!", "Un malheur, c’est le mot, chef.": "A smash is the word, chef.", "Le lendemain, la femme de chambre fait une découverte troublante.": "The next day, the chambermaid makes a troubling discovery.", "À 20 h et à 20 h 30, le directeur suivait le chef partout pour discuter du prix du caviar.": "At 8 pm and at 8:30 pm, the manager was following the chef everywhere to discuss the price of caviar.", "Ginette a gardé Max près d’elle à 20 h comme à 20 h 30, pour lui faire porter ses quatorze chapeaux.": "Goldie kept Lou close at 8 pm and at 8:30 pm, to have him carry her fourteen hats.", "Quand la pendule a sonné neuf coups, Ginette complimentait le chef Al Dente sur ses moustaches.": "When the clock struck nine, Goldie was complimenting Chef Al Dente on his moustache.", "À 21 h, Max était seul, assis sur une valise. Il n’en a pas bougé jusqu’à 21 h 30.": "At 9 pm, Lou was alone, sitting on a suitcase. He didn’t move from it until 9:30 pm.", "Ginette a changé quatre fois de pièce. À 22 h, elle était seule, et elle s’en plaignait à voix haute.": "Goldie changed rooms four times. At 10 pm she was alone, and complaining about it loudly.", "Le directeur n’a changé que deux fois de pièce, dont une entre 20 h 30 et 21 h. Il économise ses pas.": "The manager changed rooms only twice, once of them between 8:30 pm and 9 pm. He saves his steps.", "Le chef n’a pas bougé à 21 h 30 comme à 22 h. Il « réfléchissait », dit-il.": "The chef stayed put at 9:30 pm and at 10 pm. He was “thinking”, he says.", "Personne sur la terrasse à 22 h : les mouettes avaient chassé tout le monde.": "Nobody on the terrace at 10 pm: the seagulls had chased everyone away.", "Max n’a jamais mis les pieds dans le couloir de la soirée, mais il est passé par le restaurant.": "Lou never set foot in the corridor all evening, but he did pass through the restaurant.", "Le chef est passé par la terrasse, mais jamais par la suite 12 : « Je ne monte pas, je cuisine. »": "The chef passed through the terrace, but never through suite 12: “I don’t go upstairs, I cook.”", "Voler une recette dans mon propre hôtel ? Je préfère encore la commander au bar.": "Steal a recipe in my own hotel? I’d rather just order it at the bar.", "Moi, je ne bois que du lait-grenadine, madame.": "Me, I only drink milk with grenadine, madam.", "Je ne copie pas les recettes, très chère. Je les fais servir.": "I don’t copy recipes, darling. I have them served.", "Lit défait": "The unmade bed", "Quelqu’un a fait la sieste dans le lit de camp du veilleur.": "Someone took a nap on the night watchman’s camp bed.", "La sieste a commencé à {h}, {lieu}. Le dormeur y était seul. Qui ?": "The nap began at {h}, {lieu}. The sleeper was alone there. Who?", "sieste": "nap", "Le lit de camp du veilleur de nuit, je l’avais fait au carré. Et maintenant… il est défait ! Quelqu’un a dormi dedans !": "I made the night watchman’s camp bed with hospital corners. And now… it’s unmade! Someone slept in it!", "Quelqu’un s’est glissé {lieu} à {h}. Seul, et sans doute fatigué.": "Someone slipped in {lieu} at {h}. Alone, and no doubt tired.", "Je dirige cet hôtel depuis vingt ans sans jamais dormir une nuit entière… Ce lit de camp est divin.": "I’ve run this hotel for twenty years without ever sleeping a whole night… That camp bed is divine.", "Paul Ochon… polochon ! Un directeur qui dort dans les suites, c’était écrit.": "Paul Pillow… of course! A manager who sleeps in the suites, it was written all over his name.", "Mais à l’heure du thé, Marcelle, la mouette empaillée de l’entrée, a disparu.": "But at teatime, Marcelle, the stuffed seagull in the entrance hall, has disappeared.", "À 20 h, le barman servait un double expresso au directeur et un jus d’orange à Max. Rémi n’était pas avec le barman : il évite les endroits où l’on paie.": "At 8 pm, the barman was serving a double espresso to the manager and an orange juice to Lou. Remy was not with the barman: he avoids places where you have to pay.", "Max ne lâche plus le barman : à 20 h 30 comme à 22 h, il était à ses côtés, à apprendre le shaker.": "Lou won’t leave the barman’s side: at 8:30 pm and at 10 pm he was right next to him, learning to shake cocktails.", "À 20 h 30, Rémi a proposé au directeur un pari sur la couleur des serviettes. Le directeur a refusé.": "At 8:30 pm, Remy offered the manager a bet on the colour of the napkins. The manager declined.", "Quand la pendule a sonné neuf coups, Rémi demandait au barman une ardoise. Refusée aussi.": "When the clock struck nine, Remy was asking the barman for a tab. Declined as well.", "À 21 h 30, Rémi était seul, à compter ce qu’il lui restait. Pas grand-chose.": "At 9:30 pm, Remy was alone, counting what he had left. Not much.", "Le directeur a changé trois fois de pièce : pas entre 20 h 30 et 21 h, mais bien entre 21 h 30 et 22 h, et il bâillait.": "The manager changed rooms three times: not between 8:30 pm and 9 pm, but indeed between 9:30 pm and 10 pm, and he was yawning.", "À 22 h 30, le directeur était seul, à se ronger les ongles en pensant à la presse.": "At 10:30 pm, the manager was alone, biting his nails at the thought of the press.", "Max et Rémi ont chacun changé cinq fois de pièce : l’un portait des valises, l’autre fuyait ses créanciers.": "Lou and Remy each changed rooms five times: one was carrying suitcases, the other was dodging his creditors.", "Le bar était désert à 20 h 30 ; la terrasse, vide quand la pendule a sonné neuf coups.": "The bar was deserted at 8:30 pm; the terrace empty when the clock struck nine.", "Max n’a jamais mis les pieds ni dans le couloir ni dans le restaurant : trop de clients qui réclament un service.": "Lou never set foot in either the corridor or the restaurant: too many guests demanding service.", "Rémi est passé par la suite 12 à un moment de la soirée. Pour « admirer la vue », dit-il.": "Remy passed through suite 12 at some point in the evening. To “admire the view”, he says.", "Une sieste ? Je cours dans les couloirs toute la journée, madame, je n’ai pas le temps de dormir !": "A nap? I run up and down the corridors all day, madam, I don’t have time to sleep!", "Je dors debout derrière mon comptoir, madame. Je n’ai pas besoin d’un lit.": "I sleep standing up behind my bar, madam. I don’t need a bed.", "Un lit de camp ? J’ai un vrai lit, madame. Payé à crédit, mais un vrai lit.": "A camp bed? I have a real bed, madam. Bought on credit, but a real bed.", "La mouette empaillée": "The stuffed seagull", "Marcelle, la mouette empaillée, a disparu.": "Marcelle, the stuffed seagull, has disappeared.", "Elle a quitté son perchoir à {h}, {lieu}. Quatre suspects, un seul oiseau.": "She left her perch at {h}, {lieu}. Four suspects, one single bird.", "disparition": "disappearance", "Marcelle ! Notre mascotte ! Empaillée en 1903 ! Le symbole de l’hôtel !": "Marcelle! Our mascot! Stuffed in 1903! The very symbol of the hotel!", "Marcelle a quitté son perchoir {lieu} à {h}. Quelqu’un l’a emportée, seul.": "Marcelle left her perch {lieu} at {h}. Someone carried her off, alone.", "Elle était pleine de poussière ! Je l’ai emmenée prendre un bain. Elle n’a pas protesté.": "She was covered in dust! I took her for a bath. She didn’t complain.", "Une mouette propre est une mouette heureuse. Rendez-la quand même.": "A clean seagull is a happy seagull. Give her back all the same.", "Cette nuit-là, la boîte à biscuits de la comtesse est retrouvée grand ouverte.": "That night, the countess’s biscuit tin is found wide open.", "À 21 h, Ginette racontait à Lise les potins de l’étage. À 21 h 30, Lise n’était plus avec elle : elle en avait assez entendu.": "At 9 pm, Goldie was telling Sheila the gossip from her floor. At 9:30 pm, Sheila was no longer with her: she had heard enough.", "À 22 h et à 22 h 30, Ginette était accoudée près du barman, à siroter son troisième « Mouette Sauvage ».": "At 10 pm and at 10:30 pm, Goldie was leaning on the bar next to the barman, sipping her third “Wild Gull”.", "Le chef n’a pas bougé à 20 h 30 comme à 21 h. À 21 h, il était seul et parlait à ses tomates.": "The chef stayed put at 8:30 pm and at 9 pm. At 9 pm he was alone, talking to his tomatoes.", "Le barman a changé cinq fois de pièce, et il est passé par le restaurant réclamer des citrons.": "The barman changed rooms five times, and he passed through the restaurant to beg for lemons.", "Lise a changé cinq fois de pièce, plumeau en main ; elle est passée par la terrasse et par le bar.": "Sheila changed rooms five times, feather duster in hand; she passed through the terrace and through the bar.", "Le chef a changé quatre fois de pièce sans jamais mettre les pieds sur la terrasse (les mouettes lui volent ses anchois) ni dans le restaurant (les clients lui posent des questions).": "The chef changed rooms four times without ever setting foot on the terrace (the seagulls steal his anchovies) or in the restaurant (the guests ask him questions).", "Ginette n’a pas bougé à 20 h 30 comme à 21 h, puis elle a changé de pièce entre 21 h et 21 h 30. Elle est passée par le restaurant dans la soirée.": "Goldie stayed put at 8:30 pm and at 9 pm, then changed rooms between 9 pm and 9:30 pm. She passed through the restaurant during the evening.", "Les cuisines sont restées désertes à 20 h, à 20 h 30 et à 22 h 30 : grève des marmitons.": "The kitchens stayed deserted at 8 pm, at 8:30 pm and at 10:30 pm: the kitchen boys were on strike.", "Quand la pendule a sonné neuf coups, l’ascenseur, le couloir et le restaurant étaient vides.": "When the clock struck nine, the lift, the corridor and the restaurant were empty.", "À 21 h 30, toujours personne dans le couloir ni dans le restaurant.": "At 9:30 pm, still nobody in the corridor or in the restaurant.", "Une mouette empaillée dans un cocktail ? Même moi, je n’ose pas.": "A stuffed seagull in a cocktail? Even I wouldn’t dare.", "Ce volatile est d’un goût affreux, ma chère. Je ne vole que ce qui brille.": "That bird is in dreadful taste, darling. I only steal what sparkles.", "Une mouette ? Je cuisine le poisson, pas ceux qui le mangent !": "A seagull? I cook fish, not the birds that eat them!", "Le coffre de l’hôtel": "The hotel safe", "La copie du collier a été volée dans sa boîte à biscuits.": "The copy of the necklace was stolen from its biscuit tin.", "Une nouvelle plume de hibou. La boîte a été ouverte à {h}, {lieu}. Attention : il faudra peut-être tester une hypothèse et voir si elle mène à une contradiction.": "Another owl feather. The tin was opened at {h}, {lieu}. Careful: you may need to test a hypothesis and see whether it leads to a contradiction.", "Le faux collier ! Je l’avais caché dans une boîte à biscuits — personne ne fouille une boîte à biscuits ! Et à la place… une plume !": "The fake necklace! I’d hidden it in a biscuit tin — nobody searches a biscuit tin! And in its place… a feather!", "Le Hibou veut même la copie. Intéressant. La boîte a été ouverte {lieu} à {h}. Cette énigme-là demande de poser des hypothèses.": "The Owl even wants the copy. Interesting. The tin was opened {lieu} at {h}. This puzzle calls for hypotheses.", "Le monsieur masqué laisse de très gros pourboires… Il m’a juste demandé d’ouvrir une boîte à biscuits. Je ne savais pas que c’était mal !": "The masked gentleman leaves very big tips… He only asked me to open a biscuit tin. I didn’t know it was wrong!", "Le Hibou recrute dans tous les métiers. Il me faut sa liste de contacts.": "The Owl recruits from every trade. I need his list of contacts.", "Le soir même, l’hôtel donne son grand bal annuel. Cinq suspects sur la piste…": "That same evening, the hotel holds its grand annual ball. Five suspects on the dance floor…", "Max ne lâchait pas Ginette d’une semelle : à 20 h 30 comme à 21 h, ils étaient dans la même pièce, une valise à chaque main.": "Lou wouldn’t leave Goldie’s side: at 8:30 pm and at 9 pm they were in the same room, a suitcase in each hand.", "À 22 h, Max et le barman se trouvaient dans la même pièce : le barman lui promettait « un gros pourboire, bientôt ».": "At 10 pm, Lou and the barman were in the same room: the barman was promising him “a big tip, soon”.", "À 20 h, Max était seul dans sa pièce, à astiquer ses valises.": "At 8 pm, Lou was alone in his room, polishing his suitcases.", "À 20 h 30, le barman était seul dans sa pièce, à compter ses bouteilles. Deux fois.": "At 8:30 pm, the barman was alone in his room, counting his bottles. Twice.", "Le directeur a changé cinq fois de pièce dans la soirée : un directeur d’hôtel est toujours quelque part ailleurs.": "The manager changed rooms five times during the evening: a hotel manager is always somewhere else.", "Max a changé trois fois de pièce : les valises ne se portent pas toutes seules.": "Lou changed rooms three times: suitcases don’t carry themselves.", "À 20 h comme à 20 h 30, Ginette est restée dans la même pièce, occupée à essayer ses bagues l’une après l’autre.": "At 8 pm and at 8:30 pm, Goldie stayed in the same room, busy trying on her rings one after another.", "À 21 h comme à 21 h 30, Max est resté dans la même pièce : il attendait un pourboire qui ne venait pas.": "At 9 pm and at 9:30 pm, Lou stayed in the same room: he was waiting for a tip that never came.", "À 21 h comme à 21 h 30, le barman est resté dans la même pièce : il « faisait l’inventaire ».": "At 9 pm and at 9:30 pm, the barman stayed in the same room: he was “taking stock”.", "Max a changé de pièce entre 20 h 30 et 21 h : il fuyait la réclamation d’un client.": "Lou changed rooms between 8:30 pm and 9 pm: he was fleeing a guest’s complaint.", "À 20 h, personne au bar : les verres attendaient en rang.": "At 8 pm, nobody at the bar: the glasses were waiting in a row.", "À 20 h 30, personne au restaurant ni à la réception.": "At 8:30 pm, nobody in the restaurant or at the reception.", "Le couloir était désert à 21 h 30, et encore à 22 h 30.": "The corridor was deserted at 9:30 pm, and again at 10:30 pm.", "Max n’a jamais mis les pieds dans le couloir : les moquettes, ça lui donne le vertige.": "Lou never set foot in the corridor: carpets make him dizzy.", "Le directeur est passé par le bar dans la soirée, pour surveiller la consommation de ses clients.": "The manager passed through the bar during the evening, to keep an eye on what his guests were drinking.", "Ginette est passée par le couloir et par l’ascenseur dans la soirée, à la recherche de sa bague préférée.": "Goldie passed through the corridor and the lift during the evening, looking for her favourite ring.", "Le barman est passé par la terrasse à un moment de la soirée, pour « prendre l’air ».": "The barman passed through the terrace at some point in the evening, to “get some air”.", "Cambrioler le coffre de mon propre hôtel ? Je fais déjà des cauchemars quand on vole une serviette !": "Burgle the safe of my own hotel? I already have nightmares when someone steals a towel!", "Une boîte à biscuits ? Si c’était moi, il ne resterait plus de biscuits, madame.": "A biscuit tin? If it were me, madam, there wouldn’t be a biscuit left.", "Une copie ? Je ne porte que du vrai, ma chère.": "A copy? I only wear the real thing, darling.", "Le bal des Mouettes": "The Gulls’ ball", "Le carnet d’Hortense a été volé pendant le bal.": "Hortense’s notebook was stolen during the ball.", "Cinq suspects cette fois. Le carnet a disparu à {h}, {lieu}. Il faudra ruser… sans carnet.": "Five suspects this time. The notebook disappeared at {h}, {lieu}. You’ll have to be cunning… without a notebook.", "En plein bal, les lumières s’éteignent. Quand elles se rallument, le carnet d’Hortense a disparu !": "In the middle of the ball, the lights go out. When they come back on, Hortense’s notebook has vanished!", "Mon carnet ! Toutes mes notes sur le Hibou ! On me l’a pris {lieu}, à {h}.": "My notebook! All my notes on the Owl! It was taken from me {lieu}, at {h}.", "Le Hibou voulait savoir ce que vous saviez. Il m’a promis une broche en diamant…": "The Owl wanted to know what you knew. He promised me a diamond brooch…", "Et où se cache-t-il, ce Hibou ?": "And where is this Owl hiding?", "Je ne sais pas… Mais il a parlé d’un testament, dans un manoir en Provence.": "I don’t know… But he mentioned a will, in a manor house in Provence.", "Fin du chapitre 2. Direction le Manoir des Oliviers.": "End of chapter 2. Next stop: the Olive Tree Manor.", "Quand la pendule a sonné huit coups, Ginette était avec le chef : elle voulait goûter les petits fours « avant les autres ».": "When the clock struck eight, Goldie was with the chef: she wanted to taste the petits fours “before everyone else”.", "À 20 h 30, Max faisait valser Lise. Entre 20 h 30 et 21 h, elle a changé de pièce : il lui marchait sur les pieds.": "At 8:30 pm, Lou was waltzing with Sheila. Between 8:30 pm and 9 pm she changed rooms: he kept treading on her toes.", "Quand la pendule a sonné dix coups, Max servait le champagne au directeur. Le chef, lui, n’était pas avec Max.": "When the clock struck ten, Lou was serving champagne to the manager. The chef, for his part, was not with Lou.", "Le chef a changé quatre fois de pièce. À 20 h 30, il était seul, à recompter ses petits fours (il en manquait).": "The chef changed rooms four times. At 8:30 pm he was alone, recounting his petits fours (some were missing).", "Le directeur n’a changé que deux fois de pièce. Il n’a pas bougé à 21 h comme à 21 h 30, et à 21 h 30 il était seul, à guetter les journalistes.": "The manager changed rooms only twice. He stayed put at 9 pm and at 9:30 pm, and at 9:30 pm he was alone, on the lookout for journalists.", "Lise n’a changé que deux fois de pièce : elle n’a pas bougé à 21 h 30 comme à 22 h, et elle est passée par la terrasse dans la soirée.": "Sheila changed rooms only twice: she stayed put at 9:30 pm and at 10 pm, and she passed through the terrace during the evening.", "Max a changé trois fois de pièce, et il est passé par les cuisines, plateau à la main.": "Lou changed rooms three times, and he passed through the kitchens, tray in hand.", "Ginette a changé de pièce entre 20 h et 20 h 30, puis n’a plus bougé à 21 h comme à 21 h 30. Elle est passée par la suite 12 au cours de la soirée.": "Goldie changed rooms between 8 pm and 8:30 pm, then stayed put at 9 pm and at 9:30 pm. She passed through suite 12 in the course of the evening.", "À 21 h 30, personne dans l’ascenseur ni à la réception.": "At 9:30 pm, nobody in the lift or at the reception.", "Quand la pendule a sonné dix coups, la terrasse était déserte : il pleuvait des confettis.": "When the clock struck ten, the terrace was deserted: it was raining confetti.", "Pendant mon bal ? J’étais trop occupé à compter les petits fours !": "During my ball? I was far too busy counting the petits fours!", "Je ramasse les confettis, madame, pas les carnets.": "I sweep up confetti, madam, not notebooks.", "Moi, au bal, je portais les manteaux. Pas les carnets !": "At the ball, I was carrying coats. Not notebooks!", "Pendant le bal, je surveillais mon soufflé. Un soufflé, ça ne se quitte pas des yeux !": "During the ball I was watching my soufflé. You never take your eyes off a soufflé!", "Le Manoir des Oliviers": "The Olive Tree Manor", "Provence. Un testament, une famille, et des témoins qui ne disent pas toujours la vérité.": "Provence. A will, a family, and witnesses who don’t always tell the truth.", "Le testament envolé": "The vanishing will", "Le testament de l’oncle Aristide a disparu.": "Uncle Aristide’s will has disappeared.", "Il a été volé à {h}, {lieu}. Chaque suspect a fait des déclarations : les innocents disent la vérité, le voleur ment à chaque fois. Trouve le menteur.": "It was stolen at {h}, {lieu}. Each suspect has made statements: the innocent tell the truth, the thief lies every time. Find the liar.", "Le Manoir des Oliviers. La famille de Carat s’y réunit pour lire le testament de l’oncle Aristide.": "The Olive Tree Manor. The Carat family gathers there to read Uncle Aristide’s will.", "Le testament a disparu ! Juste avant la lecture !": "The will has disappeared! Just before the reading!", "Nouvelle règle, comtesse : ici, chacun me donne sa version. Les innocents disent vrai. Le voleur, lui, ment sur tout.": "New rule, Countess: here, everyone gives me their version. The innocent tell the truth. The thief lies about everything.", "Tonton m’avait légué un chat. UN CHAT. J’ai voulu… améliorer un peu le texte.": "Uncle left me a cat. A CAT. I wanted to… improve the wording a little.", "On n’améliore pas un testament, Lucie. On le lit.": "You don’t improve a will, Lucy. You read it.", "L’après-midi, la tarte aux olives du goûter disparaît.": "In the afternoon, the olive tart for tea disappears.", "« À 19 h comme à 19 h 30, je n’ai pas bougé : une clause, ça ne se lit pas en marchant. »": "“At 7 pm and at 7:30 pm I didn’t move: you don’t read a clause while walking.”", "« À 20 h comme à 20 h 30, je suis resté au même endroit. En ma qualité de notaire, je n’ai rien vu. »": "“At 8 pm and at 8:30 pm I stayed in the same place. In my capacity as notary, I saw nothing.”", "« Hippolyte n’a jamais mis les pieds au jardin de la soirée. L’herbe abîme ses souliers vernis. »": "“Ivor never set foot in the garden all evening. Grass ruins his patent shoes.”", "« Le majordome est passé par la cave à un moment de la soirée. Je l’atteste. »": "“The butler passed through the cellar at some point in the evening. I can attest to it.”", "« Je suis passé par le bureau dans la soirée, pour relire le testament. Rien de plus. »": "“I passed through the study during the evening, to reread the will. Nothing more.”", "« À 19 h 30, Mademoiselle Lucie et moi étions dans la même pièce. Elle a goûté la sauce sans permission. »": "“At 7:30 pm, Miss Lucy and I were in the same room. She tasted the sauce without permission.”", "« Je n’ai pas quitté ma pièce à 20 h 30 comme à 21 h. Un majordome ne court pas : il glisse. »": "“I didn’t leave my room at 8:30 pm or at 9 pm. A butler doesn’t run: he glides.”", "« À 21 h, j’étais avec Hippolyte. Il m’a servi un thé tiède, comme d’habitude. »": "“At 9 pm I was with Ivor. He served me lukewarm tea, as usual.”", "« À 21 h, je n’étais pas avec le notaire. Dieu merci. »": "“At 9 pm I was not with the notary. Thank heavens.”", "« Hippolyte n’a pas bougé à 20 h comme à 20 h 30. Il fait partie des meubles. »": "“Ivor stayed put at 8 pm and at 8:30 pm. He’s part of the furniture.”", "« J’ai changé de pièce entre 19 h et 19 h 30. Je m’ennuyais. »": "“I changed rooms between 7 pm and 7:30 pm. I was bored.”", "« Hippolyte est passé par le salon dans la soirée, plumeau en main. Il époussetait les soupçons. »": "“Ivor passed through the drawing room during the evening, feather duster in hand. He was dusting off suspicions.”", "Voler un testament que je dois lire moi-même ? Ce serait me priver du meilleur moment.": "Steal a will I have to read out myself? That would rob me of the best part.", "Un majordome ne touche jamais aux papiers de monsieur, madame. Seulement à la poussière dessus.": "A butler never touches the master’s papers, madam. Only the dust on them.", "La tarte aux olives": "The olive tart", "La tarte aux olives a été engloutie.": "The olive tart has been gobbled up.", "Quelqu’un l’a mangée à {h}, {lieu}, tout seul. Les innocents disent vrai, le gourmand ment à chaque phrase.": "Someone ate it at {h}, {lieu}, all alone. The innocent tell the truth, the glutton lies in every sentence.", "goûter": "snack", "Ma tarte aux olives ! Je l’avais posée à refroidir, et il ne reste que le plat !": "My olive tart! I left it to cool, and only the dish is left!", "Elle a été dévorée {lieu}, à {h}. Écoutons ce que chacun raconte. L’un d’eux ment.": "It was devoured {lieu}, at {h}. Let’s hear what everyone has to say. One of them is lying.", "Les olives viennent de MES oliviers. C’était une sorte de… dégustation professionnelle.": "The olives come from MY olive trees. It was a sort of… professional tasting.", "Une dégustation de la tarte entière, Basile ?": "A tasting of the entire tart, Bud?", "Le soir, c’est le rosier préféré de l’oncle Aristide qui est saccagé.": "In the evening, it’s Uncle Aristide’s favourite rose bush that gets ransacked.", "« À 19 h 30 comme à 20 h, je n’ai pas bougé : ma pâte reposait, moi aussi. »": "“At 7:30 pm and at 8 pm I didn’t move: my pastry was resting, and so was I.”", "« À 20 h 30 comme à 21 h, je suis restée au même endroit, à éplucher. »": "“At 8:30 pm and at 9 pm I stayed in the same place, peeling.”", "« Rémi n’a jamais mis les pieds dans ma cuisine de la soirée. Heureusement : il m’aurait emprunté mes couteaux. »": "“Remy never set foot in my kitchen all evening. Just as well: he’d have borrowed my knives.”", "« À 20 h 30, j’étais au jardin, à cueillir du thym. »": "“At 8:30 pm I was in the garden, picking thyme.”", "« À 19 h, Julie et Basile étaient ensemble. Je parie qu’ils parlaient de courgettes. »": "“At 7 pm, Julie and Bud were together. I bet they were talking about courgettes.”", "« À 19 h 30, Julie et moi étions dans la même pièce. Je lui ai demandé un petit prêt… refusé. »": "“At 7:30 pm, Julie and I were in the same room. I asked her for a small loan… refused.”", "« Quand l’horloge a sonné neuf coups, Julie et Basile étaient encore ensemble. Je parie qu’ils parlaient toujours de courgettes. »": "“When the clock struck nine, Julie and Bud were still together. I bet they were still talking about courgettes.”", "« À 19 h, Julie était dans le bureau. Elle cherchait les chocolats de monsieur. »": "“At 7 pm, Julie was in the study. She was looking for the master’s chocolates.”", "« À 19 h 30, Rémi et moi étions ensemble, à parler de mes rosiers. »": "“At 7:30 pm, Remy and I were together, talking about my rose bushes.”", "« Rémi n’a pas bougé à 19 h comme à 19 h 30. Planté là comme un poireau. »": "“Remy stayed put at 7 pm and at 7:30 pm. Planted there like a leek.”", "« Rémi n’a jamais mis les pieds dans la bibliothèque. Il ne lit que les cotes des courses. »": "“Remy never set foot in the library. He only reads the racing odds.”", "« Rémi a fait un tour par le bureau dans la soirée. J’ai vu ses traces de semelles. »": "“Remy took a turn through the study during the evening. I saw his footprints.”", "« Rémi est passé par le jardin à un moment donné. Il a piétiné mes bégonias. »": "“Remy passed through the garden at some point. He trampled my begonias.”", "Engloutir ma propre tarte ? Je la connais par cœur, madame, je n’ai plus besoin de la goûter.": "Gobble up my own tart? I know it by heart, madam, I don’t need to taste it any more.", "Des olives ? Je suis fauché, madame, pas affamé… enfin, pas que.": "Olives? I’m broke, madam, not starving… well, not only.", "Le rosier d’Aristide": "Aristide’s rose bush", "Le rosier primé a été dépouillé.": "The prize-winning rose bush has been stripped bare.", "Toutes les roses ont été coupées à {h}, {lieu}. Le coupable y était seul. Ici, tous les constats sont vrais.": "Every rose was cut at {h}, {lieu}. The culprit was alone there. Here, all the findings are true.", "cueillette": "picking", "Le rosier de monsieur Aristide ! Toutes les roses coupées ! Il avait gagné trois concours !": "Mr Aristide’s rose bush! Every rose cut! It had won three competitions!", "Retour aux constats, sans témoignages. Les roses ont été coupées {lieu} à {h}.": "Back to findings, no testimonies. The roses were cut {lieu} at {h}.", "C’était… pour un bouquet. Pour mademoiselle Julie. Un majordome a aussi un cœur, madame.": "It was… for a bouquet. For Miss Julie. A butler has a heart too, madam.", "Un cœur, oui. Un sécateur, apparemment aussi.": "A heart, yes. And apparently a pair of secateurs as well.", "Le lendemain, la lecture du testament reprend… et le notaire s’endort au milieu.": "The next day, the reading of the will resumes… and the notary falls asleep in the middle of it.", "À 19 h 30, le majordome aidait Julie à écosser des petits pois. Julie, elle, n’a pas bougé à 19 h 30 comme à 20 h.": "At 7:30 pm, the butler was helping Julie shell peas. Julie, for her part, stayed put at 7:30 pm and at 8 pm.", "Le docteur n’a pas bougé à 19 h comme à 19 h 30 ; à 19 h 30, Lucie est venue lui réclamer des cachets « contre l’ennui ».": "The doctor stayed put at 7 pm and at 7:30 pm; at 7:30 pm, Lucy came to ask him for pills “against boredom”.", "À 20 h 30, Lucie se faisait ausculter par le docteur Cament. Diagnostic : mauvaise foi chronique.": "At 8:30 pm, Lucy was being examined by Dr Cation. Diagnosis: chronic bad faith.", "Quand l’horloge a sonné neuf coups, Julie servait une tisane à Lucie, qui l’a trouvée imbuvable.": "When the clock struck nine, Julie was serving herbal tea to Lucy, who found it undrinkable.", "Le majordome a changé cinq fois de pièce sans jamais mettre les pieds dans le hall, mais il est passé par le salon.": "The butler changed rooms five times without ever setting foot in the hall, but he did pass through the drawing room.", "Julie n’a changé que deux fois de pièce : elle n’a pas bougé à 20 h 30 comme à 21 h, et elle est passée par le salon.": "Julie changed rooms only twice: she stayed put at 8:30 pm and at 9 pm, and she passed through the drawing room.", "Lucie a changé trois fois de pièce, dont une fois entre 19 h 30 et 20 h.": "Lucy changed rooms three times, once of them between 7:30 pm and 8 pm.", "Lucie n’a pas bougé à 21 h comme à 21 h 30. Elle est passée par le salon dans la soirée, le nez en l’air.": "Lucy stayed put at 9 pm and at 9:30 pm. She passed through the drawing room during the evening, nose in the air.", "Le salon était désert à 19 h 30. Le docteur y est passé à un autre moment de la soirée.": "The drawing room was deserted at 7:30 pm. The doctor passed through it at another moment in the evening.", "Des roses ? Moi, je cueille des poireaux.": "Roses? I pick leeks.", "Des fleurs ? Je préfère qu’on m’en offre, voyons.": "Flowers? I’d rather someone gave me some, really.", "Mon diagnostic : allergie aux pollens. Je ne m’approche jamais des rosiers.": "My diagnosis: pollen allergy. I never go near rose bushes.", "Le notaire endormi": "The sleeping notary", "Le notaire s’est endormi pendant la lecture.": "The notary fell asleep during the reading.", "Son thé a été trafiqué à {h}, {lieu}. Même le notaire endormi a donné sa version. Les innocents disent vrai, le coupable ment toujours.": "His tea was tampered with at {h}, {lieu}. Even the sleeping notary gave his version. The innocent tell the truth, the culprit always lies.", "somnifère": "sleeping draught", "Maître Menvussa ronfle au milieu de la lecture ! Quelqu’un a mis un somnifère dans son thé !": "Mr Nott is snoring in the middle of the reading! Someone put a sleeping draught in his tea!", "Le thé a été trafiqué {lieu} à {h}. Quatre témoins, un menteur.": "The tea was tampered with {lieu} at {h}. Four witnesses, one liar.", "Il lisait si lentement… J’ai pensé qu’une petite sieste lui ferait du bien. Et à nous aussi.": "He was reading so slowly… I thought a little nap would do him good. And us too.", "Docteur Cament. Vous prescrivez des somnifères sans ordonnance, maintenant ?": "Dr Cation. Prescribing sleeping pills without a prescription now?", "Pendant ce temps, la bouteille de 1899 de l’oncle a disparu.": "Meanwhile, Uncle’s bottle of 1899 has disappeared.", "« À 21 h, j’étais avec Julie, qui me décrivait ses aigreurs d’estomac. »": "“At 9 pm I was with Julie, who was describing her heartburn to me.”", "« Le notaire n’a pas bougé à 20 h 30 comme à 21 h. Il dormait, je l’ai ausculté. »": "“The notary stayed put at 8:30 pm and at 9 pm. He was asleep, I examined him.”", "« Julie n’a pas bougé à 20 h 30 comme à 21 h non plus. Repos complet : je le lui avais prescrit. »": "“Julie stayed put at 8:30 pm and at 9 pm as well. Complete rest: I had prescribed it.”", "« Basile a changé de pièce entre 20 h 30 et 21 h. Il trotte comme un lapin, ce jardinier. »": "“Bud changed rooms between 8:30 pm and 9 pm. He scampers about like a rabbit, that gardener.”", "« À 19 h 30, j’étais à la cave. Pour raisons médicales. »": "“At 7:30 pm I was in the cellar. For medical reasons.”", "« À 19 h, Julie et moi étions dans la même pièce. Je n’ai rien vu d’autre, comme toujours. »": "“At 7 pm, Julie and I were in the same room. I saw nothing else, as always.”", "« Julie n’a pas bougé à 19 h comme à 19 h 30. Je l’ai remarqué, pour une fois. »": "“Julie stayed put at 7 pm and at 7:30 pm. I noticed it, for once.”", "« À 20 h 30, le notaire et moi étions ensemble. Il m’a parlé de successions, je lui ai parlé de boutures. »": "“At 8:30 pm, the notary and I were together. He talked to me about inheritances, I talked to him about cuttings.”", "« À 20 h 30, le docteur et Julie étaient ensemble. Il lui prenait le pouls, elle lui tendait une tartine. »": "“At 8:30 pm, the doctor and Julie were together. He was taking her pulse, she was handing him a slice of bread and jam.”", "« À 20 h, le notaire n’était pas avec Julie. Elle le fuit depuis l’affaire du gigot. »": "“At 8 pm, the notary was not with Julie. She has been avoiding him since the business with the leg of lamb.”", "« Le notaire n’a pas bougé à 19 h 30 comme à 20 h. Il a des racines, celui-là. »": "“The notary stayed put at 7:30 pm and at 8 pm. That one has put down roots.”", "« Le notaire a changé de pièce entre 20 h et 20 h 30. On aurait dit une limace pressée. »": "“The notary changed rooms between 8 pm and 8:30 pm. Like a slug in a hurry.”", "« Le docteur a changé de pièce entre 20 h 30 et 21 h, sa sacoche sous le bras. »": "“The doctor changed rooms between 8:30 pm and 9 pm, his bag under his arm.”", "« Julie n’a jamais mis les pieds dans le hall de la soirée. Ses fourneaux ne la lâchent pas. »": "“Julie never set foot in the hall all evening. Her stove won’t let her go.”", "« Je suis passé par la cave dans la soirée, chercher du terreau. »": "“I passed through the cellar during the evening, to fetch some compost.”", "« Quand l’horloge a sonné sept coups, le docteur était à la cave. Il comptait les bouteilles, à mon avis. »": "“When the clock struck seven, the doctor was in the cellar. Counting the bottles, if you ask me.”", "« Quand l’horloge a sonné neuf coups, le docteur et le notaire étaient ensemble. Deux bavards dans la même casserole. »": "“When the clock struck nine, the doctor and the notary were together. Two chatterboxes in the same pot.”", "« À 19 h, le docteur n’était pas avec Basile. Ces deux-là ne mangent pas à la même table. »": "“At 7 pm, the doctor was not with Bud. Those two don’t eat at the same table.”", "« Le notaire a changé de pièce entre 19 h et 19 h 30. Il a toujours faim au mauvais moment. »": "“The notary changed rooms between 7 pm and 7:30 pm. He’s always hungry at the wrong moment.”", "M’endormir moi-même ? Mes lectures y suffisent très bien, madame.": "Put myself to sleep? My own readings do that perfectly well, madam.", "Moi, je fais dormir les graines, madame, pas les notaires.": "I put seeds to sleep, madam, not notaries.", "Ma tisane réveille les morts, madame. Elle ne les endort pas !": "My herbal tea wakes the dead, madam. It doesn’t send people to sleep!", "Cave à surprises": "Cellar of surprises", "La bouteille de 1899 a disparu.": "The bottle of 1899 has disappeared.", "Elle a été emportée à {h}, {lieu}. Un des quatre suspects ment sur toute la ligne.": "It was carried off at {h}, {lieu}. One of the four suspects lies all the way.", "Le Château-Margaux 1899 ! La bouteille préférée de monsieur ! Je l’avais montée de la cave pour le dîner… et elle a disparu !": "The 1899 Château Margaux! The master’s favourite bottle! I had brought it up from the cellar for dinner… and it has disappeared!", "La bouteille a été prise {lieu}, à {h}. Écoutons leurs versions.": "The bottle was taken {lieu}, at {h}. Let’s hear their versions.", "Je l’ai… vendue. Pour rembourser une petite dette. Une toute petite. Avec beaucoup de zéros.": "I… sold it. To pay off a little debt. A tiny one. With lots of zeros.", "Rémi, vous êtes le seul suspect que je retrouve dans chaque chapitre.": "Remy, you are the only suspect I run into in every chapter.", "Le lendemain matin, quelqu’un a dessiné une moustache sur le portrait de l’oncle Aristide.": "The next morning, someone has drawn a moustache on Uncle Aristide’s portrait.", "« À 20 h 30, Hippolyte et Basile n’étaient pas ensemble. Ils se détestent, c’est reposant. »": "“At 8:30 pm, Ivor and Bud were not together. They loathe each other, which is restful.”", "« Basile n’a pas bougé à 19 h 30 comme à 20 h. Comme ses salades. »": "“Bud stayed put at 7:30 pm and at 8 pm. Like his lettuces.”", "« Basile a changé de pièce entre 20 h 30 et 21 h. Une mauvaise herbe, ça se déplace. »": "“Bud changed rooms between 8:30 pm and 9 pm. Weeds get around.”", "« À 21 h, j’étais à la cuisine. Je volais des biscuits, si vous voulez tout savoir. »": "“At 9 pm I was in the kitchen. Stealing biscuits, if you must know.”", "« À 19 h, Hippolyte et moi étions ensemble. Je lui ai emprunté un peu de monnaie. »": "“At 7 pm, Ivor and I were together. I borrowed a little change from him.”", "« À 20 h 30, Lucie et Hippolyte étaient dans la même pièce. Je parie qu’ils parlaient de moi. »": "“At 8:30 pm, Lucy and Ivor were in the same room. I bet they were talking about me.”", "« À 20 h 30, Lucie et Basile étaient ensemble, eux aussi. Cote à deux contre un. »": "“At 8:30 pm, Lucy and Bud were together too. Odds of two to one.”", "« À 20 h 30, j’étais avec Lucie. Parole de joueur. »": "“At 8:30 pm I was with Lucy. Gambler’s honour.”", "« Quand l’horloge a sonné neuf coups, Lucie et Hippolyte étaient ensemble. Je mettrais ma chemise là-dessus. »": "“When the clock struck nine, Lucy and Ivor were together. I’d bet my shirt on it.”", "« À 21 h, Hippolyte et moi étions ensemble. Il gardait la main sur l’argenterie. »": "“At 9 pm, Ivor and I were together. He kept a hand on the silverware.”", "« Je n’ai jamais mis les pieds dans le bureau de la soirée. Je n’aime pas les endroits où l’on compte. »": "“I never set foot in the study all evening. I don’t like places where people count.”", "« Quand l’horloge a sonné sept coups, Hippolyte était à la cuisine. Il goûtait la sauce en douce. »": "“When the clock struck seven, Ivor was in the kitchen. Sneaking a taste of the sauce.”", "« À 21 h, Hippolyte était dans le hall, raide comme un portemanteau. »": "“At 9 pm, Ivor was in the hall, as stiff as a coat stand.”", "« Je n’ai pas quitté ma pièce à 20 h comme à 20 h 30, si je puis me permettre. »": "“I didn’t leave my room at 8 pm or at 8:30 pm, if I may say so.”", "« Monsieur Rémi n’a jamais mis les pieds dans la bibliothèque. Il ne lit pas. »": "“Mr Remy never set foot in the library. He doesn’t read.”", "« Je n’ai jamais mis les pieds dans la cave de la soirée. Je laisse la poussière aux araignées. »": "“I never set foot in the cellar all evening. I leave the dust to the spiders.”", "« Monsieur Rémi est passé par le jardin dans la soirée. Il cherchait des pièces dans la fontaine, je présume. »": "“Mr Remy passed through the garden during the evening. Looking for coins in the fountain, I presume.”", "« Basile est passé par la cave à un moment de la soirée. Avec ses bottes, naturellement. »": "“Bud passed through the cellar at some point in the evening. In his boots, naturally.”", "« Quand l’horloge a sonné sept coups, Mademoiselle Lucie était dans le bureau. Je n’ai pas osé demander pourquoi. »": "“When the clock struck seven, Miss Lucy was in the study. I didn’t dare ask why.”", "« À 19 h 30, j’étais au jardin, si je puis me permettre, à cueillir des roses pour la table. »": "“At 7:30 pm I was in the garden, if I may say so, picking roses for the table.”", "« À 19 h 30, Lucie et Rémi étaient ensemble. Deux ronces dans le même buisson. »": "“At 7:30 pm, Lucy and Remy were together. Two brambles in the same bush.”", "« À 19 h 30, j’étais à la cuisine, pour livrer mes radis. »": "“At 7:30 pm I was in the kitchen, delivering my radishes.”", "Du vin de 1899 ? Je ne bois que du champagne de l’année.": "Wine from 1899? I only drink this year’s champagne.", "Je garde cette bouteille depuis trente ans, madame. Je l’aurais volée bien plus tôt.": "I’ve been looking after that bottle for thirty years, madam. I would have stolen it long ago.", "Moi, je ne bois que l’eau de mon arrosoir.": "I only drink the water from my watering can.", "Le portrait moustachu": "The moustached portrait", "Le portrait de l’oncle a été moustachu.": "Uncle’s portrait has been given a moustache.", "Le gribouillage date de {h}, {lieu}. Tous les constats sont vrais, mais il faudra raisonner par l’absurde : suppose, et vois si ça coince.": "The scribble dates from {h}, {lieu}. All the findings are true, but you’ll have to reason by contradiction: suppose, and see if it jams.", "gribouillage": "scribbling", "L’oncle Aristide… avec une moustache en guidon de vélo ! C’est un sacrilège !": "Uncle Aristide… with a handlebar moustache! It’s sacrilege!", "La peinture était fraîche {lieu} à {h}. Énigme corsée : il faudra sans doute tester des hypothèses.": "The paint was fresh {lieu} at {h}. A tough one: you’ll probably have to test hypotheses.", "Aristide m’a toujours dit que la moustache m’allait mieux qu’à lui. Je voulais vérifier.": "Aristide always told me the moustache suited me better than him. I wanted to check.", "Maître Menvussa. Vous qui n’avez jamais rien vu… vous avez tout dessiné.": "Mr Nott. You who never see a thing… you drew it all.", "La nuit tombe sur le manoir. Un codicille secret vient d’être retrouvé… puis volé.": "Night falls on the manor. A secret codicil has just been found… then stolen.", "Julie et Lucie ne se quittaient pas : à 19 h, à 20 h 30 puis à 21 h 30, elles étaient dans la même pièce, à échanger des ragots.": "Julie and Lucy were inseparable: at 7 pm, at 8:30 pm and then at 9:30 pm they were in the same room, swapping gossip.", "À 21 h, le docteur et Julie étaient dans la même pièce : il lui prescrivait du repos, elle lui servait de la tarte.": "At 9 pm, the doctor and Julie were in the same room: he was prescribing her rest, she was serving him tart.", "Le docteur et Julie n’étaient pas ensemble à 19 h 30, ni à 20 h 30 : elle fuyait ses « consultations ».": "The doctor and Julie were not together at 7:30 pm, nor at 8:30 pm: she was dodging his “consultations”.", "À 19 h, le docteur était seul dans sa pièce, à prendre son propre pouls.": "At 7 pm, the doctor was alone in his room, taking his own pulse.", "À 20 h 30, le notaire était seul dans sa pièce, à relire une clause pour la dixième fois.": "At 8:30 pm, the notary was alone in his room, rereading a clause for the tenth time.", "Julie n’a changé que deux fois de pièce dans la soirée : une cuisinière aime ses habitudes.": "Julie changed rooms only twice during the evening: a cook loves her habits.", "À 19 h comme à 19 h 30, le notaire est resté dans la même pièce, plongé dans ses codicilles.": "At 7 pm and at 7:30 pm, the notary stayed in the same room, buried in his codicils.", "Le docteur a changé quatre fois de pièce : il faisait sa tournée des malades imaginaires.": "The doctor changed rooms four times: he was doing his rounds of imaginary patients.", "À 19 h 30, à 20 h comme à 20 h 30, Julie est restée dans la même pièce : un gâteau ne se surveille pas en marchant.": "At 7:30 pm, at 8 pm and at 8:30 pm, Julie stayed in the same room: you don’t watch a cake while walking.", "À 19 h 30 comme à 20 h, le docteur est resté dans la même pièce, à se tâter le pouls.": "At 7:30 pm and at 8 pm, the doctor stayed in the same room, feeling his own pulse.", "À 20 h 30 comme à 21 h, Lucie et le notaire sont restés chacun dans la même pièce : elle comptait les virgules du testament, lui les relisait.": "At 8:30 pm and at 9 pm, Lucy and the notary each stayed in the same room: she was counting the commas in the will, he was rereading them.", "Julie a changé de pièce entre 20 h 30 et 21 h : la tarte refroidissait ailleurs.": "Julie changed rooms between 8:30 pm and 9 pm: the tart was cooling somewhere else.", "À 19 h, personne dans le salon ni dans le jardin.": "At 7 pm, nobody in the drawing room or the garden.", "À 20 h 30, le bureau et la bibliothèque étaient déserts.": "At 8:30 pm, the study and the library were deserted.", "À 21 h 30, personne dans le salon, dans le jardin ni dans le bureau.": "At 9:30 pm, nobody in the drawing room, the garden or the study.", "Le notaire n’a jamais mis les pieds dans le hall : il y a trop de courants d’air pour un testament.": "The notary never set foot in the hall: far too draughty for a will.", "Lucie est passée par le jardin à un moment de la soirée, pour « prendre l’air ».": "Lucy passed through the garden at some point in the evening, to “get some air”.", "Une moustache ? Je dessine sur les gâteaux, madame, pas sur les tableaux.": "A moustache? I draw on cakes, madam, not on paintings.", "Gribouiller un portrait ? J’ai bien trop bon goût.": "Scribble on a portrait? My taste is far too good for that.", "J’ai une écriture de médecin, madame. Personne n’aurait reconnu une moustache.": "I have a doctor’s handwriting, madam. Nobody would have recognised a moustache.", "Le codicille": "The codicil", "Le codicille secret a été volé.": "The secret codicil has been stolen.", "Une plume de hibou l’a remplacé. Vol à {h}, {lieu}. Les innocents disent vrai, le voleur ment à chaque déclaration.": "An owl feather has taken its place. Theft at {h}, {lieu}. The innocent tell the truth, the thief lies in every statement.", "Le codicille de 1920 ! Celui qui disait que les Larmes de Lune… enfin, celui qui disait quelque chose d’important ! Volé !": "The 1920 codicil! The one that said the Moon Tears… well, the one that said something important! Stolen!", "Et une plume de hibou à sa place. Le vol a eu lieu {lieu} à {h}. Un menteur parmi quatre, sur six créneaux.": "And an owl feather in its place. The theft happened {lieu} at {h}. One liar among four, over six time slots.", "Le Hibou paie bien mieux que l’héritage de tonton. Au revoir, cousine !": "The Owl pays far better than Uncle’s inheritance. Goodbye, cousin!", "Lucie Fer s’enfuit vers le port de Nice et monte à bord du paquebot Bel Azur.": "Lucy Fer flees to the port of Nice and boards the liner Bel Azur.", "Comtesse, faites vos valises. Nous prenons la mer.": "Countess, pack your bags. We are going to sea.", "Fin du chapitre 3.": "End of chapter 3.", "« Quand l’horloge a sonné huit coups, Basile et le docteur étaient ensemble. Le docteur examinait une écharde. »": "“When the clock struck eight, Bud and the doctor were together. The doctor was examining a splinter.”", "« À 21 h, Basile et moi étions dans la même pièce. Il avait de la terre sur les chaussures. Sur mes tapis. »": "“At 9 pm, Bud and I were in the same room. He had soil on his shoes. On my rugs.”", "« À 21 h 30, le docteur et Mademoiselle Lucie étaient ensemble. Mademoiselle toussait de façon… théâtrale. »": "“At 9:30 pm, the doctor and Miss Lucy were together. Miss Lucy was coughing in a… theatrical manner.”", "« À 20 h 30, le docteur et moi n’étions pas ensemble. Je ne fréquente pas la Faculté. »": "“At 8:30 pm, the doctor and I were not together. I don’t keep company with the medical profession.”", "« Je n’ai pas quitté ma pièce à 20 h comme à 20 h 30. Un majordome attend qu’on le sonne. »": "“I didn’t leave my room at 8 pm or at 8:30 pm. A butler waits to be rung for.”", "« Mademoiselle Lucie est passée par le jardin dans la soirée, sans s’essuyer les pieds en rentrant. »": "“Miss Lucy passed through the garden during the evening, without wiping her feet on the way back in.”", "« À 19 h, Basile était au salon. Sans autorisation. »": "“At 7 pm, Bud was in the drawing room. Without permission.”", "« À 19 h 30, le docteur était au jardin, à respirer « le bon air » à pleins poumons. »": "“At 7:30 pm, the doctor was in the garden, breathing in ‘the good air’ by the lungful.”", "« Quand l’horloge a sonné sept coups, Hippolyte et Lucie étaient ensemble. Un chardon et une ortie. »": "“When the clock struck seven, Ivor and Lucy were together. A thistle and a nettle.”", "« Hippolyte n’a pas bougé à 21 h comme à 21 h 30. Un vrai tuteur de tomates. »": "“Ivor stayed put at 9 pm and at 9:30 pm. A real tomato stake.”", "« À 21 h, le docteur était au jardin. Il marchait sur mes semis. »": "“At 9 pm, the doctor was in the garden. Walking on my seedlings.”", "« Quand l’horloge a sonné neuf coups, j’étais dans le hall, à rempoter un ficus. »": "“When the clock struck nine, I was in the hall, repotting a ficus.”", "« À 20 h, Hippolyte et Basile étaient ensemble. Je n’ai rien diagnostiqué de grave. »": "“At 8 pm, Ivor and Bud were together. I diagnosed nothing serious.”", "« À 21 h 30, Basile et Lucie étaient dans la même pièce. Elle avait l’air en pleine forme. Trop. »": "“At 9:30 pm, Bud and Lucy were in the same room. She looked in fine form. Too fine.”", "« Basile n’a pas bougé à 20 h 30 comme à 21 h. Excellent pour son dos. »": "“Bud stayed put at 8:30 pm and at 9 pm. Excellent for his back.”", "« J’ai changé de pièce entre 21 h et 21 h 30. Prescription : marcher. »": "“I changed rooms between 9 pm and 9:30 pm. Prescription: walking.”", "« Lucie est passée par la cave dans la soirée. Mauvais pour les bronches, l’humidité. »": "“Lucy passed through the cellar during the evening. Bad for the lungs, all that damp.”", "« À 19 h, le docteur et moi étions ensemble. Il m’a trouvé une santé insolente. »": "“At 7 pm, the doctor and I were together. He found me in insolently good health.”", "« À 20 h, le docteur et moi étions encore ensemble. Je ne le lâche plus. »": "“At 8 pm, the doctor and I were still together. I’m not letting him out of my sight.”", "« À 21 h 30, Hippolyte et le docteur étaient ensemble. Le duo le plus ennuyeux du manoir. »": "“At 9:30 pm, Ivor and the doctor were together. The most boring duo in the manor.”", "« Le docteur n’a pas bougé à 20 h 30 comme à 21 h. Il se prescrit du repos, lui aussi. »": "“The doctor stayed put at 8:30 pm and at 9 pm. He prescribes himself rest too.”", "« Le docteur a changé de pièce entre 19 h et 19 h 30. Il fuyait une patiente, sans doute. »": "“The doctor changed rooms between 7 pm and 7:30 pm. Fleeing a patient, no doubt.”", "« J’ai changé de pièce entre 21 h et 21 h 30. J’avais mieux à faire. »": "“I changed rooms between 9 pm and 9:30 pm. I had better things to do.”", "« Quand l’horloge a sonné huit coups, j’étais au jardin. Les roses de tonton sont superbes la nuit. »": "“When the clock struck eight, I was in the garden. Uncle’s roses are superb at night.”", "Le codicille ? Je ne sais même pas ce que c’est, madame. Mais je l’ai épousseté.": "The codicil? I don’t even know what that is, madam. But I dusted it.", "Un codi-quoi ? Moi, je ne vole que des boutures.": "A codi-what? The only thing I steal is cuttings.", "Les papiers de famille, très peu pour moi. J’ai assez des ordonnances.": "Family papers are not for me. I have enough with prescriptions.", "Le paquebot Bel Azur": "The liner Bel Azur", "En mer. Personne ne peut descendre, et quelqu’un ment encore.": "At sea. Nobody can get off, and someone is still lying.", "Le compas affolé": "The crazy compass", "Le compas du navire a été saboté.": "The ship’s compass has been sabotaged.", "Un aimant a été collé à {h}, {lieu}. Le saboteur y était seul. Tous les constats sont vrais.": "A magnet was stuck on at {h}, {lieu}. The saboteur was alone there. All the findings are true.", "sabotage": "sabotage", "À bord du Bel Azur, cap sur la Corse. En théorie.": "On board the Bel Azur, heading for Corsica. In theory.", "Quelqu’un a collé un aimant sous le compas ! On tourne en rond depuis une heure !": "Someone has stuck a magnet under the compass! We’ve been going round in circles for an hour!", "L’aimant a été posé {lieu} à {h}.": "The magnet was placed {lieu} at {h}.", "Je testais une intrigue pour mon prochain roman : « Mort sur un paquebot qui tourne en rond ». Ça marche, non ?": "I was testing a plot for my next novel: “Death on a Liner Going Round in Circles”. It works, doesn’t it?", "Trop bien, madame Crispie. Votre éditeur sera ravi, le capitaine beaucoup moins.": "Too well, Mrs Crispy. Your publisher will be delighted; the captain, much less so.", "Le lendemain, quelqu’un coupe toutes les cordes du piano de voyage de Paul Ka.": "The next day, someone cuts every string of Paul Kerr’s travelling piano.", "À 20 h, Marcel racontait à Cécile la vie intime de ses pistons. Cécile n’a rien répondu : elle ne répond jamais.": "At 8 pm, Rusty was telling Cecily about the private life of his pistons. Cecily didn’t reply: she never does.", "À 20 h 30, Agathe interrogeait Cécile pour son prochain roman. Elle a obtenu trois hochements de tête.": "At 8:30 pm, Agatha was interviewing Cecily for her next novel. She got three nods.", "Quand la cloche du bord a sonné neuf coups, le pianiste jouait une polka à Cécile, qui s’est bouché les oreilles.": "When the ship’s bell struck nine, the pianist was playing Cecily a polka; she put her fingers in her ears.", "À 20 h, Agathe était seule, à noircir son carnet.": "At 8 pm, Agatha was alone, filling her notebook.", "Cécile a changé quatre fois de pièce, toujours en silence ; à 22 h 30, elle était enfin seule. Le bonheur.": "Cecily changed rooms four times, always in silence; at 10:30 pm she was finally alone. Bliss.", "Marcel a changé trois fois de pièce, notamment entre 21 h et 21 h 30, puis entre 22 h et 22 h 30.": "Rusty changed rooms three times, notably between 9 pm and 9:30 pm, then between 10 pm and 10:30 pm.", "Le pianiste a changé quatre fois de pièce, mais il n’a pas bougé à 20 h comme à 20 h 30 : il battait la mesure.": "The pianist changed rooms four times, but he stayed put at 8 pm and at 8:30 pm: he was beating time.", "Agathe est passée par la salle à manger dans la soirée, et elle a changé de pièce entre 22 h et 22 h 30.": "Agatha passed through the dining room during the evening, and she changed rooms between 10 pm and 10:30 pm.", "À 21 h 30, la salle des machines, la cabine 7, la salle à manger et le salon de musique étaient déserts.": "At 9:30 pm, the engine room, cabin 7, the dining room and the music room were deserted.", "À 22 h, personne dans la salle à manger : le soufflé était retombé.": "At 10 pm, nobody in the dining room: the soufflé had collapsed.", "À 22 h 30, personne dans la cabine 12, ni dans la cabine 7, ni au salon de musique.": "At 10:30 pm, nobody in cabin 12, nor in cabin 7, nor in the music room.", "Marcel n’a jamais mis les pieds sur la passerelle ni dans la coursive : « Trop loin de mes chaudières. »": "Rusty never set foot on the bridge or in the gangway: “Too far from my boilers.”", "Cécile n’a jamais mis les pieds dans la salle des machines. Trop bruyant.": "Cecily never set foot in the engine room. Too noisy.", "Saboter le compas ? Et finir perdu en mer avec vous tous ? Non merci.": "Sabotage the compass? And end up lost at sea with all of you? No thank you.", "Moi, je ne sais même pas où est le nord. Seulement où est le do.": "I don’t even know where north is. Only where middle C is.", "Silence à bord": "Silence on board", "Le piano a perdu toutes ses cordes.": "The piano has lost all its strings.", "Elles ont été coupées à {h}, {lieu}. Les innocents disent vrai, le coupable ment à chaque fois.": "They were cut at {h}, {lieu}. The innocent tell the truth, the culprit lies every time.", "Mon piano de voyage ! Je l’avais sorti pour l’accorder… Plus une corde ! Comment je joue ma polka, maintenant ?": "My travelling piano! I took it out to tune it… Not a string left! How am I supposed to play my polka now?", "Les cordes ont été coupées {lieu} à {h}. Retour des témoignages : un des quatre ment.": "The strings were cut {lieu} at {h}. Testimonies are back: one of the four is lying.", "Cécile Ence… « silence » ! Mademoiselle voulait simplement un peu de calme. Son nom aurait dû me mettre sur la piste.": "Cecily Hush… hush! The lady simply wanted a little peace and quiet. Her name should have put me on the trail.", "Le lendemain, la casquette du capitaine passe par-dessus bord.": "The next day, the captain’s cap goes overboard.", "« Cécile n’a jamais mis les pieds dans la cabine 7 de la soirée. Je l’aurais entendue… enfin, non. »": "“Cecily never set foot in cabin 7 all evening. I’d have heard her… well, no.”", "« À 21 h, Agathe était au salon de musique, à prendre des notes. Sur moi, j’espère. »": "“At 9 pm, Agatha was in the music room, taking notes. About me, I hope.”", "« À 22 h, Lucie et moi étions ensemble. Un personnage fascinant, cette Lucie. Chapitre douze. »": "“At 10 pm, Lucy and I were together. A fascinating character, that Lucy. Chapter twelve.”", "« À 22 h, Marcel et Cécile étaient ensemble. Lui parlait, elle pas. »": "“At 10 pm, Rusty and Cecily were together. He talked, she didn’t.”", "« À 21 h, Cécile et moi n’étions pas ensemble. Dommage, je voulais l’interviewer. »": "“At 9 pm, Cecily and I were not together. A pity, I wanted to interview her.”", "« Cécile est passée par le salon de musique dans la soirée. Une muette parmi les instruments : quel symbole ! »": "“Cecily passed through the music room during the evening. A mute among the instruments: what symbolism!”", "« À 21 h, Lucie était dans la salle des machines. Une héroïne qui se salit les mains : j’adore. »": "“At 9 pm, Lucy was in the engine room. A heroine who gets her hands dirty: I love it.”", "« À 21 h 30, Marcel était dans la salle des machines. Évidemment. »": "“At 9:30 pm, Rusty was in the engine room. Obviously.”", "« Marcel n’a pas bougé. De 21 h à 21 h 30. »": "“Rusty. Didn’t move. 9 pm, 9:30 pm.”", "« Agathe ? Jamais à la salle à manger. »": "“Agatha? Never in the dining room.”", "« Marcel ? Jamais en cabine 12. »": "“Rusty? Never in cabin 12.”", "« Moi ? Passée par la salle à manger. »": "“Me? Passed through the dining room.”", "« Agathe. Pont promenade. 20 h 30. »": "“Agatha. Promenade deck. 8:30 pm.”", "« Moi. Coursive. 21 h. »": "“Me. Gangway. 9 pm.”", "« Cécile n’a jamais mis les pieds dans la salle des machines. Dommage : c’est le seul endroit où l’on ne s’entend pas parler. »": "“Cecily never set foot in the engine room. A pity: it’s the only place where you can’t hear yourself talk.”", "« À 22 h, Cécile était dans la coursive. Muette, comme toujours. »": "“At 10 pm, Cecily was in the gangway. Silent, as always.”", "Des cordes de piano ? J’ai déjà assez de câbles à réparer, madame.": "Piano strings? I’ve got enough cables to repair already, madam.", "Un piano muet ? Quelle idée d’intrigue… mais ce n’est pas la mienne.": "A silent piano? What a plot idea… but it isn’t mine.", "Couper des cordes ? Je risquerais de m’abîmer les ongles.": "Cut strings? I might chip my nails.", "Casquette à la mer": "Cap overboard", "La casquette du capitaine a fini à la mer.": "The captain’s cap ended up in the sea.", "Elle a été lancée à {h}, {lieu}. Cinq suspects, et le coupable y était seul.": "It was thrown at {h}, {lieu}. Five suspects, and the culprit was alone there.", "plouf": "splash", "Ma casquette ! Trente ans de navigation ! Un capitaine sans casquette, c’est un passager avec des galons !": "My cap! Thirty years at sea! A captain without a cap is just a passenger with stripes!", "Elle a été jetée par un hublot, {lieu}, à {h}. Cinq suspects, toutes les pièces à surveiller.": "It was thrown out of a porthole, {lieu}, at {h}. Five suspects, every room to watch.", "Il m’a fait jouer la même polka quarante-deux fois. QUARANTE-DEUX. J’ai craqué.": "He made me play the same polka forty-two times. FORTY-TWO. I snapped.", "Circonstances atténuantes, monsieur Ka.": "Mitigating circumstances, Mr Kerr.", "Le lendemain, la fin du manuscrit d’Agathe Crispie a disparu.": "The next day, the ending of Agatha Crispy’s manuscript has disappeared.", "À 20 h et à 20 h 30, Marcel parlait chaudières à Cécile, qui n’a pas dit un mot.": "At 8 pm and at 8:30 pm, Rusty was talking boilers to Cecily, who didn’t say a word.", "Quand la cloche a sonné neuf coups, puis à 21 h 30, le pianiste faisait danser Marcel. Mal.": "When the bell struck nine, and again at 9:30 pm, the pianist was making Rusty dance. Badly.", "Le pianiste a changé trois fois de pièce ; à 20 h 30, il était seul, à répéter sa polka.": "The pianist changed rooms three times; at 8:30 pm he was alone, rehearsing his polka.", "À 20 h 30, Agathe était seule, en plein chapitre. Elle a changé de pièce entre 21 h 30 et 22 h.": "At 8:30 pm, Agatha was alone, in the middle of a chapter. She changed rooms between 9:30 pm and 10 pm.", "Quand la cloche a sonné neuf coups, Cécile était seule — enfin. Elle n’a pas bougé à 21 h 30 comme à 22 h.": "When the bell struck nine, Cecily was alone — at last. She stayed put at 9:30 pm and at 10 pm.", "À 22 h, le pianiste était seul. Pour une fois, on ne l’entendait pas.": "At 10 pm, the pianist was alone. For once, nobody could hear him.", "À 22 h, Agathe était seule, à chercher une rime à « paquebot ».": "At 10 pm, Agatha was alone, looking for a rhyme for “steamship”.", "Marcel a changé quatre fois de pièce : ses chaudières le réclament partout.": "Rusty changed rooms four times: his boilers need him everywhere.", "Rémi n’a pas bougé à 20 h 30 comme à 21 h, et il est passé par le salon de musique dans la soirée, pour parier sur la prochaine fausse note.": "Remy stayed put at 8:30 pm and at 9 pm, and he passed through the music room during the evening, to bet on the next wrong note.", "La passerelle était déserte à 21 h 30 : le capitaine dînait.": "The bridge was deserted at 9:30 pm: the captain was having dinner.", "Quand la cloche a sonné dix coups, personne dans la salle à manger, dans la cabine 12 ni dans la coursive.": "When the bell struck ten, nobody in the dining room, in cabin 12 or in the gangway.", "Cécile n’a jamais mis les pieds au salon de musique (trop de bruit), mais elle est passée par la coursive.": "Cecily never set foot in the music room (too much noise), but she did pass through the gangway.", "Agathe est passée par le pont promenade dans la soirée, pour « humer l’intrigue ».": "Agatha passed through the promenade deck during the evening, to “sniff out the plot”.", "Je vis dans la salle des machines, madame. Je ne vois même jamais la mer.": "I live in the engine room, madam. I never even see the sea.", "Jeter une casquette ? Dans mes romans, on jette plutôt des cadavres.": "Throw a cap? In my novels, it’s usually bodies that get thrown.", "Une casquette ? J’aurais pu la revendre, madame, pas la jeter !": "A cap? I could have sold it, madam, not thrown it away!", "Le dernier chapitre": "The last chapter", "La fin du roman d’Agathe Crispie a été volée.": "The ending of Agatha Crispy’s novel has been stolen.", "Les pages ont été prises à {h}, {lieu}. Les innocents disent vrai ; le voleur ment à chaque fois.": "The pages were taken at {h}, {lieu}. The innocent tell the truth; the thief lies every time.", "Les dix dernières pages de mon roman ! Celles où l’on découvre l’assassin !": "The last ten pages of my novel! The ones where you find out who the murderer is!", "Les pages ont disparu {lieu} à {h}. Six créneaux, quatre témoins, un menteur.": "The pages disappeared {lieu} at {h}. Six time slots, four witnesses, one liar.", "Je ne supporte pas le suspense ! Il fallait que je sache qui était l’assassin !": "I can’t stand suspense! I had to know who the murderer was!", "C’était le majordome, capitaine. C’est toujours le majordome. Sauf au manoir.": "It was the butler, Captain. It’s always the butler. Except at the manor.", "En pleine nuit, les machines s’arrêtent. Le paquebot dérive.": "In the middle of the night, the engines stop. The liner is drifting.", "« À 21 h, Cécile et moi étions ensemble. Je lui ai joué une polka. Elle n’a pas applaudi. »": "“At 9 pm, Cecily and I were together. I played her a polka. She didn’t clap.”", "« À 21 h 30, Lucie et Cécile étaient dans la même pièce. Un duo sans paroles. »": "“At 9:30 pm, Lucy and Cecily were in the same room. A duet without words.”", "« À 22 h 30, le capitaine et moi étions ensemble. Il m’a réclamé une marche militaire. »": "“At 10:30 pm, the captain and I were together. He demanded a military march.”", "« Le capitaine n’a pas bougé à 20 h comme à 20 h 30. Ancré comme un piano à queue. »": "“The captain stayed put at 8 pm and at 8:30 pm. Anchored like a grand piano.”", "« Lucie n’a pas bougé à 20 h comme à 20 h 30 non plus. Un soupir dans la partition. »": "“Lucy stayed put at 8 pm and at 8:30 pm too. A rest in the score.”", "« Cécile n’a pas bougé à 21 h 30 comme à 22 h. Ni d’un pouce, ni d’une note. »": "“Cecily stayed put at 9:30 pm and at 10 pm. Not an inch, not a note.”", "« Le capitaine est passé par le salon de musique dans la soirée. Il a marché sur ma partition. »": "“The captain passed through the music room during the evening. He stepped on my sheet music.”", "« Le pianiste n’a pas bougé à 21 h comme à 21 h 30. Il mangeait. Beaucoup. »": "“The pianist stayed put at 9 pm and at 9:30 pm. He was eating. A lot.”", "« À 22 h, le capitaine n’était pas au salon de musique. Je vous le dis gratuitement, pour une fois. »": "“At 10 pm, the captain was not in the music room. I’m telling you for free, for once.”", "« Le capitaine n’a jamais mis les pieds dans la salle des machines. Il a peur de se salir. »": "“The captain never set foot in the engine room. He’s afraid of getting dirty.”", "« Je suis passée par la coursive dans la soirée. Comme tout le monde, non ? »": "“I passed through the gangway during the evening. Like everybody, surely?”", "« À 21 h, Cécile était dans la salle à manger. Elle mâchait en silence, comme le reste. »": "“At 9 pm, Cecily was in the dining room. Chewing in silence, like everything else.”", "« À 21 h 30, le capitaine était dans la coursive, à se chercher un cap. »": "“At 9:30 pm, the captain was in the gangway, trying to find his bearings.”", "« À 20 h, le pianiste et Lucie étaient ensemble, parole de capitaine ! »": "“At 8 pm, the pianist and Lucy were together, on my word as a captain!”", "« Quand la cloche a sonné neuf coups, Lucie et moi étions ensemble ! »": "“When the bell struck nine, Lucy and I were together!”", "« À 21 h 30 aussi, Lucie et moi étions ensemble ! Je la tenais à l’œil, mille hublots ! »": "“At 9:30 pm too, Lucy and I were together! I had my eye on her, by a thousand portholes!”", "« Et à 22 h, encore avec Lucie ! Je ne l’ai pas quittée des yeux ! »": "“And at 10 pm, still with Lucy! I never took my eyes off her!”", "« À 22 h comme à 22 h 30, je n’ai pas bougé : un capitaine reste à son poste ! »": "“At 10 pm and at 10:30 pm I didn’t move: a captain stays at his post!”", "« Cécile n’a jamais mis les pieds au salon de musique, par tous les embruns ! »": "“Cecily never set foot in the music room, by all the sea spray!”", "« À 20 h 30, Lucie était dans la salle à manger, à se goinfrer de homard ! »": "“At 8:30 pm, Lucy was in the dining room, stuffing herself with lobster!”", "« À 22 h 30, le pianiste était dans la salle à manger, à finir les restes ! »": "“At 10:30 pm, the pianist was in the dining room, finishing the leftovers!”", "« Le capitaine. Avec moi. 20 h. »": "“The captain. With me. 8 pm.”", "« 22 h. Le pianiste et Lucie. Ensemble. »": "“10 pm. The pianist and Lucy. Together.”", "« Lucie. Pas bougé. De 20 h 30 à 21 h. »": "“Lucy. Didn’t move. 8:30 pm, 9 pm.”", "« Le capitaine ? Jamais en cabine 7. »": "“The captain? Never in cabin 7.”", "« Le pianiste. Passé par la passerelle. »": "“The pianist. Passed through the bridge.”", "La fin d’un roman ? Je ne lis que des partitions, madame.": "The ending of a novel? I only read sheet music, madam.", "Je connais déjà la fin, très chère : c’est toujours moi qui gagne.": "I already know the ending, darling: I always win.", "Machine arrière": "Full astern", "La clé de la vanne à charbon a été volée.": "The key to the coal valve has been stolen.", "Elle a disparu à {h}, {lieu}. Tous les constats sont vrais, mais l’énigme est corsée : suppose, et vois si ça coince.": "It disappeared at {h}, {lieu}. All the findings are true, but this one is tough: suppose, and see if it jams.", "le saboteur": "the saboteur", "Quelqu’un a volé la clé de la vanne à charbon ! Sans elle, impossible de relancer les machines !": "Someone has stolen the key to the coal valve! Without it, there’s no restarting the engines!", "Je l’avais oubliée {lieu}. Elle a disparu à {h}. Il faudra sans doute faire une hypothèse et la pousser jusqu’au bout.": "I had left it {lieu}. It disappeared at {h}. You’ll probably have to make a hypothesis and push it all the way.", "Le Hibou avait besoin qu’on ralentisse. Son canot automobile n’est pas très rapide.": "The Owl needed us to slow down. His motorboat isn’t very fast.", "Son canot ? Il est donc tout près.": "His boat? Then he’s very close.", "Le soir suivant, une bouteille est jetée à la mer. À l’intérieur, un message.": "The following evening, a bottle is thrown into the sea. Inside, a message.", "Quand la cloche a sonné neuf coups, Marcel apprenait au pianiste le bruit exact d’une bielle qui chante. À 22 h, la leçon continuait.": "When the bell struck nine, Rusty was teaching the pianist the exact sound of a singing connecting rod. At 10 pm, the lesson went on.", "À 21 h et à 21 h 30, Agathe suivait Lucie partout : « Une héroïne pareille, ça ne s’invente pas. »": "At 9 pm and at 9:30 pm, Agatha followed Lucy everywhere: “You couldn’t make up a heroine like that.”", "À 20 h, Lucie était seule, à griffonner un message.": "At 8 pm, Lucy was alone, scribbling a message.", "Marcel a changé quatre fois de pièce ; à 21 h 30, il était seul, à graisser une clé à molette.": "Rusty changed rooms four times; at 9:30 pm he was alone, greasing an adjustable spanner.", "Agathe a changé cinq fois de pièce sans jamais mettre les pieds dans la coursive ; elle est passée par la salle à manger.": "Agatha changed rooms five times without ever setting foot in the gangway; she passed through the dining room.", "Le pianiste a changé cinq fois de pièce. Il est passé par la salle des machines et par la cabine 12, mais jamais par le salon de musique : son piano n’a plus de cordes.": "The pianist changed rooms five times. He passed through the engine room and cabin 12, but never through the music room: his piano has no strings left.", "Lucie a changé de pièce entre 21 h 30 et 22 h.": "Lucy changed rooms between 9:30 pm and 10 pm.", "Quand la cloche a sonné huit coups, personne dans la salle à manger, sur le pont promenade ni sur la passerelle.": "When the bell struck eight, nobody in the dining room, on the promenade deck or on the bridge.", "À 20 h 30, la salle des machines, la cabine 12 et la cabine 7 étaient désertes.": "At 8:30 pm, the engine room, cabin 12 and cabin 7 were deserted.", "À 21 h 30, la salle à manger était vide.": "At 9:30 pm, the dining room was empty.", "À 22 h 30, plus personne dans la salle des machines. C’est bien le problème.": "At 10:30 pm, nobody left in the engine room. That’s exactly the problem.", "Marcel n’a jamais mis les pieds ni dans la cabine 7 ni au salon de musique.": "Rusty never set foot in either cabin 7 or the music room.", "Lucie n’a jamais mis les pieds dans la salle à manger, mais elle est passée par la cabine 12.": "Lucy never set foot in the dining room, but she did pass through cabin 12.", "Ma propre clé ? Je n’ai pas besoin de la voler, madame : je la perds tout seul.": "My own key? I don’t need to steal it, madam: I lose it all by myself.", "Arrêter le navire en pleine intrigue ? Jamais. Le suspense doit continuer.": "Stop the ship in the middle of a plot? Never. The suspense must go on.", "Je joue du piano, madame, pas de la vanne.": "I play the piano, madam, not the valve.", "Bouteille à la mer": "Message in a bottle", "Quelqu’un a envoyé un message au Hibou.": "Someone has sent a message to the Owl.", "La bouteille a été lancée à {h}, {lieu}. Les innocents disent vrai, le messager ment à chaque phrase.": "The bottle was thrown at {h}, {lieu}. The innocent tell the truth, the messenger lies in every sentence.", "message": "message", "Ce message en bouteille dit : « Opéra, samedi, loge de la diva ». Quelqu’un a prévenu le Hibou. La bouteille est partie par un hublot, {lieu}, à {h}.": "This message in a bottle says: “Opera, Saturday, the diva’s dressing room”. Someone has tipped off the Owl. The bottle went out through a porthole, {lieu}, at {h}.", "Il paie en lingots, madame. Moi, je suis payé en charbon.": "He pays in gold bars, madam. I get paid in coal.", "Le Hibou achète tout le monde. Sauf moi.": "The Owl buys everyone. Except me.", "Cette nuit-là, une lampe clignote derrière un hublot. Au loin, un canot répond.": "That night, a lamp blinks behind a porthole. In the distance, a boat answers.", "« À 20 h, Cécile et moi étions ensemble. Une excellente auditrice. »": "“At 8 pm, Cecily and I were together. An excellent listener.”", "« À 20 h 30, Cécile et Marcel étaient ensemble. Lui parlait chaudières, elle regardait la mer. »": "“At 8:30 pm, Cecily and Rusty were together. He talked boilers, she watched the sea.”", "« Quand la cloche a sonné neuf coups, Cécile et Agathe étaient ensemble. Je les ai vues, par tous les embruns ! »": "“When the bell struck nine, Cecily and Agatha were together. I saw them, by all the sea spray!”", "« À 21 h 30 comme à 22 h, je n’ai pas bougé, mille hublots ! »": "“At 9:30 pm and at 10 pm I didn’t move, by a thousand portholes!”", "« Marcel n’a pas bougé à 21 h 30 comme à 22 h. Il ronflait plus fort que ses chaudières. »": "“Rusty stayed put at 9:30 pm and at 10 pm. He was snoring louder than his boilers.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé non plus. Un capitaine est un roc. »": "“At 10 pm and at 10:30 pm I didn’t move either. A captain is a rock.”", "« Je n’ai jamais mis les pieds au salon de musique. La polka me donne le mal de mer. »": "“I never set foot in the music room. Polkas make me seasick.”", "« Cécile n’a jamais mis les pieds dans la salle à manger. Elle ne mange pas, elle observe. »": "“Cecily never set foot in the dining room. She doesn’t eat, she observes.”", "« Quand la cloche a sonné huit coups, Agathe était dans la cabine 7, à taper son roman. »": "“When the bell struck eight, Agatha was in cabin 7, typing her novel.”", "« 22 h. Marcel et Agathe. Ensemble. »": "“10 pm. Rusty and Agatha. Together.”", "« Agathe. Pas bougé. De 21 h à 21 h 30. »": "“Agatha. Didn’t move. 9 pm, 9:30 pm.”", "« À 22 h, le capitaine et Cécile étaient ensemble. Sur la tête de mes pistons. »": "“At 10 pm, the captain and Cecily were together. On the head of my pistons.”", "« À 22 h 30, ils étaient encore ensemble, le capitaine et Cécile. Inséparables comme une bielle et son piston. »": "“At 10:30 pm they were still together, the captain and Cecily. Inseparable as a rod and its piston.”", "« Cécile n’a pas bougé à 21 h comme à 21 h 30. Pas un boulon de travers. »": "“Cecily stayed put at 9 pm and at 9:30 pm. Not a bolt out of place.”", "« Agathe n’a pas bougé à 21 h 30 comme à 22 h. Elle avait trouvé l’inspiration, faut croire. »": "“Agatha stayed put at 9:30 pm and at 10 pm. Found her inspiration, I reckon.”", "« À 22 h 30, Cécile n’était pas sur la passerelle. Je l’aurais vue, j’ai l’œil. »": "“At 10:30 pm, Cecily was not on the bridge. I’d have seen her, I’ve got a good eye.”", "« Le capitaine n’a jamais mis les pieds sur le pont promenade. Trop de passagers à saluer. »": "“The captain never set foot on the promenade deck. Too many passengers to greet.”", "« À 20 h 30, Cécile était sur la passerelle, à regarder les étoiles. »": "“At 8:30 pm, Cecily was on the bridge, looking at the stars.”", "« À 22 h comme à 22 h 30, je n’ai pas bougé : j’écrivais la scène finale. »": "“At 10 pm and at 10:30 pm I didn’t move: I was writing the final scene.”", "« Cécile a changé de pièce entre 22 h et 22 h 30. Sans un mot, évidemment. »": "“Cecily changed rooms between 10 pm and 10:30 pm. Without a word, of course.”", "« Marcel est passé par la salle à manger dans la soirée. De la graisse jusqu’aux coudes. Quel personnage ! »": "“Rusty passed through the dining room during the evening. Grease up to his elbows. What a character!”", "Écrire au Hibou ? Je n’écris qu’au journal de bord, madame !": "Write to the Owl? I only write in the ship’s log, madam!", "Une bouteille à la mer ? Trop de clichés, ma chère. Je n’écris pas ainsi.": "A message in a bottle? Far too clichéd, darling. That’s not how I write.", "Le canot de minuit": "The midnight boat", "Quelqu’un a fait des signaux au canot du Hibou.": "Someone has been signalling to the Owl’s boat.", "La lampe a clignoté à {h}, {lieu}. Les innocents disent vrai, la fuyarde ment toujours. Difficile : il faudra parfois supposer pour avancer.": "The lamp blinked at {h}, {lieu}. The innocent tell the truth, the runaway always lies. Hard: sometimes you’ll have to suppose to move forward.", "la fugitive": "the fugitive", "fuite": "escape", "Des signaux lumineux en pleine mer ! Et à minuit, un canot de sauvetage a disparu… avec quelqu’un dedans !": "Light signals in the middle of the sea! And at midnight, a lifeboat disappeared… with someone in it!", "Les signaux venaient {lieu}, à {h}. Qui les a faits a pris le canot. Énigme corsée : certaines pistes ne tombent qu’en testant une hypothèse.": "The signals were sent {lieu}, at {h}. Whoever made them took the boat. A tough one: some leads only fall into place when you test a hypothesis.", "Trop tard, Hortense ! Rendez-vous à Monte-Carlo… si vous aimez l’opéra.": "Too late, Hortense! See you in Monte Carlo… if you like opera.", "Fin du chapitre 4. Monte-Carlo. Ce samedi, Aria Vibrato chante à l’Opéra.": "End of chapter 4. Monte Carlo. This Saturday, Aria Vibrato sings at the Opera.", "« Lucie. Avec moi. 20 h 30. »": "“Lucy. With me. 8:30 pm.”", "« 22 h 30. Lucie et Rémi. Ensemble. »": "“10:30 pm. Lucy and Remy. Together.”", "« 22 h 30. Le pianiste et Lucie. Ensemble aussi. »": "“10:30 pm. The pianist and Lucy. Together too.”", "« 22 h 30. Lucie et moi ? Pas ensemble. »": "“10:30 pm. Lucy and me? Not together.”", "« Moi. Pont promenade. 20 h. »": "“Me. Promenade deck. 8 pm.”", "« Rémi. Coursive. 22 h. »": "“Remy. Gangway. 10 pm.”", "« À 22 h, Lucie et Rémi étaient ensemble. Ils comptaient des billets. »": "“At 10 pm, Lucy and Remy were together. They were counting banknotes.”", "« Rémi a changé de pièce entre 20 h et 20 h 30. Il m’avait promis de me rembourser. »": "“Remy changed rooms between 8 pm and 8:30 pm. He had promised to pay me back.”", "« Je n’ai jamais mis les pieds dans la salle à manger : je jeûne avant les concerts. »": "“I never set foo
