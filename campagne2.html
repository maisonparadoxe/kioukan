<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kioukan · La Dernière Vente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap">
<style>
/* Concept : épisode de webtoon. On lit l'histoire en faisant défiler de grandes cases pleine largeur
   séparées par du blanc, avec une lumière de cinéma et des bulles ovales. L'enquête suit, sur des
   cartes claires et douces, comme une application de lecture. */
:root {
  --bg: #f6f3ef;
  --gutter: #ffffff;
  --paper: #ffffff;
  --panel-2: #f1ece6;
  --cell: #fbf9f6;
  --ink: #26201f;
  --ink-2: #77706b;
  --line: #e7e0d8;
  --line-2: #d6cdc3;
  --accent: #c2414f;
  --accent-ink: #ffffff;
  --accent-2: #3d5a96;
  --red: #d23c4c;
  --red-bg: #fde4e6;
  --given: #f7e7cf;
  --ok: #2f9a6a;
  --shadow: 0 6px 22px rgba(60, 40, 30, 0.10);
  --s0: #4f7fc4;
  --s1: #2f9a6a;
  --s2: #c9824a;
  --s3: #8a5bb3;
  --s4: #c2414f;
  --wall: #3a2a28; --door: #fff3cf;
  --wood-a: #f7dbe2; --wood-b: #ebbccb; --check-a: #fde9ef; --check-c: #f6c7d6; --tile-a: #e3e7fb; --tile-b: #cdd4f3;
  --diamond-a: #ece3f8; --diamond-c: #d6c8f0; --grass-a: #cdeac3; --grass-c: #a9d89d; --steel-a: #dde3f2; --steel-b: #bcc6e0;
  --fu: #f0a3b9; --fu2: #c9bdf0; --fw: #ffffff; --fpot: #b5806a; --fg: #6dbb84; --fg2: #4f9f6c; --ftv: #3a3f6b; --win: #bfe2f7;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
    --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
    --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
    --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
    --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --gutter: #0c0b0f; --paper: #1d1b22; --panel-2: #26232c; --cell: #17151b;
  --ink: #f2ece6; --ink-2: #a49c96; --line: #2e2a33; --line-2: #3d3843;
  --accent: #ef6f7c; --accent-ink: #160c10; --accent-2: #9db7ef; --red: #ff7a86; --red-bg: #3e1d26;
  --given: #4a3a26; --ok: #5fd39b; --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
  --s0: #7da7ea; --s1: #55c690; --s2: #e7a56d; --s3: #b48ad6; --s4: #ef6f7c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--sans);
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.app { max-width: 1040px; margin: 0 auto; }
.mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 16px; }
h1 { margin: 0; font: 900 clamp(40px, 12vw, 60px)/0.95 var(--serif); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.mode-tag { margin: 0; font: 600 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }

/* Épisode : couverture puis bande verticale */
#intro { max-width: 640px; margin: 0 auto; }
/* sur grand écran, une case de BD tient dans la hauteur de l'écran */
@media (min-width: 700px) { #intro { max-width: max(360px, min(640px, 82vh)); } }
.cover { text-align: center; padding: 6px 0 18px; }
.kicker { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.lvl-title { margin: 0; font: italic 700 30px/1.15 var(--serif); text-wrap: balance; }
.lvl-title span { display: block; margin-bottom: 4px; font: 600 12px var(--sans); font-style: normal; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.strip { background: var(--gutter); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 28px 0 40px; display: flex; flex-direction: column; gap: 46px; }
@media (min-width: 672px) { .strip { margin-inline: 0; border-radius: 6px; } }
.beat { position: relative; }
.says { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 6px; padding: 0 14px; margin-bottom: -26px; }
.wbubble {
  position: relative; margin: 0; max-width: 80%; padding: 20px 28px; background: #fff; color: #231b1b;
  border: 1.6px solid #2a201f; border-radius: 50%; text-align: center;
  font: 600 13.5px/1.35 var(--sans); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance;
}
.wbubble.l { align-self: flex-start; }
.wbubble.r { align-self: flex-end; }
.wbubble::after {
  content: ""; position: absolute; top: calc(100% - 4px); width: 18px; height: 22px; background: #fff;
  border-right: 1.6px solid #2a201f; clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.wbubble.l::after { left: 30%; transform: skewX(14deg); }
.wbubble.r::after { right: 30%; transform: scaleX(-1) skewX(14deg); }
.wpanel { position: relative; margin: 0; overflow: hidden; background: #222; }
.wbg, .wbg svg, .wbg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.wchar { position: absolute; bottom: 0; transform: translateX(-50%); }
.wchar .wport { display: block; width: 100%; height: auto; }
.wcap {
  position: absolute; z-index: 2; margin: 0; max-width: 74%; padding: 8px 12px; background: rgba(255, 252, 247, 0.92); color: #231b1b;
  border: 1px solid rgba(40, 30, 30, 0.6); font: 400 13.5px/1.4 var(--sans);
}
.wcap.tl { top: 12px; left: 12px; } .wcap.br { bottom: 12px; right: 12px; } .wcap.bl { bottom: 12px; left: 12px; }
.sfx {
  position: absolute; z-index: 2; white-space: nowrap; font: italic 900 42px/1 var(--serif); color: #fff; transform: rotate(var(--r));
  -webkit-text-stroke: 1.6px #2a201f; paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.sfx.center { transform: translate(-50%, -50%) rotate(var(--r)); font-size: 54px; color: #ffe0d6; }
.go { text-align: center; margin: 22px 0 0; }

/* Boutons */
.btn {
  display: inline-block; text-decoration: none; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink);
  padding: 9px 16px; min-height: 42px; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 22px; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn.accuse { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible + span { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* Jeu */
.layout { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
.col { display: contents; }
#case { order: 1; } #suspects { order: 2; } #map-panel { order: 3; } #board-panel { order: 4; } #verdict { order: 5; } #clues-panel { order: 6; } #rules { order: 7; }
@media (min-width: 700px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #case, #suspects, #map-panel, #board-panel, #verdict, #clues-panel, #rules { order: 0; }
}
@media (min-width: 700px) and (min-height: 520px) {
  /* indices et plan restent à l'écran pendant qu'on remplit la grille */
  .layout > .col:last-child { position: sticky; top: 10px; max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 4px 6px 10px; margin: -4px -6px 0; }
}
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; scroll-margin-top: 12px; }
.panel-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; font: 700 19px/1.15 var(--serif); }
.sub { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

.eyebrow { margin: 0 0 6px; font: 600 12px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.case h2 { margin: 0 0 6px; font: 700 21px/1.3 var(--serif); text-wrap: balance; }
.case h2 em { font-style: italic; color: var(--accent); }
.case p { margin: 0; color: var(--ink-2); }
.case p b { color: var(--ink); }

.fiches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fiche { margin: 0; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--cell); border: 1px solid var(--line); }
.fiche-img { aspect-ratio: 5 / 6; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #fff8f2), color-mix(in srgb, var(--c) 45%, #f6efe8)); overflow: hidden; }
.fiche-img svg, .fiche-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fiche figcaption { text-align: center; padding: 6px 4px 8px; line-height: 1.15; }
.fiche .fn { display: block; font: 700 16px var(--serif); }
.fiche small { display: block; font: 600 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.fiche .guilty { color: var(--red); }
.mini { display: inline-block; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in srgb, var(--c, #c9a48a) 30%, #fff8f2); border: 2px solid var(--c, var(--line-2)); vertical-align: middle; }
.mini svg, .mini img { display: block; width: 100%; height: 100%; transform: scale(1.5) translateY(14%); object-fit: cover; }

.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 3px 0; min-height: 36px; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.crime::after { content: ""; position: absolute; top: -3px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--paper); }
.train-frame { border-radius: 12px; overflow: hidden; }
.lc-train { display: block; width: 100%; height: auto; }
.lc-train [stroke="#1c1b22"] { stroke: #3a2a28; stroke-width: 0.8; }
.lc-plate { font: 700 5.6px var(--sans); letter-spacing: 0.1em; text-anchor: middle; dominant-baseline: central; fill: #2a2020; }
.lc-plate.crime { fill: #fff; }
.lc-roof-t { font: 700 6.5px var(--sans); letter-spacing: 0.3em; text-anchor: middle; fill: rgba(255, 240, 220, 0.6); }
.lc-tok.culprit { filter: drop-shadow(0 0 2px #ff5a5a) drop-shadow(0 0 3px #ff5a5a); }
.legend { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; margin-right: 6px; vertical-align: middle; }
.lg-door { width: 8px; height: 14px; background: #2a2a30; border-radius: 2px; }
.lg-ladder { width: 12px; height: 5px; background: #e3b23c; border-radius: 2px; }
.lg-crime { width: 16px; height: 12px; border: 2px dashed #e2483d; border-radius: 2px; }

.s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.board { display: grid; grid-template-columns: var(--tw) repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.who { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding-bottom: 4px; min-width: 0; text-align: center; }
.who .mini { width: 40px; height: 40px; }
.who b { font: 700 14px/1.1 var(--serif); overflow-wrap: anywhere; }
.who small { font: 600 10.5px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.time { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; min-height: 48px; padding: 0 6px; border: 0; border-radius: 10px; background: transparent; font: 600 13px var(--sans); color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.time.sel { background: var(--panel-2); color: var(--ink); }
.time small { font: 700 9.5px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.cell {
  position: relative; min-height: 48px; min-width: 0; padding: 2px 3px; border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: inset 0 -3px 0 var(--c); background: var(--cell); color: var(--ink); font: 600 13px var(--sans);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.cell.empty { color: var(--ink-2); }
.cell.empty::before { content: "·"; }
.cell.given { background: var(--given); cursor: default; }
.cell.given svg { position: absolute; top: 4px; right: 5px; opacity: 0.6; }
.cell.bad { background: var(--red-bg); border-color: var(--red); }
.cell:disabled { color: var(--ink); opacity: 1; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.status .err { color: var(--red); font-weight: 600; }
.reply { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.reply.r { justify-content: flex-end; }
.reply .bubble.small { margin: 0; padding: 10px 16px; background: #fff; color: #231b1b; border: 1.4px solid #2a201f; border-radius: 22px; font: 600 12.5px/1.35 var(--sans); text-transform: uppercase; }
.reply .mini { width: 42px; height: 42px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-height: 36px; }
.switch { min-height: 44px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.hintline { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }

.opts { margin: -2px 0 6px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clue { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 14.5px; }
.clue:first-child { border-top: 0; }
.clue .ico { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: #fff; }
.clue.ok .ico { background: var(--ok); border-color: var(--ok); }
.clue.bad .ico { background: var(--red); border-color: var(--red); }
.clue.ok .txt { color: var(--ink-2); }
.clue.bad .txt { color: var(--red); font-weight: 600; }
.clue.rule .txt { font-weight: 600; }
.empty-note { margin: 0; color: var(--ink-2); }

.verdict { display: flex; flex-direction: column; gap: 12px; border-color: var(--red); }
.v-top { display: flex; align-items: center; gap: 16px; }
.v-top .fiche { width: 108px; flex: none; }
.stamp { font: italic 900 28px/1.05 var(--serif); color: var(--red); }
.verdict p { margin: 0; }
.verdict .sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13.5px; }
.strip.epi { margin-inline: -16px; border-radius: 0; padding-top: 34px; }
.next { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.soon { font-size: 13px; color: var(--ink-2); }

.rules summary { cursor: pointer; font: 700 18px var(--serif); padding: 10px 0; min-height: 44px; }
.rules ol { margin: 12px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 7px; color: var(--ink-2); font-size: 14.5px; }
.rules ol b { color: var(--ink); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 10, 12, 0.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; background: var(--paper);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.16s ease-out; } @keyframes rise { from { transform: translateY(20px); } } }
.sheet-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-hd b { font: 700 17px var(--serif); }
.trail { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.trail b { color: var(--ink); }
.room-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room-btn { min-height: 52px; padding: 6px 4px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--cell); font: 600 13.5px/1.15 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow-wrap: anywhere; }
.room-btn small { font-size: 11px; color: var(--ink-2); font-weight: 400; }
.room-btn.far { border-style: dashed; color: var(--ink-2); }
.room-btn.cur { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.room-btn.cur small { color: var(--paper); }
.sheet-ft { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.acc-t { font: italic 900 26px var(--serif); color: var(--red); }
.acc-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.acc-btn { border: 0; background: transparent; padding: 0; cursor: pointer; min-width: 0; text-align: inherit; }
.acc-btn:active .fiche { transform: scale(0.97); }
.acc-btn.out { opacity: 0.45; cursor: default; }
.acc-btn.out .fiche-img { filter: grayscale(1); }

/* Plans vus de dessus */
.plan { display: block; width: 100%; height: auto; background: var(--panel-2); }
.pt-wood .pa-a { fill: var(--wood-a); } .pt-wood .pa-b { stroke: var(--wood-b); fill: none; stroke-width: 0.9; }
.pt-check .pa-a { fill: var(--check-a); } .pt-check .pa-c { fill: var(--check-c); }
.pt-tile .pa-a { fill: var(--tile-a); } .pt-tile .pa-b { stroke: var(--tile-b); fill: none; stroke-width: 1; }
.pt-diamond .pa-a { fill: var(--diamond-a); } .pt-diamond .pa-c { fill: var(--diamond-c); }
.pt-grass .pa-a { fill: var(--grass-a); } .pt-grass .pa-c { fill: var(--grass-c); }
.pt-steel .pa-a { fill: var(--steel-a); } .pt-steel .pa-b { stroke: var(--steel-b); fill: none; stroke-width: 0.9; }
.furn .fu { fill: var(--fu); } .furn .fu2 { fill: var(--fu2); } .furn .fw { fill: var(--fw); } .furn .fpot { fill: var(--fpot); }
.furn .fg { fill: var(--fg); } .furn .fg2 { fill: var(--fg2); } .furn .ftv { fill: var(--ftv); } .furn .win { fill: var(--win); }
.furn .fl { stroke: var(--wall); stroke-opacity: 0.35; stroke-width: 0.9; fill: none; }
.furn rect, .furn ellipse, .furn circle { stroke: var(--wall); stroke-opacity: 0.3; stroke-width: 0.8; }
.wall { fill: none; stroke: var(--wall); stroke-width: 3; stroke-linejoin: round; }
.crimeroom { fill: none; stroke: #e2483d; stroke-width: 2.2; stroke-dasharray: 6 4; }
.door { fill: var(--door); stroke: var(--wall); stroke-width: 1.2; }
.pill rect { fill: #fff; stroke: #3a2a28; stroke-width: 1; }
.pill text { font: 700 6.8px var(--sans); letter-spacing: 0.06em; fill: #3a2a28; text-anchor: middle; dominant-baseline: central; }

/* Liste des épisodes */
#episodes { max-width: 640px; margin: 0 auto 14px; }
.ep-toggle { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; text-align: left; padding: 10px 16px; min-height: 48px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--paper); cursor: pointer; box-shadow: var(--shadow); }
.ep-toggle span { font: 600 11px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.ep-toggle b { font: italic 700 16px var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-toggle i { font-style: normal; color: var(--ink-2); }
.ep-list { margin-top: 10px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.ep-ch h3 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font: italic 700 17px var(--serif); }
.ep-ch h3 span { font: 600 11px var(--sans); font-style: normal; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.ep-ch h3 small { margin-left: auto; font: 600 12px var(--sans); font-style: normal; color: var(--ink-2); }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ep-btn { display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; gap: 0 8px; align-items: center; text-align: left; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--cell); cursor: pointer; min-height: 48px; }
.ep-btn b { grid-row: 1 / 3; font: 700 15px var(--serif); color: var(--accent); text-align: center; }
.ep-btn span { font: 600 12.5px/1.2 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-btn small { font-size: 10.5px; color: var(--ink-2); }
.ep-btn.done { background: color-mix(in srgb, var(--ok) 12%, var(--cell)); }
.ep-btn.done small { color: var(--ok); }
.ep-btn.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ep-btn:disabled { opacity: 0.45; cursor: default; }
.blurb { margin: 6px auto 12px; max-width: 34ch; font: italic 400 15px/1.4 var(--serif); color: var(--ink-2); }

/* Témoignages (modes menteur) */
.liar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.liar-q { font: italic 900 20px var(--serif); color: var(--red); }
.liar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.liar-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 14px 4px 5px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--cell); font: 600 13.5px var(--sans); cursor: pointer; }
.liar-btn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.who .liar-badge { color: var(--red); }
.speaker { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 14px 0 4px; }
.speaker b { font: 700 15px var(--serif); }
.tag { display: inline-block; font: 600 10.5px var(--sans); letter-spacing: 0.04em; color: var(--ink-2); background: var(--panel-2); border-radius: 999px; padding: 2px 8px; white-space: nowrap; vertical-align: middle; }
.tag.liar-tag { color: #fff; background: var(--red); }
.sp { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: start; margin: 16px 0 4px; }
.sp .mini { width: 42px; height: 42px; }
.sp-name { margin: 2px 0 6px; }
.sp-name b { font: 700 15px var(--serif); }
.bubbles .clue { position: relative; margin: 0 0 8px; padding: 9px 12px 9px 10px; background: var(--panel-2); border: 0; border-radius: 16px; }
.bubbles .clue::before { content: ""; position: absolute; left: -7px; top: 13px; border: 7px solid transparent; border-left: 0; border-right-color: var(--panel-2); }
.bubbles .clue.bad { background: var(--red-bg); }
.bubbles .clue.bad::before { border-right-color: var(--red-bg); }
.clue.proof .ico { background: var(--given); border-color: transparent; color: var(--ink); }
.clue.proof .txt { color: var(--ink); }
.board.dense .cell { font-size: 11.5px; }
.skip { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fiches { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
@media (min-width: 480px) { .fiches { grid-template-columns: repeat(var(--N), minmax(0, 1fr)); } }
@media (min-width: 700px) { .fiche .fn { font-size: 14.5px; } .fiche figcaption .sub { font-size: 10.5px; } }

.who small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; }
.board.dense .who b, .board[style*="--cols:4"] .who b { font-size: 13px; }
.fiche figcaption .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Portraits « carte » : image sur fond papier, sans détourage */
.wchar .pcard { border-radius: 10px 10px 0 0; border: 3px solid #fffaf0; border-bottom: 0; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(60, 40, 30, 0.35); background: #f5e9d2; }
.fiche-img img.pcard { object-position: 50% 18%; }
.mini img.pcard { transform: scale(1.35) translateY(4%); object-position: 50% 30%; }

/* Introduction en texte */
.story-text { margin: 4px 0 8px; display: grid; gap: 10px; }
.snar { margin: 0; font: 400 16px/1.55 var(--sans); color: var(--ink); }
.sline { margin: 0; display: flex; gap: 10px; align-items: flex-start; }
.sline .mini { width: 44px; height: 44px; margin-top: 2px; }
.sline .sq { font: italic 400 16px/1.5 var(--serif); }
.sline .sq b { font: 700 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; font-style: normal; color: var(--ink-2); margin-right: 4px; }
/* Portraits noir et blanc : le blanc prend la couleur du suspect */
.pbw { mix-blend-mode: multiply; }
.fiche-img img.pbw { object-position: 50% 12%; }
.mini img.pbw { transform: scale(1.25) translateY(2%); object-position: 50% 20%; }
.wchar .pbw { mix-blend-mode: normal; background: #fffdf8; }

</style>

uit suivante, un cri d’horreur retentit à bord. Celui du professeur Tumulus…": "The next night, a scream of horror rings out on board. Professor Barrow’s…", "AAAAH !": "AAAAH!", "Le papyrus à la soupe": "The Papyrus in the Soup", "Le papyrus du professeur a fini dans la soupe.": "The professor’s papyrus ended up in the soup.", "La soupière a été renversée à {h}, {lieu}, par la seule personne présente. Qui a noyé Ramsès Deux-Fois ?": "The soup tureen was knocked over at {h}, {lieu}, by the only person there. Who drowned Ramses the Second Helping?", "le coupable": "the culprit", "méfait": "mischief", "Mon papyrus de Ramsès Deux-Fois ! Trempé dans la soupe à l’oignon ! Trois mille ans d’histoire, et ça sent la ciboulette !": "My papyrus of Ramses the Second Helping! Soaked in onion soup! Three thousand years of history, and it smells of chives!", "La soupière a été renversée à {h}, {lieu}. Une seule personne s’y trouvait.": "The tureen was knocked over at {h}, {lieu}. Only one person was there.", "Ce soir, le professeur Tumulus n’a pas quitté la voiture-bar. Restent trois suspects.": "Tonight, Professor Barrow never left the bar car. That leaves three suspects.", "Je voulais seulement le faire sécher… sur la soupière. Elle était chaude, c’était pratique !": "I only wanted to dry it… on the tureen. It was hot, it was handy!", "Un papyrus n’est pas une serviette, Ernest. Même en wagon-restaurant.": "A papyrus is not a napkin, Ernest. Even in a dining car.", "Troisième nuit. Le contrôleur cherche désespérément quelque chose…": "Third night. The inspector is desperately looking for something…", "La poinçonneuse": "The Ticket Punch", "La poinçonneuse du contrôleur a disparu.": "The inspector’s ticket punch has disappeared.", "Elle a été dérobée à {h}, {lieu}. Jean Bilet était au fourgon, il est hors de cause. Lequel des trois autres passagers ?": "It was stolen at {h}, {lieu}. Jack Punch was in the luggage van, so he is in the clear. Which of the other three passengers did it?", "Ma poinçonneuse ! Sans elle, je ne peux plus poinçonner ! Un contrôleur qui ne poinçonne pas, c’est un passager !": "My ticket punch! Without it, I can’t punch! An inspector who doesn’t punch is just a passenger!", "On l’a prise {lieu}, à {h}. Le voleur y était seul.": "It was taken {lieu}, at {h}. The thief was alone there.", "Cette fois, la nuit sera plus longue : six créneaux à reconstituer.": "This time the night will be longer: six time slots to reconstruct.", "Je voulais faire des confettis pour ma première à l’Opéra. Les confettis poinçonnés, c’est très chic.": "I wanted to make confetti for my opening night at the Opera. Punched confetti is very chic.", "Chic, peut-être. Légal, certainement pas.": "Chic, perhaps. Legal, certainly not.", "Quatrième nuit. C’est Bijou, le caniche, qui disparaît.": "Fourth night. This time it’s Jewel the poodle who vanishes.", "OUAF !": "WOOF!", "Un caniche sans billet": "A Poodle Without a Ticket", "Bijou le caniche a été enlevé.": "Jewel the poodle has been kidnapped.", "Le chien a été emmené à {h}, {lieu}, par une personne seule avec lui. Retrouve-la.": "The dog was taken at {h}, {lieu}, by someone alone with it. Find them.", "enlèvement": "kidnapping", "Bijou ! Mon Bijou ! Quelqu’un a enlevé mon caniche !": "Jewel! My Jewel! Someone has kidnapped my poodle!", "On l’a entendu gémir {lieu} à {h}. Son ravisseur était seul avec lui.": "Whimpering was heard {lieu} at {h}. The kidnapper was alone with the dog.", "Le professeur Tumulus dormait sous ses papyrus et le neveu ronflait. Restent trois suspects.": "Professor Barrow was asleep under his papyri and the nephew was snoring. That leaves three suspects.", "Le règlement est clair : pas de billet, pas de voyage. Même pour un caniche.": "The rules are clear: no ticket, no travel. Even for a poodle.", "Le caniche voyage avec sa maîtresse, monsieur Bilet. Il a même un collier, lui.": "The poodle travels with its mistress, Mr Punch. It even has a collar, which is more than I can say for you.", "Cinquième nuit. La diva Aria Vibrato ne peut plus chanter une note…": "Fifth night. The diva Aria Vibrato can’t sing a single note…", "Fausse note": "A Sour Note", "Les pastilles de la diva ont été piégées.": "The diva’s throat lozenges have been tampered with.", "Quelqu’un a glissé des bonbons au piment dans la boîte d’Aria Vibrato à {h}, {lieu}. Lequel des quatre ?": "Someone slipped chilli sweets into Aria Vibrato’s tin at {h}, {lieu}. Which of the four?", "Mes pastilles pour la voix ! Remplacées par des bonbons au piment ! Ma voix… elle est partie en fumée !": "My voice lozenges! Swapped for chilli sweets! My voice… it went up in smoke!", "Quatre suspects, cette fois. L’échange a eu lieu {lieu}, à {h}.": "Four suspects this time. The swap took place {lieu}, at {h}.", "La comtesse, elle, ne quittait pas Bijou d’une semelle.": "The countess, meanwhile, never let Jewel out of her sight.", "Elle faisait ses vocalises toute la nuit ! Même mes momies ne pouvaient plus dormir.": "She did her vocal warm-ups all night long! Even my mummies couldn’t sleep.", "Il existe des bouchons d’oreilles, professeur. Ils sont moins épicés.": "Earplugs exist, Professor. They are less spicy.", "Sixième nuit. Le train freine brutalement en pleine campagne.": "Sixth night. The train brakes sharply in the middle of the countryside.", "SKRIIII !": "SKREEEE!", "Signal d’alarme": "Pull the Cord", "Le signal d’alarme a été tiré.": "The emergency cord has been pulled.", "Le train s’est arrêté net à {h}. La poignée se trouve {lieu}, et le coupable y était seul. Qui a fait ça ?": "The train stopped dead at {h}. The handle is {lieu}, and the culprit was alone there. Who did this?", "alarme": "alarm", "Quelqu’un a tiré le signal d’alarme ! Une heure de retard ! Vous savez combien de billets je vais devoir re-poinçonner ?": "Someone pulled the emergency cord! An hour late! Do you know how many tickets I’ll have to re-punch?", "La poignée a été tirée {lieu}, à {h}. Le coupable était seul.": "The handle was pulled {lieu}, at {h}. The culprit was alone.", "Je pensais que c’était la poignée des toilettes ! Et puis… je voulais descendre à Monaco. Le casino, vous comprenez.": "I thought it was the toilet chain! And then… I wanted to get off at Monaco. The casino, you understand.", "Rémi, encore vous. Je commence à connaître votre chronologie par cœur.": "Remy, you again. I’m starting to know your timeline by heart.", "Au matin du septième jour, la comtesse ouvre son écrin. Le collier est là… mais il est faux.": "On the morning of the seventh day, the countess opens her jewel case. The necklace is there… but it’s fake.", "La plume du Hibou": "The Owl’s Feather", "Le vrai collier a été remplacé par une copie.": "The real necklace has been replaced by a copy.", "Une plume de hibou a été trouvée dans l’écrin. L’échange a eu lieu à {h}, {lieu}. Qui travaille pour le Hibou ?": "An owl feather was found in the case. The swap took place at {h}, {lieu}. Who works for the Owl?", "échange": "swap", "C’est du verre ! On a échangé mes Larmes de Lune contre une vulgaire copie ! Et il y a… une plume !": "It’s glass! My Moon Tears have been swapped for a cheap copy! And there’s… a feather!", "Une plume de hibou. La signature d’un cambrioleur célèbre. L’échange a eu lieu {lieu}, à {h}.": "An owl feather. The signature of a famous burglar. The swap took place {lieu}, at {h}.", "Dernier mystère avant Nice. Rémi, puni, n’a pas quitté sa tante de la nuit : il est hors de cause.": "Last mystery before Nice. Remy, grounded, never left his aunt all night: he is in the clear.", "Un monsieur masqué m’a donné un très gros pourboire pour échanger deux colliers. Je croyais que c’était un jeu de société !": "A masked gentleman gave me a very generous tip to swap two necklaces. I thought it was a parlour game!", "Le Hibou. Il a déjà filé avec le vrai collier. Mais un hibou, ça finit toujours par rentrer au nid.": "The Owl. He has already made off with the real necklace. But an owl always comes back to its nest.", "Fin du chapitre 1. Direction Nice, et le Grand Hôtel des Mouettes.": "End of chapter 1. Next stop: Nice, and the Grand Hôtel des Mouettes.", "À 22 h, Rémi a emprunté dix francs à Ernest « jusqu’à demain ». À 23 h, Ernest le cherchait pour récupérer son argent : ils n’étaient pas dans la même voiture.": "At 10 pm, Remy borrowed ten francs from Ernest \"until tomorrow\". At 11 pm, Ernest was looking for him to get his money back: they were not in the same car.", "De 21 h à 21 h 30, Aria a fait ses vocalises sans bouger d’un pouce : une diva ne se déplace pas pendant ses gammes.": "From 9 pm to 9:30 pm, Aria did her vocal exercises without moving an inch: a diva does not move during her scales.", "Ernest a changé trois fois de voiture dans la soirée, plateau à la main : une fois entre 21 h et 21 h 30, une autre entre 22 h et 22 h 30.": "Ernest changed cars three times during the evening, tray in hand: once between 9 pm and 9:30 pm, and once between 10 pm and 10:30 pm.", "Rémi est passé par le fourgon à un moment de la soirée. Pour y cacher ses créanciers, paraît-il.": "Remy passed through the luggage van at some point in the evening. To hide from his creditors, apparently.", "Au cours de la soirée, Aria est passée au wagon-restaurant réclamer du miel pour sa gorge. Ernest y est passé lui aussi, à un moment ou à un autre.": "During the evening, Aria passed through the dining car to ask for honey for her throat. Ernest passed through too, at one time or another.", "Le contrôleur a vérifié le billet d’Aria quand la pendule a sonné dix coups… puis encore à 23 h, « par précaution ». Les deux fois, ils étaient dans la même voiture.": "The inspector checked Aria’s ticket when the clock struck ten… then again at 11 pm, \"just in case\". Both times, they were in the same car.", "À 21 h comme à 22 h, Ernest astiquait l’argenterie, seul dans sa voiture.": "At 9 pm and at 10 pm, Ernest was polishing the silverware, alone in his car.", "Jean Bilet a changé de voiture quatre fois dans la soirée. Un contrôleur ne tient pas en place.": "Jack Punch changed cars four times during the evening. An inspector can’t sit still.", "Ernest a changé trois fois de voiture, mais de 22 h 30 à 23 h, il n’a pas quitté la sienne : il recollait une soupière.": "Ernest changed cars three times, but from 10:30 pm to 11 pm he stayed put: he was gluing a soup tureen back together.", "À 21 h 30, Aria n’était plus dans la voiture où elle se trouvait à 21 h : elle fuyait un courant d’air.": "At 9:30 pm, Aria was no longer in the car she had been in at 9 pm: she was fleeing a draught.", "Dans la soirée, Aria est passée par le salon-fumoir (en toussant ostensiblement) et Ernest par la voiture-bar.": "During the evening, Aria passed through the smoking lounge (coughing ostentatiously) and Ernest through the bar car.", "À 21 h 30, le professeur Tumulus expliquait à Aria comment on momifie un chat. Elle faisait semblant d’écouter, juste à côté de lui.": "At 9:30 pm, Professor Barrow was explaining to Aria how to mummify a cat. She pretended to listen, right next to him.", "Rémi a suivi Aria comme son ombre à 22 h et à 22 h 30, pour lui emprunter de quoi jouer. Entre ces deux heures, elle a changé de voiture pour le semer… en vain.": "Remy followed Aria like a shadow at 10 pm and 10:30 pm, to borrow gambling money. Between those two times she changed cars to shake him off… in vain.", "Quand la pendule a sonné onze coups, le professeur faisait la sieste, seul dans sa voiture. Et le wagon-lit A était désert.": "When the clock struck eleven, the professor was napping, alone in his car. And sleeper A was deserted.", "Aria a changé trois fois de voiture dans la soirée, mais elle n’a pas bougé de 22 h 30 à 23 h : elle se remaquillait.": "Aria changed cars three times during the evening, but she didn’t move from 10:30 pm to 11 pm: she was touching up her make-up.", "Rémi a changé trois fois de voiture, mais de 21 h à 21 h 30 il est resté au même endroit, à recompter ses dettes.": "Remy changed cars three times, but from 9 pm to 9:30 pm he stayed put, recounting his debts.", "Le professeur a changé trois fois de voiture. Il n’a pas bougé de 21 h 30 à 22 h, ni de 22 h 30 à 23 h : il dort beaucoup.": "The professor changed cars three times. He didn’t move from 9:30 pm to 10 pm, nor from 10:30 pm to 11 pm: he sleeps a lot.", "Ni Rémi ni le professeur n’ont mis les pieds dans la voiture-bar de la soirée : l’un n’a plus un sou, l’autre ne boit que de la tisane.": "Neither Remy nor the professor set foot in the bar car all evening: one is out of money, the other only drinks herbal tea.", "Le professeur est passé par le wagon-lit A à un moment de la soirée, à la recherche de ses lunettes (qu’il avait sur le nez).": "The professor passed through sleeper A at some point in the evening, looking for his glasses (which he was wearing).", "À 21 h, Ernest a proposé un café au contrôleur, qui l’a refusé : « Pas pendant le service. »": "At 9 pm, Ernest offered the inspector a coffee, who refused: \"Not while on duty.\"", "Quand la pendule a sonné dix coups, puis encore à 22 h 30, Ernest servait du miel chaud à Aria, qui se plaignait de sa gorge.": "When the clock struck ten, and again at 10:30 pm, Ernest was serving hot honey to Aria, who was complaining about her throat.", "À 23 h, le contrôleur exigeait le billet d’Aria. Ernest, lui, n’était pas avec eux.": "At 11 pm, the inspector was demanding Aria’s ticket. Ernest was not with them.", "Ernest a changé quatre fois de voiture dans la soirée, dont une fois entre 21 h 30 et 22 h.": "Ernest changed cars four times during the evening, once of them between 9:30 pm and 10 pm.", "Le contrôleur a changé quatre fois de voiture, notamment entre 21 h 30 et 22 h, puis entre 22 h et 22 h 30.": "The inspector changed cars four times, notably between 9:30 pm and 10 pm, then between 10 pm and 10:30 pm.", "Le wagon-restaurant était désert à 21 h et à 22 h : le chef était en grève.": "The dining car was deserted at 9 pm and at 10 pm: the chef was on strike.", "Ernest n’a jamais mis les pieds dans le salon-fumoir de la soirée : la fumée lui fait pleurer les yeux.": "Ernest never set foot in the smoking lounge all evening: the smoke makes his eyes water.", "Le contrôleur n’a mis les pieds ni dans le wagon-lit A, ni dans la voiture-bar. Le règlement, c’est le règlement.": "The inspector set foot in neither sleeper A nor the bar car. Rules are rules.", "Au cours de la soirée, Aria est passée par le salon-fumoir et, à un moment, sur le toit du train pour « respirer l’air des cimes ».": "During the evening, Aria passed through the smoking lounge and, at one point, onto the roof of the train to \"breathe the mountain air\".", "Le contrôleur est passé par le wagon-restaurant à un moment de la soirée.": "The inspector passed through the dining car at some point in the evening.", "À 21 h comme à 21 h 30, Rémi était avec le professeur, à essayer de lui vendre une « authentique » momie de chat.": "At 9 pm and at 9:30 pm, Remy was with the professor, trying to sell him an \"authentic\" cat mummy.", "À 22 h 30, le contrôleur a surpris Rémi sans billet. Il l’a noté deux fois dans son carnet.": "At 10:30 pm, the inspector caught Remy without a ticket. He wrote it down twice in his notebook.", "Quand la pendule a sonné onze coups, Ernest consolait Rémi, qui venait de perdre aux cartes.": "When the clock struck eleven, Ernest was comforting Remy, who had just lost at cards.", "Le professeur a changé trois fois de voiture, mais il n’a pas bougé de 22 h à 22 h 30 : il ronflait.": "The professor changed cars three times, but he didn’t move from 10 pm to 10:30 pm: he was snoring.", "Le professeur est passé par le wagon-lit A au cours de la soirée.": "The professor passed through sleeper A during the evening.", "Ernest n’a changé que deux fois de voiture dans la soirée, dont une fois entre 21 h et 21 h 30.": "Ernest changed cars only twice during the evening, once of them between 9 pm and 9:30 pm.", "Le contrôleur a changé trois fois de voiture, mais de 22 h 30 à 23 h, il n’a pas bougé : il remplissait son carnet.": "The inspector changed cars three times, but from 10:30 pm to 11 pm he didn’t move: he was filling in his notebook.", "Trois lieux déserts : le wagon-lit A à 21 h, la voiture-bar à 22 h et le toit du train à 22 h 30.": "Three deserted spots: sleeper A at 9 pm, the bar car at 10 pm and the roof of the train at 10:30 pm.", "Trois serments : le professeur n’a jamais mis les pieds dans la voiture-bar, Rémi jamais dans le wagon-restaurant, et le contrôleur jamais sur le toit.": "Three oaths: the professor never set foot in the bar car, Remy never in the dining car, and the inspector never on the roof.", "Ernest est monté sur le toit du train à un moment de la soirée, pour secouer une nappe.": "Ernest climbed onto the roof of the train at some point in the evening, to shake out a tablecloth.", "Quand la pendule a sonné neuf coups, ils étaient tous les quatre dans la même voiture pour le tournoi de belote : Rémi, Ernest, Aria et le professeur.": "When the clock struck nine, all four were in the same car for the belote tournament: Remy, Ernest, Aria and the professor.", "À 22 h, Aria, Rémi et le professeur partageaient la même voiture… et la même tarte.": "At 10 pm, Aria, Remy and the professor shared the same car… and the same tart.", "À 22 h 30 comme à 23 h, Ernest était seul dans sa voiture, à compter ses pourboires.": "At 10:30 pm and at 11 pm, Ernest was alone in his car, counting his tips.", "Ernest a changé trois fois de voiture dans la soirée, mais pas entre 21 h et 21 h 30 : la belote, c’est sacré.": "Ernest changed cars three times during the evening, but not between 9 pm and 9:30 pm: belote is sacred.", "Aria n’a pas bougé de 22 h à 22 h 30 : elle avait trouvé un public.": "Aria didn’t move from 10 pm to 10:30 pm: she had found an audience.", "Le professeur n’a pas bougé de 22 h 30 à 23 h : il dormait.": "The professor didn’t move from 10:30 pm to 11 pm: he was sleeping.", "Personne dans le salon-fumoir à 22 h 30. Personne sur le toit ni dans le wagon-restaurant à 23 h.": "Nobody in the smoking lounge at 10:30 pm. Nobody on the roof or in the dining car at 11 pm.", "Le professeur est passé par le salon-fumoir à un moment de la soirée, sa pipe éteinte à la main.": "The professor passed through the smoking lounge at some point in the evening, an unlit pipe in his hand.", "À 21 h, puis de nouveau à 23 h, Aria répétait son grand air devant le professeur.": "At 9 pm, and again at 11 pm, Aria rehearsed her big aria in front of the professor.", "À 21 h 30, Ernest apportait un grog à Aria.": "At 9:30 pm, Ernest brought Aria a hot toddy.", "À 21 h 30, le contrôleur a réveillé le professeur pour contrôler son billet. Le professeur s’est rendormi aussitôt et n’a pas bougé jusqu’à 22 h.": "At 9:30 pm, the inspector woke the professor to check his ticket. The professor fell straight back asleep and didn’t move until 10 pm.", "Quand la pendule a sonné dix coups, Aria signait un autographe au contrôleur… sur son carnet de contraventions.": "When the clock struck ten, Aria was signing an autograph for the inspector… in his book of fines.", "À 22 h 30, Aria s’était isolée pour se concentrer : personne d’autre dans sa voiture. La voiture-bar, elle, était vide.": "At 10:30 pm, Aria had shut herself away to concentrate: nobody else in her car. The bar car was empty.", "À 23 h 30, le professeur était seul, penché sur un hiéroglyphe.": "At 11:30 pm, the professor was alone, bent over a hieroglyph.", "Le professeur a changé quatre fois de voiture et il est passé par le toit du train à un moment de la soirée.": "The professor changed cars four times and passed over the roof of the train at some point in the evening.", "À 22 h, à 22 h 30 et à 23 h, Ernest était toujours dans la même voiture, à préparer les plateaux du petit-déjeuner.": "At 10 pm, 10:30 pm and 11 pm, Ernest was always in the same car, preparing the breakfast trays.", "Le contrôleur n’a pas bougé de 23 h à 23 h 30.": "The inspector didn’t move from 11 pm to 11:30 pm.", "Aria et Ernest sont tous deux passés par le salon-fumoir dans la soirée, pas forcément au même moment.": "Aria and Ernest both passed through the smoking lounge during the evening, not necessarily at the same time.", "Le contrôleur est passé par le wagon-lit A à un moment de la soirée, pour compter les couchettes.": "The inspector passed through sleeper A at some point in the evening, to count the berths.", "Hmm. Son alibi tient. Reprenons la chronologie.": "Hmm. Their alibi holds. Let’s go back over the timeline.", "Je retire ce que j’ai dit. Mon carnet n’a pas dit son dernier mot.": "I take back what I said. My notebook has not had its final word.", "Fausse piste. Le coupable doit bien rire.": "A false lead. The culprit must be laughing.", "Ce n’était pas l’heure ni la bonne personne. Recomptons.": "Wrong time, wrong person. Let’s recount.", "Moi ? Je n’ai même pas de quoi m’offrir un alibi !": "Me? I can’t even afford an alibi!", "Quelle audace ! Je n’ai que faire des bijoux des autres : j’ai les miens.": "How dare you! I have no use for other people’s jewels: I have my own.", "Vingt ans de service, et pas une petite cuillère ne m’a jamais manqué !": "Twenty years of service, and not one teaspoon has ever gone missing!", "Je contrôle les billets, madame, pas les soupçons.": "I check tickets, madam, not suspicions.", "J’étudie les momies, pas les cambriolages. Elles au moins ne me dérangent pas.": "I study mummies, not burglaries. At least they don’t disturb me.", "Moi ? Votre cliente ? Vous perdez la tête, ma chère Hortense.": "Me? Your client? You’re losing your mind, my dear Hortense.", "L’Express de minuit": "The Midnight Express", "Paris – Nice, en wagon-lit. Un collier, un caniche et beaucoup trop de suspects pour un seul train.": "Paris to Nice, by sleeper train. A necklace, a poodle and far too many suspects for a single eur": "One liar", "Verrouillé": "Locked", "Vos retours sont précieux : dites-nous ce que vous avez aimé, ce qui vous a bloqué, et ce que vous voudriez voir ensuite.": "Your feedback matters: tell us what you liked, what stumped you, and what you would like to see next.", "Vérification en direct": "Live checking", "Vérification en direct : les erreurs s’affichent tout de suite en rouge.": "Live checking: mistakes show up in red straight away.", "Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier ».": "Manual checking: nothing shows until you press “Check”.", "Vérifier": "Check", "cases": "cells", "certaines": "certain", "chronologie complète : désigne le menteur": "timeline complete: name the liar", "confirmé": "confirmed", "confirmés": "confirmed", "constats": "clues", "coupable": "guilty", "dit vrai": "tells the truth", "désigne un menteur": "name a liar", "faux": "false", "indices": "clues", "innocent": "innocent", "lieu des faits": "scene of the crime", "menteur ?": "liar?", "passage entre voitures": "passage between cars", "personnes": "people", "porte": "door", "résolu avec aide": "solved with help", "résolu ✓": "solved ✓", "touche une case": "tap a cell", "trappe vers le toit": "hatch to the roof", "trop loin": "too far", "vide": "empty", "vrai": "true", "vérification en direct désactivée": "live checking off", "Écrire à l’équipe": "Write to the team", "Épisode": "Episode", "à": "at", "contradiction": "contradiction", "contradictions": "contradictions", "fausse accusation": "wrong accusation", "fausses accusations": "wrong accusations", "ment en partie": "partly lies", "ment sur tout": "lies about everything", "Démo terminée, merci !": "Demo complete, thank you!", "Bravo, l’histoire est terminée !": "Well done, the story is over!", "Vous faites erreur !": "You are mistaken!", "Pr Hector Tumulus": "Prof. Hector Barrow", "← Menu": "← Menu", "Comment jouer ?": "How to play?", "Comment jouer": "How to play", "Mode histoire · Le Hibou": "Story mode · The Owl", "Épisodes": "Episodes", "Introduction": "Introduction", "L'affaire": "The case", "Chronologie des déplacements": "Timeline of movements", "Le train en coupe": "The train, cutaway", "Dossier en préparation…": "Preparing the case file…", "Nouvelle affaire": "New case", "Décor": "Setting", "Mode de jeu": "Game mode", "Difficulté": "Difficulty", "Plan du manoir": "Plan of the manor", "Classique": "Classic", "Plan du train": "Plan of the train", "Plan de l’hôtel": "Plan of the hotel", "Manoir": "Manor", "Train": "Train", "Hôtel": "Hotel", "Le maître des lieux a été retrouvé mort": "The master of the house has been found dead", "Sa montre s’est arrêtée à": "His watch stopped at", "dans le manoir ce soir-là": "in the manor that evening", "Un riche voyageur a été retrouvé mort": "A wealthy traveller has been found dead", "Sa montre à gousset s’est arrêtée à": "His pocket watch stopped at", "à bord de l’express cette nuit-là": "aboard the express that night", "Le directeur de l’hôtel a été retrouvé mort": "The hotel manager has been found dead", "dans l’hôtel ce soir-là": "in the hotel that evening", "L’affaire": "The case", "Trois": "Three", "Quatre": "Four", "Cinq": "Five", "scène du crime": "scene of the crime", " suspects ont été interrogés. Les innocents ont dit la vérité. Le meurtrier, seul avec la victime à cet instant, a mêlé le vrai et le faux : au moins une de ses déclarations est vraie, au moins une est fausse. Démasque-le.": " suspects were questioned. The innocent told the truth. The killer, alone with the victim at that moment, mixed truth and lies: at least one of the statements is true and at least one is false. Unmask them.", " suspects ont été interrogés. Les innocents ont dit la vérité. Le meurtrier, seul avec la victime à cet instant, a menti dans chacune de ses déclarations. Démasque-le.": " suspects were questioned. The innocent told the truth. The killer, alone with the victim at that moment, lied in every statement. Unmask them.", "Déclarations": "Statements", "confirmées": "confirmed", "ment : tout est faux": "lies: everything is false", "Affaire suivante": "Next case", "Qui est le meurtrier ? Une mauvaise réponse est comptée comme une erreur.": "Who is the killer? A wrong answer counts as a mistake.", "Instruction du dossier…": "Preparing the case file…", "Masquer les constats confirmés": "Hide confirmed clues", "Vérification manuelle : rien ne s’affiche tant que tu n’appuies pas sur « Vérifier », qui contrôle toute la grille d’un coup.": "Manual checking: nothing shows while you play; press “Check” to check the whole grid at once.", "Chaque case de la <b>chronologie</b> indique la pièce où se trouvait un suspect à une heure donnée. Touche une case pour choisir la pièce.": "Each cell of the <b>timeline</b> shows which {unit} a suspect was in at a given time. Tap a cell to choose the {unit}.", "Entre deux heures, un suspect <b>reste sur place</b> ou <b>passe une porte</b> (les traits colorés du plan). Un mur sans porte ne se traverse pas.": "Between two times, a suspect either <b>stays put</b> or <b>goes through a door</b> (the coloured marks on the plan). Nobody walks through a wall.", "Tous les <b>constats</b> sont vrais. Il n’existe qu’une seule chronologie qui les respecte tous.": "Every <b>clue</b> is true. Only one timeline fits them all.", "À l’heure du crime, un seul suspect se trouvait dans la pièce du crime : c’est le <b>meurtrier</b>. Complète la grille pour le démasquer.": "At the time of the crime, only one suspect was in the {unit} of the crime: that is the <b>killer</b>. Fill in the grid to unmask them.", "Touche une heure pour voir qui était où sur le plan. Les cases au fond doré sont des alibis déjà confirmés.": "Tap a time to see who was where on the plan. Gold cells are alibis already confirmed.", "Chaque case de la <b>chronologie</b> indique la pièce où se trouvait un suspect à une heure donnée. Entre deux heures, on reste sur place ou on passe une porte.": "Each cell of the <b>timeline</b> shows which {unit} a suspect was in at a given time. Between two times, you either stay put or go through a door.", "Chaque suspect fait des <b>déclarations</b>. Les innocents disent la vérité. <b>Un seul suspect ment</b>, et toutes ses déclarations sont fausses.": "Each suspect makes <b>statements</b>. The innocent tell the truth. <b>Only one suspect lies</b>, and all of their statements are false.", "Le menteur est le <b>meurtrier</b> : c’est le seul suspect qui se trouvait dans la pièce du crime à l’heure du crime.": "The liar is the <b>killer</b>: the only suspect who was in the {unit} of the crime at the time of the crime.", "Désigne celui que tu soupçonnes sous <b>Qui ment ?</b>, puis remplis la grille. Chaque déclaration se vérifie sur la chronologie : essaie un suspect, change d’avis si ça coince.": "Pick the one you suspect under <b>Who is lying?</b>, then fill in the grid. Each statement is checked against the timeline: try a suspect, and change your mind if it gets stuck.", "Les <b>preuves</b> sont des faits certains. Elles sont déjà placées dans les cases au fond doré.": "<b>Proof</b> is certain fact. It is already placed in the gold cells.", "Chaque suspect fait des <b>déclarations</b>. Les innocents disent toujours la vérité.": "Each suspect makes <b>statements</b>. The innocent always tell the truth.", "Le <b>meurtrier</b> mélange le vrai et le faux : <b>au moins une</b> de ses déclarations est vraie et <b>au moins une</b> est fausse. C’est le seul suspect qui se trouvait dans la pièce du crime à l’heure du crime.": "The <b>killer</b> mixes truth and lies: <b>at least one</b> of their statements is true and <b>at least one</b> is false. They are the only suspect who was in the {unit} of the crime at the time of the crime.", "Désigne celui que tu soupçonnes sous <b>Qui ment ?</b>. Ses déclarations s’affichent alors comme vraies ou fausses d’après ta grille, et il doit en avoir des deux sortes.": "Pick the one you suspect under <b>Who is lying?</b>. Their statements then show as true or false based on your grid, and they must have both kinds.", "Dans ce mode, le coupable est le menteur. <b>Qui ment ?</b> sert à tester une hypothèse (les déclarations se colorent). <b>J’accuse !</b> sert à la valider : une bonne accusation gagne tout de suite.": "In this mode, the culprit is the liar. <b>Who is lying?</b> lets you test a hypothesis (statements get coloured). <b>I accuse!</b> confirms it: a correct accusation wins immediately.", "Pas besoin de tout remplir : dès que tu es sûr, touche <b>J’accuse !</b> et désigne le coupable. Une bonne accusation gagne tout de suite. Une mauvaise est comptée comme une erreur et le suspect est écarté.": "No need to fill everything in: as soon as you are sure, tap <b>I accuse!</b> and name the culprit. A correct accusation wins immediately. A wrong one counts as a mistake and the suspect is ruled out.", "<b>Vérification en direct</b> : cochée, les erreurs apparaissent aussitôt en rouge (une case qui contredit un constat, ou un trajet impossible). Décochée, rien ne s’affiche pendant que tu joues : le bouton <b>Vérifier</b> contrôle alors toute la grille d’un coup, à la demande. C’est le mode sans filet.": "<b>Live checking</b>: when ticked, mistakes turn red straight away (a cell that contradicts a clue, or an impossible journey). When unticked, nothing shows while you play: the <b>Check</b> button then checks the whole grid on demand. No safety net.", "Contact": "Contact", "Wagons-Lits": "Wagons-Lits", "1ʳᵉ classe": "1st class", "Mode histoire": "Story mode", "Le Hibou": "The Owl", "Hortense Lafleur, institutrice à la retraite, traque un voleur de bijoux de l’Express de minuit jusqu’au casino de Monte-Carlo.": "Hortense Bloom, a retired schoolteacher, hunts a jewel thief from the Midnight Express all the way to the Monte Carlo casino.", "Commencer l’enquête": "Start the investigation", "7 épisodes": "7 episodes", "Dossier": "Case file", "Affaire libre": "Open case", "Partie rapide": "Quick game", "Une affaire au hasard": "A random case", "Une énigme toujours nouvelle, à la difficulté de votre choix.": "A brand-new puzzle every time, at the difficulty of your choice.", "Ouvrir un dossier": "Open a file", "3 niveaux": "3 levels", "Votre progression est enregistrée sur cet appareil.": "Your progress is saved on this device.", "Qui ? Où ? Quand ?": "Who? Where? When?", "Résolvez les crimes en reconstituant les emplois du temps des suspects.": "Solve the crimes by reconstructing the suspects’ schedules.", "Démo terminée": "Demo complete", "Relire l’enquête": "Reread the case", "Reprendre l’enquête": "Resume the case", "Passer en français": "Passer en français", "Merci d’avoir joué !": "Thank you for playing!", "Le chapitre 1 s’achève ici : le Hibou court toujours, et le reste du jeu (hôtel, manoir, paquebot, opéra et casino) est encore en développement. Vous venez de tester la démo, et cela compte énormément pour nous.": "Chapter 1 ends here: the Owl is still at large, and the rest of the game (hotel, manor, ocean liner, opera and casino) is still in development. You have just played the demo, and that means a great deal to us.", "Si le jeu vous a plu, faites-le découvrir à vos proches : chaque joueur de plus nous aide à continuer l’enquête.": "If you enjoyed the game, please tell your friends and family: every extra player helps us continue the investigation.", "Dites-nous ce que vous avez aimé, ce qui vous a bloqué, et ce que vous voudriez voir ensuite.": "Tell us what you liked, what stumped you, and what you would like to see next.", "Partager le jeu": "Share the game", "Nous écrire": "Write to us", "Essayer la partie rapide": "Try the quick game", "Ce que j’ai aimé :\n\nCe qui m’a bloqué :\n\nCe que j’aimerais voir ensuite :\n": "What I liked:\n\nWhat stumped me:\n\nWhat I would like to see next:\n", "Je viens d’essayer Kioukan, un jeu d’enquête où l’on reconstitue les alibis des suspects. Essaie !": "I just tried Kioukan, a detective game where you reconstruct the suspects’ alibis. Give it a go!", "Lien copié, il ne reste qu’à le coller !": "Link copied, just paste it!", "Les trois modes de jeu": "The three game modes", "mode actuel": "current mode", "Tous les indices du carnet sont vrais : il suffit de reconstituer la seule chronologie qui les respecte tous.": "Every clue in the notebook is true: you just need to rebuild the one timeline that fits them all.", "Les suspects font des déclarations. Un seul ment, et c’est le coupable : toutes ses déclarations sont fausses.": "The suspects make statements. Only one is lying, and that is the culprit: all of their statements are false.", "Le coupable mêle le vrai et le faux : au moins une de ses déclarations est vraie et au moins une est fausse. Les innocents disent toujours vrai.": "The culprit mixes truth and lies: at least one of their statements is true and at least one is false. The innocent always tell the truth.", "<b>La chronologie.</b> Chaque case indique dans quelle pièce se trouvait un suspect à une heure donnée. Touche une case pour choisir la pièce.": "<b>The timeline.</b> Each cell shows which room a suspect was in at a given time. Tap a cell to choose the room.", "<b>Les déplacements.</b> Entre deux heures, un suspect reste sur place ou franchit une porte. Un mur ne se traverse pas : le plan te montre les passages.": "<b>Movements.</b> Between two times, a suspect either stays put or goes through a door. Nobody walks through walls: the plan shows you the passages.", "<b>Le crime.</b> À l’heure du crime, le coupable était seul dans la pièce où il a été commis.": "<b>The crime.</b> At the time of the crime, the culprit was alone in the room where it happened.", "<b>Les cases dorées</b> sont des faits établis. Le bouton <b>Indice</b> en révèle une de plus, et la <b>vérification en direct</b> signale tes erreurs en rouge.": "<b>Gold cells</b> are established facts. The <b>Hint</b> button reveals one more, and <b>live checking</b> flags your mistakes in red.", "<b>J’accuse !</b> Dès que tu es sûr, désigne le coupable. Une mauvaise accusation compte comme une erreur.": "<b>I accuse!</b> As soon as you are sure, name the culprit. A wrong accusation counts as a mistake.", "Mode d’emploi": "Instructions", "Un crime a été commis. Reconstitue qui était où, et à quelle heure, pour démasquer le coupable.": "A crime has been committed. Work out who was where, and when, to unmask the culprit.", "Deux façons de jouer": "Two ways to play", "une enquête en épisodes, avec ses personnages et ses dialogues.": "an episodic investigation, with its characters and dialogue.", "une affaire au hasard, avec le décor (manoir, train, hôtel), le mode et la difficulté de ton choix.": "a random case, with the setting (manor, train, hotel), mode and difficulty of your choice."});
Object.assign(window.KIOUKAN_EN, {"Moi, noyer un papyrus ? Mes cordes vocales ont horreur de la vapeur de soupe !": "Me, drown a papyrus? My vocal cords can't stand soup steam!", "Je contrôle les billets, madame, pas les soupes.": "I check tickets, madam, not soups.", "Moi ? Je n’ai même pas de quoi payer un billet à poinçonner !": "Me? I can't even afford a ticket to punch!", "Je ne collectionne que les antiquités, madame, pas les poinçonneuses.": "I only collect antiquities, madam, not ticket punches.", "Enlever Bijou ? Il me mord les mollets depuis Paris, madame !": "Kidnap Bijou? He's been biting my calves since Paris, madam!", "Je suis allergique aux poils, madame. Un caniche ? Atchoum !": "I'm allergic to fur, madam. A poodle? Achoo!", "Des bonbons au piment ? Je n’ai même pas de quoi acheter des bonbons doux !": "Chili candies? I can't even afford the mild ones!", "Vingt ans de service, madame : jamais je ne mettrais de piment dans une boîte de pastilles !": "Twenty years of service, madam: I would never put chili in a tin of lozenges!", "Je contrôle les billets, madame, pas les pastilles.": "I check tickets, madam, not lozenges.", "Moi ? Si je veux arrêter un train, il me suffit de chanter une note aiguë !": "Me? If I want to stop a train, I just sing a high note!", "Un steward ne tire pas le signal d’alarme, madame : il rassure les passagers !": "A steward doesn't pull the alarm, madam: he reassures the passengers!", "J’étais plongé dans mes notes sur Ramsès : le train aurait pu dérailler que je n’aurais rien remarqué.": "I was buried in my notes on Ramses: the train could have derailed and I wouldn't have noticed.", "Un hibou, moi ? Je suis un rossignol, madame, nuance !": "An owl, me? I'm a nightingale, madam, there's a difference!", "J’ai poinçonné bien des billets, madame, mais jamais celui d’un hibou !": "I've punched plenty of tickets, madam, but never an owl's!", "Le Hibou ? J’étudie les momies, madame, pas les oiseaux de nuit.": "The Owl? I study mummies, madam, not birds of the night."});
Object.assign(window.KIOUKAN_EN, {"À 21 h 30, le contrôleur relisait son carnet, seul dans sa voiture : personne d’autre ne supportait ses remarques.": "At 9:30 pm, the inspector was rereading his notebook, alone in his car: nobody else could stand his remarks.", "À 22 h, Rémi était seul dans sa voiture, à recompter ses dernières pièces. Ça ne prend pas longtemps.": "At 10 pm, Remy was alone in his car, recounting his last few coins. It doesn’t take long.", "À 21 h comme à 21 h 30, le professeur est resté dans la même voiture, à réciter ses fouilles à une momie de poche.": "At 9 pm and at 9:30 pm, the professor stayed in the same car, reciting his excavations to a pocket mummy.", "Le professeur et le contrôleur ont voyagé ensemble à 22 h comme à 22 h 30 : l’un dormait, l’autre vérifiait que ce sommeil était réglementaire.": "The professor and the inspector travelled together at 10 pm and at 10:30 pm: one slept, the other checked that the sleep was within regulations.", "À 22 h 30, Ernest et le professeur se trouvaient dans la même voiture : la tisane du professeur refroidissait, comme d’habitude.": "At 10:30 pm, Ernest and the professor were in the same car: the professor’s herbal tea was getting cold, as usual.", "Rémi a changé trois fois de voiture dans la soirée : il fuyait ses créanciers, et ils étaient nombreux.": "Remy changed cars three times during the evening: he was dodging his creditors, and there were many of them.", "À 21 h 30 comme à 22 h, Rémi est resté dans la même voiture, le temps de parier sur l’heure d’arrivée du train.": "At 9:30 pm and at 10 pm, Remy stayed in the same car, just long enough to bet on the train’s arrival time.", "Rémi n’a jamais mis les pieds dans la voiture-bar : il n’avait même pas de quoi s’y payer un verre.": "Remy never set foot in the bar car: he couldn’t even afford a drink there.", "Rémi a traversé le toit du train à un moment de la soirée, pour échapper à un créancier.": "Remy crossed the roof of the train at some point in the evening, to escape a creditor.", "Ernest n’a changé que deux fois de voiture dans la soirée, plateau à la main.": "Ernest changed cars only twice during the evening, tray in hand.", "À 22 h comme à 22 h 30, Ernest est resté dans la même voiture : un plateau de tisanes à servir sans rien renverser.": "At 10 pm and at 10:30 pm, Ernest stayed in the same car: a tray of herbal teas to serve without spilling a drop.", "Ernest est passé par le salon-fumoir à un moment de la soirée, à la recherche d’un cendrier.": "Ernest passed through the smoking lounge at some point in the evening, looking for an ashtray.", "Le contrôleur a changé deux fois de voiture : un homme de règlement ne court pas après les wagons.": "The inspector changed cars twice: a man of regulations doesn’t chase after carriages."});
Object.assign(window.KIOUKAN_EN, {"À 21 h comme à 21 h 30, Aria a fait ses vocalises sans bouger d’un pouce : une diva ne se déplace pas pendant ses gammes.": "At 9 pm and at 9:30 pm, Aria did her vocal exercises without moving an inch: a diva does not move during her scales.", "Ernest a changé trois fois de voiture, mais à 22 h 30 comme à 23 h, il n’a pas quitté la sienne : il recollait une soupière.": "Ernest changed cars three times, but at 10:30 pm and at 11 pm he stayed put: he was gluing a soup tureen back together.", "Aria a changé trois fois de voiture dans la soirée, mais elle n’a pas bougé à 22 h 30 comme à 23 h : elle se remaquillait.": "Aria changed cars three times during the evening, but she was in the same car at 10:30 pm and at 11 pm: she was touching up her make-up.", "Rémi a changé trois fois de voiture, mais à 21 h comme à 21 h 30 il est resté au même endroit, à recompter ses dettes.": "Remy changed cars three times, but at 9 pm and at 9:30 pm he stayed put, recounting his debts.", "Le professeur a changé trois fois de voiture. Il n’a pas bougé à 21 h 30 comme à 22 h, ni à 22 h 30 comme à 23 h : il dort beaucoup.": "The professor changed cars three times. He was in the same car at 9:30 pm and at 10 pm, and again at 10:30 pm and at 11 pm: he sleeps a lot.", "Aria n’a pas bougé à 22 h comme à 22 h 30 : elle avait trouvé un public.": "Aria stayed put at 10 pm and at 10:30 pm: she had found an audience.", "Le professeur n’a pas bougé à 22 h 30 comme à 23 h : il dormait.": "The professor stayed put at 10:30 pm and at 11 pm: he was sleeping.", "Le contrôleur n’a pas bougé à 23 h comme à 23 h 30.": "The inspector stayed put at 11 pm and at 11:30 pm."});
Object.assign(window.KIOUKAN_EN, {"Mon papyrus de Ramsès Deux ! Trempé dans la soupe à l’oignon ! Ramsès Deux-Louches, voilà ce qu’il est devenu ! Trois mille ans d’histoire, et ça sent la ciboulette !": "My papyrus of Ramses the Second! Soaked in onion soup! Ramses the Second Helping, that’s what it’s become! Three thousand years of history, and it smells of chives!", "La soupière a été renversée à {h}, {lieu}, par la seule personne présente. Qui a noyé Ramsès Deux ?": "The soup tureen was knocked over at {h}, {lieu}, by the only person there. Who drowned Ramses the Second?"});
Object.assign(window.KIOUKAN_EN, {"Tutoriel": "Tutorial", "Une enquête pour apprendre à jouer, étape par étape.": "A case to learn how to play, step by step.", "Le sucrier de la comtesse": "The countess’s sugar bowl", "Mon sucrier en argent ! Il a disparu de la voiture-bar !": "My silver sugar bowl! It has vanished from the bar car!", "Du calme, comtesse. Nous allons retrouver le voleur… et je vais t’expliquer chaque étape.": "Calm down, countess. We will find the thief… and I will explain every step.", "Entraînement : trois suspects, quatre heures à reconstituer, et un guide pour t’accompagner.": "Practice case: three suspects, four times to rebuild, and a guide to walk you through it.", "Le sucrier de la comtesse a disparu.": "The countess’s sugar bowl has vanished.", "Le sucrier a disparu {lieu}, à {h}, et le voleur y était seul. Trois passagers, quatre heures à reconstituer.": "The sugar bowl vanished {lieu}, at {h}, and the thief was alone there. Three passengers, four times to rebuild.", "Un sucrier en argent, ça fait un si joli tintement… Je voulais seulement l’entendre sonner.": "A silver sugar bowl makes such a lovely ring… I only wanted to hear it chime.", "Entraînement terminé ! Maintenant, la vraie enquête commence : un collier a disparu dans l’Express de minuit.": "Practice over! Now the real case begins: a necklace has vanished on the Midnight Express.", "Commencer la vraie enquête": "Start the real case", "À 21 h 30, Aria et Ernest étaient dans la même voiture : elle lui racontait sa dernière tournée.": "At 9:30 pm, Aria and Ernest were in the same car: she was telling him about her latest tour.", "Rémi a changé de voiture entre 21 h et 21 h 30 : il cherchait un endroit où compter ses pièces en paix.": "Remy changed cars between 9 pm and 9:30 pm: he was looking for somewhere to count his coins in peace.", "À 21 h 30, personne dans le fourgon : même les bagages avaient pris congé.": "At 9:30 pm, nobody in the luggage van: even the bags had taken the evening off.", "À 21 h 30 comme à 22 h, Rémi est resté dans la même voiture, à bouder.": "At 9:30 pm and at 10 pm, Remy stayed in the same car, sulking.", "À 21 h comme à 21 h 30, Ernest est resté dans la même voiture : un steward ne lâche pas son plateau.": "At 9 pm and at 9:30 pm, Ernest stayed in the same car: a steward never lets go of his tray.", "À 21 h 30 comme à 22 h, Aria est restée dans la même voiture, à s’échauffer la voix.": "At 9:30 pm and at 10 pm, Aria stayed in the same car, warming up her voice.", "À 22 h comme à 22 h 30, Aria est encore restée dans la même voiture, très sûre d’elle.": "At 10 pm and at 10:30 pm, Aria stayed in the same car again, very sure of herself.", "À 22 h, Aria était seule dans sa voiture : personne ne supportait ses vocalises.": "At 10 pm, Aria was alone in her car: nobody could stand her vocal exercises.", "Rémi est passé par le wagon-restaurant à un moment de la soirée, attiré par l’odeur du potage.": "Remy passed through the dining car at some point in the evening, drawn by the smell of soup.", "À 22 h 30, Ernest et Rémi étaient dans la même voiture : l’un servait, l’autre mendiait.": "At 10:30 pm, Ernest and Remy were in the same car: one was serving, the other begging."});

Object.assign(window.KIOUKAN_EN, {"Le Grand Hôtel des Mouettes": "The Grand Hotel of Gulls", "Nice. Un palace où les clés disparaissent plus vite que les croissants.": "Nice. A palace where keys vanish faster than croissants.", "Les croissants fantômes": "The phantom croissants", "Les croissants de la comtesse ont été mangés.": "The countess’s croissants have been eaten.", "Le plateau a été dévalisé à {h}, {lieu}. Il reste des miettes et trois suspects.": "The tray was raided at {h}, {lieu}. All that’s left are crumbs and three suspects.", "larcin": "pilfering", "Nice. Le Grand Hôtel des Mouettes, cinq étoiles, trois mouettes empaillées et un directeur très nerveux.": "Nice. The Grand Hotel of Gulls: five stars, three stuffed seagulls and a very nervous manager.", "On m’a monté un plateau de petit-déjeuner… vide ! Où sont passés mes croissants ?": "They brought up my breakfast tray… empty! Where have my croissants gone?", "Le plateau est resté sans surveillance {lieu} à {h}. Quelqu’un y était seul… avec la faim.": "The tray was left unattended {lieu} at {h}. Someone was alone there… with an appetite.", "Je porte des valises toute la journée… J’avais un petit creux. Ils avaient l’air tellement seuls, ces croissants.": "I carry suitcases all day long… I was feeling peckish. Those croissants looked so lonely.", "Des miettes sur votre veste, Max. Le pire alibi du monde.": "Crumbs on your jacket, Lou. The worst alibi in the world.", "À midi, c’est le passe-partout de l’hôtel qui s’évapore.": "At noon, it’s the hotel’s master key that vanishes into thin air.", "Max a tenu compagnie à Lise à 20 h et à 20 h 30 : il l’aidait à porter les draps propres (et goûtait les chocolats des oreillers).": "Lou kept Sheila company at 8 pm and at 8:30 pm: he was helping her carry clean sheets (and tasting the chocolates on the pillows).", "À 21 h 30, Max, Lise et le chef se sont retrouvés au même endroit, à se marcher sur les pieds.": "At 9:30 pm, Lou, Sheila and the chef ended up in the same place, treading on each other’s toes.", "À 22 h, le chef était seul, à goûter sa sauce pour la quarantième fois.": "At 10 pm, the chef was alone, tasting his sauce for the fortieth time.", "Lise a changé trois fois de pièce : pas entre 20 h 30 et 21 h (un drap à plier au carré), mais bien entre 21 h 30 et 22 h.": "Sheila changed rooms three times: not between 8:30 pm and 9 pm (a sheet to fold just so), but indeed between 9:30 pm and 10 pm.", "Le chef n’a pas bougé à 20 h comme à 20 h 30, ni à 21 h comme à 21 h 30. Un chef ne court pas : il mijote.": "The chef stayed put at 8 pm and at 8:30 pm, and again at 9 pm and at 9:30 pm. A chef doesn’t run: he simmers.", "Max a changé de pièce entre 21 h et 21 h 30 : quelqu’un avait sonné.": "Lou changed rooms between 9 pm and 9:30 pm: someone had rung.", "À 22 h 30, la terrasse était déserte. Même les mouettes dormaient.": "At 10:30 pm, the terrace was deserted. Even the seagulls were asleep.", "Le chef est passé par le restaurant à un moment de la soirée, pour sermonner un client sur la cuisson de ses pâtes.": "The chef passed through the restaurant at some point in the evening, to lecture a guest on how to cook pasta.", "Je change les draps, madame, pas les plateaux. Et je préfère les biscottes.": "I change sheets, madam, not trays. And I prefer rusks.", "Manger mes propres croissants ? Jamais ! Je les goûte, nuance.": "Eat my own croissants? Never! I taste them. There’s a difference.", "Le passe-partout": "The master key", "La clé qui ouvre toutes les portes a disparu.": "The key that opens every door has disappeared.", "Le passe-partout a été décroché à {h}, {lieu}. Quatre suspects, une seule clé.": "The master key was taken off its hook at {h}, {lieu}. Four suspects, one single key.", "Le passe-partout ! Vingt ans de contrôle dans l’Express, et on me vole la clé de l’hôtel sous le nez ! Mon sifflet n’y survivra pas !": "The master key! Twenty years checking tickets on the Express, and they steal the hotel key from under my nose! My whistle will never get over it!", "Elle était accrochée {lieu}. Disparue à {h}, quand une seule personne y était.": "It was hanging {lieu}. Gone at {h}, when only one person was there.", "Je voulais juste admirer les bijoux des autres suites. Regarder n’est pas voler, voyons !": "I only wanted to admire the jewels in the other suites. Looking isn’t stealing, surely!", "Ouvrir la porte des autres, si, madame Pépite.": "Opening other people’s doors is, Mrs Nugget.", "Le soir, c’est au bar que le drame éclate.": "In the evening, drama breaks out at the bar.", "Quand la pendule a sonné huit coups, Lise et le chef ont entamé une dispute sur la bonne façon de plier une serviette. À 20 h 30, ils y étaient encore. À 21 h aussi.": "When the clock struck eight, Sheila and the chef started arguing about the proper way to fold a napkin. At 8:30 pm they were still at it. At 9 pm too.", "À 22 h, le barman, le chef et Lise trinquaient ensemble : la serviette se plie en cygne, c’est réglé.": "At 10 pm, the barman, the chef and Sheila were raising a glass together: the napkin folds into a swan, case closed.", "Lise a changé de pièce entre 21 h et 21 h 30 : un oreiller mal tapé l’appelait.": "Sheila changed rooms between 9 pm and 9:30 pm: a badly plumped pillow was calling her.", "Le barman a changé quatre fois de pièce sans jamais mettre les pieds à la réception, où l’attend une pile de factures. Il est passé par la suite 12, en revanche.": "The barman changed rooms four times without ever setting foot in the reception, where a pile of bills awaits him. He did pass through suite 12, though.", "Ginette a changé trois fois de pièce, et elle est passée par la terrasse pour faire admirer son collier aux mouettes.": "Goldie changed rooms three times, and she passed through the terrace to show her necklace off to the seagulls.", "Personne dans le couloir à 21 h 30. Le chef, lui, est passé par l’ascenseur à un moment de la soirée, en chantant.": "Nobody in the corridor at
